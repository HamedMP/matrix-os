#!/usr/sbin/nft -f
# Revertible public management firewall. The mandatory tenant unit owns
# guest restrictions and NAT separately.
# Placeholders: @WAN@ public interface, @INGRESS_PORT@ owner ingress,
# @API_PORT@ host API. The SSH allow must precede restrictive rules.

table inet matrix_hostd
delete table inet matrix_hostd
table inet matrix_hostd {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname "@WAN@" tcp dport 22 accept
    iifname "tailscale0" accept
    iifname "brmx" ip saddr 10.78.3.254 ip daddr 10.78.0.1 tcp dport 9480 accept
    iifname "brmx" drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    tcp dport 443 accept
    udp dport 3478 accept
    udp dport 41641 accept
    tcp dport @INGRESS_PORT@ accept
    tcp dport @API_PORT@ accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    iifname "brmx" accept
    iifname "tailscale0" oifname "brmx" accept
    # VM networks on other bridges (a host that already runs VMs) keep their new
    # outbound connections; their own tables still filter them, and nothing
    # but tailscale0 reaches brmx. Inbound port forwards into them stay dropped.
    iifname != { "@WAN@", "brmx", "tailscale0" } oifname "@WAN@" accept
  }
}
