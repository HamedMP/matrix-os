<svg xmlns="http://www.w3.org/2000/svg" width="768" height="620.57" viewBox="0 0 1120 905" role="img" aria-labelledby="03-order-en-title 03-order-en-desc"><title id="03-order-en-title">Figure 4 · One initiation, safe completion order</title><desc id="03-order-en-desc">Figure 4 · One initiation, safe completion order</desc><defs><marker id="03-order-en-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#718096"/></marker></defs><rect width="1120" height="905" rx="20" fill="#f8fafc"/><text x="32" y="44" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#14213a" font-weight="700"><tspan x="32" dy="0">Figure 4 · One initiation, safe completion order</tspan></text><rect x="85" y="90" width="950" height="85" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="123.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">1  User clicks Update</tspan><tspan x="560.0" dy="31.5">Bind runtime and exact Desktop / bundle targets</tspan></text><path d="M560 179 L560 196" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#03-order-en-arrow)"/><rect x="85" y="206" width="950" height="85" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="239.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">2  Validate eligibility and transition</tspan><tspan x="560.0" dy="31.5">Old Desktop must support the target bundle</tspan></text><path d="M560 295 L560 312" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#03-order-en-arrow)"/><rect x="85" y="322" width="950" height="85" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="355.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">3  Update cloud; download Desktop in parallel</tspan><tspan x="560.0" dy="31.5">Skip steps already complete or unnecessary</tspan></text><path d="M560 411 L560 428" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#03-order-en-arrow)"/><rect x="85" y="438" width="950" height="85" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="471.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">4  Verify running version and health</tspan><tspan x="560.0" dy="31.5">Installed without a restart is not ready</tspan></text><path d="M560 527 L560 544" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#03-order-en-arrow)"/><rect x="85" y="554" width="950" height="85" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="587.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">5  Revalidate → restart to finish Desktop update</tspan><tspan x="560.0" dy="31.5">All install paths, including quit, use the same checks</tspan></text><path d="M560 643 L560 660" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#03-order-en-arrow)"/><rect x="85" y="670" width="950" height="85" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/><text x="560.0" y="703.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">6  Verify after restart and finish</tspan><tspan x="560.0" dy="31.5">Matching commits are not a completion condition</tspan></text><rect x="35" y="801" width="1050" height="75" rx="14" fill="#fff8e8" stroke="#b45309" stroke-width="1.5"/><text x="560.0" y="844.96" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">On failure: retain completed progress and retry that step; no automatic rollback</tspan></text></svg>