<svg xmlns="http://www.w3.org/2000/svg" width="768" height="500.57" viewBox="0 0 1120 730" role="img" aria-labelledby="04-notices-en-title 04-notices-en-desc"><title id="04-notices-en-title">Figure 3 · Prompt from compatibility and actionable targets</title><desc id="04-notices-en-desc">Figure 3 · Prompt from compatibility and actionable targets</desc><defs><marker id="04-notices-en-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#718096"/></marker></defs><rect width="1120" height="730" rx="20" fill="#f8fafc"/><text x="32" y="44" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#14213a" font-weight="700"><tspan x="32" dy="0">Figure 3 · Prompt from compatibility and actionable targets</tspan></text><rect x="35" y="90" width="1050" height="80" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="137.14" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">Read current compatibility, release readiness, and eligible targets</tspan></text><path d="M560 175 L560 198 L198 198 L198 225" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#04-notices-en-arrow)"/><path d="M560 175 L560 198 L560 198 L560 225" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#04-notices-en-arrow)"/><path d="M560 175 L560 198 L922 198 L922 225" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#04-notices-en-arrow)"/><rect x="35" y="235" width="326" height="72" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/><text x="198.0" y="278.14" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="198.0" dy="0">Confirmed compatible</tspan></text><path d="M198 312 L198 335" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#0