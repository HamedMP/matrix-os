width="1.5"/><text x="922.0" y="405.62" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#14213a" font-weight="450"><tspan x="922.0" dy="0">Show unable to confirm</tspan><tspan x="922.0" dy="27.0">Allow another check</tspan><tspan x="922.0" dy="27.0">Keep verified restrictions</tspan><tspan x="922.0" dy="27.0">Do not invent update demands</tspan></text><rect x="35" y="580" width="1050" height="105" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="624.3" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">Existing update task: progress / waiting for restart / retry</tspan><tspan x="560.0" dy="30.0">Focus, reconnect, SHA changes, and relaunch do not repeat the same prompt</tspan></text></svg>