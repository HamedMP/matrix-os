<svg xmlns="http://www.w3.org/2000/svg" width="768" height="469.71" viewBox="0 0 1120 685" role="img" aria-labelledby="01-model-en-title 01-model-en-desc"><title id="01-model-en-title">Figure 1 · We own the decision, modal, and update flow</title><desc id="01-model-en-desc">Figure 1 · We own the decision, modal, and update flow</desc><defs><marker id="01-model-en-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#718096"/></marker></defs><rect width="1120" height="685" rx="20" fill="#f8fafc"/><text x="32" y="44" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#14213a" font-weight="700"><tspan x="32" dy="0">Figure 1 · We own the decision, modal, and update flow</tspan></text><rect x="35" y="95" width="500" height="150" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="146.8" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#14213a" font-weight="450"><tspan x="285.0" dy="0">Release service inputs</tspan><tspan x="285.0" dy="30.0">Stable pair and minimum bundle</tspan><tspan x="285.0" dy="30.0">Eligibility and transition support</tspan></text><rect x="585" y="95" width="500" height="150" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="835.0" y="146.8" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#14213a" font-weight="450"><tspan x="835.0" dy="0">Platform / Gateway inputs</tspan><tspan x="835.0" dy="30.0">Running versions, health, task status</tspan><tspan x="835.0" dy="30.0">Platform / bundle compatibility</tspan></text><path d="M285 248 L285 280 L560 280 L560 309" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#01-model-en-arrow)"/><path d="M835 248 L835 280 L560 280" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#01-model-en-arrow)"/><rect x="35" y="320" width="105