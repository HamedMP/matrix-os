<svg xmlns="http://www.w3.org/2000/svg" width="768" height="493.71" viewBox="0 0 1120 720" role="img" aria-labelledby="02-stable-dev-en-title 02-stable-dev-en-desc"><title id="02-stable-dev-en-title">Figure 2 · Paired target and minimum version are distinct</title><desc id="02-stable-dev-en-desc">Figure 2 · Paired target and minimum version are distinct</desc><defs><marker id="02-stable-dev-en-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#718096"/></marker></defs><rect width="1120" height="720" rx="20" fill="#f8fafc"/><text x="32" y="44" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#14213a" font-weight="700"><tspan x="32" dy="0">Figure 2 · Paired target and minimum version are distinct</tspan></text><rect x="35" y="90" width="1050" height="85" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="123.89" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">One stable release: releaseSetId</tspan><tspan x="560.0" dy="31.5">Both artifacts ready and eligible for this user</tspan></text><path d="M285 180 L285 219" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#02-stable-dev-en-arrow)"/><path d="M835 180 L835 219" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#02-stable-dev-en-arrow)"/><rect x="35" y="230" width="500" height="135" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="285.0" y="289.3" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#14213a" font-weight="450"><tspan x="285.0" dy="0">Target Desktop: D2</tspan><tspan x="285.0" dy="30.0">Minimum compatible bundle: B1</tspan></text><rect x="585" y="230" width="500" height="135" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="835.0" y="289.3" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#14213a" font-weight="450"><tspan x="835.0" dy="0">Paired bundle: B2</tspan><tspan x="835.0" dy="30.0">Proposed target for this update</tspan></text><text x="560" y="410" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#14213a" font-weight="450"><tspan x="560" dy="0">Illustrative ordering: B0 &lt; B1 &lt; B2; not actual releases</tspan></text><rect x="35" y="445" width="326" height="135" rx="14" fill="#fff8e8" stroke="#b45309" stroke-width="1.5"/><text x="198.0" y="491.62" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#14213a" font-weight="450"><tspan x="198.0" dy="0">Running B0</tspan><tspan x="198.0" dy="27.0">Below minimum</tspan><tspan x="198.0" dy="27.0">Cloud update required</tspan></text><rect x="397" y="445" width="326" height="135" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="491.62" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">Running B1</tspan><tspan x="560.0" dy="27.0">Minimum satisfied</tspan><tspan x="560.0" dy="27.0">Still target paired B2 (proposal)</tspan></text><rect x="759" y="445" width="326" height="135" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/><text x="922.0" y="491.62" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#14213a" font-weight="450"><tspan x="922.0" dy="0">Running B2 or newer safe version</tspan><tspan x="922.0" dy="27.0">Skip cloud installation</tspan><tspan x="922.0" dy="27.0">No automatic downgrade</tspan></text><rect x="35" y="612" width="1050" height="75" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="560.0" y="655.62" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#14213a" font-weight="450"><tspan x="560.0" dy="0">Minimum detects an old bundle; reverse and Platform compatibility still need proof</tspan></text></svg>