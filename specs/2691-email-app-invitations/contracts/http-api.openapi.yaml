openapi: 3.1.0
info:
  title: Matrix.page email invitation API
  version: 1.0.0
  description: >-
    Owner management and public viewer exchange contracts for private_email
    publications. Existing publication, public, and private_link routes remain
    unchanged. All responses are Cache-Control no-store.
servers:
  - url: https://app.matrix-os.com
    description: Owner Gateway API
  - url: https://matrix.page
    description: Public Matrix.page edge
paths:
  /api/apps/{appSlug}/site/invitations:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
    get:
      operationId: listSiteEmailInvitations
      summary: List the verified owner's invitation inventory
      security:
        - ownerSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        '200':
          description: Bounded keyset page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createSiteEmailInvitations
      summary: Create or reuse invitations and queue delivery
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationsRequest'
      responses:
        '200':
          description: One explicit result in input order for every address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationsResponse'
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/apps/{appSlug}/site/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: resendSiteEmailInvitation
      summary: Start a new delivery generation for a pending-failed or expired invitation
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationMutationRequest'
      responses:
        '200':
          description: Updated invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationMutationResponse'
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/apps/{appSlug}/site/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      operationId: revokeSiteEmailInvitation
      summary: Revoke pending or accepted access
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationMutationRequest'
      responses:
        '200':
          description: Revocation completed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationMutationResponse'
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/apps/{appSlug}/site/invitation-events:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
    get:
      operationId: listSiteInvitationAuditEvents
      summary: List bounded owner-visible security events
      security:
        - ownerSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        '200':
          description: Bounded keyset page without credentials or recipient email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /{siteId}/access/email:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: exchangeEmailViewerSession
      summary: Exchange a verified Clerk identity for a site-scoped viewer session
      description: >-
        The Matrix.page Worker accepts this route only for the canonical UUID
        path and exact same Origin. It forwards Authorization only here. The
        body is an empty strict object because email and identity come from
        authoritative Clerk data, never the browser.
      security:
        - clerkSessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: >-
            Active grant resumed or matching invitation accepted. Sets exactly
            one approved path-scoped HttpOnly viewer cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >-
                __Secure-matrix_site_viewer_<site-id-without-dashes>=<session-id>.<secret>;
                Path=/<site-id>; HttpOnly; Secure; SameSite=Lax; Max-Age<=2592000
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [granted]
                properties:
                  granted: { const: true }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/ViewerDenied' }
        '403': { $ref: '#/components/responses/ViewerDenied' }
        '404': { $ref: '#/components/responses/ViewerDenied' }
        '409': { $ref: '#/components/responses/ViewerDenied' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RetryLater' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /{siteId}/access/email/sign-out:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: signOutEmailViewerSession
      summary: Revoke this browser's shared Matrix.page viewer authority
      description: >-
        The trusted same-origin gate calls this endpoint before shared Clerk
        sign-out or account switch. The Worker forwards only the exact site
        viewer cookie and, when present, a bounded Clerk bearer on this exact
        route. Platform resolves the Clerk session from verified bearer and/or
        active viewer cookie, requires them to agree if both are present, and
        revokes that session's viewer authority across publications before
        Clerk sign-out completes. A request with neither credential makes no
        authority change and returns the same coarse success, so repeat
        sign-out remains safe. Main Matrix sign-out
        must await a trusted revocation hook before completing Clerk sign-out;
        an asynchronous session event is only backup cleanup.
        The exact Clerk-session binding and cross-origin propagation require
        the production-domain compatibility spike to pass.
      security:
        - viewerSession: []
        - clerkSessionToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Idempotent coarse result; expires the exact site viewer cookie
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Expire the exact path-scoped viewer cookie with Max-Age=0
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [signedOut]
                properties:
                  signedOut: { const: true }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/ViewerDenied' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    ownerSession:
      type: http
      scheme: bearer
      bearerFormat: Matrix owner session
      description: >-
        Existing verified Gateway owner principal; Gateway-to-Platform hop uses
        the existing machine/slot/epoch-bound bearer.
    clerkSessionToken:
      type: http
      scheme: bearer
      bearerFormat: short-lived Clerk session JWT
      description: Forwarded by the Matrix.page Worker only on exact exchange and sign-out routes.
    viewerSession:
      type: apiKey
      in: cookie
      name: __Secure-matrix_site_viewer_<site-id-without-dashes>
      description: Exact path-scoped opaque viewer cookie for the canonical site ID.

  parameters:
    AppSlug:
      name: appSlug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateInvitationsRequest:
      type: object
      additionalProperties: false
      required: [emailAddresses, baseRevision]
      properties:
        emailAddresses:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 320
        baseRevision:
          type: integer
          minimum: 0

    CreateInvitationsResponse:
      type: object
      additionalProperties: false
      required: [results, siteRevision]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/InvitationInputResult'
        siteRevision:
          type: integer
          minimum: 0

    InvitationInputResult:
      description: >-
        One result per submitted address in input order. A queued/existing result
        always includes the current invitation state (pending or accepted as
        applicable); a rejected result reveals no invitation record.
      oneOf:
        - type: object
          additionalProperties: false
          required: [inputIndex, outcome, invitation]
          properties:
            inputIndex:
              type: integer
              minimum: 0
              maximum: 99
            outcome:
              enum: [queued, existing]
            invitation:
              $ref: '#/components/schemas/InvitationSummary'
        - type: object
          additionalProperties: false
          required: [inputIndex, outcome]
          properties:
            inputIndex:
              type: integer
              minimum: 0
              maximum: 99
            outcome:
              enum: [invalid, duplicate_in_batch, policy_rejected]

    InvitationMutationRequest:
      type: object
      additionalProperties: false
      required: [baseRevision, invitationRevision]
      properties:
        baseRevision:
          type: integer
          minimum: 0
        invitationRevision:
          type: integer
          minimum: 0

    InvitationMutationResponse:
      type: object
      additionalProperties: false
      required: [invitation, siteRevision]
      properties:
        invitation:
          $ref: '#/components/schemas/InvitationSummary'
        siteRevision:
          type: integer
          minimum: 0

    InvitationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - emailAddress
        - state
        - deliveryState
        - generation
        - revision
        - issuedAt
        - expiresAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        emailAddress:
          type: string
          format: email
          maxLength: 254
        state:
          enum: [pending, accepted, expired, revoked]
        deliveryState:
          enum: [queued, sending, sent, failed, ambiguous, suppressed]
        generation:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 0
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }

    InvitationPage:
      type: object
      additionalProperties: false
      required: [invitations, siteRevision]
      properties:
        invitations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InvitationSummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
        siteRevision:
          type: integer
          minimum: 0

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, type, actorKind, occurredAt]
      properties:
        id: { type: string, format: uuid }
        invitationId: { type: [string, 'null'], format: uuid }
        type:
          enum:
            - invitation_created
            - invitation_resent
            - invitation_accepted
            - invitation_revoked
            - delivery_sent
            - delivery_failed
            - grant_revoked
            - mode_changed
            - unpublished
        actorKind: { enum: [owner, viewer, system] }
        occurredAt: { type: string, format: date-time }
        details:
          type: object
          maxProperties: 4
          additionalProperties: false
          properties:
            generation: { type: integer, minimum: 1 }
            reason: { type: string, maxLength: 32 }
            fromMode: { enum: [public, private_link, private_email] }
            toMode: { enum: [public, private_link, private_email] }

    AuditPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          maxLength: 120

  responses:
    Invalid:
      description: Invalid request; no provider, database, path, or identity details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Invalid request }
    Unauthorized:
      description: Missing or invalid owner authority
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unauthorized }
    Conflict:
      description: Site or invitation changed; refresh authoritative state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Site changed; reload and try again }
    ViewerDenied:
      description: Coarse denial for all viewer identity/invitation/grant failures
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Invitation unavailable }
    TooLarge:
      description: Body rejected before buffering
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Request too large }
    RetryLater:
      description: Bounded admission or rate limit reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Try again later }
    Unavailable:
      description: Generic missing/unavailable/misconfigured response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Site unavailable }

