name: Mobile iOS TestFlight

# EAS performs the native iOS build on its macOS workers.
# Operator setup: docs/dev/mobile-shell.md, "Native beta releases".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-testflight
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: "24.8.0"

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mobile-ios-testflight
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Mobile unit tests
        run: pnpm --dir apps/mobile exec jest --runInBand
      - name: Build and submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/ci/mobile-store-release.sh ios
