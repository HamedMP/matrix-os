name: Billing Owner Audit

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: billing-owner-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Check billing owners still exist
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Audit billing identities without modifying accounts
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/ops/audit-orphaned-billing.ts --gcp-project "$GCP_PROJECT_ID"
