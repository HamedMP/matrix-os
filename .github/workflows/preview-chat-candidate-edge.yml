name: Preview Chat Candidate Edge Route

# One-time operator label on the same-repository PR. workflow_dispatch cannot
# trigger a new workflow before that workflow exists on the default branch.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: preview-chat-candidate-edge
  cancel-in-progress: false

jobs:
  test:
    name: Verify exact-head Edge candidate
    if: >-
      github.event.label.name == 'preview-chat-candidate-route' &&
      github.event.pull_request.number >= 1 &&
      github.event.pull_request.number <= 999999999 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEWED_PR: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEWED_REF: ${{ github.event.pull_request.head.ref }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate current PR label event
        run: |
          python3 scripts/ci/preview-chat-candidate-selector.py admit --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Edge Router
        run: |
          pnpm --filter @matrix-os/edge-router typecheck
          pnpm --filter @matrix-os/edge-router test
          pnpm --filter @matrix-os/edge-router deploy:dry-run

  deploy:
    name: Deploy one-chat candidate route
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      REVIEWED_PR: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEWED_REF: ${{ github.event.pull_request.head.ref }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check current PR head and trigger label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/preview-chat-candidate-selector.py admit --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEWED_PR}" |
            python3 scripts/ci/preview-chat-candidate-selector.py current --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy exact reviewed Edge Router and selector
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/preview-chat-candidate-selector.py admit --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF"
          check_current_pr() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEWED_PR}" |
              python3 scripts/ci/preview-chat-candidate-selector.py current --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
                --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF"
          }
          check_current_pr
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Production deployment credentials are unavailable.' >&2
            exit 1
          fi
          raw_selector="$(mktemp)"
          wrangler_secrets="$(mktemp)"
          response_headers="$(mktemp)"
          response_body="$(mktemp)"
          gateway_response="$(mktemp)"
          cleanup() { rm -f "$raw_selector" "$wrangler_secrets" "$response_headers" "$response_body" "$gateway_response"; }
          trap cleanup EXIT
          chmod 600 "$raw_selector" "$wrangler_secrets" "$response_headers" "$response_body" "$gateway_response"
          gcloud secrets versions access latest \
            --secret "preview-chat-candidate-pr-${REVIEWED_PR}" \
            --project "$GCP_PROJECT_ID" \
            --out-file="$raw_selector" --quiet
          python3 scripts/ci/preview-chat-candidate-selector.py selector --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF" \
            --raw "$raw_selector" --output "$wrangler_secrets" --config packages/edge-router/wrangler.toml
          # Cloudflare AI Gateway read permission probe. Never print the response body.
          gateway_status=000
          if gateway_status="$(curl --silent --connect-timeout 5 --max-time 15 \
            --request GET --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output "$gateway_response" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-gateway/gateways/matrix-funded-preview" 2>/dev/null)"; then
            :
          else
            gateway_status=000
          fi
          readable=false
          if [ "$gateway_status" = 200 ] &&
            jq -e '.success == true and .result.id == "matrix-funded-preview"' "$gateway_response" >/dev/null 2>&1; then
            readable=true
          fi
          echo "Cloudflare AI Gateway probe: HTTP ${gateway_status}; readable=${readable}"
          # Recheck current head/branch/label and lease after the read-only probe.
          check_current_pr
          python3 scripts/ci/preview-chat-candidate-selector.py selector --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --pr "$REVIEWED_PR" --sha "$REVIEWED_SHA" --ref "$REVIEWED_REF" \
            --raw "$raw_selector" --output "$wrangler_secrets" --config packages/edge-router/wrangler.toml
          pnpm --filter @matrix-os/edge-router exec wrangler deploy --secrets-file "$wrangler_secrets"
          chat_id="$(python3 - "$wrangler_secrets" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())["PREVIEW_CHAT_CANDIDATE_CHAT_ID"])
          PY
          )"
          handle="pr-${REVIEWED_PR}"
          status_code="$(curl --silent --show-error --max-time 20 \
            --request POST --header 'content-type: application/json' --data '{}' \
            --dump-header "$response_headers" --output "$response_body" --write-out '%{http_code}' \
            "https://app.matrix-os.com/vm/${handle}/~runtime/${handle}/api/chats/${chat_id}/turns")"
          if ! grep -Eqi '^x-matrix-preview-platform-route: candidate[[:space:]]*$' "$response_headers"; then
            echo 'The selected Preview Chat request did not reach the tagged Platform candidate.' >&2
            exit 1
          fi
          unauth_login=false
          if [ "$status_code" = "200" ] &&
            grep -Eqi '^content-type: text/html' "$response_headers" &&
            grep -Fq 'Sign in to continue to your Matrix computer' "$response_body"; then
            unauth_login=true
          fi
          if [ "$status_code" != "401" ] && [ "$status_code" != "403" ] && [ "$unauth_login" != true ]; then
            echo "The candidate did not reject an unauthenticated Chat turn (HTTP ${status_code})." >&2
            exit 1
          fi
          echo 'The exact Preview Chat route reached the tagged Platform candidate.'
