            # HMACs provide end-to-end authenticity; the reusable key never crosses this link.
            curl --fail --silent --show-error --max-time 90 --insecure \
              --resolve "app.matrix-os.com:443:${ADDRESS}" \
              -D "$headers" -o "$response" -X POST "$endpoint" \
              -H "x-matrix-acceptance-timestamp: $timestamp" \
              -H "x-matrix-acceptance-nonce: $nonce" \
              -H "x-matrix-acceptance-signature: $signature" \
              -H 'content-type: application/json' \
              --data-binary "$body"
            response_signature="$(awk 'BEGIN{IGNORECASE=1} /^x-matrix-acceptance-response-signature:/ {gsub("\\r", "", $2); value=$2} END{print value}' "$headers")"
            ACCEPTANCE_SIGNING_KEY="$token" node --input-type=module -e '
              import { createHash, createHmac, timingSafeEqual } from "node:crypto";
              import { readFile } from "node:fs/promises";
              const [timestamp, nonce, signature, path] = process.argv.slice(1);
              const body = await readFile(path);
              const digest = createHash("sha256").update(body).digest("hex");
              const expected = createHmac("sha256", process.env.ACCEPTANCE_SIGNING_KEY)
                .update(`v1-response\n${timestamp}\n${nonce}\n${digest}`).digest("hex");
              if (!/^[0-9a-f]{64}$/.test(signature) ||
                !timingSafeEqual(Buffer.from(signature, "hex"), Buffer.from(expected, "hex"))) process.exit(1);
            ' "$timestamp" "$nonce" "$response_signature" "$response"
          }
          send_command() {
            local body="$1" response="$RUNNER_TEMP/user-systemd-command.json"
            send_signed_command "$body" "$response"
            jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null)' \
              "$response" >/dev/null
          }
          upload_asset() {
            local source="$1" remote="$2" suffix="$3" group="$4" mode="$5"
            local payload offset chunk script body
            [[ "$group" == root || "$group" == matrix ]]
            [[ "$mode" == 0700 || "$mode" == 0640 ]]
            local encoded="/tmp/matrix-user-systemd-${HEAD_SHA:0:7}-${RUN_NONCE}-${suffix}.b64"
            local decoded="/tmp/matrix-user-systemd-${HEAD_SHA:0:7}-${RUN_NONCE}-${suffix}"
            payload="$(gzip -9 -c "$source" | base64 --wrap=0)"
            body="$(jq -cn --arg file "$encoded" '{command:["/usr/bin/truncate","--size","0",$file]}')"
            send_command "$body"
            offset=0
            while [ "$offset" -lt "${#payload}" ]; do
              chunk="${payload:$offset:3000}"
              script="$(jq -nr --arg file "$encoded" --arg chunk "$chunk" \
                '"printf %s " + ($chunk|@sh) + " >> " + ($file|@sh)')"
              body="$(jq -cn --arg script "$script" '{command:["/bin/bash","-c",$script]}')"
              send_command "$body"
              offset=$((offset + 3000))
            done
            script="$(jq -nr --arg input "$encoded" --arg output "$decoded" \
              '"umask 077; base64 --decode " + ($input|@sh) + " | gzip --decompress > " + ($output|@sh)')"
            body="$(jq -cn --arg script "$script" '{command:["/bin/bash","-c",$script]}')"
            send_command "$body"
            body="$(jq -cn --arg source "$decoded" --arg target "$remote" \
              --arg group "$group" --arg mode "$mode" \
              '{command:["/usr/bin/sudo","/usr/bin/install","-o","root","-g",$group,"-m",$mode,$source,$target]}')"
            send_command "$body"
            body="$(jq -cn --arg first "$encoded" --arg second "$decoded" \
              '{command:["/usr/bin/rm","-f","--",$first,$second]}')"
            send_command "$body"
          }
          remote_base="/var/tmp/matrix-user-systemd-accept-${HEAD_SHA:0:7}-${RUN_NONCE}"
          upload_asset scripts/spikes/user-systemd-terminal/production-acceptance.sh \
            "${remote_base}.sh" helper root 0700
          upload_asset scripts/spikes/user-systemd-terminal/production-probe.mjs \
            "${remote_base}-probe.mjs" probe matrix 0640
          printf '%s\n' "$remote_base" >"$RUNNER_TEMP/user-systemd-remote-base"
      - name: Run two-bundle, gateway-failure, rollback, and pre-reboot matrix
        env:
