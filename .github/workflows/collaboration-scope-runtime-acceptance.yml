name: Collaboration Scope Runtime Acceptance

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read

concurrency:
  group: collaboration-scope-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.label.name == 'scope-runtime-production-acceptance' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      head: ${{ steps.resolve.outputs.head }}
      handle: ${{ steps.resolve.outputs.handle }}
    steps:
      - id: resolve
        name: Resolve immutable labeled preview head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          head="$(jq -r .head.sha <<<"$pr_json")"
          repo="$(jq -r .head.repo.full_name <<<"$pr_json")"
          if [ "$repo" != "$GITHUB_REPOSITORY" ] ||
            [ "$head" != "$EVENT_HEAD" ] ||
            ! printf '%s' "$head" | grep -Eq '^[0-9a-f]{40}$' ||
            ! jq -e '.labels | any(.name == "preview-vps") and
              any(.name == "scope-runtime-production-acceptance")' <<<"$pr_json" >/dev/null; then
            echo "Scope-runtime acceptance requires the immutable same-repository preview head." >&2
            exit 1
          fi
          {
            echo "pr=$PR"
            echo "head=$head"
            echo "handle=pr-$PR"
          } >>"$GITHUB_OUTPUT"

  prove:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      PR: ${{ needs.gate.outputs.pr }}
      HEAD_SHA: ${{ needs.gate.outputs.head }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.head }}

      - id: preview
        name: Resolve the exact disposable production preview
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$deadline" ]; do
            fleet="$(curl --fail --silent --show-error --max-time 30 \
              -H "authorization: Bearer $PLATFORM_SECRET" \
              "${PLATFORM_PUBLIC_URL%/}/vps/fleet")"
            machine="$(jq -ce --arg handle "$HANDLE" '
              [.machines[] | select(.handle == $handle and .runtimeSlot == $handle
                and .status == "running" and .healthy == true and .deletedAt == null)]
              | if length == 1 then .[0] else {} end
            ' <<<"$fleet")"
            machine_id="$(jq -r '.machineId // ""' <<<"$machine")"
            version="$(jq -r '.runtimeVersion // ""' <<<"$machine")"
            address="$(jq -r '.publicIPv4 // ""' <<<"$machine")"
            if printf '%s' "$machine_id" |
                grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' &&
              printf '%s' "$version" | grep -Eq '^(v[0-9]|main-[A-Za-z0-9])[A-Za-z0-9._-]{0,127}$' &&
              printf '%s' "$address" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$' &&
              [ "${version##*-}" = "${HEAD_SHA:0:7}" ]; then
              echo "::add-mask::$address"
              {
                echo "address=$address"
                echo "version=$version"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "The exact production preview did not become ready." >&2
          exit 1

      - name: Run native proof and exact production supervisor acceptance
        env:
          ADDRESS: ${{ steps.preview.outputs.address }}
          PREVIEW_VERSION: ${{ steps.preview.outputs.version }}
        run: |
          set -euo pipefail
          expected_sdk_version="$(jq -er '
            .dependencies["@anthropic-ai/claude-agent-sdk"]
            | select(test("^0\\.[0-9]+\\.[0-9]+$"))
          ' packages/kernel/package.json)"
          token="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.argv[2])
              .update(process.argv[1]).digest("hex"));
          ' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$token"
          endpoint='https://app.matrix-os.com/api/internal/terminal-acceptance/run'
          evidence="$RUNNER_TEMP/scope-runtime-native-evidence.json"
          ROOT_STAGING_DIR=/var/lib/matrix-scope-runtime/acceptance
          jq -cn --arg head "$HEAD_SHA" --arg version "$PREVIEW_VERSION" '{
            head: $head,
            previewVersion: $version,
            status: "started"
          }' >"$evidence"

          send_signed_command() {
            local body="$1"
            local response="$2"
            local timestamp nonce signature response_signature headers
            timestamp="$(date +%s)"
            nonce="$(openssl rand -hex 16)"
            signature="$(ACCEPTANCE_SIGNING_KEY="$token" ACCEPTANCE_BODY="$body" \
              node --input-type=module -e '
                import { createHash, createHmac } from "node:crypto";
                const digest = createHash("sha256")
                  .update(process.env.ACCEPTANCE_BODY).digest("hex");
                process.stdout.write(createHmac("sha256", process.env.ACCEPTANCE_SIGNING_KEY)
                  .update("v1\n" + process.argv[1] + "\n" + process.argv[2] + "\n" + digest)
                  .digest("hex"));
              ' "$timestamp" "$nonce")"
            headers="$RUNNER_TEMP/scope-runtime-response-headers"
            curl --fail --silent --show-error --max-time 190 --insecure \
              --resolve "app.matrix-os.com:443:${ADDRESS}" \
              -D "$headers" -o "$response" -X POST "$endpoint" \
              -H "x-matrix-acceptance-timestamp: $timestamp" \
              -H "x-matrix-acceptance-nonce: $nonce" \
              -H "x-matrix-acceptance-signature: $signature" \
              -H 'content-type: application/json' --data-binary "$body"
            response_signature="$(awk 'BEGIN{IGNORECASE=1}
              /^x-matrix-acceptance-response-signature:/ {
                gsub("\r", "", $2); value=$2
              } END{print value}' "$headers")"
            ACCEPTANCE_SIGNING_KEY="$token" node --input-type=module -e '
              import { createHash, createHmac, timingSafeEqual } from "node:crypto";
              import { readFile } from "node:fs/promises";
              const [timestamp, nonce, signature, path] = process.argv.slice(1);
              const body = await readFile(path);
              const digest = createHash("sha256").update(body).digest("hex");
              const expected = createHmac("sha256", process.env.ACCEPTANCE_SIGNING_KEY)
                .update("v1-response\n" + timestamp + "\n" + nonce + "\n" + digest)
                .digest("hex");
              if (!/^[0-9a-f]{64}$/.test(signature) ||
                !timingSafeEqual(Buffer.from(signature, "hex"), Buffer.from(expected, "hex"))) {
                process.exit(1);
              }
            ' "$timestamp" "$nonce" "$response_signature" "$response"
          }

          send_command() {
            local body="$1"
            local response="$RUNNER_TEMP/scope-runtime-command.json"
            send_signed_command "$body" "$response"
            jq -e 'select(.exitCode == 0 and .timedOut == false and
              .truncated == false and .signal == null)' "$response" >/dev/null
          }

          upload_asset() {
            local source="$1"
            local remote="$2"
            local mode="$3"
            local encoded chunk offset body
            encoded="$(base64 --wrap=0 "$source")"
            body="$(jq -cn --arg path "$remote.b64" '{
              command:["/usr/bin/truncate","--size","0",$path]
            }')"
            send_command "$body"
            offset=0
            while [ "$offset" -lt "${#encoded}" ]; do
              chunk="${encoded:$offset:3000}"
              body="$(jq -cn --arg path "$remote.b64" --arg chunk "$chunk" '{
                command:["/usr/bin/python3","-c",
                  "import sys; open(sys.argv[1], \"ab\").write(sys.argv[2].encode())",
                  $path,$chunk]
              }')"
              send_command "$body"
              offset=$((offset + 3000))
            done
            body="$(jq -cn --arg input "$remote.b64" --arg output "$remote" '{
              command:["/usr/bin/python3","-c",
                "import base64,sys; open(sys.argv[2], \"wb\").write(base64.b64decode(open(sys.argv[1], \"rb\").read(), validate=True))",
                $input,$output]
            }')"
            send_command "$body"
            body="$(jq -cn --arg mode "$mode" --arg path "$remote" '{
              command:["/usr/bin/chmod",$mode,$path]
            }')"
            send_command "$body"
          }

          stage_root_asset() {
            local source="$1"
            local remote="$2"
            local destination="$3"
            local mode="$4"
            local expected body response actual
            expected="$(sha256sum "$source" | cut -d ' ' -f 1)"
            body="$(jq -cn --arg mode "$mode" --arg source "$remote" \
              --arg destination "$destination" '{
                command:["/usr/bin/sudo","/usr/bin/install","--owner=root","--group=root",
                  ("--mode=" + $mode),$source,$destination]
              }')"
            send_command "$body"
            body="$(jq -cn --arg destination "$destination" '{
              command:["/usr/bin/sudo","/usr/bin/sha256sum","--",$destination]
            }')"
            response="$RUNNER_TEMP/scope-runtime-root-asset-hash.json"
            send_signed_command "$body" "$response"
            jq -e 'select(.exitCode == 0 and .timedOut == false and
              .truncated == false and .signal == null)' "$response" >/dev/null
            actual="$(jq -er '.stdout | capture("^(?<hash>[0-9a-f]{64})  ").hash' "$response")"
            [ "$actual" = "$expected" ]
          }

          cleanup_remote() {
            local body
            body='{"command":["/usr/bin/rm","-f","--",
              "/var/tmp/matrix-scope-runtime-probe.ts",
              "/var/tmp/matrix-scope-runtime-probe.ts.b64",
              "/var/tmp/matrix-scope-runtime-sdk-probe.mjs",
              "/var/tmp/matrix-scope-runtime-sdk-probe.mjs.b64",
              "/var/tmp/matrix-scope-runtime-broker-fixture.mjs",
              "/var/tmp/matrix-scope-runtime-broker-fixture.mjs.b64",
              "/var/tmp/matrix-scope-native-acceptance.sh",
              "/var/tmp/matrix-scope-native-acceptance.sh.b64",
              "/var/tmp/matrix-scope-production-acceptance.mjs",
              "/var/tmp/matrix-scope-production-acceptance.mjs.b64"]}'
            send_command "$body" || true
            body="$(jq -cn --arg root "$ROOT_STAGING_DIR" '{
              command:["/usr/bin/sudo","/usr/bin/rm","-rf","--",$root]
            }')"
            send_command "$body" || true
          }
          trap cleanup_remote EXIT

          stage_body="$(jq -cn --arg root "$ROOT_STAGING_DIR" '{
            command:["/usr/bin/sudo","/usr/bin/install","--directory",
              "--owner=root","--group=root","--mode=0700",$root]
          }')"
          send_command "$stage_body"

          upload_asset scripts/spikes/collaboration/scope-runtime-probe.ts \
            /var/tmp/matrix-scope-runtime-probe.ts 0644
          stage_root_asset scripts/spikes/collaboration/scope-runtime-probe.ts \
            /var/tmp/matrix-scope-runtime-probe.ts \
            "$ROOT_STAGING_DIR/matrix-scope-runtime-probe.ts" 0644
          upload_asset scripts/spikes/collaboration/scope-runtime-sdk-probe.mjs \
            /var/tmp/matrix-scope-runtime-sdk-probe.mjs 0644
          stage_root_asset scripts/spikes/collaboration/scope-runtime-sdk-probe.mjs \
            /var/tmp/matrix-scope-runtime-sdk-probe.mjs \
            "$ROOT_STAGING_DIR/matrix-scope-runtime-sdk-probe.mjs" 0644
          upload_asset scripts/spikes/collaboration/scope-runtime-broker-fixture.mjs \
            /var/tmp/matrix-scope-runtime-broker-fixture.mjs 0644
          stage_root_asset scripts/spikes/collaboration/scope-runtime-broker-fixture.mjs \
            /var/tmp/matrix-scope-runtime-broker-fixture.mjs \
            "$ROOT_STAGING_DIR/matrix-scope-runtime-broker-fixture.mjs" 0644
          upload_asset scripts/spikes/collaboration/native-isolation-acceptance.sh \
            /var/tmp/matrix-scope-native-acceptance.sh 0700
          stage_root_asset scripts/spikes/collaboration/native-isolation-acceptance.sh \
            /var/tmp/matrix-scope-native-acceptance.sh \
            "$ROOT_STAGING_DIR/matrix-scope-native-acceptance.sh" 0700
          upload_asset scripts/spikes/collaboration/production-supervisor-acceptance.mjs \
            /var/tmp/matrix-scope-production-acceptance.mjs 0700
          stage_root_asset scripts/spikes/collaboration/production-supervisor-acceptance.mjs \
            /var/tmp/matrix-scope-production-acceptance.mjs \
            "$ROOT_STAGING_DIR/matrix-scope-production-acceptance.mjs" 0700

          run_body="$(jq -cn --arg root "$ROOT_STAGING_DIR" '{
            command:["/usr/bin/sudo","/usr/bin/env",
              "MATRIX_SCOPE_PROBE_DISPOSABLE=1",
              ("MATRIX_SCOPE_ASSET_ROOT=" + $root),
              ($root + "/matrix-scope-native-acceptance.sh")],timeoutMs:180000
          }')"
          native_response="$RUNNER_TEMP/scope-runtime-native-run.json"
          if ! send_signed_command "$run_body" "$native_response"; then
            cp "$native_response" "$evidence" 2>/dev/null || true
            exit 1
          fi
          if ! jq -e 'select(.exitCode == 0 and .timedOut == false and
            .truncated == false and .signal == null)' "$native_response" >/dev/null; then
            echo "The native proof command failed; inspect the bounded evidence artifact." >&2
            exit 1
          fi
          if ! jq -er '.stdout' "$native_response" |
            grep -Fxq "agent_sdk_version=${expected_sdk_version}"; then
            echo "The disposable preview SDK does not match the immutable probe head." >&2
            exit 1
          fi
          jq -e 'select(
            (.stdout | contains("scope_runtime_acceptance=passed")))' "$native_response" >/dev/null

          production_expected_head="MATRIX_SCOPE_EXPECTED_HEAD=$HEAD_SHA"
          production_body="$(jq -cn --arg expected "$production_expected_head" \
            --arg root "$ROOT_STAGING_DIR" '{
            command:["/usr/bin/sudo","/usr/bin/env",
              "MATRIX_SCOPE_PRODUCTION_DISPOSABLE=1",$expected,
              ($root + "/matrix-scope-production-acceptance.mjs")],
            timeoutMs:180000
          }')"
          production_response="$RUNNER_TEMP/scope-runtime-production-run.json"
          jq -cn '{status:"production-command-not-returned"}' >"$production_response"
          if ! send_signed_command "$production_body" "$production_response"; then
            if ! jq -e . "$production_response" >/dev/null 2>&1; then
              jq -cn '{status:"production-command-transport-failed"}' >"$production_response"
            fi
            jq -cn --arg head "$HEAD_SHA" --arg version "$PREVIEW_VERSION" \
              --slurpfile native "$native_response" --slurpfile production "$production_response" '{
                head:$head, previewVersion:$version,
                nativeProof:$native[0], productionSupervisor:$production[0]
              }' >"$evidence"
            exit 1
          fi
          jq -cn --arg head "$HEAD_SHA" --arg version "$PREVIEW_VERSION" \
            --slurpfile native "$native_response" --slurpfile production "$production_response" '{
              head:$head, previewVersion:$version,
              nativeProof:$native[0], productionSupervisor:$production[0]
            }' >"$evidence"
          jq -e 'select(.exitCode == 0 and .timedOut == false and
            .truncated == false and .signal == null and
            (.stdout | contains("scope_runtime_production_acceptance=passed")))' \
            "$production_response" >/dev/null

      - name: Upload public-safe native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scope-runtime-native-evidence-${{ needs.gate.outputs.head }}
          path: ${{ runner.temp }}/scope-runtime-native-evidence.json
          if-no-files-found: error
          retention-days: 7
