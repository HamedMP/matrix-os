name: Collaboration Scope Runtime Acceptance

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read

concurrency:
  group: collaboration-scope-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.label.name == 'scope-runtime-production-acceptance' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      head: ${{ steps.resolve.outputs.head }}
      handle: ${{ steps.resolve.outputs.handle }}
    steps:
      - id: resolve
        name: Resolve immutable labeled preview head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          head="$(jq -r .head.sha <<<"$pr_json")"
          repo="$(jq -r .head.repo.full_name <<<"$pr_json")"
          if [ "$repo" != "$GITHUB_REPOSITORY" ] ||
            [ "$head" != "$EVENT_HEAD" ] ||
            ! printf '%s' "$head" | grep -Eq '^[0-9a-f]{40}$' ||
            ! jq -e '.labels | any(.name == "preview-vps") and
              any(.name == "scope-runtime-production-acceptance")' <<<"$pr_json" >/dev/null; then
            echo "Scope-runtime acceptance requires the immutable same-repository preview head." >&2
            exit 1
          fi
          {
            echo "pr=$PR"
            echo "head=$head"
            echo "handle=pr-$PR"
          } >>"$GITHUB_OUTPUT"

  prove:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      PR: ${{ needs.gate.outputs.pr }}
      HEAD_SHA: ${{ needs.gate.outputs.head }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head }}

      - id: preview
        name: Resolve the exact disposable preview
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            fleet="$(curl --fail --silent --show-error --max-time 30 \
              -H "authorization: Bearer $PLATFORM_SECRET" \
              "${PLATFORM_PUBLIC_URL%/}/vps/fleet")"
            machine="$(jq -ce --arg handle "$HANDLE" '
              [.machines[] | select(.handle == $handle and .runtimeSlot == $handle
                and .status == "running" and .healthy == true and .deletedAt == null)]
              | if length == 1 then .[0] else {} end
            ' <<<"$fleet")"
            version="$(jq -r '.runtimeVersion // ""' <<<"$machine")"
            address="$(jq -r '.publicIPv4 // ""' <<<"$machine")"
            if [ -n "$version" ] &&
              [ "${version##*-}" = "${HEAD_SHA:0:7}" ] &&
              printf '%s' "$address" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
              echo "::add-mask::$address"
              {
                echo "address=$address"
                echo "version=$version"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "The exact-head disposable preview did not become ready." >&2
          exit 1

      - name: Upload reviewed assets and run the native proof
        env:
          ADDRESS: ${{ steps.preview.outputs.address }}
          PREVIEW_VERSION: ${{ steps.preview.outputs.version }}
        run: |
          set -euo pipefail
          token="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.argv[2])
              .update(process.argv[1]).digest("hex"));
          ' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$token"
          endpoint='https://app.matrix-os.com/api/internal/terminal-acceptance/run'
          evidence="$RUNNER_TEMP/scope-runtime-native-evidence.json"
          jq -cn --arg head "$HEAD_SHA" --arg version "$PREVIEW_VERSION" '{
            head: $head, previewVersion: $version, status: "started"
          }' >"$evidence"

          send_signed_command() {
            local body="$1"
            local response="$2"
            local timestamp nonce signature response_signature headers
            timestamp="$(date +%s)"
            nonce="$(openssl rand -hex 16)"
            signature="$(ACCEPTANCE_SIGNING_KEY="$token" ACCEPTANCE_BODY="$body" \
              node --input-type=module -e '
                import { createHash, createHmac } from "node:crypto";
                const digest = createHash("sha256")
                  .update(process.env.ACCEPTANCE_BODY).digest("hex");
                process.stdout.write(createHmac("sha256", process.env.ACCEPTANCE_SIGNING_KEY)
                  .update("v1\n" + process.argv[1] + "\n" + process.argv[2] + "\n" + digest)
                  .digest("hex"));
              ' "$timestamp" "$nonce")"
            headers="$RUNNER_TEMP/scope-runtime-response-headers"
            curl --fail --silent --show-error --max-time 190 --insecure \
              --resolve "app.matrix-os.com:443:${ADDRESS}" \
              -D "$headers" -o "$response" -X POST "$endpoint" \
              -H "x-matrix-acceptance-timestamp: $timestamp" \
              -H "x-matrix-acceptance-nonce: $nonce" \
              -H "x-matrix-acceptance-signature: $signature" \
              -H 'content-type: application/json' --data-binary "$body"
            response_signature="$(awk 'BEGIN{IGNORECASE=1}
              /^x-matrix-acceptance-response-signature:/ {
                gsub("\r", "", $2); value=$2
              } END{print value}' "$headers")"
            ACCEPTANCE_SIGNING_KEY="$token" node --input-type=module -e '
              import { createHash, createHmac, timingSafeEqual } from "node:crypto";
              import { readFile } from "node:fs/promises";
              const [timestamp, nonce, signature, path] = process.argv.slice(1);
              const body = await readFile(path);
              const digest = createHash("sha256").update(body).digest("hex");
              const expected = createHmac("sha256", process.env.ACCEPTANCE_SIGNING_KEY)
                .update("v1-response\n" + timestamp + "\n" + nonce + "\n" + digest)
                .digest("hex");
              if (!/^[0-9a-f]{64}$/.test(signature) ||
                !timingSafeEqual(Buffer.from(signature, "hex"), Buffer.from(expected, "hex"))) {
                process.exit(1);
              }
            ' "$timestamp" "$nonce" "$response_signature" "$response"
          }

          send_command() {
            local body="$1"
            local response="$RUNNER_TEMP/scope-runtime-command.json"
            send_signed_command "$body" "$response"
            jq -e 'select(.exitCode == 0 and .timedOut == false and
              .truncated == false and .signal == null)' "$response" >/dev/null
          }

          upload_asset() {
            local source="$1"
            local remote="$2"
            local mode="$3"
            local encoded chunk offset body
            encoded="$(base64 --wrap=0 "$source")"
            body="$(jq -cn --arg path "$remote.b64" '{
              command:["/usr/bin/truncate","--size","0",$path]
            }')"
            send_command "$body"
            offset=0
            while [ "$offset" -lt "${#encoded}" ]; do
              chunk="${encoded:$offset:3000}"
              body="$(jq -cn --arg path "$remote.b64" --arg chunk "$chunk" '{
                command:["/usr/bin/python3","-c",
                  "import sys; open(sys.argv[1], \"ab\").write(sys.argv[2].encode())",
                  $path,$chunk]
              }')"
              send_command "$body"
              offset=$((offset + 3000))
            done
            body="$(jq -cn --arg input "$remote.b64" --arg output "$remote" '{
              command:["/usr/bin/python3","-c",
                "import base64,sys; open(sys.argv[2], \"wb\").write(base64.b64decode(open(sys.argv[1], \"rb\").read(), validate=True))",
                $input,$output]
            }')"
            send_command "$body"
            body="$(jq -cn --arg mode "$mode" --arg path "$remote" '{
              command:["/usr/bin/chmod",$mode,$path]
            }')"
            send_command "$body"
          }

          cleanup_remote() {
            local body
            body='{"command":["/usr/bin/rm","-f","--",
              "/var/tmp/matrix-scope-runtime-probe.ts",
              "/var/tmp/matrix-scope-runtime-probe.ts.b64",
              "/var/tmp/matrix-scope-runtime-sdk-probe.mjs",
              "/var/tmp/matrix-scope-runtime-sdk-probe.mjs.b64",
              "/var/tmp/matrix-scope-runtime-broker-fixture.mjs",
              "/var/tmp/matrix-scope-runtime-broker-fixture.mjs.b64",
              "/var/tmp/matrix-scope-native-acceptance.sh",
              "/var/tmp/matrix-scope-native-acceptance.sh.b64"]}'
            send_command "$body" || true
          }
          trap cleanup_remote EXIT

          upload_asset scripts/spikes/collaboration/scope-runtime-probe.ts \
            /var/tmp/matrix-scope-runtime-probe.ts 0644
          upload_asset scripts/spikes/collaboration/scope-runtime-sdk-probe.mjs \
            /var/tmp/matrix-scope-runtime-sdk-probe.mjs 0644
          upload_asset scripts/spikes/collaboration/scope-runtime-broker-fixture.mjs \
            /var/tmp/matrix-scope-runtime-broker-fixture.mjs 0644
          upload_asset scripts/spikes/collaboration/native-isolation-acceptance.sh \
            /var/tmp/matrix-scope-native-acceptance.sh 0700

          run_body='{"command":["/usr/bin/sudo","/usr/bin/env",
            "MATRIX_SCOPE_PROBE_DISPOSABLE=1",
            "/var/tmp/matrix-scope-native-acceptance.sh"],"timeoutMs":180000}'
          response="$RUNNER_TEMP/scope-runtime-native-run.json"
          if ! send_signed_command "$run_body" "$response"; then
            cp "$response" "$evidence" 2>/dev/null || true
            exit 1
          fi
          jq -c --arg head "$HEAD_SHA" --arg version "$PREVIEW_VERSION" '{
            head: $head,
            previewVersion: $version,
            exitCode,
            timedOut,
            truncated,
            signal,
            stdout,
            stderr
          }' "$response" >"$evidence"
          jq -e 'select(.exitCode == 0 and .timedOut == false and
            .truncated == false and .signal == null and
            (.stdout | contains("scope_runtime_acceptance=passed")))' "$response" >/dev/null

      - name: Upload public-safe native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scope-runtime-native-evidence-${{ needs.gate.outputs.head }}
          path: ${{ runner.temp }}/scope-runtime-native-evidence.json
          if-no-files-found: error
          retention-days: 7
