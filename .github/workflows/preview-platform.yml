# Platform preview revision per PR (spec 093) -- scaffold
#
# Label a same-repo PR with `preview-platform` to deploy the platform image to
# a DEDICATED preview Cloud Run service as a tagged, zero-traffic revision:
#   https://pr-<N>---<preview-service-url>
#
# Safety model: the preview service (matrix-platform-preview) is a separate
# Cloud Run service running as a dedicated runtime SA
# (matrix-platform-preview-runner) that can only read preview/staging
# secrets: the staging database, preview-generated platform/jwt/edge-router
# secrets, the Clerk keys, the R2 bundles credentials, and Stripe TEST-mode
# secrets (test secret key, test webhook secret, test price IDs). Production
# CLOUD_RUN_SERVICE, its runtime SA, and its secrets are never referenced, and
# only test-mode Stripe keys are mounted -- a preview can never touch live money
# or the production database.
#
# Exposure: the service runs with public ingress (--allow-unauthenticated),
# exactly like the production platform -- the app enforces its own Clerk/JWT
# auth on every route, and the operator API stays gated by the preview
# PLATFORM_SECRET. It is fronted by the browser-reachable host
# https://preview.matrix-os.com so onboarding/billing PRs can be walked end to
# end before merge. Previews are still per-PR tagged, zero-traffic revisions;
# to walk a specific PR, route its tag to the host:
#   gcloud run services update-traffic matrix-platform-preview \
#     --region europe-west3 --to-tags pr-<N>=100
# then reset when done. No Hetzner token is mounted, so previews still cannot
# provision real VPSes (enabling the provisioned hand-off slice is a separate,
# deliberate change -- a preview-scoped Hetzner token plus VPS reaping).
# Config lives in the GitHub "Preview" environment; the jobs no-op with a
# notice when it is absent. Neon branch databases per PR remain deferred
# (spec 093).

name: Preview Platform

on:
  pull_request:
    types: [labeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to deploy a platform preview for"
        required: true
        type: string

      custom_mcp:
        description: "Enable the personal MCP broker with the isolated preview encryption key"
        type: boolean
        default: false

      connect_share_preview:
        description: "Connect an existing PR platform tag to its share-only VPS route in staging"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-platform-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview revision
    if: >-
      ((github.event_name == 'workflow_dispatch' && !inputs.connect_share_preview) ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.action != 'closed' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'preview-platform') ||
         (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview-platform')))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      PREVIEW_PUBLIC_URL: ${{ vars.PREVIEW_PUBLIC_URL || 'https://preview.matrix-os.com' }}
      MATRIX_CARD_TRIALS_ENABLED: ${{ vars.MATRIX_CARD_TRIALS_ENABLED || 'true' }}
      MATRIX_CARD_TRIAL_DAYS: ${{ vars.MATRIX_CARD_TRIAL_DAYS || '3' }}
      CUSTOM_MCP_ENABLED: ${{ inputs.custom_mcp && 'true' || 'false' }}
      MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED: ${{ vars.MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED || 'false' }}
      MATRIX_FUNDED_AI_RUNTIME_ENABLED: ${{ vars.MATRIX_FUNDED_AI_RUNTIME_ENABLED || 'false' }}
      MATRIX_FUNDED_AI_RELAY_URL: ${{ vars.MATRIX_FUNDED_AI_RELAY_URL }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Check preview configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_RUN_PREVIEW_SERVICE:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUD_RUN_PREVIEW_SERVICE is not configured; platform previews are disabled. See specs/093-preview-environments/."
            exit 0
          fi
          if [ -z "${CLOUD_RUN_SERVICE_ACCOUNT:-}" ]; then
            echo "CLOUD_RUN_PREVIEW_SERVICE_ACCOUNT must be set in the Preview environment; refusing to fall back to another SA." >&2
            exit 1
          fi
          case "$MATRIX_CARD_TRIALS_ENABLED" in
            true|false) ;;
            *)
              echo "MATRIX_CARD_TRIALS_ENABLED must be true or false." >&2
              exit 1
              ;;
          esac
          if ! [[ "$MATRIX_CARD_TRIAL_DAYS" =~ ^(0*[1-9]|0*[12][0-9]|0*30)$ ]]; then
            echo "MATRIX_CARD_TRIAL_DAYS must be an integer from 1 to 30." >&2
            exit 1
          fi
          for name in MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED MATRIX_FUNDED_AI_RUNTIME_ENABLED; do
            case "${!name}" in
              true|false) ;;
              *)
                echo "$name must be true or false." >&2
                exit 1
                ;;
            esac
          done
          if [ "$MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED" != "$MATRIX_FUNDED_AI_RUNTIME_ENABLED" ]; then
            echo "Funded AI control-plane and runtime flags must be enabled or disabled together." >&2
            exit 1
          fi
          if [ "$MATRIX_FUNDED_AI_RUNTIME_ENABLED" = "true" ]; then
            if ! [[ "$MATRIX_FUNDED_AI_RELAY_URL" =~ ^https://[^/?#]+/?$ ]]; then
              echo "MATRIX_FUNDED_AI_RELAY_URL must be an HTTPS origin when funded AI is enabled." >&2
              exit 1
            fi
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.config.outputs.configured == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify preview funded AI control-plane secrets
        if: steps.config.outputs.configured == 'true' && env.MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED == 'true'
        run: |
          set -euo pipefail
          required_funded_ai_secrets=(
            ai-relay-control-token
            ai-funded-credential-hash-secret
          )
          for secret_name in "${required_funded_ai_secrets[@]}"; do
            gcloud secrets versions describe latest \
              --secret "$secret_name" \
              --project "$GCP_PROJECT_ID" >/dev/null
            accessor_member="$(
              gcloud secrets get-iam-policy "$secret_name" \
                --project "$GCP_PROJECT_ID" \
                --flatten='bindings[].members' \
                --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" \
                --format='value(bindings.members)' \
                | head -1
            )"
            if [ "$accessor_member" != "serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
              echo "$secret_name must grant roles/secretmanager.secretAccessor to ${CLOUD_RUN_SERVICE_ACCOUNT}." >&2
              exit 1
            fi
          done

      - name: Build platform image
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi
          if [ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" = "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k" ]; then
            echo "Refusing to build a platform preview with the example Clerk key." >&2
            exit 1
          fi
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-platform:pr-${PR_NUMBER}-${head_sha::12}"
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --config cloudbuild.platform.yaml \
            --substitutions "_IMAGE=$image,_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,_NEXT_PUBLIC_MATRIX_APP_URL=$PREVIEW_PUBLIC_URL" \
            --quiet
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify preview golden snapshot operator secret
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          snapshot_operator_secret_name=golden-snapshot-operator-secret-preview
          gcloud secrets describe "$snapshot_operator_secret_name" \
            --project "$GCP_PROJECT_ID" >/dev/null
          snapshot_operator_secret_tmpfile="$(mktemp)"
          trap 'rm -f "$snapshot_operator_secret_tmpfile"' EXIT
          if ! gcloud secrets versions access latest --secret "$snapshot_operator_secret_name" \
            --project "$GCP_PROJECT_ID" >"$snapshot_operator_secret_tmpfile"; then
            echo "Preview golden snapshot operator secret must have an accessible latest version." >&2
            exit 1
          fi
          if [ ! -s "$snapshot_operator_secret_tmpfile" ]; then
            echo "Preview golden snapshot operator secret must not be empty." >&2
            exit 1
          fi
          accessor_member="$(
            gcloud secrets get-iam-policy "$snapshot_operator_secret_name" \
              --project "$GCP_PROJECT_ID" \
              --flatten='bindings[].members' \
              --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" \
              --format='value(bindings.members)' \
              | head -1
          )"
          if [ "$accessor_member" != "serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
            echo "Preview golden snapshot operator secret must grant roles/secretmanager.secretAccessor to ${CLOUD_RUN_SERVICE_ACCOUNT}." >&2
            exit 1
          fi

      - name: Verify preview speech secrets
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for secret_name in platform-speech-openai-api-key-preview platform-speech-secret-preview; do
            secret_tmpfile="$(mktemp)"
            trap 'rm -f "$secret_tmpfile"' EXIT
            gcloud secrets versions access latest --secret "$secret_name" \
              --project "$GCP_PROJECT_ID" >"$secret_tmpfile"
            test -s "$secret_tmpfile"
            accessor_member="$(
              gcloud secrets get-iam-policy "$secret_name" \
                --project "$GCP_PROJECT_ID" \
                --flatten='bindings[].members' \
                --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" \
                --format='value(bindings.members)' | head -1
            )"
            if [ "$accessor_member" != "serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
              echo "Preview speech secret access is misconfigured." >&2
              exit 1
            fi
            rm -f "$secret_tmpfile"
            trap - EXIT
          done

      - name: Deploy zero-traffic tagged revision to preview service
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Browser-reachable preview host (custom domain routed to this service).
          # Origins/redirects and Stripe return URLs resolve to this host.
          PREVIEW_PUBLIC_URL="${PREVIEW_PUBLIC_URL:-https://preview.matrix-os.com}"
          # Derive the bare host so MATRIX_APP_DOMAIN_HOSTS always tracks
          # PREVIEW_PUBLIC_URL (origin/CORS checks must match the real host).
          PREVIEW_DOMAIN="${PREVIEW_PUBLIC_URL#http://}"
          PREVIEW_DOMAIN="${PREVIEW_DOMAIN#https://}"
          PREVIEW_DOMAIN="${PREVIEW_DOMAIN%%/*}"
          funded_ai_env_bindings="|MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED=${MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED}|MATRIX_FUNDED_AI_RUNTIME_ENABLED=${MATRIX_FUNDED_AI_RUNTIME_ENABLED}"
          funded_ai_secret_bindings=""
          if [ "$MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED" = "true" ]; then
            funded_ai_env_bindings="${funded_ai_env_bindings}|MATRIX_FUNDED_AI_RELAY_URL=${MATRIX_FUNDED_AI_RELAY_URL}"
            funded_ai_secret_bindings=",AI_RELAY_CONTROL_TOKEN=ai-relay-control-token:latest,AI_FUNDED_CREDENTIAL_HASH_SECRET=ai-funded-credential-hash-secret:latest"
          fi
          PREVIEW_SPEECH_NOT_AFTER="$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%S.000Z')"
          deploy_preview() {
            local api_origin="$1"
            local custom_mcp_secret_bindings=""
            if [ "$CUSTOM_MCP_ENABLED" = "true" ]; then
              custom_mcp_secret_bindings=",MCP_CREDENTIAL_ENCRYPTION_KEY=mcp-credential-encryption-key-preview:1"
            fi
            gcloud run deploy "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --image "$IMAGE" \
              --service-account "$CLOUD_RUN_SERVICE_ACCOUNT" \
              --tag "pr-${PR_NUMBER}" \
              --no-traffic \
              --allow-unauthenticated \
              --set-env-vars "^|^PLATFORM_RUNTIME_MODE=cloud_run|PLATFORM_PORT=8080|PLATFORM_PREVIEW=true|CUSTOMER_VPS_ENABLED=true|CUSTOMER_VPS_IMAGE_VERSION=dev|CUSTOMER_VPS_CLOUD_INIT_PATH=distro/customer-vps/cloud-init.yaml|AUTH_SHELL_HOST=127.0.0.1|AUTH_SHELL_PORT=3200|MATRIX_LEGACY_CONTAINER_ROUTING_ENABLED=false|MATRIX_STRIPE_BILLING_ENABLED=true|MATRIX_CARD_TRIALS_ENABLED=${MATRIX_CARD_TRIALS_ENABLED}|MATRIX_CARD_TRIAL_DAYS=${MATRIX_CARD_TRIAL_DAYS}|PLATFORM_PUBLIC_URL=${PREVIEW_PUBLIC_URL}|MATRIX_API_ORIGIN=${api_origin}|MATRIX_APP_URL=${PREVIEW_PUBLIC_URL}|MATRIX_APP_DOMAIN_HOSTS=${PREVIEW_DOMAIN},${api_origin#https://}|CUSTOMER_VPS_TLS_VERIFY=false|CUSTOM_MCP_ENABLED=${CUSTOM_MCP_ENABLED}|MCP_OAUTH_CALLBACK_URL=${api_origin}/api/mcp-servers/oauth/callback|MATRIX_PLATFORM_SPEECH_RUNTIME_ENABLED=true|PLATFORM_SPEECH_ENABLED=true|PLATFORM_SPEECH_PROVIDER=openai|PLATFORM_SPEECH_MODEL=gpt-4o-mini-transcribe|PLATFORM_SPEECH_POLICY_REVISION=preview-speech-v1|PLATFORM_SPEECH_PREVIEW_NO_CHARGE=true|PLATFORM_SPEECH_PREVIEW_MAX_OPERATIONS_PER_RUNTIME=25|PLATFORM_SPEECH_PREVIEW_NOT_AFTER=${PREVIEW_SPEECH_NOT_AFTER}|PLATFORM_SPEECH_OWNER_AUDIO_ENABLED=false${funded_ai_env_bindings}" \
              --set-secrets "PLATFORM_DATABASE_URL=platform-database-url-staging:latest,PLATFORM_SECRET=platform-preview-secret:latest,GOLDEN_SNAPSHOT_OPERATOR_SECRET=golden-snapshot-operator-secret-preview:latest,PLATFORM_JWT_SECRET=platform-preview-jwt-secret:latest,EDGE_ROUTER_SECRET=edge-router-preview-secret:latest,CLERK_SECRET_KEY=clerk-secret-key:latest,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=next-public-clerk-publishable-key:latest,R2_BUNDLES_ACCOUNT_ID=r2-bundles-account-id:latest,R2_BUNDLES_BUCKET=r2-bundles-bucket:latest,R2_BUNDLES_ENDPOINT=r2-bundles-endpoint:latest,R2_BUNDLES_ACCESS_KEY_ID=r2-bundles-access-key-id:latest,R2_BUNDLES_SECRET_ACCESS_KEY=r2-bundles-secret-access-key:latest,STRIPE_SECRET_KEY=stripe-secret-key-test:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret-test:latest,STRIPE_PRICE_MATRIX_STARTER_MONTHLY=stripe-price-matrix-starter-monthly-test:latest,STRIPE_PRICE_MATRIX_STARTER_ANNUAL=stripe-price-matrix-starter-annual-test:latest,STRIPE_PRICE_MATRIX_BUILDER_MONTHLY=stripe-price-matrix-builder-monthly-test:latest,STRIPE_PRICE_MATRIX_BUILDER_ANNUAL=stripe-price-matrix-builder-annual-test:latest,STRIPE_PRICE_MATRIX_MAX_MONTHLY=stripe-price-matrix-max-monthly-test:latest,STRIPE_PRICE_MATRIX_MAX_ANNUAL=stripe-price-matrix-max-annual-test:latest,STRIPE_LEGACY_PRICE_CATALOG_JSON=stripe-legacy-price-catalog-json-test:latest,PLATFORM_SPEECH_OPENAI_API_KEY=platform-speech-openai-api-key-preview:latest,PLATFORM_SPEECH_SECRET=platform-speech-secret-preview:latest${custom_mcp_secret_bindings}${funded_ai_secret_bindings}" \
              --cpu 1 --memory 1Gi --concurrency 10 --timeout 300 --min-instances 0 --max-instances 2 \
              --quiet
          }

          service_base_url="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          BOOTSTRAP_API_ORIGIN="https://preview-bootstrap.invalid"
          if [ -z "$service_base_url" ]; then
            deploy_preview "$BOOTSTRAP_API_ORIGIN"
            service_base_url="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --format='value(status.url)')"
          fi
          if [ -z "$service_base_url" ]; then
            echo "Preview service URL is unavailable; refusing a shared control-plane fallback." >&2
            exit 1
          fi
          PREVIEW_API_ORIGIN="https://pr-${PR_NUMBER}---${service_base_url#https://}"
          deploy_preview "$PREVIEW_API_ORIGIN"
          url=""
          revision=""
          for _attempt in {1..10}; do
            desc="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format json)"
            url="$(jq -r --arg tag "pr-${PR_NUMBER}" \
              '[(.status.traffic // [])[] | select(.tag == $tag) | .url] | first // ""' <<< "$desc")"
            revision="$(jq -r --arg tag "pr-${PR_NUMBER}" \
              '[(.status.traffic // [])[] | select(.tag == $tag) | .revisionName] | first // ""' <<< "$desc")"
            if [ -n "$url" ] && [ -n "$revision" ]; then
              break
            fi
            sleep 3
          done
          if [ -z "$url" ] || [ -z "$revision" ]; then
            echo "PR-tagged preview revision metadata did not become ready." >&2
            exit 1
          fi
          if [ "$url" != "$PREVIEW_API_ORIGIN" ]; then
            echo "Tagged preview URL does not match MATRIX_API_ORIGIN." >&2
            exit 1
          fi
          expected_digest="$(gcloud artifacts docker images describe "$IMAGE" \
            --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          revision_image="$(gcloud run revisions describe "$revision" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          expected_digest_image="${IMAGE%:*}@${expected_digest}"
          if [ -z "$expected_digest" ] || { [ "$revision_image" != "$IMAGE" ] && [ "$revision_image" != "$expected_digest_image" ]; }; then
            echo "PR-tagged preview revision does not run the exact built image." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 5 --max-time 10 "${PREVIEW_API_ORIGIN}/health" > /dev/null
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "PREVIEW_PUBLIC_URL=$PREVIEW_PUBLIC_URL" >> "$GITHUB_ENV"
          echo "PREVIEW_API_ORIGIN=$PREVIEW_API_ORIGIN" >> "$GITHUB_ENV"

      - name: Comment preview URL on PR
        if: steps.config.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="**Platform preview revision deployed**

          - Browser-reachable host: ${PREVIEW_PUBLIC_URL} (route this PR's tag to it: \`gcloud run services update-traffic ${CLOUD_RUN_PREVIEW_SERVICE} --region ${GCP_REGION} --to-tags pr-${PR_NUMBER}=100\`, then reset when done)
          - Desktop control-plane origin: ${PREVIEW_API_ORIGIN}
          - Revision URL: ${PREVIEW_URL}
          - Service: \`${CLOUD_RUN_PREVIEW_SERVICE}\` (deployed zero-traffic, tag \`pr-${PR_NUMBER}\`)

          Runs as the preview runtime SA against the staging database with Stripe TEST-mode keys; production service, SA, database, and live Stripe keys are untouched."
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("**Platform preview revision deployed**"))] | .[0].id // ""')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi

  teardown:
    name: Remove preview revision
    if: >-
      github.event.action == 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'preview-platform')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check preview configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_RUN_PREVIEW_SERVICE:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUD_RUN_PREVIEW_SERVICE is not configured; nothing to tear down."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Remove tag and delete tagged revisions
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          revisions="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format json |
            jq -r --arg tag "pr-${PR_NUMBER}" \
              '[(.status.traffic // [])[] | select(.tag == $tag) | .revisionName] | unique | .[]')"
          if [ -z "$revisions" ]; then
            echo "No revisions tagged pr-${PR_NUMBER}; nothing to tear down."
            exit 0
          fi
          gcloud run services update-traffic "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --remove-tags "pr-${PR_NUMBER}" --quiet
          for rev in $revisions; do
            current_service="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format json --quiet)"
            if jq -e --arg revision "$rev" \
              '.status.latestCreatedRevisionName == $revision or
               any((.status.traffic // [])[];
                 .revisionName == $revision and ((.percent // 0) > 0 or (.tag // "") != ""))' \
              <<< "$current_service" >/dev/null; then
              echo "Retaining protected or referenced revision $rev after removing the PR tag."
              continue
            fi
            gcloud run revisions delete "$rev" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
            echo "Deleted revision $rev"
          done

  select-share-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.connect_share_preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.runtime.outputs.head_sha }}
    env:
      PR_NUMBER: ${{ inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select exact-head preview runtime artifact
        id: runtime
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          pull_request="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          expected_head_sha="$(jq -er --arg repository "$GITHUB_REPOSITORY" '
            select(.state == "open" and .head.repo.full_name == $repository)
            | .head.sha
            | select(type == "string" and test("^[a-f0-9]{40}$"))
          ' <<< "$pull_request")"
          expected_artifact="preview-runtime-access-$PR_NUMBER"
          run_id=""
          mapfile -t candidate_runs < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/preview-vps.yml/runs?head_sha=${expected_head_sha}&event=pull_request&status=success&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
          for candidate in "${candidate_runs[@]}"; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" | \
              jq -r --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name and .expired == false)] | .[0].id // empty')"
            if [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]; then
              run_id="$candidate"
              break
            fi
          done
          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "A successful exact-head Preview VPS run is required before connecting speech." >&2
            exit 1
          fi
          echo "head_sha=$expected_head_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: preview-runtime-access-${{ inputs.pr }}
          path: preview-runtime-access
          repository: ${{ github.repository }}
          run-id: ${{ steps.runtime.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Preserve exact-head preview runtime route
        run: |
          set -euo pipefail
          public_route=preview-runtime-access/preview-runtime-route.json
          test -s "$public_route"
          test "$(wc -c < "$public_route")" -le 1024
          jq -e --arg handle "pr-$PR_NUMBER" '
            type == "object"
            and keys == ["address", "handle"]
            and .handle == $handle
            and (.address | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' "$public_route" >/dev/null
          cp "$public_route" preview-share-route.json
          chmod 600 preview-share-route.json
      - uses: actions/upload-artifact@v4
        with:
          name: preview-share-route
          path: preview-share-route.json
          retention-days: 1

  connect-share-preview:
    needs: select-share-preview
    if: github.event_name == 'workflow_dispatch' && inputs.connect_share_preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      PR_NUMBER: ${{ inputs.pr }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
      PREVIEW_CLERK_ACCESS_USER_IDS: ${{ secrets.PREVIEW_CLERK_ACCESS_USER_IDS }}
      PREVIEW_VPS_CONTROL_URL: https://app.matrix-os.com
      CUSTOM_MCP_ENABLED: ${{ inputs.custom_mcp }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      EXPECTED_HEAD_SHA: ${{ needs.select-share-preview.outputs.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: preview-share-route
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter . --ignore-scripts
      - name: Register only the PR preview route in staging
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$pr_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The requested PR head changed before preview connection." >&2
            exit 1
          fi
          test "$CLOUD_RUN_PREVIEW_SERVICE" = matrix-platform-preview
          gcloud help secrets versions access >/dev/null
          preview_db="$(gcloud secrets versions access latest --secret platform-database-url-staging --project "$GCP_PROJECT_ID" --quiet)"
          echo "::add-mask::$preview_db"
          PREVIEW_DATABASE_URL="$preview_db" PREVIEW_CLERK_USER_ID="$PREVIEW_CLERK_USER_ID" \
            PREVIEW_CLERK_ACCESS_USER_IDS="${PREVIEW_CLERK_ACCESS_USER_IDS:-[]}" \
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { Client } from "pg";
          import { selectSharePreviewMachine } from "./scripts/chat-share-preview-fixture.mjs";

          const actorId = process.env.PREVIEW_CLERK_USER_ID ?? "";
          const prNumber = process.env.PR_NUMBER ?? "";
          const fixtureOwnerId = `chat-share-preview-fixture-pr-${prNumber}`;
          if (!/^user_[A-Za-z0-9]+$/.test(actorId)) {
            console.error("Preview fixture authorization is invalid.");
            process.exit(1);
          }
          let accessUserIds;
          try {
            accessUserIds = JSON.parse(process.env.PREVIEW_CLERK_ACCESS_USER_IDS ?? "[]");
            // The staging fixture has a synthetic owner. The real Preview
            // owner is one of its collaborators, leaving seven extra slots.
            if (!Array.isArray(accessUserIds) || accessUserIds.length > 7
              || accessUserIds.some((id) => typeof id !== "string" || !/^user_[A-Za-z0-9]+$/.test(id) || id === actorId)
              || new Set(accessUserIds).size !== accessUserIds.length) throw new Error("invalid access list");
          } catch {
            console.error("Preview fixture access list is invalid.");
            process.exit(1);
          }
          const client = new Client({
            connectionString: process.env.PREVIEW_DATABASE_URL,
            connectionTimeoutMillis: 10_000,
            statement_timeout: 10_000,
          });
          try {
            const fixture = JSON.parse(await readFile("preview-share-route.json", "utf8"));
            const { handle, address } = selectSharePreviewMachine({ machines: [{
              handle: fixture.handle,
              runtimeSlot: fixture.handle,
              publicIPv4: fixture.address,
              provisioningClass: "preview",
              status: "running",
            }] }, prNumber);
            await client.connect();
            const result = await client.query(`INSERT INTO user_machines
              (machine_id, clerk_user_id, handle, runtime_slot, provisioning_class, public_ipv4,
               status, provisioned_at, developer_tools, access_clerk_user_ids)
              VALUES ($1, $6, $2, $2, 'preview', $3,
                      'running', $4, '[]', $5::TEXT[])
              ON CONFLICT (machine_id) DO UPDATE SET
                clerk_user_id = EXCLUDED.clerk_user_id,
                public_ipv4 = EXCLUDED.public_ipv4,
                status = 'running',
                deleted_at = NULL,
                provisioned_at = EXCLUDED.provisioned_at,
                access_clerk_user_ids = EXCLUDED.access_clerk_user_ids
              WHERE user_machines.clerk_user_id IN ('chat-share-preview-fixture', $6)
                AND user_machines.handle = EXCLUDED.handle
                AND user_machines.runtime_slot = EXCLUDED.runtime_slot
                AND user_machines.provisioning_class = 'preview'
              RETURNING access_clerk_user_ids @> $5::TEXT[] AS authorized`, [
              `chat-share-preview-${handle}`, handle, address, new Date().toISOString(), [actorId, ...accessUserIds], fixtureOwnerId,
            ]);
            if (result.rowCount !== 1 || result.rows[0]?.authorized !== true) {
              throw new Error("authorization rejected");
            }
          } catch {
            console.error("Preview fixture authorization failed.");
            process.exitCode = 1;
          } finally {
            try {
              await client.end();
            } catch {
              console.error("Preview fixture cleanup failed.");
              process.exitCode = 1;
            }
          }
          NODE
      - name: Enable the existing tagged host without moving traffic
        run: |
          set -euo pipefail
          speech_config_response=/tmp/preview-speech-config.json
          gateway_restart_response=/tmp/preview-gateway-restart.json
          gateway_active_response=/tmp/preview-gateway-active.json
          speech_capabilities_response=/tmp/preview-speech-capabilities.json
          gateway_capabilities_response=/tmp/preview-gateway-capabilities.json
          cleanup_preview_connection() {
            rm -f "$speech_config_response" "$gateway_restart_response" "$gateway_active_response" \
              "$speech_capabilities_response" "$gateway_capabilities_response"
          }
          trap cleanup_preview_connection EXIT
          gcloud help run services describe >/dev/null
          gcloud help run revisions describe >/dev/null
          gcloud help run deploy >/dev/null
          service="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json --quiet)"
          revision="$(jq -er --arg tag "pr-$PR_NUMBER" '.status.traffic[] | select(.tag == $tag) | .revisionName' <<< "$service")"
          url="$(jq -er --arg tag "pr-$PR_NUMBER" '.status.traffic[] | select(.tag == $tag) | .url' <<< "$service")"
          image="$(gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.containers[0].image)' --quiet)"
          expected_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-platform:pr-${PR_NUMBER}-${EXPECTED_HEAD_SHA::12}"
          expected_digest="$(gcloud artifacts docker images describe "$expected_image" \
            --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)' --quiet)"
          expected_digest_image="${expected_image%:*}@${expected_digest}"
          if [ -z "$expected_digest" ] || { [ "$image" != "$expected_image" ] && [ "$image" != "$expected_digest_image" ]; }; then
            echo "The tagged platform preview does not match the exact PR head." >&2
            exit 1
          fi
          # Match the existing platform VPS-origin TLS policy (tracked in #410).
          # This applies only to the dedicated Preview service and registered VPS addresses.
          gcloud run deploy "$CLOUD_RUN_PREVIEW_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$image" --tag "pr-$PR_NUMBER" --no-traffic \
            --update-env-vars "^@^MATRIX_APP_DOMAIN_HOSTS=preview.matrix-os.com,${url#https://}@CUSTOMER_VPS_TLS_VERIFY=false" --quiet
          if ! [[ "$PREVIEW_CLERK_USER_ID" =~ ^user_[A-Za-z0-9]+$ ]]; then
            echo "PREVIEW_CLERK_USER_ID is required for preview speech authorization." >&2
            exit 1
          fi
          handle="pr-$PR_NUMBER"
          machine_id="chat-share-preview-$handle"
          fixture_owner_id="chat-share-preview-fixture-$handle"
          if [ -z "${CLERK_SECRET_KEY:-}" ]; then
            echo "Preview Clerk authentication is not configured." >&2
            exit 1
          fi
          sessions="$(curl --fail --silent --show-error --max-time 30 \
            "https://api.clerk.com/v1/sessions?user_id=${PREVIEW_CLERK_USER_ID}&status=active&limit=10" \
            -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
            -H "Clerk-API-Version: 2025-11-10")"
          session_id="$(jq -er \
            'sort_by(.last_active_at // 0) | reverse | .[0].id | select(type == "string" and test("^sess_[A-Za-z0-9]+$"))' \
            <<< "$sessions")"
          session_token_payload="$(curl --fail --silent --show-error --max-time 30 \
            -X POST "https://api.clerk.com/v1/sessions/${session_id}/tokens" \
            -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
            -H "Clerk-API-Version: 2025-11-10" \
            -H "content-type: application/json" \
            --data-binary '{"expires_in_seconds":300}')"
          preview_session_token="$(jq -er '.jwt | select(type == "string" and length <= 8192)' \
            <<< "$session_token_payload")"
          echo "::add-mask::$preview_session_token"
          unset sessions session_token_payload
          terminal_url="${PREVIEW_VPS_CONTROL_URL}/vm/${handle}/api/terminal/run"
          preview_platform_secret="$(gcloud secrets versions access latest \
            --secret platform-preview-secret --project "$GCP_PROJECT_ID" --quiet)"
          echo "::add-mask::$preview_platform_secret"
          mcp_token="$(PREVIEW_SIGNING_SECRET="$preview_platform_secret" node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.env.PREVIEW_SIGNING_SECRET).update(process.argv[1]).digest("hex"));
          ' "$handle")"
          echo "::add-mask::$mcp_token"
          speech_token="$(PREVIEW_SIGNING_SECRET="$preview_platform_secret" node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.env.PREVIEW_SIGNING_SECRET).update(JSON.stringify([
              "matrix-platform-speech-runtime", 1, process.argv[1], process.argv[2], process.argv[3],
            ])).digest("hex"));
          ' "$handle" "$machine_id" "$handle")"
          echo "::add-mask::$speech_token"
          runtime_config="$(jq -cn \
            --arg origin "$url" \
            --arg token "$speech_token" \
            --arg owner "$PREVIEW_CLERK_USER_ID" \
            --arg fixtureOwner "$fixture_owner_id" \
            --arg machine "$machine_id" \
            --arg slot "$handle" \
            '{
              MATRIX_PREVIEW_RUNTIME:"true",
              MATRIX_PLATFORM_SPEECH_ENABLED:"true",
              MATRIX_PLATFORM_SPEECH_ORIGIN:$origin,
              MATRIX_PLATFORM_SPEECH_RUNTIME_TOKEN:$token,
              MATRIX_PLATFORM_SPEECH_REQUEST_OWNER_ID:$owner,
              MATRIX_PLATFORM_SPEECH_OWNER_ID:$fixtureOwner,
              MATRIX_PLATFORM_SPEECH_MACHINE_ID:$machine,
              MATRIX_PLATFORM_SPEECH_RUNTIME_SLOT:$slot
            }')"
          if [ "$CUSTOM_MCP_ENABLED" = true ]; then
            runtime_config="$(jq -cn --argjson base "$runtime_config" --arg origin "$url" --arg mcpToken "$mcp_token" --arg fixtureOwner "$fixture_owner_id" '
              $base + {
                MATRIX_PREVIEW_CUSTOM_MCP_ORIGIN:$origin,
                MATRIX_PREVIEW_CUSTOM_MCP_TOKEN:$mcpToken,
                MATRIX_PREVIEW_CUSTOM_MCP_OWNER_ID:$fixtureOwner
              }')"
          fi
          read -r -d '' patch_script <<'PYTHON' || true
          import json
          import os
          import re
          import stat
          import sys
          import tempfile

          path = "/opt/matrix/env/host.env"
          config = json.loads(sys.argv[1])
          if not isinstance(config, dict) or not config:
              raise ValueError("invalid preview runtime configuration")
          for key, value in config.items():
              if not re.fullmatch(r"[A-Z][A-Z0-9_]{0,79}", key) or not isinstance(value, str):
                  raise ValueError("invalid preview runtime configuration")
              if not value or len(value) > 2048 or "\n" in value or "\r" in value or "\0" in value:
                  raise ValueError("invalid preview runtime configuration")
          metadata = os.lstat(path)
          if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_size > 1024 * 1024:
              raise ValueError("invalid host environment file")
          with open(path, "r", encoding="utf-8") as source:
              lines = source.read().splitlines()
          keys = set(config)
          preview_mcp_keys = {"MATRIX_PREVIEW_CUSTOM_MCP_ORIGIN", "MATRIX_PREVIEW_CUSTOM_MCP_TOKEN", "MATRIX_PREVIEW_CUSTOM_MCP_OWNER_ID"}
          lines = [line for line in lines if line.split("=", 1)[0] not in keys | preview_mcp_keys]
          lines.extend(f"{key}={config[key]}" for key in sorted(keys))
          directory = os.path.dirname(path)
          fd, temporary = tempfile.mkstemp(prefix=".host.env.preview.", dir=directory, text=True)
          try:
              os.fchmod(fd, 0o640)
              os.fchown(fd, 0, metadata.st_gid)
              with os.fdopen(fd, "w", encoding="utf-8") as target:
                  target.write("\n".join(lines) + "\n")
                  target.flush()
                  os.fsync(target.fileno())
              os.replace(temporary, path)
              directory_fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY)
              try:
                  os.fsync(directory_fd)
              finally:
                  os.close(directory_fd)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          PYTHON
          send_runtime_command() {
            local body="$1" response="$2"
            curl --fail --silent --show-error --max-time 45 \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
              -o "$response" -X POST "$terminal_url" \
              -H "authorization: Bearer ${preview_session_token}" \
              -H 'content-type: application/json' --data-binary "$body"
            jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null)' \
              "$response" >/dev/null
          }
          body="$(jq -cn --arg script "$patch_script" --arg config "$runtime_config" \
            '{command:["/usr/bin/sudo","/usr/bin/python3","-c",$script,$config],timeoutMs:10000}')"
          send_runtime_command "$body" "$speech_config_response"
          # A synchronous restart drops the gateway connection that carries this terminal request.
          restart_unit="matrix-preview-gateway-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body="$(jq -cn --arg unit "--unit=$restart_unit" \
            '{command:["/usr/bin/sudo","/usr/bin/systemd-run",$unit,"--on-active=2s","--collect","/usr/bin/systemctl","restart","matrix-gateway.service"],timeoutMs:10000}')"
          send_runtime_command "$body" "$gateway_restart_response"
          sleep 5
          body='{"command":["/usr/bin/systemctl","is-active","--quiet","matrix-gateway.service"],"timeoutMs":10000}'
          send_runtime_command "$body" "$gateway_active_response"
          capability_url="${url}/internal/containers/${handle}/speech/capabilities?runtimeSlot=${handle}"
          curl --fail --silent --show-error --max-time 15 \
            -H "authorization: Bearer ${speech_token}" "$capability_url" \
            -o "$speech_capabilities_response"
          jq -e '.fileTranscription.status == "ready" and .fileTranscription.dictation.enabled == true' \
            "$speech_capabilities_response" >/dev/null
          read -r -d '' gateway_probe_script <<'PYTHON' || true
          import json
          import os
          import re
          import stat
          import urllib.request

          path = "/opt/matrix/env/host.env"
          fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
          try:
              metadata = os.fstat(fd)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_size > 1024 * 1024:
                  raise ValueError("invalid host environment file")
              source = os.fdopen(fd, "r", encoding="utf-8")
              fd = -1
              with source:
                  token_lines = [
                      line.removeprefix("MATRIX_AUTH_TOKEN=")
                      for line in source.read().splitlines()
                      if line.startswith("MATRIX_AUTH_TOKEN=")
                  ]
          finally:
              if fd >= 0:
                  os.close(fd)
          if len(token_lines) != 1:
              raise ValueError("invalid gateway authentication configuration")
          token = token_lines[0]
          if re.fullmatch(r"[a-f0-9]{64}", token) is None:
              raise ValueError("invalid gateway authentication configuration")
          results = {}
          for name, path in (
              ("speech", "/api/speech/capabilities"),
              ("providers", "/api/chat-providers"),
          ):
              request = urllib.request.Request(
                  f"http://127.0.0.1:4000{path}",
                  headers={"authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise RuntimeError("gateway preview probe failed")
                  results[name] = json.load(response)
          print(json.dumps(results, separators=(",", ":")))
          PYTHON
          body="$(jq -cn --arg script "$gateway_probe_script" \
            '{command:["/usr/bin/python3","-c",$script],timeoutMs:30000}')"
          send_runtime_command "$body" "$gateway_capabilities_response"
          jq -e '
            (.stdout | fromjson) as $result
            | $result.speech.fileTranscription.status == "ready"
            and $result.speech.fileTranscription.dictation.enabled == true
            and ($result.providers | type == "object")
          ' "$gateway_capabilities_response" >/dev/null
          echo "Share preview origin: $url" >> "$GITHUB_STEP_SUMMARY"
