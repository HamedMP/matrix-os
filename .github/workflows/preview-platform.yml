# Platform preview revision per PR (spec 093) -- scaffold
#
# Label a same-repo PR with `preview-platform` to deploy the platform image to
# a DEDICATED preview Cloud Run service as a tagged, zero-traffic revision:
#   https://pr-<N>---<preview-service-url>
#
# Safety model: the preview service (matrix-platform-preview) is a separate
# Cloud Run service running as a dedicated runtime SA
# (matrix-platform-preview-runner) that can only read preview/staging
# secrets: the staging database, preview-generated platform/jwt/edge-router
# secrets, the Clerk keys, the R2 bundles credentials, and Stripe TEST-mode
# secrets (test secret key, test webhook secret, test price IDs). Production
# CLOUD_RUN_SERVICE, its runtime SA, and its secrets are never referenced, and
# only test-mode Stripe keys are mounted -- a preview can never touch live money
# or the production database.
#
# Exposure: the service runs with public ingress (--allow-unauthenticated),
# exactly like the production platform -- the app enforces its own Clerk/JWT
# auth on every route, and the operator API stays gated by the preview
# PLATFORM_SECRET. It is fronted by the browser-reachable host
# https://preview.matrix-os.com so onboarding/billing PRs can be walked end to
# end before merge. Previews are still per-PR tagged, zero-traffic revisions;
# to walk a specific PR, route its tag to the host:
#   gcloud run services update-traffic matrix-platform-preview \
#     --region europe-west3 --to-tags pr-<N>=100
# then reset when done. No Hetzner token is mounted, so previews still cannot
# provision real VPSes (enabling the provisioned hand-off slice is a separate,
# deliberate change -- a preview-scoped Hetzner token plus VPS reaping).
# Config lives in the GitHub "Preview" environment; the jobs no-op with a
# notice when it is absent. Neon branch databases per PR remain deferred
# (spec 093).

name: Preview Platform

on:
  pull_request:
    types: [labeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to deploy a platform preview for"
        required: true
        type: string

      connect_share_preview:
        description: "Connect an existing PR platform tag to its share-only VPS route in staging"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-platform-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview revision
    if: >-
      ((github.event_name == 'workflow_dispatch' && !inputs.connect_share_preview) ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.action != 'closed' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'preview-platform') ||
         (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview-platform')))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      PREVIEW_PUBLIC_URL: ${{ vars.PREVIEW_PUBLIC_URL || 'https://preview.matrix-os.com' }}
      MATRIX_CARD_TRIALS_ENABLED: ${{ vars.MATRIX_CARD_TRIALS_ENABLED || 'true' }}
      MATRIX_CARD_TRIAL_DAYS: ${{ vars.MATRIX_CARD_TRIAL_DAYS || '3' }}
      MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED: ${{ vars.MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED || 'false' }}
      MATRIX_FUNDED_AI_RUNTIME_ENABLED: ${{ vars.MATRIX_FUNDED_AI_RUNTIME_ENABLED || 'false' }}
      MATRIX_FUNDED_AI_RELAY_URL: ${{ vars.MATRIX_FUNDED_AI_RELAY_URL }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Check preview configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_RUN_PREVIEW_SERVICE:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUD_RUN_PREVIEW_SERVICE is not configured; platform previews are disabled. See specs/093-preview-environments/."
            exit 0
          fi
          if [ -z "${CLOUD_RUN_SERVICE_ACCOUNT:-}" ]; then
            echo "CLOUD_RUN_PREVIEW_SERVICE_ACCOUNT must be set in the Preview environment; refusing to fall back to another SA." >&2
            exit 1
          fi
          case "$MATRIX_CARD_TRIALS_ENABLED" in
            true|false) ;;
            *)
              echo "MATRIX_CARD_TRIALS_ENABLED must be true or false." >&2
              exit 1
              ;;
          esac
          if ! [[ "$MATRIX_CARD_TRIAL_DAYS" =~ ^(0*[1-9]|0*[12][0-9]|0*30)$ ]]; then
            echo "MATRIX_CARD_TRIAL_DAYS must be an integer from 1 to 30." >&2
            exit 1
          fi
          for name in MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED MATRIX_FUNDED_AI_RUNTIME_ENABLED; do
            case "${!name}" in true|false) ;; *) echo "$name must be true or false." >&2; exit 1;; esac
          done
          if [ "$MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED" != "$MATRIX_FUNDED_AI_RUNTIME_ENABLED" ]; then
            echo "Funded AI control-plane and runtime flags must match." >&2
            exit 1
          fi
          if [ "$MATRIX_FUNDED_AI_RUNTIME_ENABLED" = "true" ] && ! [[ "$MATRIX_FUNDED_AI_RELAY_URL" =~ ^https://[^/?#]+/?$ ]]; then
            echo "MATRIX_FUNDED_AI_RELAY_URL must be an HTTPS origin when funded AI is enabled." >&2
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.config.outputs.configured == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build platform image
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi
          if [ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" = "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k" ]; then
            echo "Refusing to build a platform preview with the example Clerk key." >&2
            exit 1
          fi
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-platform:pr-${PR_NUMBER}-${head_sha::12}"
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --config cloudbuild.platform.yaml \
            --substitutions "_IMAGE=$image,_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,_NEXT_PUBLIC_MATRIX_APP_URL=$PREVIEW_PUBLIC_URL" \
            --quiet
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify preview speech and funded AI secrets
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          required_preview_secrets=(platform-speech-openai-api-key-preview platform-speech-secret-preview)
          if [ "$MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED" = "true" ]; then
            required_preview_secrets+=(ai-relay-control-token-preview ai-funded-credential-hash-secret-preview)
          fi
          for secret_name in "${required_preview_secrets[@]}"; do
            gcloud secrets versions describe latest --secret "$secret_name" --project "$GCP_PROJECT_ID" >/dev/null
            accessor_member="$(gcloud secrets get-iam-policy "$secret_name" --project "$GCP_PROJECT_ID" \
              --flatten='bindings[].members' --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" \
              --format='value(bindings.members)' | head -1)"
            if [ "$accessor_member" != "serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
              echo "$secret_name must be readable by the preview runtime service account." >&2
              exit 1
            fi
          done

      - name: Verify preview golden snapshot operator secret
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          snapshot_operator_secret_name=golden-snapshot-operator-secret-preview
          gcloud secrets describe "$snapshot_operator_secret_name" \
            --project "$GCP_PROJECT_ID" >/dev/null
          snapshot_operator_secret_tmpfile="$(mktemp)"
          trap 'rm -f "$snapshot_operator_secret_tmpfile"' EXIT
          if ! gcloud secrets versions access latest --secret "$snapshot_operator_secret_name" \
            --project "$GCP_PROJECT_ID" >"$snapshot_operator_secret_tmpfile"; then
            echo "Preview golden snapshot operator secret must have an accessible latest version." >&2
            exit 1
          fi
          if [ ! -s "$snapshot_operator_secret_tmpfile" ]; then
            echo "Preview golden snapshot operator secret must not be empty." >&2
            exit 1
          fi
          accessor_member="$(
            gcloud secrets get-iam-policy "$snapshot_operator_secret_name" \
              --project "$GCP_PROJECT_ID" \
              --flatten='bindings[].members' \
              --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" \
              --format='value(bindings.members)' \
              | head -1
          )"
          if [ "$accessor_member" != "serviceAccount:${CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
            echo "Preview golden snapshot operator secret must grant roles/secretmanager.secretAccessor to ${CLOUD_RUN_SERVICE_ACCOUNT}." >&2
            exit 1
          fi

      - name: Deploy zero-traffic tagged revision to preview service
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Browser-reachable preview host (custom domain routed to this service).
          # Origins/redirects and Stripe return URLs resolve to this host.
          PREVIEW_PUBLIC_URL="${PREVIEW_PUBLIC_URL:-https://preview.matrix-os.com}"
          # Derive the bare host so MATRIX_APP_DOMAIN_HOSTS always tracks
          # PREVIEW_PUBLIC_URL (origin/CORS checks must match the real host).
          PREVIEW_DOMAIN="${PREVIEW_PUBLIC_URL#http://}"
          PREVIEW_DOMAIN="${PREVIEW_DOMAIN#https://}"
          PREVIEW_DOMAIN="${PREVIEW_DOMAIN%%/*}"
          deploy_preview() {
            local api_origin="$1"
            funded_ai_env_bindings=",MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED=${MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED},MATRIX_FUNDED_AI_RUNTIME_ENABLED=${MATRIX_FUNDED_AI_RUNTIME_ENABLED}"
            funded_ai_secret_bindings=""
            if [ "$MATRIX_FUNDED_AI_CONTROL_PLANE_ENABLED" = "true" ]; then
              funded_ai_env_bindings="${funded_ai_env_bindings},MATRIX_FUNDED_AI_RELAY_URL=${MATRIX_FUNDED_AI_RELAY_URL}"
              funded_ai_secret_bindings=",AI_RELAY_CONTROL_TOKEN=ai-relay-control-token-preview:latest,AI_FUNDED_CREDENTIAL_HASH_SECRET=ai-funded-credential-hash-secret-preview:latest"
            fi
            gcloud run deploy "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --image "$IMAGE" \
              --service-account "$CLOUD_RUN_SERVICE_ACCOUNT" \
              --tag "pr-${PR_NUMBER}" \
              --no-traffic \
              --allow-unauthenticated \
              --set-env-vars "PLATFORM_RUNTIME_MODE=cloud_run,PLATFORM_PORT=8080,PLATFORM_PREVIEW=true,CUSTOMER_VPS_ENABLED=true,CUSTOMER_VPS_IMAGE_VERSION=dev,CUSTOMER_VPS_CLOUD_INIT_PATH=distro/customer-vps/cloud-init.yaml,AUTH_SHELL_HOST=127.0.0.1,AUTH_SHELL_PORT=3200,MATRIX_LEGACY_CONTAINER_ROUTING_ENABLED=false,MATRIX_STRIPE_BILLING_ENABLED=true,MATRIX_CARD_TRIALS_ENABLED=${MATRIX_CARD_TRIALS_ENABLED},MATRIX_CARD_TRIAL_DAYS=${MATRIX_CARD_TRIAL_DAYS},PLATFORM_PUBLIC_URL=${PREVIEW_PUBLIC_URL},MATRIX_API_ORIGIN=${api_origin},MATRIX_APP_URL=${PREVIEW_PUBLIC_URL},MATRIX_APP_DOMAIN_HOSTS=${PREVIEW_DOMAIN},PLATFORM_SPEECH_ENABLED=true,PLATFORM_SPEECH_PROVIDER=openai,PLATFORM_SPEECH_MODEL=gpt-4o-transcribe,PLATFORM_SPEECH_POLICY_REVISION=preview-speech-v1,PLATFORM_SPEECH_MICROUSD_PER_MINUTE=25000,PLATFORM_SPEECH_FUNDING_SOURCES=promotional,PLATFORM_SPEECH_OWNER_AUDIO_ENABLED=false${funded_ai_env_bindings}" \
              --set-secrets "PLATFORM_DATABASE_URL=platform-database-url-staging:latest,PLATFORM_SECRET=platform-preview-secret:latest,PLATFORM_SPEECH_OPENAI_API_KEY=platform-speech-openai-api-key-preview:latest,PLATFORM_SPEECH_SECRET=platform-speech-secret-preview:latest,GOLDEN_SNAPSHOT_OPERATOR_SECRET=golden-snapshot-operator-secret-preview:latest,PLATFORM_JWT_SECRET=platform-preview-jwt-secret:latest,EDGE_ROUTER_SECRET=edge-router-preview-secret:latest,CLERK_SECRET_KEY=clerk-secret-key:latest,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=next-public-clerk-publishable-key:latest,R2_BUNDLES_ACCOUNT_ID=r2-bundles-account-id:latest,R2_BUNDLES_BUCKET=r2-bundles-bucket:latest,R2_BUNDLES_ENDPOINT=r2-bundles-endpoint:latest,R2_BUNDLES_ACCESS_KEY_ID=r2-bundles-access-key-id:latest,R2_BUNDLES_SECRET_ACCESS_KEY=r2-bundles-secret-access-key:latest,STRIPE_SECRET_KEY=stripe-secret-key-test:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret-test:latest,STRIPE_PRICE_MATRIX_STARTER_MONTHLY=stripe-price-matrix-starter-monthly-test:latest,STRIPE_PRICE_MATRIX_STARTER_ANNUAL=stripe-price-matrix-starter-annual-test:latest,STRIPE_PRICE_MATRIX_BUILDER_MONTHLY=stripe-price-matrix-builder-monthly-test:latest,STRIPE_PRICE_MATRIX_BUILDER_ANNUAL=stripe-price-matrix-builder-annual-test:latest,STRIPE_PRICE_MATRIX_MAX_MONTHLY=stripe-price-matrix-max-monthly-test:latest,STRIPE_PRICE_MATRIX_MAX_ANNUAL=stripe-price-matrix-max-annual-test:latest,STRIPE_LEGACY_PRICE_CATALOG_JSON=stripe-legacy-price-catalog-json-test:latest${funded_ai_secret_bindings}" \
              --cpu 1 --memory 1Gi --concurrency 10 --timeout 300 --min-instances 0 --max-instances 2 \
              --quiet
          }

          service_base_url="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          BOOTSTRAP_API_ORIGIN="https://preview-bootstrap.invalid"
          if [ -z "$service_base_url" ]; then
            deploy_preview "$BOOTSTRAP_API_ORIGIN"
            service_base_url="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --format='value(status.url)')"
          fi
          if [ -z "$service_base_url" ]; then
            echo "Preview service URL is unavailable; refusing a shared control-plane fallback." >&2
            exit 1
          fi
          PREVIEW_API_ORIGIN="https://pr-${PR_NUMBER}---${service_base_url#https://}"
          deploy_preview "$PREVIEW_API_ORIGIN"
          url=""
          revision=""
          for _attempt in {1..10}; do
            desc="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format json)"
            url="$(jq -r --arg tag "pr-${PR_NUMBER}" \
              '[(.status.traffic // [])[] | select(.tag == $tag) | .url] | first // ""' <<< "$desc")"
            revision="$(jq -r --arg tag "pr-${PR_NUMBER}" \
              '[(.status.traffic // [])[] | select(.tag == $tag) | .revisionName] | first // ""' <<< "$desc")"
            if [ -n "$url" ] && [ -n "$revision" ]; then
              break
            fi
            sleep 3
          done
          if [ -z "$url" ] || [ -z "$revision" ]; then
            echo "PR-tagged preview revision metadata did not become ready." >&2
            exit 1
          fi
          if [ "$url" != "$PREVIEW_API_ORIGIN" ]; then
            echo "Tagged preview URL does not match MATRIX_API_ORIGIN." >&2
            exit 1
          fi
          expected_digest="$(gcloud artifacts docker images describe "$IMAGE" \
            --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          revision_image="$(gcloud run revisions describe "$revision" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          expected_digest_image="${IMAGE%:*}@${expected_digest}"
          if [ -z "$expected_digest" ] || { [ "$revision_image" != "$IMAGE" ] && [ "$revision_image" != "$expected_digest_image" ]; }; then
            echo "PR-tagged preview revision does not run the exact built image." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 5 --max-time 10 "${PREVIEW_API_ORIGIN}/health" > /dev/null
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "PREVIEW_PUBLIC_URL=$PREVIEW_PUBLIC_URL" >> "$GITHUB_ENV"
          echo "PREVIEW_API_ORIGIN=$PREVIEW_API_ORIGIN" >> "$GITHUB_ENV"

      - name: Comment preview URL on PR
        if: steps.config.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="**Platform preview revision deployed**

          - Browser-reachable host: ${PREVIEW_PUBLIC_URL} (route this PR's tag to it: \`gcloud run services update-traffic ${CLOUD_RUN_PREVIEW_SERVICE} --region ${GCP_REGION} --to-tags pr-${PR_NUMBER}=100\`, then reset when done)
          - Desktop control-plane origin: ${PREVIEW_API_ORIGIN}
          - Revision URL: ${PREVIEW_URL}
          - Service: \`${CLOUD_RUN_PREVIEW_SERVICE}\` (deployed zero-traffic, tag \`pr-${PR_NUMBER}\`)

          Runs as the preview runtime SA against the staging database with Stripe TEST-mode keys; production service, SA, database, and live Stripe keys are untouched."
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("**Platform preview revision deployed**"))] | .[0].id // ""')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi

  teardown:
    name: Remove preview revision
    if: >-
      github.event.action == 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'preview-platform')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check preview configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_RUN_PREVIEW_SERVICE:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUD_RUN_PREVIEW_SERVICE is not configured; nothing to tear down."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Remove tag and delete tagged revisions
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          revisions="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format json |
            jq -r --arg tag "pr-${PR_NUMBER}" \
              '[(.status.traffic // [])[] | select(.tag == $tag) | .revisionName] | unique | .[]')"
          if [ -z "$revisions" ]; then
            echo "No revisions tagged pr-${PR_NUMBER}; nothing to tear down."
            exit 0
          fi
          gcloud run services update-traffic "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --remove-tags "pr-${PR_NUMBER}" --quiet
          for rev in $revisions; do
            gcloud run revisions delete "$rev" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
            echo "Deleted revision $rev"
          done

  select-share-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.connect_share_preview && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ inputs.pr }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read the one existing preview route
        run: node scripts/chat-share-preview-fixture.mjs --select
      - uses: actions/upload-artifact@v4
        with:
          name: preview-share-route
          path: preview-share-route.json
          retention-days: 1

  connect-share-preview:
    needs: select-share-preview
    if: github.event_name == 'workflow_dispatch' && inputs.connect_share_preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      PR_NUMBER: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: preview-share-route
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter . --ignore-scripts
      - name: Resolve the existing tagged speech origin without moving traffic
        id: origin
        run: |
          set -euo pipefail
          gcloud help run services describe >/dev/null
          gcloud help run revisions describe >/dev/null
          gcloud help run deploy >/dev/null
          service="$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json --quiet)"
          revision="$(jq -er --arg tag "pr-$PR_NUMBER" '.status.traffic[] | select(.tag == $tag) | .revisionName' <<< "$service")"
          url="$(jq -er --arg tag "pr-$PR_NUMBER" '.status.traffic[] | select(.tag == $tag) | .url' <<< "$service")"
          image="$(gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.containers[0].image)' --quiet)"
          # Match the existing platform VPS-origin TLS policy (tracked in #410).
          # This applies only to the dedicated Preview service and registered VPS addresses.
          gcloud run deploy "$CLOUD_RUN_PREVIEW_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$image" --tag "pr-$PR_NUMBER" --no-traffic \
            --update-env-vars "^@^MATRIX_APP_DOMAIN_HOSTS=preview.matrix-os.com,${url#https://}@CUSTOMER_VPS_TLS_VERIFY=false" --quiet
          echo "speech_origin=$url" >> "$GITHUB_OUTPUT"
          echo "Share preview origin: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Seed only the exact preview identity and bounded speech credit in staging
        env:
          SPEECH_ORIGIN: ${{ steps.origin.outputs.speech_origin }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          test "$CLOUD_RUN_PREVIEW_SERVICE" = matrix-platform-preview
          preview_db="$(gcloud secrets versions access latest --secret platform-database-url-staging --project "$GCP_PROJECT_ID" --quiet)"
          preview_platform_secret="$(gcloud secrets versions access latest --secret platform-preview-secret --project "$GCP_PROJECT_ID" --quiet)"
          echo "::add-mask::$preview_db"
          echo "::add-mask::$preview_platform_secret"
          PREVIEW_DATABASE_URL="$preview_db" PLATFORM_SECRET="$preview_platform_secret" \
            node scripts/chat-share-preview-fixture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: preview-speech-activation
          path: preview-speech-activation.json
          retention-days: 1

  activate-share-preview:
    needs: connect-share-preview
    if: github.event_name == 'workflow_dispatch' && inputs.connect_share_preview && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ inputs.pr }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: preview-speech-activation
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Revalidate and activate only speech on the exact disposable host
        run: |
          set -euo pipefail
          cp preview-speech-activation.json expected-preview-speech-activation.json
          node scripts/chat-share-preview-fixture.mjs --select
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const expected = JSON.parse(await readFile("expected-preview-speech-activation.json", "utf8"));
          const current = JSON.parse(await readFile("preview-share-route.json", "utf8"));
          for (const key of ["handle", "address", "ownerId", "machineId", "runtimeSlot"]) {
            if (expected[key] !== current[key]) throw new Error(`Preview identity changed: ${key}`);
          }
          NODE
          handle="$(jq -er .handle expected-preview-speech-activation.json)"
          owner_id="$(jq -er .ownerId expected-preview-speech-activation.json)"
          machine_id="$(jq -er .machineId expected-preview-speech-activation.json)"
          runtime_slot="$(jq -er .runtimeSlot expected-preview-speech-activation.json)"
          speech_origin="$(jq -er .speechOrigin expected-preview-speech-activation.json)"
          speech_runtime_token="$(jq -er .speechRuntimeToken expected-preview-speech-activation.json)"
          echo "::add-mask::$speech_runtime_token"
          if [ "$owner_id" != "$PREVIEW_CLERK_USER_ID" ] || [ -z "${CLERK_SECRET_KEY:-}" ]; then
            echo "The exact preview owner must be the configured QA user." >&2
            exit 1
          fi
          sessions_code="$(curl -sS --max-time 30 -o /tmp/clerk-sessions.json -w '%{http_code}' \
            "https://api.clerk.com/v1/sessions?user_id=${PREVIEW_CLERK_USER_ID}&status=active&limit=10" \
            -H "authorization: Bearer ${CLERK_SECRET_KEY}" -H "Clerk-API-Version: 2025-11-10")"
          test "$sessions_code" = 200
          session_id="$(jq -er 'sort_by(.last_active_at // 0) | reverse | .[0].id | select(type == "string" and test("^sess_[A-Za-z0-9]+$"))' /tmp/clerk-sessions.json)"
          mint_session_token() {
            local token_code
            token_code="$(curl -sS --max-time 30 -o /tmp/clerk-token.json -w '%{http_code}' \
              -X POST "https://api.clerk.com/v1/sessions/${session_id}/tokens" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" -H "Clerk-API-Version: 2025-11-10" \
              -H "content-type: application/json" --data-binary '{"expires_in_seconds":60}')"
            test "$token_code" = 200
            session_token="$(jq -er '.jwt | select(type == "string" and length <= 8192)' /tmp/clerk-token.json)"
            echo "::add-mask::$session_token"
          }
          activation_script="$(sed '1{/^#!/d;}' scripts/activate-speech-preview.py)"
          body="$(jq -cn --arg script "$activation_script" --arg handle "$handle" --arg machine "$machine_id" \
            --arg owner "$owner_id" --arg slot "$runtime_slot" --arg origin "$speech_origin" --arg token "$speech_runtime_token" \
            '{command:["/usr/bin/sudo","/usr/bin/python3","-c",$script,"--handle",$handle,"--machine-id",$machine,"--owner-id",$owner,"--runtime-slot",$slot,"--speech-origin",$origin,"--speech-runtime-token",$token],timeoutMs:15000}')"
          send_runtime_command() {
            local payload="$1" output="$2"
            curl --fail --silent --show-error --max-time 45 -o "$output" \
              -X POST "https://app.matrix-os.com/vm/${handle}/api/terminal/run" \
              -H "authorization: Bearer ${session_token}" -H 'content-type: application/json' --data-binary "$payload"
            jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null)' "$output" >/dev/null
          }
          mint_session_token
          send_runtime_command "$body" /tmp/speech-activation.json
          restart_unit="matrix-speech-preview-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restart_body="$(jq -cn --arg unit "$restart_unit" \
            '{command:["/usr/bin/sudo","/usr/bin/systemd-run","--unit",$unit,"--on-active=2s","--timer-property=AccuracySec=1s","--collect","/usr/bin/systemctl","restart","matrix-gateway.service"],timeoutMs:10000}')"
          mint_session_token
          send_runtime_command "$restart_body" /tmp/speech-restart.json
          sleep 3
          health_code=""
          for _attempt in {1..8}; do
            mint_session_token
            health_code="$(curl --silent --show-error --connect-timeout 3 --max-time 8 \
              -o /tmp/speech-health.json -w '%{http_code}' \
              "https://app.matrix-os.com/vm/${handle}/api/speech/capabilities" \
              -H "authorization: Bearer ${session_token}" || true)"
            if [ "$health_code" = 200 ] && jq -e \
              '.contractVersion == 1 and .fileTranscription.status == "ready" and .fileTranscription.dictation.enabled == true' \
              /tmp/speech-health.json >/dev/null; then
              break
            fi
            sleep 2
          done
          test "$health_code" = 200
          jq -e '.contractVersion == 1 and .fileTranscription.status == "ready" and .fileTranscription.dictation.enabled == true' \
            /tmp/speech-health.json >/dev/null
          echo "Activated isolated speech origin for ${handle}; PLATFORM_INTERNAL_URL and MATRIX_FUNDED_AI_* were preserved." >> "$GITHUB_STEP_SUMMARY"
