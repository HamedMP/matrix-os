name: Desktop Canary Release

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-canary
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare canary metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suffix: ${{ steps.meta.outputs.suffix }}
      version: ${{ steps.meta.outputs.version }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          set -euo pipefail
          SUFFIX="canary.$(date -u +%Y%m%d%H%M%S)"
          BASE_VERSION="$(node -p "require('./desktop/package.json').version.replace(/-.*/, '')")"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION-$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=matrix-desktop-desktop-canary" >> "$GITHUB_OUTPUT"

      - name: Guard immutable Desktop release
        uses: ./.github/actions/guard-immutable-desktop-release
        with:
          tag_name: desktop-v${{ steps.meta.outputs.version }}
          expected_sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    uses: ./.github/workflows/desktop-build.yml
    with:
      channel: canary
      version: ${{ needs.prepare.outputs.version }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}
      retention_days: 7
    secrets: inherit

  release:
    name: Publish canary release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: desktop-release
          merge-multiple: true

      - name: Merge macOS update manifests
        uses: ./.github/actions/merge-mac-manifests
        with:
          directory: desktop-release

      - name: Merge canary macOS update manifests
        uses: ./.github/actions/merge-mac-manifests
        with:
          directory: desktop-release
          output: canary-mac.yml
          channel: canary

      - name: Generate release manifest
        run: |
          node scripts/release/generate-desktop-release-manifest.mjs desktop-release "desktop-v${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.version }}" canary "$GITHUB_SHA"

      - name: Generate Desktop release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMMUTABLE_TAG="desktop-v${{ needs.prepare.outputs.version }}"
          if git ls-remote --exit-code --tags origin refs/tags/desktop-canary >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$IMMUTABLE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name=desktop-canary \
              -q .body > RELEASE_NOTES.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$IMMUTABLE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -q .body > RELEASE_NOTES.md
          fi

      - name: Prepare channel pointer manifests
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          node scripts/release/prepare-desktop-channel-manifests.mjs \
            desktop-release desktop-channel "$owner" "$repo" \
            "desktop-v${{ needs.prepare.outputs.version }}" canary RELEASE_NOTES.md

      - name: Publish immutable canary release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ needs.prepare.outputs.version }}
          name: Matrix OS Desktop ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          draft: false
          make_latest: false
          files: desktop-release/**
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Advance desktop-canary tag
        run: |
          set -euo pipefail
          git tag -f desktop-canary "$GITHUB_SHA"
          git push origin refs/tags/desktop-canary --force

      - name: Publish desktop-canary channel pointer
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-canary
          name: Matrix OS Desktop Canary Channel
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          draft: false
          make_latest: false
          files: desktop-channel/**
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Prune desktop-canary channel assets
        uses: ./.github/actions/prune-desktop-channel-assets
        with:
          tag_name: desktop-canary
          channel: canary
        env:
          GH_TOKEN: ${{ github.token }}
