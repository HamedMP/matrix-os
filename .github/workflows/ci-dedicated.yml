                {sha:process.env.CONTROLLER_SHA,ref:process.env.EXECUTION_ORIGIN?'refs/heads/main':context.ref,workflowRef:process.env.EXECUTION_ORIGIN?`${context.repo.owner}/${context.repo.repo}/.github/workflows/ci-dedicated.yml@refs/heads/main`:process.env.CONTROLLER_WORKFLOW_REF,...(process.env.EXECUTION_ORIGIN?{executionOrigin:JSON.parse(process.env.EXECUTION_ORIGIN)}:{})},JSON.parse(process.env.LEASE_REQUEST));
