name: Dedicated CI Benchmark
# Data-only identity is available in the API even while the controller is queued.
# Exact ref/merge/attempt provenance is still verified after admission.
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('dedicated-refresh-v2 execution={0} request={1} title={2}', (((startsWith(github.event.workflow_run.display_title, 'CI refresh-v1 ') || startsWith(github.event.workflow_run.display_title, 'CI coverage-v1 · ')) && ((github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1) || (github.event.action == 'in_progress' && github.event.workflow_run.run_attempt > 1))) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1)) && 'true' || 'false', github.event.workflow_run.id, github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && format('CI coverage-v1 · {0}', github.event.workflow_run.head_sha) || github.event.workflow_run.display_title) || format('dedicated-ci-v2 pr={0} head={1} base={2} requested={3}', github.event.pull_request.number || 0, github.event.pull_request.head.sha || github.sha, github.event.pull_request.base.sha || 'manual', github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'labeled' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'edited' && github.event.changes.base != null)) && 'true' || 'false') }}

# This controller comes from the default branch and never executes PR code.
# Parent-only moves fail CI Source Qualification and dispatch fresh main-defined CI.
# Old reruns retain old snapshots and cannot refresh hosted qualification.
# PR cancellation closes the leased SSH session; the root lease kills owned CPU.
# Enable only after configuring the main-only `matrix-ci` environment and
# installing the root-owned forced-command dispatcher on a dedicated host.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact public commit to benchmark (blank uses this commit)
        required: false
        type: string
      suite:
        description: Benchmark suite
        type: choice
        default: qualification
        options: [qualification, full, unit, checks, e2e-general, e2e-electron]
  pull_request_target:
    types: [opened, labeled, ready_for_review, synchronize, reopened, edited, unlabeled, converted_to_draft, closed]

permissions:
  actions: write
  contents: read
  checks: write
  pull-requests: read

concurrency:
  # Irrelevant edits/label changes must not cancel an admitted qualification.
  group: dedicated-ci-${{ github.event.pull_request.number || github.run_id }}-${{ ((github.event.action == 'edited' && github.event.changes.base == null) || (github.event.action == 'unlabeled' && github.event.label.name != 'ready-for-ci' && github.event.label.name != 'fast-ci')) && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: (vars.MATRIX_CI_DEDICATED_ENABLED == 'true' || vars.MATRIX_CI_DEDICATED_SHADOW == 'true') && github.ref == 'refs/heads/main' && ((github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'fast-ci')) || (github.event_name == 'workflow_run' && (((startsWith(github.event.workflow_run.display_title, 'CI refresh-v1 ') || startsWith(github.event.workflow_run.display_title, 'CI coverage-v1 · ')) && ((github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1) || (github.event.action == 'in_progress' && github.event.workflow_run.run_attempt > 1))) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1))))
    runs-on: ubuntu-latest
    environment: matrix-ci
    timeout-minutes: 70
    env:
      # Duplicate workflow_run events start several controllers; only the newest may
      # qualify. These exact helper errors mean another controller or source won.
      RACE_LOST_ERRORS: '["A newer controller superseded this lease", "A newer requesting CI attempt superseded this lease", "Dedicated qualification revision or admission is stale", "Current parent ref has changed", "Current ordered merge parents are stale", "Current main source is stale", "Main moved during source attestation"]'
    steps:
      - name: Authenticate reviewed controller pin before helper or secret use
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const pin=process.env.CONTROLLER_SHA;
            if(context.ref!=='refs/heads/main'||process.env.CONTROLLER_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/.github/workflows/ci-dedicated.yml@refs/heads/main`||!/^[a-f0-9]{40}$/.test(pin||''))throw new Error('Untrusted default controller origin or source pin');
            const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:'main',request:{timeout:10000}});
            if(main.name!=='main'||!/^[a-f0-9]{40}$/.test(main.commit?.sha||''))throw new Error('Invalid current main branch identity');
            const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${main.commit.sha}`,request:{timeout:10000}});
            if(!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Reviewed controller pin is not on main');
      - name: Checkout reviewed default-controller helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Admit current source head
        id: admit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          MATRIX_CI_DEDICATED_ENABLED: ${{ vars.MATRIX_CI_DEDICATED_ENABLED }}
          MATRIX_CI_DEDICATED_MAIN: ${{ vars.MATRIX_CI_DEDICATED_MAIN }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {admitDedicatedSource,newestRequestingCiRun}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
            // A controller can wait on a hosted runner past its requesting CI run; nothing is left to qualify then.
            const requester=context.eventName==='workflow_run'?context.payload.workflow_run:null;
            const requesterInactive=async()=>{
              const {data:live}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:requester.id,request:{timeout:10000}});
              // A push leaves the old head's CI run in flight until it is cancelled; that head has nothing left to qualify.
              const pull=live.event==='pull_request'&&live.pull_requests?.length===1?live.pull_requests[0]:null;
              const replacedHead=pull!==null&&/^[a-f0-9]{40}$/.test(pull.head?.sha||'')&&pull.head.sha!==live.head_sha;
              return live.status==='completed'||live.run_attempt!==requester.run_attempt||replacedHead;
            };
            const standDownInactive=()=>{core.notice(`Standing down: Requesting CI run ${requester.id} attempt ${requester.run_attempt} is no longer active`);core.setOutput('admitted','false');};
            if(requester&&await requesterInactive()){standDownInactive();return;}
            let admission;
            try{admission=await admitDedicatedSource(github,{
              repo:context.repo, controller:{sha:process.env.CONTROLLER_SHA,ref:context.ref,workflowRef:process.env.CONTROLLER_WORKFLOW_REF},
              eventName:context.eventName,payload:context.payload,inputSha:process.env.INPUT_SHA});}
            catch(error){
              // The requester can finish between the lookup above and the helper's own read; confirm before standing down.
              if(requester&&error instanceof Error&&error.message==='Refresh requester is not currently admitted'&&await requesterInactive()){standDownInactive();return;}
              if(!raceLost(error))throw error;core.notice(`Standing down: ${error.message}`);core.setOutput('admitted','false');return;
            }
            if (!admission) { core.setOutput('admitted','false'); return; }
            const {sourceSha:sha,headSha,baseSha,baseRef,prNumber}=admission;
            const mode=process.env.MATRIX_CI_DEDICATED_ENABLED==='true'&&(admission.sourceKind!=='main'||process.env.MATRIX_CI_DEDICATED_MAIN==='true')?'delegated':'shadow';
            const requesting=prNumber>0||admission.sourceKind==='main'?await newestRequestingCiRun(github,context.repo,admission,mode):null;
            const summary={schemaVersion:3,suite:context.payload.inputs?.suite || 'qualification',
              ...(requesting?{requestingRunId:requesting.runId,requestingRunAttempt:requesting.runAttempt}:{}),
              mode,imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,
              ...admission,controllerSha:process.env.CONTROLLER_SHA,controllerRef:context.ref,
              controllerAttempt:Number(process.env.CONTROLLER_ATTEMPT),controllerWorkflow:'.github/workflows/ci-dedicated.yml'};
            const {data:check}=await github.rest.checks.create({
              ...context.repo, name:prNumber>0||admission.sourceKind==='main' ? 'Dedicated CI Results' : 'Dedicated CI Benchmark',
              head_sha:headSha,status:'in_progress',request:{timeout:10000},
              details_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output:{title:'Isolated Linux qualification pending',summary:JSON.stringify(summary)}});
            for(const [key,value] of Object.entries({sha,source_kind:admission.sourceKind || '',merge_parents:JSON.stringify(admission.mergeParents || []),head_sha:headSha,base_sha:baseSha,base_ref:baseRef,merge_parent_sha:admission.mergeParents?.[0] || '',
              pr_number:prNumber,check_id:check.id,admitted:true,mode,
              requesting_run_id:requesting?.runId || 0,requesting_run_attempt:requesting?.runAttempt || 0}))core.setOutput(key,String(value));

      - name: Revalidate exact PR snapshot before dispatch
        id: current
        if: steps.admit.outputs.admitted == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SNAPSHOT: ${{ toJSON(steps.admit.outputs) }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {verifyCurrentDedicatedSource}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            const data=JSON.parse(process.env.SNAPSHOT);
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
            try{await verifyCurrentDedicatedSource(github,context.repo,{sourceSha:data.sha,headSha:data.head_sha,
              baseSha:data.base_sha,baseRef:data.base_ref,prNumber:Number(data.pr_number),...(data.source_kind==='main'?{sourceKind:'main'}:{}),mergeParents:JSON.parse(data.merge_parents)});}
            catch(error){if(!raceLost(error))throw error;core.notice(`Standing down: ${error.message}`);core.setOutput('superseded','true');return;}
            core.setOutput('current','true');

      - name: Dispatch authenticated PR qualification lease
        id: dispatch
        if: steps.admit.outputs.admitted == 'true' && (steps.admit.outputs.pr_number != '0' || steps.admit.outputs.source_kind == 'main') && steps.current.outputs.current == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONFIGURATION_APP_ID: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          CONFIGURATION_INSTALLATION_ID: ${{ vars.MATRIX_CI_GATE_APP_INSTALLATION_ID }}
          CONFIGURATION_PRIVATE_KEY: ${{ secrets.MATRIX_CI_GATE_APP_PRIVATE_KEY }}
          SNAPSHOT: ${{ toJSON(steps.admit.outputs) }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
          CI_SSH_KEY: ${{ secrets.CI_RUNNER_SSH_KEY }}
          CI_SSH_HOST: ${{ secrets.CI_RUNNER_HOST }}
          CI_KNOWN_HOSTS: ${{ secrets.CI_RUNNER_KNOWN_HOSTS }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {createConfigurationSession}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-config-token.mjs')).href);
            const configuration=createConfigurationSession(github,context.repo,{appId:Number(process.env.CONFIGURATION_APP_ID),installationId:Number(process.env.CONFIGURATION_INSTALLATION_ID),repositoryId:context.payload.repository.id,privateKey:process.env.CONFIGURATION_PRIVATE_KEY,mask:value=>core.setSecret(value)});
            const {mkdir,writeFile}=require('node:fs/promises');
            const {dispatchDedicatedLease}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            const data=JSON.parse(process.env.SNAPSHOT);
            const request={repository:`${context.repo.owner}/${context.repo.repo}`,prNumber:Number(data.pr_number),
              headSha:data.head_sha,baseSha:data.base_sha,baseRef:data.base_ref,mergeSha:data.sha,
              mergeParents:JSON.parse(data.merge_parents),...(data.source_kind==='main'?{sourceKind:'main'}:{}),requestingRunId:Number(data.requesting_run_id),
              requestingRunAttempt:Number(data.requesting_run_attempt),controllerRunId:context.runId,
              controllerRunAttempt:Number(process.env.CONTROLLER_ATTEMPT),controllerSha:process.env.CONTROLLER_SHA,
              controllerRef:context.ref,controllerWorkflow:'.github/workflows/ci-dedicated.yml',
              imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,
              mode:data.mode,suite:'qualification',limits:{unitWorkers:16,cpu:30,memoryMiB:114688,
                workMiB:65536,tmpMiB:8192,homeMiB:1024,pids:4096,shmMiB:2048}};
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
            let receipt;
            try{receipt=await dispatchDedicatedLease(configuration.github,{repo:context.repo,
              controller:{sha:process.env.CONTROLLER_SHA,ref:context.ref,workflowRef:process.env.CONTROLLER_WORKFLOW_REF},request,
              ssh:{host:process.env.CI_SSH_HOST,key:process.env.CI_SSH_KEY,knownHosts:process.env.CI_KNOWN_HOSTS}},
              {metrics:values=>core.info('Controller API polling: '+JSON.stringify(values))});}
            catch(error){if(!raceLost(error))throw error;core.notice(`Standing down: ${error.message}`);core.setOutput('superseded','true');return;}
            finally{await configuration.close();}
            await mkdir('output/ci-dedicated',{recursive:true});
            await writeFile('output/ci-dedicated/receipt.json',JSON.stringify(receipt),{flag:'wx'});
            core.setOutput('request',JSON.stringify(request));
            core.setOutput('request_digest',receipt.requestDigest);
            core.setOutput('lease_id',receipt.leaseId);
            core.setOutput('verified',String(receipt.qualified===true));core.setOutput('infrastructure_proof',['infrastructure-unavailable','transport-unavailable'].includes(receipt.outcome)?JSON.stringify({...(receipt.outcome==='transport-unavailable'?{proofOrigin:receipt.proofOrigin,grantSent:receipt.grantSent,controlBytes:receipt.controlBytes,handshakeBoundSeconds:receipt.handshakeBoundSeconds}:{}),outcome:receipt.outcome,status:76,reason:receipt.reason,stage:receipt.stage,workloadStarted:receipt.workloadStarted,containerGone:receipt.containerGone}):'');

      - name: Manual isolated benchmark unavailable
        id: manual
        if: steps.admit.outputs.admitted == 'true' && steps.admit.outputs.pr_number == '0' && steps.admit.outputs.source_kind != 'main'
        run: |
          echo "::error::SHA-only SSH benchmarks are unavailable. Use authenticated PR qualification; private operator benchmarks remain separate."
          exit 64

      - name: Settle source-head check
        if: always() && steps.admit.outputs.check_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONFIGURATION_APP_ID: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          CONFIGURATION_INSTALLATION_ID: ${{ vars.MATRIX_CI_GATE_APP_INSTALLATION_ID }}
          CONFIGURATION_PRIVATE_KEY: ${{ secrets.MATRIX_CI_GATE_APP_PRIVATE_KEY }}
          CHECK_ID: ${{ steps.admit.outputs.check_id }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          MERGE_PARENT_SHA: ${{ steps.admit.outputs.merge_parent_sha }}
          MERGE_PARENTS: ${{ steps.admit.outputs.merge_parents }}
          SOURCE_KIND: ${{ steps.admit.outputs.source_kind }}
          INFRASTRUCTURE_PROOF: ${{ steps.dispatch.outputs.infrastructure_proof }}
          BASE_SHA: ${{ steps.admit.outputs.base_sha }}
          BASE_REF: ${{ steps.admit.outputs.base_ref }}
          PR_NUMBER: ${{ steps.admit.outputs.pr_number }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          MANUAL_OUTCOME: ${{ steps.manual.outcome }}
          QUALIFICATION_VERIFIED: ${{ steps.dispatch.outputs.verified }}
          LEASE_REQUEST: ${{ steps.dispatch.outputs.request }}
          REQUEST_DIGEST: ${{ steps.dispatch.outputs.request_digest }}
          LEASE_ID: ${{ steps.dispatch.outputs.lease_id }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUESTING_RUN_ID: ${{ steps.admit.outputs.requesting_run_id }}
          REQUESTING_RUN_ATTEMPT: ${{ steps.admit.outputs.requesting_run_attempt }}
          MODE: ${{ steps.admit.outputs.mode }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
          SOURCE_SHA: ${{ steps.admit.outputs.sha }}
          SUITE: ${{ inputs.suite || 'qualification' }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          SUPERSEDED: ${{ steps.current.outputs.superseded || steps.dispatch.outputs.superseded }}
        with:
          script: |
            const main=process.env.SOURCE_KIND==='main';
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
            // A newer controller or source owns qualification; this check never carries receipt credit.
            const settleSuperseded=()=>github.rest.checks.update({...context.repo,check_run_id:Number(process.env.CHECK_ID),request:{timeout:10000},
                details_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                status:'completed',conclusion:'neutral',output:{title:'Superseded by a newer controller or source',
                  summary:JSON.stringify({schemaVersion:3,...(main?{sourceKind:'main'}:{}),superseded:true,receiptVerified:false,
                    sourceSha:process.env.SOURCE_SHA,headSha:process.env.HEAD_SHA,prNumber:Number(process.env.PR_NUMBER),
                    controllerSha:process.env.CONTROLLER_SHA,controllerAttempt:Number(process.env.CONTROLLER_ATTEMPT)})}});
            if(process.env.SUPERSEDED==='true'){await settleSuperseded();return;}
            let superseded=false;
            let infrastructure=false;let proof={};
            let success=Number(process.env.PR_NUMBER)===0&&!main?process.env.MANUAL_OUTCOME==='success':process.env.DISPATCH_OUTCOME === 'success' && process.env.QUALIFICATION_VERIFIED === 'true';
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {verifyCurrentDedicatedSource,verifyDedicatedLeaseGrant}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            let configuration;
            try {
              const {createConfigurationSession}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-config-token.mjs')).href);
              configuration=createConfigurationSession(github,context.repo,{appId:Number(process.env.CONFIGURATION_APP_ID),installationId:Number(process.env.CONFIGURATION_INSTALLATION_ID),repositoryId:context.payload.repository.id,privateKey:process.env.CONFIGURATION_PRIVATE_KEY,mask:value=>core.setSecret(value)});
              const {validInfrastructureProof}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-outcome.mjs')).href);
              proof=process.env.INFRASTRUCTURE_PROOF?JSON.parse(process.env.INFRASTRUCTURE_PROOF):{};infrastructure=process.env.DISPATCH_OUTCOME==='success'&&validInfrastructureProof(proof);
              if((success||infrastructure) && (Number(process.env.PR_NUMBER)>0||main))await verifyDedicatedLeaseGrant(configuration.github,context.repo,
                {sha:process.env.CONTROLLER_SHA,ref:context.ref,workflowRef:process.env.CONTROLLER_WORKFLOW_REF},JSON.parse(process.env.LEASE_REQUEST));
              await verifyCurrentDedicatedSource(github,context.repo,{sourceSha:process.env.SOURCE_SHA,
                headSha:process.env.HEAD_SHA,baseSha:process.env.BASE_SHA,baseRef:process.env.BASE_REF,
                prNumber:Number(process.env.PR_NUMBER),...(main?{sourceKind:'main'}:{}),mergeParents:JSON.parse(process.env.MERGE_PARENTS||'[]')});
            } catch(error) {
              success=false;infrastructure=false;
              if(raceLost(error)){superseded=true;core.notice(`Standing down: ${error.message}`);}
              else{
                core.warning(error instanceof Error ? error.message : 'Unknown PR revalidation failure');
                core.setFailed('Current PR revision could not be revalidated');
              }
            } finally{
              if(configuration)try{await configuration.close();}
              catch{core.setFailed('Configuration read token revocation failed');success=false;infrastructure=false;superseded=false;}
            }
            if(superseded){await settleSuperseded();return;}
            await github.rest.checks.update({
              ...context.repo, check_run_id: Number(process.env.CHECK_ID), request: {timeout: 10000},
              details_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              status: 'completed', conclusion: success ? 'success' : infrastructure ? 'neutral' : 'failure',
              output: {
                title: success ? 'Isolated Linux suite passed' : infrastructure ? 'Linux infrastructure unavailable; full hosted coverage required' : 'Isolated Linux suite failed',
                summary: JSON.stringify({schemaVersion: 3,...(main?{sourceKind:'main'}:{}),...(infrastructure?proof:{}), requestingRunId:Number(process.env.REQUESTING_RUN_ID),
                  requestingRunAttempt:Number(process.env.REQUESTING_RUN_ATTEMPT),
                  imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,
                  mode:process.env.MODE,receiptVerified:success,requestDigest:process.env.REQUEST_DIGEST,
                  leaseId:process.env.LEASE_ID, suite: process.env.SUITE,
                  sourceSha: process.env.SOURCE_SHA, headSha: process.env.HEAD_SHA, mergeParents:JSON.parse(process.env.MERGE_PARENTS||'[]'),
                  baseSha: process.env.BASE_SHA, baseRef:process.env.BASE_REF, prNumber: Number(process.env.PR_NUMBER),
                  controllerSha: process.env.CONTROLLER_SHA, controllerRef: context.ref,
                  controllerAttempt:Number(process.env.CONTROLLER_ATTEMPT),
                  controllerWorkflow: '.github/workflows/ci-dedicated.yml'})
              }
            });

      - name: Upload immutable qualification provenance
        if: always() && (steps.dispatch.outputs.verified == 'true' || steps.dispatch.outputs.infrastructure_proof != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dedicated-qualification-${{ steps.admit.outputs.head_sha }}-${{ steps.admit.outputs.sha }}-${{ steps.admit.outputs.base_sha }}-pr${{ steps.admit.outputs.pr_number }}-request${{ steps.admit.outputs.requesting_run_id }}-${{ steps.admit.outputs.requesting_run_attempt }}-attempt${{ github.run_attempt }}
          path: output/ci-dedicated/receipt.json
          if-no-files-found: error
          retention-days: 7

  reconcile:
    name: Revoke stale stacked qualification
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.action == 'completed')
    environment: matrix-ci
    permissions:
      actions: write
      contents: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # One global queue serialized every PR's reconcile behind every other (40+ deep under load).
      # Queue per scope instead: a PR, a pushed PR with its direct children, or the full scan.
      group: matrix-ci-reconcile-${{ github.event.pull_request && format('{0}-{1}', github.event.action == 'synchronize' && 'push' || 'pr', github.event.pull_request.number) || (github.event.workflow_run.pull_requests[0] && !github.event.workflow_run.pull_requests[1] && github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id && github.event.workflow_run.pull_requests[0].base.repo.id == github.event.repository.id) && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || 'full' }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Authenticate default-main reconciliation source
        id: origin
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const pin=process.env.CONTROLLER_SHA || context.sha;
            if(context.ref!=='refs/heads/main'||process.env.CONTROLLER_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/.github/workflows/ci-dedicated.yml@refs/heads/main`||!/^[a-f0-9]{40}$/.test(pin||''))throw new Error('Untrusted default controller origin or source pin');
            const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:'main',request:{timeout:10000}});
            if(main.name!=='main'||!/^[a-f0-9]{40}$/.test(main.commit?.sha||''))throw new Error('Invalid current main branch identity');
            const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${main.commit.sha}`,request:{timeout:10000}});
            if(!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Reviewed controller pin is not on main');
            core.setOutput('controller_sha',pin);
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.origin.outputs.controller_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Create repository-scoped configuration read token
        id: configuration-token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONFIGURATION_APP_ID: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          CONFIGURATION_INSTALLATION_ID: ${{ vars.MATRIX_CI_GATE_APP_INSTALLATION_ID }}
          CONFIGURATION_PRIVATE_KEY: ${{ secrets.MATRIX_CI_GATE_APP_PRIVATE_KEY }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {mintConfigurationToken}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-config-token.mjs')).href);
            const token=await mintConfigurationToken(github,context.repo,{appId:Number(process.env.CONFIGURATION_APP_ID),installationId:Number(process.env.CONFIGURATION_INSTALLATION_ID),repositoryId:context.payload.repository.id,privateKey:process.env.CONFIGURATION_PRIVATE_KEY,mask:value=>core.setSecret(value)});
            core.setOutput('token',token);

      - name: Create repository-scoped checks-only gate token
        id: gate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          private-key: ${{ secrets.MATRIX_CI_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Verify gate installation identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GATE_INSTALLATION_ID: ${{ vars.MATRIX_CI_GATE_APP_INSTALLATION_ID }}
          TOKEN_INSTALLATION_ID: ${{ steps.gate-token.outputs.installation-id }}
        with:
          script: |
            const expected=process.env.GATE_INSTALLATION_ID;
            if(expected && (!/^[1-9][0-9]{0,15}$/.test(expected)||expected!==process.env.TOKEN_INSTALLATION_ID))throw new Error('Dedicated gate App installation mismatch');
      - name: Reconcile completed child source checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONFIGURATION_TOKEN: ${{ steps.configuration-token.outputs.token }}
          GATE_TOKEN: ${{ steps.gate-token.outputs.token }}
          GATE_APP_ID: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          CONTROLLER_SHA: ${{ steps.origin.outputs.controller_sha }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {withConfigurationGithub}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-config-token.mjs')).href);
            if(!process.env.CONFIGURATION_TOKEN)throw new Error('Configuration read token is required');
            const configurationGithub=new github.constructor({auth:process.env.CONFIGURATION_TOKEN,baseUrl:github.request.endpoint.DEFAULTS.baseUrl,request:{timeout:10000}});
            const sourceGithub=withConfigurationGithub(github,configurationGithub);
            const {reconcileSourceQualification}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            if(!process.env.GATE_TOKEN)throw new Error('Protected gate App token is required');
            // GitHub Script bundles Octokit; external @actions packages are not installed.
            const gateGithub=new github.constructor({auth:process.env.GATE_TOKEN,baseUrl:github.request.endpoint.DEFAULTS.baseUrl,request:{timeout:10000}});
            // Scope reconciliation to the PRs an event can affect; full scans exhausted the installation API budget.
            // Main pushes, schedules and dispatched refresh CI keep the full scan.
            const ownRepo=`${github.request.endpoint.DEFAULTS.baseUrl}/repos/${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const ciPulls=context.eventName==='workflow_run'?(context.payload.workflow_run?.pull_requests??[]):[];
            const scope=context.payload.pull_request
              ?(context.payload.action==='synchronize'
                ?{childrenOf:{number:context.payload.pull_request.number,headRef:context.payload.pull_request.head.ref}}
                :{prNumber:context.payload.pull_request.number})
              :ciPulls.length===1&&[ciPulls[0].base?.repo?.url,ciPulls[0].head?.repo?.url].every(url=>String(url).toLowerCase()===ownRepo)
                ?{prNumber:ciPulls[0].number}:{};
            const gate=await reconcileSourceQualification(sourceGithub,context.repo,
              {sha:process.env.CONTROLLER_SHA,ref:context.ref,workflowRef:process.env.CONTROLLER_WORKFLOW_REF},
              {gateGithub,gateAppId:Number(process.env.GATE_APP_ID),runId:context.runId,runAttempt:Number(process.env.CONTROLLER_ATTEMPT),...scope});
            core.info(`Examined ${gate.examined} source gates; refreshed ${gate.dispatched} exact-source requests.`);

      - name: Revoke configuration read token
        if: always() && steps.configuration-token.outputs.token != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONFIGURATION_TOKEN: ${{ steps.configuration-token.outputs.token }}
        with:
          script: |
            const client=new github.constructor({auth:process.env.CONFIGURATION_TOKEN,baseUrl:github.request.endpoint.DEFAULTS.baseUrl,request:{timeout:10000}});
            try{await client.request('DELETE /installation/token',{request:{timeout:10000}});}
            catch{throw new Error('Configuration read token revocation failed');}
