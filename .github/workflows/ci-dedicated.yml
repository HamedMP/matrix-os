            const settleSuperseded=()=>github.rest.checks.update({...context.repo,check_run_id:Number(process.env.CHECK_ID),request:{timeout:10000},
                details_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                status:'completed',conclusion:'neutral',output:{title:'Superseded by a newer controller or source',
                  summary:JSON.stringify({schemaVersion:process.env.EXECUTION_ORIGIN?4:3,...(process.env.EXECUTION_ORIGIN?{executionOrigin:JSON.parse(process.env.EXECUTION_ORIGIN)}:{}),...(main?{sourceKind:'main'}:{}),superseded:true,receiptVerified:false,
