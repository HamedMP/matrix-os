name: Dedicated CI Benchmark
# Data-only identity is available in the API even while the controller is queued.
# Exact ref/merge/attempt provenance is still verified after admission.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.controller_mode && format('dedicated-isolated-v1 mode={0} request={1} attempt={2}', inputs.controller_mode, inputs.requesting_run_id, inputs.requesting_run_attempt) || github.event_name == 'workflow_run' && format('dedicated-refresh-v2 execution={0} request={1} title={2}', ((vars.MATRIX_CI_ISOLATED_EXECUTION != 'true' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && (github.event.workflow_run.event != 'push' || (vars.MATRIX_CI_DEDICATED_ENABLED == 'true' && vars.MATRIX_CI_DEDICATED_MAIN == 'true')) && (((startsWith(github.event.workflow_run.display_title, 'CI refresh-v1 ') || startsWith(github.event.workflow_run.display_title, 'CI coverage-v1 · ')) && ((github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1) || (github.event.action == 'in_progress' && github.event.workflow_run.run_attempt > 1))) || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.display_title == 'CI' && github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1))) && 'true' || 'false', github.event.workflow_run.id, github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && format('CI coverage-v1 · {0}', github.event.workflow_run.head_sha) || github.event.workflow_run.display_title) || format('dedicated-ci-v2 pr={0} head={1} base={2} requested={3}', github.event.pull_request.number || 0, github.event.pull_request.head.sha || github.sha, github.event.pull_request.base.sha || 'manual', github.event_name == 'pull_request_target' && !(github.event_name == 'pull_request_target' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.pull_request.draft == true) || (github.event.action == 'edited' && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-for-ci' && github.event.label.name != 'fast-ci') || (github.event.action == 'labeled' && !(contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && contains(github.event.pull_request.labels.*.name, 'fast-ci'))))) && (github.event.action == 'opened' || github.event.action == 'labeled' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'edited' && github.event.changes.base != null)) && 'true' || 'false') }}

# This controller comes from the default branch and never executes PR code.
# Parent-only moves fail CI Source Qualification and dispatch fresh main-defined CI.
# Old reruns retain old snapshots and cannot refresh hosted qualification.
# PR cancellation closes the leased SSH session; the root lease kills owned CPU.
# Enable only after configuring the main-only `matrix-ci` environment and
# installing the root-owned forced-command dispatcher on a dedicated host.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      controller_mode:
        description: Authenticated isolated controller operation
        type: choice
        options: ['', qualification, reconcile, maintenance]
        default: ''
      requesting_run_id:
        description: Exact authenticated original run ID
        type: string
      requesting_run_attempt:
        description: Exact authenticated original run attempt
        type: string
      requesting_action:
        description: Original authenticated event action
        type: string
      reconciliation_pr:
        description: Queue hint revalidated against the authenticated requester (0 means full)
        type: string
        default: ''
      source_sha:
        description: Exact public commit to benchmark (blank uses this commit)
        required: false
        type: string
      suite:
        description: Benchmark suite
        type: choice
        default: qualification
        options: [qualification, full, unit, checks, e2e-general, e2e-electron]
  pull_request_target:
    types: [opened, labeled, ready_for_review, synchronize, reopened, edited, unlabeled, converted_to_draft, closed]

permissions:
  actions: write
  contents: read
  checks: write
  pull-requests: read

concurrency:
  # One expression, repeated here, in the run-name requested flag and in both job
  # conditions, names PR events that cannot change admission: title/body edits,
  # draft label events, other labels, and one admission label while the other is missing.
  # They never admit, never count as the newest controller and run in their own
  # group, so they cannot cancel (and leave a red cancelled run on) a qualification.
  group: dedicated-ci-${{ github.event.pull_request.number || github.run_id }}-${{ (github.event_name == 'pull_request_target' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.pull_request.draft == true) || (github.event.action == 'edited' && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-for-ci' && github.event.label.name != 'fast-ci') || (github.event.action == 'labeled' && !(contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && contains(github.event.pull_request.labels.*.name, 'fast-ci'))))) && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  route_execution:
    name: Route isolated controller work
    if: github.ref == 'refs/heads/main' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && (github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Dispatch authenticated isolated operation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
        with:
          script: |
            const {pathToFileURL}=require('node:url'),{resolve}=require('node:path');
            const {routeControllerEvent}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-execution-router.mjs')).href);
            const result=await routeControllerEvent(github,context.repo,process.env.CONTROLLER_SHA,{...context,runAttempt:Number(process.env.CONTROLLER_ATTEMPT)},{pin:process.env.CONTROLLER_SHA,flag:process.env.ISOLATED_EXECUTION});
            await core.summary.addRaw(`Controller routing only: ${JSON.stringify(result)}. No candidate coverage is claimed.`).write();

  benchmark:
    # The main-delegation guard here must match the run-name execution flag; both are evaluated in tests.
    if: (((vars.MATRIX_CI_DEDICATED_ENABLED == 'true' || vars.MATRIX_CI_DEDICATED_SHADOW == 'true') && github.ref == 'refs/heads/main' && !(github.event_name == 'pull_request_target' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.pull_request.draft == true) || (github.event.action == 'edited' && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-for-ci' && github.event.label.name != 'fast-ci') || (github.event.action == 'labeled' && !(contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && contains(github.event.pull_request.labels.*.name, 'fast-ci'))))) && ((github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'fast-ci')) || (github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || (vars.MATRIX_CI_DEDICATED_ENABLED == 'true' && vars.MATRIX_CI_DEDICATED_MAIN == 'true')) && (((startsWith(github.event.workflow_run.display_title, 'CI refresh-v1 ') || startsWith(github.event.workflow_run.display_title, 'CI coverage-v1 · ')) && ((github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1) || (github.event.action == 'in_progress' && github.event.workflow_run.run_attempt > 1))) || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.display_title == 'CI' && github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.action == 'requested' && github.event.workflow_run.run_attempt == 1))))) && (vars.MATRIX_CI_ISOLATED_EXECUTION != 'true' || github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))) || ((vars.MATRIX_CI_DEDICATED_ENABLED == 'true' || vars.MATRIX_CI_DEDICATED_SHADOW == 'true') && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.event_name == 'workflow_dispatch' && inputs.controller_mode == 'qualification' && startsWith(github.ref, 'refs/heads/ci-execution/'))
    runs-on: ubuntu-latest
    environment: matrix-ci
    timeout-minutes: 70
    env:
      # Duplicate workflow_run events start several controllers; only the newest may
      # qualify. These exact helper errors mean another controller or source won.
      RACE_LOST_ERRORS: '["A newer controller superseded this lease", "A newer requesting CI attempt superseded this lease", "Dedicated qualification revision or admission is stale", "Current parent ref has changed", "Current ordered merge parents are stale", "Current main source is stale", "Main moved during source attestation"]'
    steps:
      - name: Authenticate reviewed controller pin before helper or secret use
        id: origin
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
          EXECUTION_WORKFLOW_PATH: .github/workflows/ci-dedicated.yml
          EXECUTION_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const pin=process.env.CONTROLLER_SHA,path=process.env.EXECUTION_WORKFLOW_PATH;
            if(!/^[a-f0-9]{40}$/.test(pin||''))throw new Error('Reviewed controller pin is missing');
            const main=context.ref==='refs/heads/main';
            if(main){if(process.env.EXECUTION_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/${path}@refs/heads/main`)throw new Error('Untrusted Main workflow origin');const request={timeout:10000};const {data:tip}=await github.rest.repos.getBranch({...context.repo,branch:'main',request});if(tip.name!=='main'||!/^[a-f0-9]{40}$/.test(tip.commit?.sha||''))throw new Error('Invalid current main branch identity');const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${tip.commit.sha}`,request});if(!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Reviewed helper pin is not on Main');core.setOutput('controller_sha',pin);core.setOutput('helper_sha',path.endsWith('/ci.yml')&&process.env.ISOLATED_EXECUTION!=='true'?context.sha:pin);return;}
            const ref=`refs/heads/ci-execution/${pin}`;
            if(process.env.ISOLATED_EXECUTION!=='true'||context.ref!==ref||process.env.EXECUTION_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/${path}@${ref}`||process.env.EXECUTION_WORKFLOW_SHA!==context.sha||context.sha===pin)throw new Error('Untrusted isolated workflow origin');
            const request={timeout:10000};
            const {data:child}=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha,request});
            const {data:source}=await github.rest.git.getCommit({...context.repo,commit_sha:pin,request});
            const {data:branch}=await github.rest.repos.getBranch({...context.repo,branch:`ci-execution/${pin}`,request});
            const {data:tip}=await github.rest.repos.getBranch({...context.repo,branch:'main',request});
            const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${tip.commit.sha}`,request});
            if(child.sha!==context.sha||source.sha!==pin||child.parents?.length!==1||child.parents[0].sha!==pin||!/^[a-f0-9]{40}$/.test(child.tree?.sha||'')||child.tree.sha!==source.tree?.sha||branch.commit?.sha!==context.sha||!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Isolated workflow does not match reviewed Main source');
            core.setOutput('controller_sha',pin);core.setOutput('helper_sha',pin);
            core.setOutput('execution_origin',JSON.stringify({schemaVersion:1,controllerSha:pin,controllerRef:'refs/heads/main',executionRef:ref,executionSha:context.sha,executionWorkflowSha:context.sha,workflowPath:path,treeSha:child.tree.sha}));
      - name: Checkout reviewed default-controller helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Admit current source head
        id: admit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          EXECUTION_ORIGIN: ${{ steps.origin.outputs.execution_origin }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MATRIX_CI_DEDICATED_ENABLED: ${{ vars.MATRIX_CI_DEDICATED_ENABLED }}
          MATRIX_CI_DEDICATED_MAIN: ${{ vars.MATRIX_CI_DEDICATED_MAIN }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {admitDedicatedSource,newestRequestingCiRun}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
            // A controller can wait on a hosted runner past its requesting CI run; nothing is left to qualify then.
            const requester=context.eventName==='workflow_run'?context.payload.workflow_run:null;
            const requesterInactive=async()=>{
              const {data:live}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:requester.id,request:{timeout:10000}});
              // A push leaves the old head's CI run in flight until it is cancelled; that head has nothing left to qualify.
              const pull=live.event==='pull_request'&&live.pull_requests?.length===1?live.pull_requests[0]:null;
              const replacedHead=pull!==null&&/^[a-f0-9]{40}$/.test(pull.head?.sha||'')&&pull.head.sha!==live.head_sha;
              return live.status==='completed'||live.run_attempt!==requester.run_attempt||replacedHead;
            };
            const standDownInactive=()=>{core.notice(`Standing down: Requesting CI run ${requester.id} attempt ${requester.run_attempt} is no longer active`);core.setOutput('admitted','false');};
            if(requester&&await requesterInactive()){standDownInactive();return;}
            let admission;
            try{admission=await admitDedicatedSource(github,{
              repo:context.repo, controller:{sha:process.env.CONTROLLER_SHA,ref:process.env.EXECUTION_ORIGIN?'refs/heads/main':context.ref,workflowRef:process.env.EXECUTION_ORIGIN?`${context.repo.owner}/${context.repo.repo}/.github/workflows/ci-dedicated.yml@refs/heads/main`:process.env.CONTROLLER_WORKFLOW_REF,...(process.env.EXECUTION_ORIGIN?{executionOrigin:JSON.parse(process.env.EXECUTION_ORIGIN)}:{})},
              eventName:context.eventName,payload:context.payload,inputSha:process.env.INPUT_SHA,executionContext:process.env.EXECUTION_ORIGIN?{ref:context.ref,sha:context.sha,workflowRef:process.env.CONTROLLER_WORKFLOW_REF,workflowSha:process.env.EXECUTION_WORKFLOW_SHA}:undefined});}
            catch(error){
              if(context.eventName==='workflow_dispatch'&&context.payload.inputs?.controller_mode==='qualification'){
                const {InactiveIsolatedRequester}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-isolated.mjs')).href);
                if(error instanceof InactiveIsolatedRequester){core.notice('Standing down: authenticated isolated requester is no longer active');core.setOutput('admitted','false');return;}
              }
              // The requester can finish between the lookup above and the helper's own read; confirm before standing down.
              if(requester&&error instanceof Error&&error.message==='Refresh requester is not currently admitted'&&await requesterInactive()){standDownInactive();return;}
              if(!raceLost(error))throw error;core.notice(`Standing down: ${error.message}`);core.setOutput('admitted','false');return;
            }
            if (!admission) { core.setOutput('admitted','false'); return; }
            const executionOrigin=process.env.EXECUTION_ORIGIN?JSON.parse(process.env.EXECUTION_ORIGIN):null;
            const {sourceSha:sha,headSha,baseSha,baseRef,prNumber}=admission;
            // The job condition admits main only when ENABLED and MAIN are both on, so main is always delegated here.
            const mode=process.env.MATRIX_CI_DEDICATED_ENABLED==='true'?'delegated':'shadow';
            const requesting=prNumber>0||admission.sourceKind==='main'?await newestRequestingCiRun(github,context.repo,{...admission,controllerSha:process.env.CONTROLLER_SHA},mode):null;
            const summary={schemaVersion:executionOrigin?4:3,...(executionOrigin?{executionOrigin}:{}),suite:context.payload.inputs?.suite || 'qualification',
              ...(requesting?{requestingRunId:requesting.runId,requestingRunAttempt:requesting.runAttempt}:{}),
              mode,imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,
              ...admission,controllerRunId:context.runId,controllerSha:process.env.CONTROLLER_SHA,controllerRef:'refs/heads/main',
              controllerAttempt:Number(process.env.CONTROLLER_ATTEMPT),controllerWorkflow:'.github/workflows/ci-dedicated.yml'};
            const {data:check}=await github.rest.checks.create({
              ...context.repo, name:prNumber>0||admission.sourceKind==='main' ? 'Dedicated CI Results' : 'Dedicated CI Benchmark',
              head_sha:headSha,status:'in_progress',request:{timeout:10000},
              details_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output:{title:'Isolated Linux qualification pending',summary:JSON.stringify(summary)}});
            for(const [key,value] of Object.entries({sha,source_kind:admission.sourceKind || '',merge_parents:JSON.stringify(admission.mergeParents || []),head_sha:headSha,base_sha:baseSha,base_ref:baseRef,merge_parent_sha:admission.mergeParents?.[0] || '',
              pr_number:prNumber,check_id:check.id,admitted:true,mode,
              requesting_run_id:requesting?.runId || 0,requesting_run_attempt:requesting?.runAttempt || 0}))core.setOutput(key,String(value));

      - name: Revalidate exact PR snapshot before dispatch
        id: current
        if: steps.admit.outputs.admitted == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SNAPSHOT: ${{ toJSON(steps.admit.outputs) }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {verifyCurrentDedicatedSource,assertMainPrIdentity,waitForCurrentMainSource}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            const data=JSON.parse(process.env.SNAPSHOT);
            const snapshot={sourceSha:data.sha,headSha:data.head_sha,baseSha:data.base_sha,baseRef:data.base_ref,prNumber:Number(data.pr_number),...(data.source_kind==='main'?{sourceKind:'main'}:{}),mergeParents:JSON.parse(data.merge_parents)};
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
            try{
              if(data.base_ref==='main'&&Number(data.pr_number)>0){
                const {data:pull}=await github.rest.pulls.get({...context.repo,pull_number:snapshot.prNumber,request:{timeout:10000}});
                assertMainPrIdentity(context.repo,pull,snapshot,true);
                if(pull.merge_commit_sha!==data.sha){
                  await waitForCurrentMainSource(github,context.repo,{...snapshot,headRef:pull.head.ref});
                }
              }
              await verifyCurrentDedicatedSource(github,context.repo,snapshot);
            }catch(error){if(!raceLost(error))throw error;core.notice(`Standing down: ${error.message}`);core.setOutput('superseded','true');return;}
            core.setOutput('current','true');

      - name: Dispatch authenticated PR qualification lease
        id: dispatch
        if: steps.admit.outputs.admitted == 'true' && (steps.admit.outputs.pr_number != '0' || steps.admit.outputs.source_kind == 'main') && steps.current.outputs.current == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONFIGURATION_APP_ID: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          CONFIGURATION_INSTALLATION_ID: ${{ vars.MATRIX_CI_GATE_APP_INSTALLATION_ID }}
          CONFIGURATION_PRIVATE_KEY: ${{ secrets.MATRIX_CI_GATE_APP_PRIVATE_KEY }}
          SNAPSHOT: ${{ toJSON(steps.admit.outputs) }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          EXECUTION_ORIGIN: ${{ steps.origin.outputs.execution_origin }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
          CI_SSH_KEY: ${{ secrets.CI_RUNNER_SSH_KEY }}
          CI_SSH_HOST: ${{ secrets.CI_RUNNER_HOST }}
          CI_KNOWN_HOSTS: ${{ secrets.CI_RUNNER_KNOWN_HOSTS }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {createConfigurationSession}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-config-token.mjs')).href);
            const configuration=createConfigurationSession(github,context.repo,{appId:Number(process.env.CONFIGURATION_APP_ID),installationId:Number(process.env.CONFIGURATION_INSTALLATION_ID),repositoryId:context.payload.repository.id,privateKey:process.env.CONFIGURATION_PRIVATE_KEY,mask:value=>core.setSecret(value)});
            const {mkdir,writeFile}=require('node:fs/promises');
            const {dispatchDedicatedLease}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            const data=JSON.parse(process.env.SNAPSHOT);
            const request={repository:`${context.repo.owner}/${context.repo.repo}`,prNumber:Number(data.pr_number),
              headSha:data.head_sha,baseSha:data.base_sha,baseRef:data.base_ref,mergeSha:data.sha,
              mergeParents:JSON.parse(data.merge_parents),...(data.source_kind==='main'?{sourceKind:'main'}:{}),requestingRunId:Number(data.requesting_run_id),
              requestingRunAttempt:Number(data.requesting_run_attempt),controllerRunId:context.runId,
              controllerRunAttempt:Number(process.env.CONTROLLER_ATTEMPT),controllerSha:process.env.CONTROLLER_SHA,
              controllerRef:'refs/heads/main',controllerWorkflow:'.github/workflows/ci-dedicated.yml',
              imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,
              mode:data.mode,suite:'qualification',limits:{unitWorkers:16,cpu:30,memoryMiB:114688,
                workMiB:65536,tmpMiB:8192,homeMiB:1024,pids:4096,shmMiB:2048}};
            const raceLost=error=>error instanceof Error&&JSON.parse(process.env.RACE_LOST_ERRORS).includes(error.message);
