  reconcile:
    name: Revoke stale stacked qualification
    if: ((github.ref == 'refs/heads/main' && !(github.event_name == 'pull_request_target' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.pull_request.draft == true) || (github.event.action == 'edited' && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-for-ci' && github.event.label.name != 'fast-ci') || (github.event.action == 'labeled' && !(contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && contains(github.event.pull_request.labels.*.name, 'fast-ci'))))) && (github.event_name != 'workflow_run' || github.event.action == 'completed')) && (vars.MATRIX_CI_ISOLATED_EXECUTION != 'true' || github.event_name == 'pull_request_target')) || (vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.event_name == 'workflow_dispatch' && (inputs.controller_mode == 'reconcile' || inputs.controller_mode == 'maintenance') && startsWith(github.ref, 'refs/heads/ci-execution/'))
    environment: matrix-ci
    permissions:
      actions: write
      contents: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # One global queue serialized every PR's reconcile behind every other (40+ deep under load).
      # Queue per scope instead: a PR, a pushed PR with its direct children, or the full scan.
      group: matrix-ci-reconcile-${{ github.event_name == 'workflow_dispatch' && inputs.controller_mode == 'reconcile' && inputs.reconciliation_pr != '' && inputs.reconciliation_pr != '0' && format('pr-{0}', inputs.reconciliation_pr) || github.event.pull_request && format('{0}-{1}', github.event.action == 'synchronize' && 'push' || 'pr', github.event.pull_request.number) || (github.event.workflow_run.pull_requests[0] && !github.event.workflow_run.pull_requests[1] && github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id && github.event.workflow_run.pull_requests[0].base.repo.id == github.event.repository.id) && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || 'full' }}
