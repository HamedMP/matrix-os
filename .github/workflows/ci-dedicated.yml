      cancel-in-progress: false
    steps:
      - name: Authenticate default-main reconciliation source
        id: origin
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
