name: Dedicated CI Benchmark

# This controller comes from the default branch and never executes PR code.
# Enable only after configuring the main-only `matrix-ci` environment and
# installing the root-owned forced-command dispatcher on a dedicated host.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact public commit to benchmark (blank uses this commit)
        required: false
        type: string
      suite:
        description: Benchmark suite
        type: choice
        default: qualification
        options: [qualification, full, unit, checks, e2e-general, e2e-electron]
  pull_request_target:
    branches: [main]
    types: [labeled, ready_for_review, synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: dedicated-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: vars.MATRIX_CI_DEDICATED_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: matrix-ci
    timeout-minutes: 70
    steps:
      - name: Admit current source head
        id: admit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            let sha = process.env.INPUT_SHA || context.sha;
            let headSha = sha, baseSha = "", prNumber = 0;
            if (context.eventName === 'pull_request_target') {
              const {data: pull} = await github.rest.pulls.get({
                ...context.repo, pull_number: context.payload.pull_request.number, request: {timeout: 10000}
              });
              if (pull.state !== 'open' || pull.draft || pull.base.ref !== "main" ||
                  pull.head.sha !== context.payload.pull_request.head.sha ||
                  pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  !pull.labels.some(label => label.name === 'ready-for-ci')) {
                core.setOutput('admitted', 'false');
                return;
              }
              headSha = pull.head.sha;
              baseSha = pull.base.sha;
              prNumber = pull.number || context.payload.pull_request.number;
              sha = pull.merge_commit_sha;
              if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("Current merge commit unavailable");
              const {data: merge} = await github.rest.repos.getCommit({...context.repo, ref: sha, request: {timeout: 10000}});
              const parents = merge.parents?.map(parent => parent.sha) || [];
              if (merge.sha !== sha || parents.length !== 2 || !parents.includes(headSha) || !parents.includes(baseSha)) {
                throw new Error("Merge commit does not bind the current PR head and base");
              }
            }
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Exact commit SHA required');
            await github.rest.repos.getCommit({...context.repo, ref: sha, request: {timeout: 10000}});
            const {data: check} = await github.rest.checks.create({
              ...context.repo, name: context.eventName === 'pull_request_target' || context.payload.inputs?.suite === 'qualification' || !context.payload.inputs?.suite ? 'Dedicated CI Results' : 'Dedicated CI Benchmark', head_sha: headSha, request: {timeout: 10000},
              status: 'in_progress', details_url:
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setOutput('sha', sha);
            core.setOutput('head_sha', headSha);
            core.setOutput('base_sha', baseSha);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('check_id', String(check.id));
            core.setOutput('admitted', 'true');

      - name: Dispatch isolated benchmark
        id: dispatch
        if: steps.admit.outputs.admitted == 'true'
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.sha }}
          SUITE: ${{ inputs.suite || 'qualification' }}
          CI_SSH_KEY: ${{ secrets.CI_RUNNER_SSH_KEY }}
          CI_SSH_HOST: ${{ secrets.CI_RUNNER_HOST }}
          CI_KNOWN_HOSTS: ${{ secrets.CI_RUNNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          [[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ ]]
          [[ $CI_SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]]
          case "$SUITE" in qualification|full|unit|checks|e2e-general|e2e-electron) ;; *) exit 64 ;; esac
          : "${CI_SSH_KEY:?CI SSH key required}"
          : "${CI_KNOWN_HOSTS:?Pinned host key required}"
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          umask 077
          printf '%s\n' "$CI_SSH_KEY" > "$key_dir/id_ed25519"
          printf '%s\n' "$CI_KNOWN_HOSTS" > "$key_dir/known_hosts"
          mkdir -p output/ci-dedicated
          timeout --signal=TERM --kill-after=15s 3900s ssh \
            -i "$key_dir/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "matrixci@$CI_SSH_HOST" "run $SOURCE_SHA $SUITE" \
            > output/ci-dedicated/benchmark.log 2>&1

      - name: Upload isolated benchmark log
        if: always() && steps.admit.outputs.admitted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dedicated-ci-${{ steps.admit.outputs.sha }}
          path: output/ci-dedicated/benchmark.log
          retention-days: 7
          if-no-files-found: warn

      - name: Settle source-head check
        if: always() && steps.admit.outputs.check_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHECK_ID: ${{ steps.admit.outputs.check_id }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          BASE_SHA: ${{ steps.admit.outputs.base_sha }}
          PR_NUMBER: ${{ steps.admit.outputs.pr_number }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          SOURCE_SHA: ${{ steps.admit.outputs.sha }}
          SUITE: ${{ inputs.suite || 'qualification' }}
        with:
          script: |
            const success = process.env.DISPATCH_OUTCOME === 'success';
            await github.rest.checks.update({
              ...context.repo, check_run_id: Number(process.env.CHECK_ID), request: {timeout: 10000},
              status: 'completed', conclusion: success ? 'success' : 'failure',
              output: {
                title: success ? 'Isolated Linux suite passed' : 'Isolated Linux suite failed',
                summary: JSON.stringify({schemaVersion: 1, suite: process.env.SUITE,
                  sourceSha: process.env.SOURCE_SHA, headSha: process.env.HEAD_SHA,
                  baseSha: process.env.BASE_SHA, prNumber: Number(process.env.PR_NUMBER),
                  controllerSha: context.sha, controllerRef: context.ref,
                  controllerWorkflow: '.github/workflows/ci-dedicated.yml'})
              }
            });

      - name: Create immutable qualification provenance
        if: always() && steps.admit.outputs.admitted == 'true' && (inputs.suite == 'qualification' || inputs.suite == '')
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.sha }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          BASE_SHA: ${{ steps.admit.outputs.base_sha }}
          PR_NUMBER: ${{ steps.admit.outputs.pr_number }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const {SOURCE_SHA,HEAD_SHA,BASE_SHA,PR_NUMBER,DISPATCH_OUTCOME}=process.env;
          writeFileSync('output/ci-dedicated/provenance.json',JSON.stringify({
            schemaVersion:1,sourceSha:SOURCE_SHA,headSha:HEAD_SHA,baseSha:BASE_SHA,
            prNumber:Number(PR_NUMBER),dispatchOutcome:DISPATCH_OUTCOME
          }),{flag:'wx'});
          NODE
      - name: Upload immutable qualification provenance
        if: always() && steps.admit.outputs.admitted == 'true' && (inputs.suite == 'qualification' || inputs.suite == '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dedicated-qualification-${{ steps.admit.outputs.head_sha }}-${{ steps.admit.outputs.sha }}-${{ steps.admit.outputs.base_sha }}-pr${{ steps.admit.outputs.pr_number }}
          path: output/ci-dedicated/provenance.json
          if-no-files-found: error
          retention-days: 7
