      - name: Revalidate isolated queue scope before credentials
        if: steps.origin.outputs.execution_origin != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {pathToFileURL}=require('node:url'),{resolve}=require('node:path');
            if(context.payload.inputs?.requesting_action==='settling'){
