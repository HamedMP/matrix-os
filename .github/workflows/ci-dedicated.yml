          CONFIGURATION_TOKEN: ${{ steps.configuration-token.outputs.token }}
          GATE_TOKEN: ${{ steps.gate-token.outputs.token }}
          GATE_APP_ID: ${{ vars.MATRIX_CI_GATE_APP_ID }}
          CONTROLLER_ATTEMPT: ${{ github.run_attempt }}
          EXECUTION_ORIGIN: ${{ steps.origin.outputs.execution_origin }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CONTROLLER_SHA: ${{ steps.origin.outputs.controller_sha }}
          CONTROLLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {withConfigurationGithub}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-config-token.mjs')).href);
            if(!process.env.CONFIGURATION_TOKEN)throw new Error('Configuration read token is required');
            const configurationGithub=new github.constructor({auth:process.env.CONFIGURATION_TOKEN,baseUrl:github.request.endpoint.DEFAULTS.baseUrl,request:{timeout:10000}});
            const sourceGithub=withConfigurationGithub(github,configurationGithub);
            const {reconcileSourceQualification}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-admission.mjs')).href);
            if(!process.env.GATE_TOKEN)throw new Error('Protected gate App token is required');
            // GitHub Script bundles Octokit; external @actions packages are not installed.
            const gateGithub=new github.constructor({auth:process.env.GATE_TOKEN,baseUrl:github.request.endpoint.DEFAULTS.baseUrl,request:{timeout:10000}});
            // Scope reconciliation to the PRs an event can affect; full scans exhausted the installation API budget.
            // Main pushes, schedules and dispatched refresh CI keep the full scan.
            const ownRepo=`${github.request.endpoint.DEFAULTS.baseUrl}/repos/${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const ciPulls=context.eventName==='workflow_run'?(context.payload.workflow_run?.pull_requests??[]):[];
            const scope=context.payload.pull_request
              ?(context.payload.action==='synchronize'
                ?{childrenOf:{number:context.payload.pull_request.number,headRef:context.payload.pull_request.head.ref}}
                :{prNumber:context.payload.pull_request.number})
              :ciPulls.length===1&&[ciPulls[0].base?.repo?.url,ciPulls[0].head?.repo?.url].every(url=>String(url).toLowerCase()===ownRepo)
