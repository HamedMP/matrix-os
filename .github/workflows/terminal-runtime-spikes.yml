name: Terminal Runtime Spikes
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number with a deployed preview VPS
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA to approve
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: terminal-runtime-spikes-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  reprovision:
    name: Remove stale disposable preview
    if: >-
      github.event.label.name == 'terminal-preview-reprovision' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Delete only the current PR preview
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_SECRET:-}" ] ||
            ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Disposable preview disposal is unavailable." >&2
            exit 1
          fi
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] ||
            [ "$head_sha" != "$EVENT_HEAD" ] ||
            ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$' ||
            ! jq -e '.labels | any(.name == "terminal-preview-reprovision")' \
              <<<"$pr_json" >/dev/null; then
            echo "Disposable preview disposal requires an immutable same-repository PR head." >&2
            exit 1
          fi
          handle="pr-${PR_NUMBER}"
          fleet="$(curl --fail --silent --show-error --max-time 30 \
            --connect-timeout 10 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL%/}/vps/fleet")"
          machine_id="$(jq -er --arg handle "$handle" '
            [.machines[] | select(
              .handle == $handle and .runtimeSlot == $handle and
              .status != "deleted"
            )]
            | if length == 1 then .[0].machineId else error("preview_unavailable") end
          ' <<<"$fleet")"
          if ! jq -en --arg id "$machine_id" \
            '$id | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")' \
            >/dev/null; then
            echo "Disposable preview identity is invalid." >&2
            exit 1
          fi
          delete_response="$RUNNER_TEMP/terminal-preview-delete.json"
          delete_code="$(curl --silent --show-error --max-time 60 \
            --connect-timeout 10 \
            -o "$delete_response" -w '%{http_code}' \
            -X DELETE "${PLATFORM_PUBLIC_URL%/}/vps/${machine_id}" \
            -H "authorization: Bearer ${PLATFORM_SECRET}")"
          if [ "$delete_code" != 200 ]; then
            echo "Disposable preview disposal failed." >&2
            exit 1
          fi
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            fleet="$(curl --fail --silent --show-error --max-time 30 \
              --connect-timeout 10 \
              -H "authorization: Bearer ${PLATFORM_SECRET}" \
              "${PLATFORM_PUBLIC_URL%/}/vps/fleet")"
            remaining="$(jq -r --arg handle "$handle" --arg id "$machine_id" '
              [.machines[] | select(
                .handle == $handle and .runtimeSlot == $handle and
                .machineId == $id and .status != "deleted"
              )] | length
            ' <<<"$fleet")"
            if [ "$remaining" = 0 ]; then
              echo "Disposable preview removed."
              exit 0
            fi
            sleep 10
          done
          echo "Disposable preview disposal did not converge." >&2
          exit 1
  bootstrap:
    name: Bootstrap legacy disposable updater
    if: github.event.label.name == 'terminal-updater-bootstrap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Resolve immutable disposable preview
        id: preview
        run: |
          set -euo pipefail; pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"; head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$head_sha" != "$EVENT_HEAD" ] ||
            ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$' ||
            ! jq -e '.labels | any(.name == "preview-vps") and any(.name == "terminal-updater-bootstrap")' <<<"$pr_json" >/dev/null; then
            echo "Legacy updater bootstrap requires an immutable same-repository preview head." >&2; exit 1
          fi
          handle="pr-${PR_NUMBER}"; fleet="$(curl --fail --silent --show-error --max-time 30 -H "authorization: Bearer ${PLATFORM_SECRET}" "${PLATFORM_PUBLIC_URL%/}/vps/fleet")"
          address="$(jq -er --arg handle "$handle" '[.machines[] | select(.handle == $handle and
            .runtimeSlot == $handle and .status == "running")] | if length == 1 then .[0].publicIPv4 else error("preview_unavailable") end' <<<"$fleet")"
          if ! node -e '
            const parts = process.argv[1].split(".").map(Number);
            const valid = parts.length === 4 && parts.every((part) => Number.isInteger(part) && part >= 0 && part <= 255);
            const blocked = !valid || parts[0] === 0 || parts[0] === 10 || parts[0] === 127 || parts[0] >= 224 ||
              (parts[0] === 169 && parts[1] === 254) ||
              (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) || (parts[0] === 192 && parts[1] === 168);
            process.exit(blocked ? 1 : 0);
          ' "$address"; then
            echo "Legacy updater bootstrap preview address is invalid." >&2; exit 1
          fi
          echo "::add-mask::$address"; printf 'address=%s\nhandle=%s\n' "$address" "$handle" >>"$GITHUB_OUTPUT"
      - name: Restart only the legacy updater unit and prove its typed socket
        env:
          ADDRESS: ${{ steps.preview.outputs.address }}
          HANDLE: ${{ steps.preview.outputs.handle }}
        run: |
          set -euo pipefail; gateway_token="$(node --input-type=module -e '
            import { createHmac } from "node:crypto"; process.stdout.write(createHmac("sha256", process.argv[2]).update(process.argv[1]).digest("hex"));
          ' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$gateway_token"; response="$RUNNER_TEMP/terminal-updater-bootstrap.json"
          call_gateway() {
            local body="$1"; curl --fail --silent --show-error --max-time 45 --connect-timeout 15 --insecure \
              --resolve "app.matrix-os.com:443:${ADDRESS}" -o "$response" -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" -H 'content-type: application/json' \
              --data-binary "$body"
          }
          restart_body="$(jq -cn '{command:["/usr/bin/sudo","/usr/bin/systemctl","restart","matrix-sync-agent.service"],timeoutMs:30000}')"
          call_gateway "$restart_body";
          jq -e 'type == "object" and .exitCode == 0 and .timedOut == false and .truncated == false and
            .signal == null and .stdout == "" and .stderr == ""' "$response" >/dev/null
          socket_body="$(jq -cn '{command:["/usr/bin/test","-S","/run/matrix-update-runtime/update.sock"],timeoutMs:10000}')"
          deadline=$((SECONDS + 120)); socket_ready=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if call_gateway "$socket_body" && jq -e 'type == "object" and .exitCode == 0 and
              .timedOut == false and .truncated == false and .signal == null and .stdout == "" and .stderr == ""' "$response" >/dev/null; then
              socket_ready=true; break
            fi
            sleep 5
          done
          if [ "$socket_ready" != true ]; then
            echo "Legacy disposable updater bootstrap did not create the typed socket." >&2; exit 1
          fi
          repair_body="$(jq -cn '{command:["/opt/matrix/bin/matrix-update","repair"],timeoutMs:10000}')"
          call_gateway "$repair_body";
          jq -e 'type == "object" and .exitCode == 0 and .timedOut == false and .truncated == false and
            .signal == null and .stdout == "Update service: accepted\n" and .stderr == ""' "$response" >/dev/null
          echo "Typed updater repair accepted."; echo "Legacy disposable updater bootstrap completed."
  prove:
    name: Prove S1 and S2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'preview-vps' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
    steps:
      - name: Resolve same-repository PR head
        id: resolve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          APPROVED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Invalid PR number." >&2
            exit 1
          fi
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || ! printf '%s' "$APPROVED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Only same-repository PR heads are accepted." >&2
            exit 1
          fi
          if [ "$head_sha" != "$APPROVED_HEAD_SHA" ]; then
            echo "The approved PR head is no longer current; approve the new head explicitly." >&2
            exit 1
          fi
          if ! jq -e '.labels | any(.name == "preview-vps")' <<<"$pr_json" >/dev/null; then
            echo "The PR must have a deployed preview-vps label." >&2
            exit 1
          fi
          {
            echo "pr=$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "short_sha=${head_sha:0:7}"
            echo "handle=pr-$PR_NUMBER"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
      - name: Resolve matching deployed preview
        id: preview
        env:
          HANDLE: ${{ steps.resolve.outputs.handle }}
          SHORT_SHA: ${{ steps.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_SECRET:-}" ]; then
            echo "Required preview operator secrets are unavailable." >&2
            exit 1
          fi
          deadline=$((SECONDS + 4500))
          public_ipv4=""
          gateway_token="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.argv[2]).update(process.argv[1]).digest("hex"));
          ' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$gateway_token"
          is_public_ipv4() {
            node -e '
              const parts = process.argv[1].split(".").map(Number);
              const valid = parts.length === 4 && parts.every((part) =>
                Number.isInteger(part) && part >= 0 && part <= 255);
              const blocked = !valid || parts[0] === 0 || parts[0] === 10 ||
                parts[0] === 127 || parts[0] >= 224 ||
                (parts[0] === 169 && parts[1] === 254) ||
                (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
                (parts[0] === 192 && parts[1] === 168);
              process.exit(blocked ? 1 : 0);
            ' "$1"
          }
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! fleet="$(curl --fail --silent --show-error --max-time 30 \
              -H "authorization: Bearer ${PLATFORM_SECRET}" \
              "${PLATFORM_PUBLIC_URL%/}/vps/fleet")"; then
              echo "Fleet query failed; retrying." >&2
              sleep 15
              continue
            fi
            machine="$(jq -ce --arg handle "$HANDLE" '
              [.machines[] | select(
                .handle == $handle and .runtimeSlot == $handle and
                .status == "running"
              )]
              | if length == 1 then .[0] else {} end
            ' <<<"$fleet")"
            runtime_version="$(jq -r '.runtimeVersion // ""' <<<"$machine")"
            candidate_ipv4="$(jq -r '.publicIPv4 // ""' <<<"$machine")"
            if [[ "$runtime_version" == *"-${SHORT_SHA}" ]] &&
              is_public_ipv4 "$candidate_ipv4"; then
              public_ipv4="$candidate_ipv4"
              break
            fi
            echo "Waiting for exact-head preview deployment."
            sleep 15
          done
          if [ -z "$public_ipv4" ]; then
            echo "Exact-head preview did not become ready before the deadline." >&2
            exit 1
          fi
          if ! node -e '
            const parts = process.argv[1].split(".").map(Number);
            const valid = parts.length === 4 && parts.every((part) => Number.isInteger(part) && part >= 0 && part <= 255);
            const blocked = !valid || parts[0] === 0 || parts[0] === 10 || parts[0] === 127 || parts[0] >= 224 ||
              (parts[0] === 169 && parts[1] === 254) || (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
              (parts[0] === 192 && parts[1] === 168);
            process.exit(blocked ? 1 : 0);
          ' "$public_ipv4"; then
            echo "Preview address is not public." >&2
            exit 1
          fi
          echo "::add-mask::$public_ipv4"
          echo "public_ipv4=$public_ipv4" >>"$GITHUB_OUTPUT"
      - name: Launch detached spike through authenticated gateway
        id: remote
        env:
          PUBLIC_IPV4: ${{ steps.preview.outputs.public_ipv4 }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HANDLE: ${{ steps.resolve.outputs.handle }}
        run: |
          set -euo pipefail
          gateway_token="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.argv[2]).update(process.argv[1]).digest("hex"));
          ' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$gateway_token"
          run_response="$RUNNER_TEMP/terminal-runtime-spike-run.json"
          call_gateway() {
            local body="$1"
            curl --silent --show-error --max-time 45 --connect-timeout 15 \
              --insecure \
              --resolve "app.matrix-os.com:443:${PUBLIC_IPV4}" \
              -o "$run_response" -w '%{http_code}' \
              -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" \
              -H 'content-type: application/json' \
              --data-binary "$body"
          }
          spike_control_body="$(jq -cn '{
            command:["/opt/matrix/bin/matrix-update","status"],
            timeoutMs:10000
          }')"
          spike_control_deadline=$((SECONDS + 300))
          spike_control_ready=false
          while [ "$SECONDS" -lt "$spike_control_deadline" ]; do
            set +e
            http_code="$(call_gateway "$spike_control_body")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ] &&
              jq -e 'type == "object" and .exitCode == 0 and
                .timedOut == false and .truncated == false and
                .signal == null and .stdout == "Update service: idle\n" and .stderr == ""' \
                "$run_response" >/dev/null; then
              spike_control_ready=true
              break
            fi
            if [ "$http_code" = 401 ] || [ "$http_code" = 403 ]; then
              echo "Authenticated spike execution failed." >&2
              exit 1
            fi
            echo "Waiting for exact-head spike control."
            sleep 15
          done
          if [ "$spike_control_ready" != true ]; then
            update_status="$(jq -r 'if .exitCode != 0 then "unavailable" elif .stdout == "Update service: idle\n" then "idle_mismatch" elif .stdout == "Update service: running\n" then "running" elif .stdout == "Update service: failed\n" then "failed" else "unexpected" end' "$run_response" 2>/dev/null || printf unavailable)"
            echo "update_status=${update_status}" >&2
            exit 1
          fi
          run_body="$(jq -cn --arg sha "$HEAD_SHA" '{
            command: [
              "/usr/bin/sudo",
              "/opt/matrix/bin/matrix-terminal-spike-control",
              "launch",
              $sha
            ],
            timeoutMs: 30000
          }')"
          # Customer VPS nginx uses the same per-host self-signed certificate
          # accepted by the platform's CUSTOMER_VPS_TLS_VERIFY=false transport.
          # Only this disposable preview's derived gateway token crosses it;
          # PLATFORM_SECRET never leaves the runner.
          spike_launch_deadline=$((SECONDS + 300))
          spike_launch_ready=false
          while [ "$SECONDS" -lt "$spike_launch_deadline" ]; do
            set +e
            http_code="$(call_gateway "$run_body")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ] &&
              jq -e 'type == "object" and .exitCode == 0 and
                .timedOut == false and .truncated == false and
                .signal == null' "$run_response" >/dev/null; then
              spike_launch_ready=true
              break
            fi
            if [ "$http_code" = 401 ] || [ "$http_code" = 403 ]; then
              echo "Authenticated spike execution failed." >&2
              exit 1
            fi
            diagnostic=unavailable
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ]; then
              diagnostic="$(jq -r '
                if ((.stderr // "") | test("spike_[a-z0-9_]+"))
                then ((.stderr // "") | capture("(?<code>spike_[a-z0-9_]+)").code)
                elif ((.stderr // "") | test("sudo:")) then "sudo_rejected"
                else "unclassified" end
              ' "$run_response" 2>/dev/null || printf 'unclassified')"
              if [ "$diagnostic" = "spike_control_unavailable" ]; then
                :
              else
                break
              fi
            fi
            echo "Waiting for exact-head spike control."
            sleep 15
          done
          echo "gateway_http_status=$http_code"
          if [ "$spike_launch_ready" != true ]; then
            if jq -e 'type == "object"' "$run_response" >/dev/null 2>&1; then
              jq '{
                exitCode, timedOut, truncated, signal,
                diagnostic: (if ((.stderr // "") | test("spike_[a-z0-9_]+"))
                  then ((.stderr // "") | capture("(?<code>spike_[a-z0-9_]+)").code)
                  elif ((.stderr // "") | test("sudo:")) then "sudo_rejected"
                  else "unclassified" end)
              }' "$run_response" >&2
            else
              printf '%s\n' '{"diagnostic":"gateway_unavailable"}' >&2
            fi
            echo "Detached spike launch failed." >&2
            exit 1
          fi
          jq -r '.stdout, .stderr' "$run_response" |
            grep -E '^spike_launch_(started|existing)$' || true
      - name: Retrieve bounded evidence through authenticated gateway
        id: retrieve
        env:
          PUBLIC_IPV4: ${{ steps.preview.outputs.public_ipv4 }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HANDLE: ${{ steps.resolve.outputs.handle }}
        run: |
          set -euo pipefail
          gateway_token="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.argv[2]).update(process.argv[1]).digest("hex"));
          ' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$gateway_token"
          pack_body="$(jq -cn --arg sha "$HEAD_SHA" '{
            command: [
              "/usr/bin/sudo",
              "/opt/matrix/bin/matrix-terminal-spike-control",
              "pack",
              $sha
            ],
            timeoutMs: 30000
          }')"
          pack_response="$RUNNER_TEMP/terminal-runtime-spike-pack.json"
          evidence_deadline=$((SECONDS + 2100))
          pack_ready=false
          http_code="000"
          while [ "$SECONDS" -lt "$evidence_deadline" ]; do
            if http_code="$(curl --silent --max-time 45 --connect-timeout 15 \
              --insecure \
              --resolve "app.matrix-os.com:443:${PUBLIC_IPV4}" \
              -o "$pack_response" -w '%{http_code}' \
              -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" \
              -H 'content-type: application/json' \
              --data-binary "$pack_body")" && [ "$http_code" = 200 ] && jq -e '
                type == "object" and .exitCode == 0 and .timedOut == false and
                .truncated == false and .signal == null and
                (.stdout | type == "string" and length > 0 and length <= 700000)
              ' "$pack_response" >/dev/null; then
              pack_ready=true
              break
            fi
            echo "Waiting for detached spike evidence."
            sleep 15
          done
          echo "gateway_http_status=$http_code"
          if [ "$pack_ready" != true ]; then
            diagnostic="$(jq -r 'if ((.stderr // "") | test("spike_[a-z0-9_]+")) then ((.stderr // "") | capture("(?<code>spike_[a-z0-9_]+)").code) else "unavailable" end' "$pack_response" 2>/dev/null || printf unavailable)"
            echo "evidence_diagnostic=${diagnostic}" >&2
            echo "Bounded evidence retrieval failed." >&2
            exit 1
          fi
          envelope="$RUNNER_TEMP/matrix-terminal-spike-evidence-${HEAD_SHA}.json"
          evidence_parent="$RUNNER_TEMP/terminal-runtime-spike-evidence"
          install -d -m 0700 "$evidence_parent"
          jq -r '.stdout' "$pack_response" | base64 --decode >"$envelope"
          evidence="$(node scripts/spikes/terminal-runtime/verify-evidence.mjs \
            --unpack "$envelope" "$evidence_parent" "$HEAD_SHA")"
          echo "evidence=$evidence" >>"$GITHUB_OUTPUT"
      - name: Validate privacy and all mandatory evidence
        id: validate
        env:
          EVIDENCE: ${{ steps.retrieve.outputs.evidence }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          set +e
          result="$(node scripts/spikes/terminal-runtime/verify-evidence.mjs \
            "$EVIDENCE" --expected-head "$HEAD_SHA")"
          validation_status=$?
          set -e
          if [ "$validation_status" -ne 0 ]; then
            node scripts/spikes/terminal-runtime/verify-evidence.mjs "$EVIDENCE" --report-gates || true
            exit "$validation_status"
          fi
          digest="$(jq -r '.summarySha256' <<<"$result")"
          if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "Invalid evidence digest." >&2
            exit 1
          fi
          echo "summary_sha256=$digest" >>"$GITHUB_OUTPUT"
      - name: Upload validated evidence
        uses: actions/upload-artifact@v7
        with:
          name: terminal-runtime-spikes-pr-${{ steps.resolve.outputs.pr }}-${{ steps.resolve.outputs.short_sha }}
          path: ${{ steps.retrieve.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
      - name: Comment passing evidence
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          SUMMARY_SHA256: ${{ steps.validate.outputs.summary_sha256 }}
        run: |
          set -euo pipefail
          body="**Terminal runtime spikes passed**
          - Commit: \`${HEAD_SHA}\`
          - Gate S1: pass
          - Gate S2: pass
          - Evidence SHA-256: \`${SUMMARY_SHA256}\`
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          The artifact is bounded and privacy-validated; it contains no terminal contents, credentials, host IPs, owner paths, or display names."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
