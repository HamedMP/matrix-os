name: AI Relay Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      promote:
        description: Promote the verified revision to 100% traffic
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ai-relay-cloud-run-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy funded AI relay
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      AI_RELAY_CLOUD_RUN_SERVICE: ${{ vars.AI_RELAY_CLOUD_RUN_SERVICE }}
      AI_RELAY_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.AI_RELAY_CLOUD_RUN_SERVICE_ACCOUNT }}
      PLATFORM_INTERNAL_URL: ${{ vars.PLATFORM_INTERNAL_URL }}
      CLOUDFLARE_AI_GATEWAY_URL: ${{ vars.CLOUDFLARE_AI_GATEWAY_URL }}
      MATRIX_JEV_PRICING_REVIEW_VERSION: ${{ vars.MATRIX_JEV_PRICING_REVIEW_VERSION }}
      MATRIX_JEV_PRICING_REVIEWED_AT: ${{ vars.MATRIX_JEV_PRICING_REVIEWED_AT }}
      MATRIX_JEV_PRICING_VALID_THROUGH: ${{ vars.MATRIX_JEV_PRICING_VALID_THROUGH }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PROMOTE: ${{ inputs.promote }}
      GH_TOKEN: ${{ github.token }}
      MATRIX_FUNDED_AI_ACCEPTANCE_RUN_ID: ${{ vars.MATRIX_FUNDED_AI_ACCEPTANCE_RUN_ID }}
      MATRIX_FUNDED_AI_ACCEPTANCE_RECEIPT_SHA256: ${{ vars.MATRIX_FUNDED_AI_ACCEPTANCE_RECEIPT_SHA256 }}
      MATRIX_FUNDED_SONNET_PRICING_REVIEW_VERSION: ${{ vars.MATRIX_FUNDED_SONNET_PRICING_REVIEW_VERSION }}
      MATRIX_FUNDED_SONNET_PRICING_REVIEWED_AT: ${{ vars.MATRIX_FUNDED_SONNET_PRICING_REVIEWED_AT }}
      MATRIX_FUNDED_SONNET_PRICING_VALID_THROUGH: ${{ vars.MATRIX_FUNDED_SONNET_PRICING_VALID_THROUGH }}
      MATRIX_FUNDED_GLM_PRICING_REVIEW_VERSION: ${{ vars.MATRIX_FUNDED_GLM_PRICING_REVIEW_VERSION }}
      MATRIX_FUNDED_GLM_PRICING_REVIEWED_AT: ${{ vars.MATRIX_FUNDED_GLM_PRICING_REVIEWED_AT }}
      MATRIX_FUNDED_GLM_PRICING_VALID_THROUGH: ${{ vars.MATRIX_FUNDED_GLM_PRICING_VALID_THROUGH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          python3 scripts/verify-funded-relay-evidence.py configuration
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            ARTIFACT_REPOSITORY
            AI_RELAY_CLOUD_RUN_SERVICE
            AI_RELAY_CLOUD_RUN_SERVICE_ACCOUNT
            PLATFORM_INTERNAL_URL
            CLOUDFLARE_AI_GATEWAY_URL
            MATRIX_FUNDED_SONNET_PRICING_REVIEW_VERSION
            MATRIX_FUNDED_SONNET_PRICING_REVIEWED_AT
            MATRIX_FUNDED_SONNET_PRICING_VALID_THROUGH
            MATRIX_FUNDED_GLM_PRICING_REVIEW_VERSION
            MATRIX_FUNDED_GLM_PRICING_REVIEWED_AT
            MATRIX_FUNDED_GLM_PRICING_VALID_THROUGH
            MATRIX_JEV_PRICING_REVIEW_VERSION
            MATRIX_JEV_PRICING_REVIEWED_AT
            MATRIX_JEV_PRICING_VALID_THROUGH
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub environment variable: $name" >&2
              exit 1
            fi
          done
          if [ "$MATRIX_JEV_PRICING_REVIEW_VERSION" != "typesafe-jev-input-2026-09" ]; then
            echo "Jev review must match the supported immutable price version." >&2
            exit 1
          fi
          for name in MATRIX_JEV_PRICING_REVIEWED_AT MATRIX_JEV_PRICING_VALID_THROUGH; do
            if ! [[ "${!name}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]; then
              echo "Jev review dates must use canonical UTC ISO timestamps." >&2
              exit 1
            fi
          done
          python3 - <<'PYTHON'
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          try:
              dates = []
              for name in ("MATRIX_JEV_PRICING_REVIEWED_AT", "MATRIX_JEV_PRICING_VALID_THROUGH"):
                  value = os.environ[name]
                  parsed = datetime.strptime(value, "%Y-%m-%dT%H:%M:%S.%fZ").replace(tzinfo=timezone.utc)
                  if parsed.isoformat(timespec="milliseconds").replace("+00:00", "Z") != value:
                      raise ValueError("noncanonical date")
                  dates.append(parsed)
              reviewed_at, valid_through = dates
              now = datetime.now(timezone.utc)
              if not timedelta(0) < valid_through - reviewed_at <= timedelta(days=90):
                  raise ValueError("invalid review window")
              if not reviewed_at <= now <= valid_through:
                  raise ValueError("review is not current")
          except (KeyError, ValueError):
              print("Jev review must use valid UTC dates and a current window of at most 90 days.", file=sys.stderr)
              sys.exit(1)
          PYTHON
          if ! [[ "$PLATFORM_INTERNAL_URL" =~ ^https://[^/?#]+/?$ ]]; then
            echo "PLATFORM_INTERNAL_URL must be an HTTPS origin." >&2
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_AI_GATEWAY_URL" =~ ^https://gateway\.ai\.cloudflare\.com/v1/[a-f0-9]{32}/[A-Za-z0-9_-]{1,64}/anthropic$ ]]; then
            echo "CLOUDFLARE_AI_GATEWAY_URL must be an official Anthropic AI Gateway URL." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify relay secrets and least-privilege access
        run: |
          set -euo pipefail
          required_secrets=(
            "${GATEWAY_TOKEN_SECRET}:${GATEWAY_TOKEN_VERSION}"
            "${WORKERS_TOKEN_SECRET}:${WORKERS_TOKEN_VERSION}"
            "${CONTROL_TOKEN_SECRET}:${CONTROL_TOKEN_VERSION}"
            "${METADATA_SECRET_SECRET}:${METADATA_SECRET_VERSION}"
          )
          for binding in "${required_secrets[@]}"; do
            secret_name="${binding%:*}"
            secret_version="${binding##*:}"
            gcloud secrets versions describe "$secret_version" \
              --secret "$secret_name" \
              --project "$GCP_PROJECT_ID" >/dev/null
            accessor_member="$(
              gcloud secrets get-iam-policy "$secret_name" \
                --project "$GCP_PROJECT_ID" \
                --flatten='bindings[].members' \
                --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:${AI_RELAY_CLOUD_RUN_SERVICE_ACCOUNT}" \
                --format='value(bindings.members)' \
                | head -1
            )"
            if [ "$accessor_member" != "serviceAccount:${AI_RELAY_CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
              echo "$secret_name must grant secret accessor to the relay service account." >&2
              exit 1
            fi
          done

      - name: Require existing safe production baseline
        if: ${{ inputs.environment == 'production' && !inputs.promote }}
        run: python3 scripts/verify-funded-relay-evidence.py deployment-preflight

      - name: Build relay image
        if: ${{ inputs.environment != 'production' || !inputs.promote }}
        run: |
          set -euo pipefail
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-ai-relay:${GITHUB_SHA::12}"
          cache_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-ai-relay:buildcache"
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --config cloudbuild.ai-relay.yaml \
            --substitutions "_IMAGE=$image,_CACHE_IMAGE=$cache_image" \
            --timeout=1200s
          digest="$(gcloud artifacts docker images describe "$image" \
            --project "$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          if [ -z "$digest" ]; then
            echo "Could not resolve the immutable relay image digest." >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=${image%:*}@${digest}" >> "$GITHUB_ENV"

      - name: Deploy candidate revision
        if: ${{ inputs.environment != 'production' || !inputs.promote }}
        run: |
          set -euo pipefail
          # Deploy onto an existing service and keep the digest-pinned candidate
          # off its default URL. Only explicit promotion may route it.
          traffic_flags=(--tag candidate --no-traffic)
          gcloud run deploy "$AI_RELAY_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_DIGEST" \
            --command "" \
            --args "" \
            --service-account "$AI_RELAY_CLOUD_RUN_SERVICE_ACCOUNT" \
            --labels "matrix-source-sha=${GITHUB_SHA}" \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 32 \
            --timeout 900 \
            --min-instances 0 \
            --max-instances 3 \
            --ingress all \
            --allow-unauthenticated \
            "${traffic_flags[@]}" \
            --set-env-vars "^|^MATRIX_FUNDED_AI_ENABLED=true|MATRIX_FUNDED_AI_RESERVATION_MODE=usage|MATRIX_FUNDED_AI_BETAS=claude-code-20250219,structured-outputs-2025-11-13,interleaved-thinking-2025-05-14,fine-grained-tool-streaming-2025-05-14,thinking-token-count-2026-05-13,context-management-2025-06-27,prompt-caching-scope-2026-01-05,mid-conversation-system-2026-04-07,effort-2025-11-24|PLATFORM_INTERNAL_URL=${PLATFORM_INTERNAL_URL}|CLOUDFLARE_AI_GATEWAY_URL=${CLOUDFLARE_AI_GATEWAY_URL}|MATRIX_FUNDED_SONNET_PRICING_REVIEW_VERSION=${MATRIX_FUNDED_SONNET_PRICING_REVIEW_VERSION}|MATRIX_FUNDED_SONNET_PRICING_REVIEWED_AT=${MATRIX_FUNDED_SONNET_PRICING_REVIEWED_AT}|MATRIX_FUNDED_SONNET_PRICING_VALID_THROUGH=${MATRIX_FUNDED_SONNET_PRICING_VALID_THROUGH}|MATRIX_FUNDED_GLM_PRICING_REVIEW_VERSION=${MATRIX_FUNDED_GLM_PRICING_REVIEW_VERSION}|MATRIX_FUNDED_GLM_PRICING_REVIEWED_AT=${MATRIX_FUNDED_GLM_PRICING_REVIEWED_AT}|MATRIX_FUNDED_GLM_PRICING_VALID_THROUGH=${MATRIX_FUNDED_GLM_PRICING_VALID_THROUGH}|MATRIX_JEV_PRICING_REVIEW_VERSION=${MATRIX_JEV_PRICING_REVIEW_VERSION}|MATRIX_JEV_PRICING_REVIEWED_AT=${MATRIX_JEV_PRICING_REVIEWED_AT}|MATRIX_JEV_PRICING_VALID_THROUGH=${MATRIX_JEV_PRICING_VALID_THROUGH}|MATRIX_FUNDED_AI_GLOBAL_CONCURRENCY=16|MATRIX_FUNDED_AI_RUNTIME_CONCURRENCY=2|MATRIX_FUNDED_AI_GLOBAL_RATE_LIMIT=60|MATRIX_FUNDED_AI_RATE_LIMIT=20" \
            --set-secrets "CLOUDFLARE_AI_GATEWAY_TOKEN=${GATEWAY_TOKEN_SECRET}:${GATEWAY_TOKEN_VERSION},CLOUDFLARE_WORKERS_AI_TOKEN=${WORKERS_TOKEN_SECRET}:${WORKERS_TOKEN_VERSION},AI_RELAY_CONTROL_TOKEN=${CONTROL_TOKEN_SECRET}:${CONTROL_TOKEN_VERSION},AI_RELAY_METADATA_SECRET=${METADATA_SECRET_SECRET}:${METADATA_SECRET_VERSION}" \
            --quiet
          candidate_url=""
          candidate_revision=""
          candidate_digest=""
          expected_digest="${IMAGE_DIGEST##*@}"
          if ! [[ "$expected_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Candidate relay metadata did not become ready." >&2
            exit 1
          fi
          for _attempt in {1..10}; do
            service_json="$(gcloud run services describe "$AI_RELAY_CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format=json 2>/dev/null || true)"
            candidate_url="$(printf '%s\n' "$service_json" | jq -r '.status.traffic[]? | select(.tag == "candidate") | .url // empty' | head -1)"
            candidate_revision="$(printf '%s\n' "$service_json" | jq -r '.status.traffic[]? | select(.tag == "candidate") | .revisionName // empty' | head -1)"
            if [ -n "$candidate_url" ] && [ -n "$candidate_revision" ]; then
              candidate_image="$(gcloud run revisions describe "$candidate_revision" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --format='value(spec.containers[0].image)' 2>/dev/null || true)"
              candidate_digest="${candidate_image##*@}"
              if [[ "$candidate_image" == *@sha256:* ]] && [ "$candidate_digest" = "$expected_digest" ]; then
                break
              fi
            fi
            sleep 3
          done
          if [ -z "$candidate_url" ] || [ -z "$candidate_revision" ] || [ "$candidate_digest" != "$expected_digest" ]; then
            echo "Candidate relay metadata did not become ready." >&2
            exit 1
          fi
          echo "CANDIDATE_URL=$candidate_url" >> "$GITHUB_ENV"
          echo "CANDIDATE_REVISION=$candidate_revision" >> "$GITHUB_ENV"

      - name: Verify deployed candidate has no default traffic
        if: ${{ inputs.environment != 'production' || !inputs.promote }}
        run: python3 scripts/verify-funded-relay-evidence.py candidate-isolation

      - name: Verify existing production candidate against reviewed evidence
        if: ${{ inputs.environment == 'production' && inputs.promote }}
        run: python3 scripts/verify-funded-relay-evidence.py promotion

      - name: Smoke candidate relay
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 "$CANDIDATE_URL/health" >/dev/null
          unknown_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$CANDIDATE_URL/instances")"
          if [ "$unknown_status" != "404" ]; then
            echo "Dedicated relay unexpectedly exposed a legacy proxy route." >&2
            exit 1
          fi

      - name: Promote verified revision
        if: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            python3 scripts/verify-funded-relay-evidence.py promotion
          fi
          gcloud run services update-traffic "$AI_RELAY_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$CANDIDATE_REVISION=100"
