name: Desktop Build

on:
  workflow_call:
    inputs:
      channel:
        description: Desktop update channel.
        required: true
        type: string
      version_suffix:
        description: Optional prerelease suffix appended to desktop/package.json.
        required: false
        type: string
        default: ""
      version:
        description: Exact desktop/package.json version for release builds.
        required: false
        type: string
        default: ""
      artifact_prefix:
        description: Prefix for uploaded artifacts.
        required: true
        type: string
      retention_days:
        description: Artifact retention.
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    env:
      MATRIX_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN || vars.NEXT_PUBLIC_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://eu.posthog.com' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare mac signing environment
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MATRIX_DESKTOP_MAC_CERTIFICATE || secrets.CSC_LINK }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MATRIX_DESKTOP_MAC_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERTIFICATE:-}" ]; then
            echo "MATRIX_DESKTOP_MAC_CERTIFICATE or CSC_LINK is required" >&2
            exit 1
          fi
          if [ -z "${MAC_CERTIFICATE_PASSWORD:-}" ]; then
            echo "MATRIX_DESKTOP_MAC_CERTIFICATE_PASSWORD or CSC_KEY_PASSWORD is required" >&2
            exit 1
          fi
          cert_delimiter="MATRIX_DESKTOP_CERT_$(uuidgen | tr '[:lower:]' '[:upper:]' | tr -d '-')"
          password_delimiter="MATRIX_DESKTOP_CERT_PASSWORD_$(uuidgen | tr '[:lower:]' '[:upper:]' | tr -d '-')"
          {
            echo "CSC_LINK<<$cert_delimiter"
            printf '%s\n' "$MAC_CERTIFICATE"
            echo "$cert_delimiter"
            echo "CSC_KEY_PASSWORD<<$password_delimiter"
            printf '%s\n' "$MAC_CERTIFICATE_PASSWORD"
            echo "$password_delimiter"
          } >> "$GITHUB_ENV"

      - name: Validate Apple notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          for var in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required Apple notarization secret: $var" >&2
              exit 1
            fi
          done

      - name: Apply desktop release version
        if: ${{ inputs.version != '' || inputs.version_suffix != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          node --input-type=module -e "import { readFile, writeFile } from 'node:fs/promises'; const p='desktop/package.json'; const j=JSON.parse(await readFile(p,'utf8')); const exact=process.env.RELEASE_VERSION || ''; const suffix=process.env.VERSION_SUFFIX || ''; j.version = exact || (j.version.replace(/-.*/, '') + '-' + suffix); await writeFile(p, JSON.stringify(j, null, 2) + '\n');"

      - name: Build desktop app
        run: pnpm --filter desktop build

      - name: Package desktop app
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --publish never

      - name: Resolve mac artifact metadata
        id: mac_artifact
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./desktop/package.json').version")"
          {
            echo "package_version=$package_version"
            echo "artifact_base=Matrix-OS-${package_version}-mac-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify packaged update resources
        shell: bash
        env:
          ARTIFACT_BASE: ${{ steps.mac_artifact.outputs.artifact_base }}
        run: |
          set -euo pipefail
          if [ ! -f desktop/dist/latest-mac.yml ]; then
            echo "Missing macOS update manifest: desktop/dist/latest-mac.yml" >&2
            exit 1
          fi
          if [ ! -f "desktop/dist/${ARTIFACT_BASE}.dmg" ]; then
            echo "Missing macOS DMG artifact: desktop/dist/${ARTIFACT_BASE}.dmg" >&2
            exit 1
          fi
          if [ ! -f "desktop/dist/${ARTIFACT_BASE}.zip" ]; then
            echo "Missing macOS ZIP artifact: desktop/dist/${ARTIFACT_BASE}.zip" >&2
            exit 1
          fi
          if [ ! -f "desktop/dist/${ARTIFACT_BASE}.dmg.blockmap" ]; then
            echo "Missing macOS DMG blockmap: desktop/dist/${ARTIFACT_BASE}.dmg.blockmap" >&2
            exit 1
          fi
          if [ ! -f "desktop/dist/${ARTIFACT_BASE}.zip.blockmap" ]; then
            echo "Missing macOS ZIP blockmap: desktop/dist/${ARTIFACT_BASE}.zip.blockmap" >&2
            exit 1
          fi
          unexpected_artifact="$(
            find desktop/dist -maxdepth 1 -type f \
              \( -name "Matrix-OS-*-mac-*.dmg" -o -name "Matrix-OS-*-mac-*.zip" -o -name "Matrix-OS-*-mac-*.blockmap" \) \
              ! -name "${ARTIFACT_BASE}.dmg" \
              ! -name "${ARTIFACT_BASE}.zip" \
              ! -name "${ARTIFACT_BASE}.dmg.blockmap" \
              ! -name "${ARTIFACT_BASE}.zip.blockmap" \
              -print -quit
          )"
          if [ -n "$unexpected_artifact" ]; then
            echo "macOS ${{ matrix.arch }} build produced unexpected artifact: $unexpected_artifact" >&2
            exit 1
          fi
          if ! find desktop/dist -path "*/Matrix OS.app/Contents/Resources/app-update.yml" -type f -print -quit | grep -q .; then
            echo "Missing packaged macOS app-update.yml" >&2
            exit 1
          fi

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find desktop/dist -maxdepth 2 -type d -name "Matrix OS.app" -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Missing unpacked macOS app for signature verification" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 \
            | grep "Authority=Developer ID Application" >/dev/null
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          if pnpm exec asar list "$app_path/Contents/Resources/app.asar" \
            | grep "node_modules/@matrix-os/contracts" >/dev/null; then
            echo "Packaged app contains raw @matrix-os/contracts sources" >&2
            exit 1
          fi

      - name: Smoke test macOS DMG mount and Launch smoke test macOS app
        shell: bash
        env:
          ARTIFACT_BASE: ${{ steps.mac_artifact.outputs.artifact_base }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_VERSION: ${{ steps.mac_artifact.outputs.package_version }}
        run: |
          set -euo pipefail
          dmg_path="desktop/dist/${ARTIFACT_BASE}.dmg"
          mount_dir=""
          volume_name=""
          finder_window_open=false
          copy_dir="$(mktemp -d)"
          app_pid=""
          update_server_pid=""
          close_finder_window() {
            if [ "$finder_window_open" = true ] && [ -n "$volume_name" ]; then
              osascript - "$volume_name" <<'APPLESCRIPT' >/dev/null 2>&1 || true
          on run argv
            set volumeName to item 1 of argv
            tell application "Finder"
              if exists disk volumeName then
                try
                  close container window of disk volumeName
                end try
              end if
            end tell
          end run
          APPLESCRIPT
            fi
            finder_window_open=false
          }
          cleanup() {
            if [ -n "$app_pid" ]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            if [ -n "$update_server_pid" ]; then
              kill "$update_server_pid" 2>/dev/null || true
              wait "$update_server_pid" 2>/dev/null || true
            fi
            close_finder_window
            if [ -n "$mount_dir" ]; then
              hdiutil detach "$mount_dir" -quiet || true
            fi
            rm -rf "$copy_dir"
          }
          trap cleanup EXIT
          attach_output="$(hdiutil attach "$dmg_path" -nobrowse -readonly)"
          mount_dir="$(printf '%s\n' "$attach_output" | awk -F '\t' '$NF ~ /^\/Volumes\// { print $NF; exit }')"
          if [ -z "$mount_dir" ] || [ "${mount_dir#/Volumes/}" = "$mount_dir" ]; then
            printf '%s\n' "$attach_output" >&2
            echo "DMG did not mount at a native /Volumes path" >&2
            exit 1
          fi
          volume_name="${mount_dir#/Volumes/}"
          if [ ! -L "$mount_dir/Applications" ]; then
            echo "DMG is missing the Applications install link" >&2
            exit 1
          fi
          applications_target="$(readlink "$mount_dir/Applications")"
          if [ "$applications_target" != "/Applications" ]; then
            echo "DMG Applications link points to an unexpected target" >&2
            exit 1
          fi
          osascript - "$volume_name" <<'APPLESCRIPT'
          on run argv
            set volumeName to item 1 of argv
            tell application "Finder" to activate
            tell application "Finder"
              if not (exists disk volumeName) then error "mounted DMG is unavailable in Finder"
              open disk volumeName
            end tell
          end run
          APPLESCRIPT
          finder_window_open=true
          finder_icon_view="missing value"
          for _ in {1..20}; do
            finder_icon_view="$(osascript - "$volume_name" <<'APPLESCRIPT'
          on run argv
            set volumeName to item 1 of argv
            tell application "Finder"
              if not (exists disk volumeName) then return "missing value"
              tell disk volumeName
                set volumeWindow to container window
                if current view of volumeWindow is not icon view then return "missing value"
                get icon view options of volumeWindow
                return "ready"
              end tell
            end tell
          end run
          APPLESCRIPT
            )" || finder_icon_view="missing value"
            if [ "$finder_icon_view" = "ready" ]; then
              break
            fi
            sleep 0.5
          done
          if [ "$finder_icon_view" != "ready" ]; then
            echo "DMG Finder icon-view settings did not become available" >&2
            exit 1
          fi
          dmgbuild_python="$(
            find "$ELECTRON_BUILDER_CACHE" -path '*/python/bin/python3' -type f -perm -111 -print -quit
          )"
          if [ -z "$dmgbuild_python" ]; then
            echo "Electron Builder's bundled DMG metadata parser is missing" >&2
            exit 1
          fi
          background_reference="$("$dmgbuild_python" - "$mount_dir/.DS_Store" <<'PYTHON'
          import sys

          from ds_store import DSStore
          from mac_alias import Alias

          with DSStore.open(sys.argv[1], "r") as store:
              icon_view = store["."]["icvp"]

          background_alias = icon_view.get("backgroundImageAlias")
          if not background_alias:
              print("missing value")
              raise SystemExit(0)

          background_target = Alias.from_bytes(background_alias).target.posix_path
          if isinstance(background_target, bytes):
              background_target = background_target.decode("utf-8")
          print(background_target or "missing value")
          PYTHON
          )"
          if [ -z "$background_reference" ] || [ "$background_reference" = "missing value" ]; then
            echo "DMG Finder background picture is missing value" >&2
            exit 1
          fi
          background_candidate="$mount_dir/${background_reference#/}"
          background_picture="missing value"
          background_picture="$(osascript - "$background_candidate" <<'APPLESCRIPT'
          on run argv
            set backgroundPath to item 1 of argv
            tell application "Finder"
              set backgroundFile to POSIX file backgroundPath
              if not (exists backgroundFile) then return "missing value"
              return POSIX path of (backgroundFile as alias)
            end tell
          end run
          APPLESCRIPT
          )" || background_picture="missing value"
          if [ -z "$background_picture" ] || [ "$background_picture" = "missing value" ]; then
            echo "DMG Finder background picture points to a missing file" >&2
            exit 1
          fi
          case "$background_picture" in
            "$mount_dir"/.background.*|"$mount_dir"/.background/*) ;;
            *)
              echo "DMG Finder background picture resolves outside .background" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$background_picture" ]; then
            echo "DMG Finder background picture points to a missing file" >&2
            exit 1
          fi
          close_finder_window
          ditto "$mount_dir/Matrix OS.app" "$copy_dir/Matrix OS.app"
          if [ ! -x "$copy_dir/Matrix OS.app/Contents/MacOS/Matrix OS" ]; then
            echo "Copied macOS app is missing executable entrypoint" >&2
            exit 1
          fi
          update_port_file="$copy_dir/update-fixture.port"
          update_server_log="$copy_dir/update-fixture.log"
          node scripts/release/desktop-update-fixture-server.mjs \
            --channel "$CHANNEL" \
            --version "$PACKAGE_VERSION" \
            --port-file "$update_port_file" >"$update_server_log" 2>&1 &
          update_server_pid=$!
          for _ in {1..40}; do
            if [ -s "$update_port_file" ]; then
              break
            fi
            if ! kill -0 "$update_server_pid" 2>/dev/null; then
              cat "$update_server_log"
              echo "Desktop update fixture server exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.25
          done
          if [ ! -s "$update_port_file" ]; then
            cat "$update_server_log"
            echo "Desktop update fixture server did not become ready" >&2
            exit 1
          fi
          update_port="$(tr -d '[:space:]' < "$update_port_file")"
          if ! [[ "$update_port" =~ ^[0-9]+$ ]]; then
            cat "$update_server_log"
            echo "Desktop update fixture server returned an invalid port" >&2
            exit 1
          fi
          app_log="$copy_dir/matrix-os-launch.log"
          OPERATOR_USER_DATA_DIR="$copy_dir/user-data" \
            OPERATOR_UPDATE_CHANNEL="$CHANNEL" \
            OPERATOR_UPDATE_FEED="http://127.0.0.1:${update_port}/" \
            "$copy_dir/Matrix OS.app/Contents/MacOS/Matrix OS" --disable-gpu >"$app_log" 2>&1 &
          app_pid=$!
          launch_attempts=20
          for ((attempt = 1; attempt <= launch_attempts; attempt += 1)); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || true
              cat "$app_log"
              echo "Packaged macOS app exited during launch smoke test" >&2
              exit 1
            fi
            if grep -Fq "[updates] update check completed: up to date" "$app_log"; then
              break
            fi
            sleep 1
          done
          if grep -Fq "[updates] check failed:" "$app_log"; then
            cat "$app_log"
            cat "$update_server_log"
            echo "Packaged macOS updater failed its fixture feed check" >&2
            exit 1
          fi
          if ! grep -Fq "[updates] update check completed: up to date" "$app_log"; then
            cat "$app_log"
            cat "$update_server_log"
            echo "Packaged macOS updater did not complete its fixture feed check" >&2
            exit 1
          fi
          if grep -Fq "ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING" "$app_log"; then
            cat "$app_log"
            echo "Packaged macOS app attempted to load raw TypeScript from node_modules" >&2
            exit 1
          fi

      - name: Rename mac update manifest for arch
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mv desktop/dist/latest-mac.yml "desktop/dist/${{ matrix.arch }}-mac.yml"
          if [ "$CHANNEL" != "stable" ] && [ -f "desktop/dist/${CHANNEL}-mac.yml" ]; then
            mv "desktop/dist/${CHANNEL}-mac.yml" "desktop/dist/${{ matrix.arch }}-${CHANNEL}-mac.yml"
          fi
          find desktop/dist -maxdepth 1 -type f -name '*-mac.yml' \
            ! -name "${{ matrix.arch }}-mac.yml" \
            ! -name "${{ matrix.arch }}-${CHANNEL}-mac.yml" \
            -delete

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-macos-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/*-mac.yml
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATRIX_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN || vars.NEXT_PUBLIC_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://eu.posthog.com' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply desktop release version
        if: ${{ inputs.version != '' || inputs.version_suffix != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          node --input-type=module -e "import { readFile, writeFile } from 'node:fs/promises'; const p='desktop/package.json'; const j=JSON.parse(await readFile(p,'utf8')); const exact=process.env.RELEASE_VERSION || ''; const suffix=process.env.VERSION_SUFFIX || ''; j.version = exact || (j.version.replace(/-.*/, '') + '-' + suffix); await writeFile(p, JSON.stringify(j, null, 2) + '\n');"

      - name: Build desktop app
        run: pnpm --filter desktop build

      - name: Package desktop app
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml --linux AppImage --x64 --publish never

      - name: Verify packaged update resources
        shell: bash
        run: |
          set -euo pipefail
          if ! find desktop/dist -maxdepth 1 -type f -name "*.AppImage" -print -quit | grep -q .; then
            echo "Missing Linux AppImage artifact in desktop/dist" >&2
            exit 1
          fi
          if [ ! -f desktop/dist/latest-linux.yml ]; then
            echo "Missing Linux update manifest: desktop/dist/latest-linux.yml" >&2
            exit 1
          fi

      - name: Create Linux channel update manifest
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != "stable" ]; then
            cp desktop/dist/latest-linux.yml "desktop/dist/${CHANNEL}-linux.yml"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-linux-x64
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/*-linux.yml
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
