name: Platform Cloud Run staging startup diagnosis

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main source to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-cloud-run-staging
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 55
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      STAGING_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      STAGING_IDENTITY: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE_ACCOUNT }}
      MATRIX_APP_URL: ${{ vars.PLATFORM_PUBLIC_URL }}
      POSTHOG_PUBLIC_HOST: ""
      POSTHOG_PUBLIC_API_HOST: /relay
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          path: source
          persist-credentials: false
      - name: Require the exact reviewed source and isolated staging configuration
        working-directory: source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" == 41b11f0890b28f2d62ec7614f777ae5d20e2c251 ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$GCP_PROJECT_ID" == matrix-os-1144 && "$GCP_REGION" == europe-west3 ]]
          [[ "$STAGING_SERVICE" == matrix-platform-staging ]]
          [[ "$STAGING_IDENTITY" == "matrix-platform-preview-runner@${GCP_PROJECT_ID}.iam.gserviceaccount.com" ]]
          [[ "$MATRIX_APP_URL" == https://matrix-platform-staging-515970864382.europe-west3.run.app ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Require the existing staging service and test-mode bindings
        run: |
          set -euo pipefail
          gcloud run services describe "$STAGING_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/platform-staging-before.json"
          jq -e --arg identity "$STAGING_IDENTITY" '
            .spec.template.spec as $runtime
            | $runtime.containers[0].env as $env
            | $runtime.serviceAccountName == $identity
            and any($env[]; .name == "PLATFORM_DATABASE_URL" and .valueFrom.secretKeyRef.name == "platform-database-url-staging")
            and any($env[]; .name == "STRIPE_SECRET_KEY" and .valueFrom.secretKeyRef.name == "stripe-secret-key-test")
            and any($env[]; .name == "PLATFORM_PREVIEW" and .value == "true")
            and all($env[]; .name != "HETZNER_API_TOKEN" and (.name != "PLATFORM_BACKGROUND_WORKERS_ENABLED" or .value == "false"))
          ' "$RUNNER_TEMP/platform-staging-before.json" >/dev/null
      - name: Diagnose the failed staging startup
        run: |
          set -euo pipefail
          revision=matrix-platform-staging-00008-pam
          gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='yaml(metadata.name,status.conditions)'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="matrix-platform-staging" AND resource.labels.revision_name="matrix-platform-staging-00008-pam"' \
            --project "$GCP_PROJECT_ID" --freshness=3h --limit=100 --order=asc \
            --format='value(timestamp,severity,textPayload)' |
            sed -E 's#(https?://|postgres(ql)?://)[^ ]+#[redacted URL]#g; s#(sk_(live|test)_[[:alnum:]_]+|Bearer [^ ]+|[[:alnum:]_]+:[^ @]+@)#[redacted credential]#g' |
            awk 'tolower($0) ~ /auth shell|platform|error|fatal|container|probe|exited|database|listen|warn/ { print substr($0, 1, 350) }'
          gcloud run services describe "$STAGING_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json |
            jq -c '[.status.traffic[] | {revisionName,percent,tag}]'
