name: Platform Cloud Run staging qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main source to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-cloud-run-staging
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 55
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      STAGING_SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
      STAGING_IDENTITY: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE_ACCOUNT }}
      MATRIX_APP_URL: ${{ vars.PLATFORM_PUBLIC_URL }}
      POSTHOG_PUBLIC_HOST: ""
      POSTHOG_PUBLIC_API_HOST: /relay
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          path: source
          persist-credentials: false
      - name: Require the exact reviewed source and isolated staging configuration
        working-directory: source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" == 41b11f0890b28f2d62ec7614f777ae5d20e2c251 ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$GCP_PROJECT_ID" == matrix-os-1144 && "$GCP_REGION" == europe-west3 ]]
          [[ "$STAGING_SERVICE" == matrix-platform-staging ]]
          [[ "$STAGING_IDENTITY" == "matrix-platform-preview-runner@${GCP_PROJECT_ID}.iam.gserviceaccount.com" ]]
          [[ "$MATRIX_APP_URL" == https://matrix-platform-staging-515970864382.europe-west3.run.app ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Require the existing staging service and test-mode bindings
        run: |
          set -euo pipefail
          gcloud run services describe "$STAGING_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/platform-staging-before.json"
          jq -e --arg identity "$STAGING_IDENTITY" '
            .spec.template.spec as $runtime
            | $runtime.containers[0].env as $env
            | $runtime.serviceAccountName == $identity
            and any($env[]; .name == "PLATFORM_DATABASE_URL" and .valueFrom.secretKeyRef.name == "platform-database-url-staging")
            and any($env[]; .name == "STRIPE_SECRET_KEY" and .valueFrom.secretKeyRef.name == "stripe-secret-key-test")
            and any($env[]; .name == "PLATFORM_PREVIEW" and .value == "true")
            and all($env[]; .name != "HETZNER_API_TOKEN" and (.name != "PLATFORM_BACKGROUND_WORKERS_ENABLED" or .value == "false"))
          ' "$RUNNER_TEMP/platform-staging-before.json" >/dev/null
      - name: Build platform image with a fresh cache tag
        working-directory: source
        run: |
          set -euo pipefail
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-platform:staging-${EXPECTED_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/matrix-platform:staging-buildcache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "CACHE_IMAGE=$cache_image" >> "$GITHUB_ENV"
          next_public_clerk_publishable_key="$(gcloud secrets versions access latest --secret next-public-clerk-publishable-key --project "$GCP_PROJECT_ID" 2>/dev/null || true)"
          next_public_posthog_key="$(gcloud secrets versions access latest --secret next-public-posthog-key --project "$GCP_PROJECT_ID" 2>/dev/null || true)"
          next_public_posthog_project_token="$(gcloud secrets versions access latest --secret next-public-posthog-project-token --project "$GCP_PROJECT_ID" 2>/dev/null || true)"
          if [ -z "$next_public_clerk_publishable_key" ]; then
            echo "next-public-clerk-publishable-key is required to build the auth-shell billing surface." >&2
            exit 1
          fi
          build_id=$(gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --config cloudbuild.platform.yaml \
            --substitutions "_IMAGE=$image,_CACHE_IMAGE=$cache_image,_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$next_public_clerk_publishable_key,_NEXT_PUBLIC_POSTHOG_KEY=$next_public_posthog_key,_NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=$next_public_posthog_project_token,_NEXT_PUBLIC_POSTHOG_HOST=$POSTHOG_PUBLIC_HOST,_NEXT_PUBLIC_POSTHOG_API_HOST=$POSTHOG_PUBLIC_API_HOST,_NEXT_PUBLIC_MATRIX_APP_URL=$MATRIX_APP_URL,_MATRIX_BUILD_SHA=$EXPECTED_SHA" \
            --async \
            --format 'value(metadata.build.id)' \
            --timeout=1800s)
          if [ -z "$build_id" ]; then
            build_id=$(gcloud builds list \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --filter "images:$image" \
              --sort-by '~createTime' \
              --limit 1 \
              --format 'value(id)')
          fi
          if [ -z "$build_id" ]; then
            echo "Could not resolve Cloud Build id for $image" >&2
            exit 1
          fi

          {
            echo "### Platform Cloud Run build"
            echo "- source_sha: \`${EXPECTED_SHA}\`"
            echo "- lane: \`platform\`"
            echo "- image: \`${image}\`"
            echo "- build_id: \`${build_id}\`"
            echo "- cache_image: \`${cache_image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          report_cloud_build_timings() {
            {
              echo
              echo '#### Cloud Build phase timings'
              echo '```yaml'
              if ! timeout 30s gcloud builds describe "$build_id" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --format='yaml(startTime,finishTime,timing,steps.timing,results.images)'; then
                echo 'Could not read Cloud Build phase timings.'
              fi
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }

          print_cloud_build_diagnostics() {
            echo "::group::Cloud Build diagnostics ($build_id)"
            if ! timeout 30s gcloud builds describe "$build_id" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='yaml(status,statusDetail,failureInfo,logUrl)'; then
              echo "Could not read Cloud Build failure metadata." >&2
            fi
            report_cloud_build_timings
            if ! timeout 60s gcloud builds log "$build_id" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION"; then
              echo "Could not read Cloud Build logs; use the build URL above." >&2
            fi
            echo "::endgroup::"
          }

          poll_deadline=$((SECONDS + 35 * 60))
          status=''
          while (( (remaining = poll_deadline - SECONDS) > 0 )); do
            if status=$(timeout "${remaining}s" gcloud builds describe "$build_id" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(status)'); then
              :
            else
              poll_exit=$?
              if [ "$poll_exit" -eq 124 ]; then
                break
              fi
              echo "Could not read Cloud Build status for $build_id (exit $poll_exit)." >&2
              print_cloud_build_diagnostics
              exit 1
            fi
            case "$status" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build $build_id ended with status $status" >&2
                print_cloud_build_diagnostics
                exit 1
                ;;
            esac
            remaining=$((poll_deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep "$((remaining < 5 ? remaining : 5))"
            fi
          done
          if [ "$status" != "SUCCESS" ]; then
            echo "Timed out waiting for Cloud Build $build_id" >&2
            print_cloud_build_diagnostics
            exit 1
          fi
          report_cloud_build_timings
          digest="$(gcloud artifacts docker images describe "$image" \
            --project "$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the immutable platform image digest." >&2
            exit 1
          fi
          image_digest="${image%:*}@${digest}"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          echo "- image_digest: \`${image_digest}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy an immutable image as a zero-traffic staging candidate
        run: |
          set -euo pipefail
          tag="qualify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run deploy "$STAGING_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE_DIGEST" --update-labels "matrix-source-sha=$EXPECTED_SHA" \
            --tag "$tag" --no-traffic --quiet
          gcloud run services describe "$STAGING_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/platform-staging-after.json"
          serving_revisions() {
            jq -cS '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName, percent}] | sort_by(.revisionName)' "$1"
          }
          test "$(serving_revisions "$RUNNER_TEMP/platform-staging-before.json")" = \
            "$(serving_revisions "$RUNNER_TEMP/platform-staging-after.json")"
          candidate="$(jq -er --arg tag "$tag" '.status.traffic[] | select(.tag == $tag and (.percent // 0) == 0) | .url' \
            "$RUNNER_TEMP/platform-staging-after.json")"
          revision="$(jq -er --arg tag "$tag" '.status.traffic[] | select(.tag == $tag and (.percent // 0) == 0) | .revisionName' \
            "$RUNNER_TEMP/platform-staging-after.json")"
          gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json |
            jq -e --arg image "$IMAGE_DIGEST" --arg sha "$EXPECTED_SHA" '
              .spec.containers[0].image == $image and .metadata.labels["matrix-source-sha"] == $sha
            ' >/dev/null
          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 10 "$candidate/health")"
          echo "$health" | jq -e '.status == "ok"' >/dev/null
          {
            echo "- staging_revision: $revision"
            echo "- immutable_image: $IMAGE_DIGEST"
            echo "- candidate_health: HTTP 200, status ok"
            echo "- promotion: disabled, serving traffic verified unchanged"
          } | tee -a "$GITHUB_STEP_SUMMARY"
