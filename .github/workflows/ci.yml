        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: ${{ needs.changes.outputs.cache_write == 'true' && 'pnpm' || '' }}

      - name: Configure git for tests
        if: needs.changes.outputs.should_run == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@matrix-os.com"

      - name: Install ripgrep for pattern scanner tests
        if: needs.changes.outputs.should_run == 'true'
        run: sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Check controller regressions before the full suite
        if: matrix.shard == 4 && needs.changes.outputs.should_run == 'true'
        timeout-minutes: 3
        env:
          UNIT_SOURCE_SHA: ${{ needs.changes.outputs.source_sha || github.sha }}
        run: |
