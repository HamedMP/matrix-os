  e2e:
    name: E2E Tests (${{ matrix.lane }})
    needs: changes
    # PRs confined to CI tooling, mobile, distro or non-E2E tests skip E2E; main always runs it.
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true' && needs.changes.outputs.e2e_tests != 'false'
    runs-on: ubuntu-latest
    # Normal runs take 5-8 minutes; a Playwright package cache miss on a slow Ubuntu mirror adds ~10.
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        lane: [general, electron]
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping e2e tests."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'
        with:
          bun-version: "1.4.3"

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for tests
        if: needs.changes.outputs.should_run == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@matrix-os.com"

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Build test prerequisites once
        run: bun run test:prepare

      - name: Restore Playwright browser revisions
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for terminal presentation regression
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @matrix-os/mcp-browser exec playwright install chromium

      - name: Install Chromium for shell-scoped Settings regressions
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter shell exec playwright install chromium

      # ubuntu-latest already ships the shared libraries Chromium and Electron need, so E2E skips
      # Playwright's apt dependency install, which pulled ~17 MB of CJK/Thai fonts and took up to
      # 11 minutes on a slow Ubuntu mirror. Fail fast with the missing library if an image drops one.
      - name: Check browser shared libraries
        if: needs.changes.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          binaries=(~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome
            ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell
            desktop/node_modules/electron/dist/electron)
          [ "${#binaries[@]}" -gt 0 ] || { echo "No browser binaries found" >&2; exit 1; }
          missing=0 checked=0
          for binary in "${binaries[@]}"; do
            [ -x "$binary" ] || continue
            checked=$((checked + 1))
            if ldd "$binary" | grep 'not found'; then echo "::error::$binary has missing shared libraries"; missing=1; fi
          done
          echo "Checked $checked browser binaries; no shared library is missing."
          exit "$missing"

      # The Chat title regression renders a Simplified Chinese title; without a CJK font it draws
      # empty boxes and measures different glyph widths. One 1.6 MB font, no dependencies.
      - name: Install the CJK font the Chat title regression renders
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-microhei; }

      - name: Save Playwright browser revisions
        if: needs.changes.outputs.should_run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run E2E tests
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'general'
        run: bun run test:e2e:run

      - name: Run native Electron terminal presentation regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_GRID_ELECTRON: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/terminal-soft-grid.e2e.test.ts --maxWorkers=1

      - name: Upload terminal presentation evidence
        if: always() && needs.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-soft-resize-evidence-${{ matrix.lane }}
          path: output/playwright/terminal-soft-resize
          if-no-files-found: ignore

      - name: Build Desktop for Electron E2E
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          DESKTOP_SOURCE_SHA: ${{ needs.changes.outputs.source_sha || github.sha }}
        run: GITHUB_SHA="$DESKTOP_SOURCE_SHA" bun run build:desktop

      - name: Run required Desktop file download regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/file-download.e2e.test.ts

      - name: Run required Desktop Chat input regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/canonical-input.e2e.test.ts

      - name: Upload Desktop Chat input evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-chat-input-evidence
          path: output/playwright/om-239/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required Electron Desktop provider Settings regressions
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
          MATRIX_PROVIDER_AUTH_ELECTRON: "1"
          MATRIX_SETTINGS_EVIDENCE_DIR: output/playwright/settings-providers
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/provider-authorization-electron.e2e.test.ts tests/e2e/desktop/provider-auth-terminal.e2e.test.ts tests/e2e/desktop/agents-providers-figma.e2e.test.ts tests/e2e/desktop/agents-providers-button-contrast.e2e.test.ts tests/e2e/desktop/provider-settings-idle.e2e.test.ts

      - name: Upload Desktop provider auth evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-provider-auth-evidence
          path: output/playwright/settings-providers/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required MAT-335 Desktop regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/project-folder-picker-layout.e2e.test.ts

      - name: Run required Desktop project deletion regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/project-deletion.e2e.test.ts

      - name: Run required Desktop terminal clipboard regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/terminal-clipboard.e2e.test.ts

      - name: Run required Desktop terminal file attachment regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/terminal-file-drop.e2e.test.ts

      - name: Run required Desktop terminal snapshot regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/terminal-snapshot.e2e.test.ts

      - name: Upload Desktop terminal snapshot evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-terminal-snapshot-evidence
          path: output/playwright/terminal-snapshot/restored.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required Desktop release alignment regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/release-alignment.e2e.test.ts

      - name: Run required Desktop Chat title regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/chat-title-layout.e2e.test.ts

      - name: Upload Desktop Chat title evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-chat-title-evidence
          path: output/mat524/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Desktop release alignment evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-alignment-evidence
          path: output/playwright/release-alignment/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.lane }}
          path: tests/e2e/
          retention-days: 7

  funded-host-root:
    name: Protected Funded Host Root Contracts
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Execute isolated root fixtures without skipped cases
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != x86_64 ]]; then exit 1; fi
          container_name="funded-host-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          image="public.ecr.aws/docker/library/node:24-bookworm"
          if ! timeout --kill-after=10s 120s docker pull "$image"; then
            image="docker.io/library/node:24-bookworm"
            timeout --kill-after=10s 120s docker pull "$image"
          fi
          timeout --kill-after=10s 180s docker run --rm --init \
            --name "$container_name" --network none --cpus 2 --memory 2g --pids-limit 256 \
            --env MATRIX_DISPOSABLE_ROOT_TEST=true \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            "$image" python3 -I /work/scripts/ci/run-funded-host-root-tests.py
          # A fresh container is required: the generated-command fixture owns /opt/matrix.
          timeout --kill-after=10s 180s docker run --rm --init \
            --name "$container_name" --network none --cpus 2 --memory 2g --pids-limit 256 \
            --env MATRIX_FUNDED_REPAIR_DISPOSABLE_TEST=1 \
            --env MATRIX_FUNDED_REPAIR_EXPECT_ARCH=x64 \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            "$image" node /work/tests/deploy/customer-vps/funded-config-linux.mjs

  ci-results:
    # The only required check. Drafts rename it so GitHub never treats a draft suite as passing.
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == true) && 'CI Draft (ignored)' || 'CI Results' }}
    needs: [changes, typecheck, shell-production-build, patterns, react-doctor, sync-client, agent-sdk-compatibility, unit, funded-postgres, collaboration-postgres, funded-host-root, docs-contract, os-view-parity, e2e]
    if: always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize required CI jobs
        env:
          CI_TRIGGER_REQUESTED: ${{ needs.changes.outputs.trigger_requested }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SHELL_PRODUCTION_BUILD_RESULT: ${{ needs.shell-production-build.result }}
          PATTERNS_RESULT: ${{ needs.patterns.result }}
          REACT_DOCTOR_RESULT: ${{ needs.react-doctor.result }}
          SYNC_CLIENT_RESULT: ${{ needs.sync-client.result }}
          AGENT_SDK_COMPATIBILITY_RESULT: ${{ needs.agent-sdk-compatibility.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FUNDED_POSTGRES_RESULT: ${{ needs.funded-postgres.result }}
          COLLABORATION_POSTGRES_RESULT: ${{ needs.collaboration-postgres.result }}
          FUNDED_HOST_ROOT_RESULT: ${{ needs.funded-host-root.result }}
          DOCS_CONTRACT_RESULT: ${{ needs.docs-contract.result }}
          OS_VIEW_PARITY_RESULT: ${{ needs.os-view-parity.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail

          {
            echo "### CI Results"
            echo
            echo "Branch protection should require this aggregate job, not each internal shard."
            echo
            echo "CI trigger requested: ${CI_TRIGGER_REQUESTED:-unknown}"
            echo "CI relevant source changes: ${SHOULD_RUN:-unknown}"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Detect CI-relevant changes | $CHANGES_RESULT |"
            echo "| Type Check | $TYPECHECK_RESULT |"
            echo "| Shell Production Build | $SHELL_PRODUCTION_BUILD_RESULT |"
            echo "| Pattern Scan | $PATTERNS_RESULT |"
            echo "| React Doctor | $REACT_DOCTOR_RESULT |"
            echo "| Sync Client Package (Node 20) | $SYNC_CLIENT_RESULT |"
            echo "| Agent SDK 0.3.251 Compatibility | $AGENT_SDK_COMPATIBILITY_RESULT |"
            echo "| Unit Tests | $UNIT_RESULT |"
            echo "| Funded Settlement PostgreSQL | $FUNDED_POSTGRES_RESULT |"
            echo "| Collaboration PostgreSQL | $COLLABORATION_POSTGRES_RESULT |"
            echo "| Protected Funded Host Root Contracts | $FUNDED_HOST_ROOT_RESULT |"
            echo "| Docs Contract Tests | $DOCS_CONTRACT_RESULT |"
            echo "| OS View Parity | $OS_VIEW_PARITY_RESULT |"
            echo "| E2E Tests | $E2E_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CI_TRIGGER_REQUESTED" != "true" ]; then
            echo "Full CI was not requested for this commit. Mark the PR ready for review (not a draft) to run CI." >&2
            exit 1
          fi

          failed=false
          for result in "$CHANGES_RESULT" "$TYPECHECK_RESULT" "$SHELL_PRODUCTION_BUILD_RESULT" "$PATTERNS_RESULT" "$REACT_DOCTOR_RESULT" "$SYNC_CLIENT_RESULT" "$AGENT_SDK_COMPATIBILITY_RESULT" "$UNIT_RESULT" "$FUNDED_POSTGRES_RESULT" "$COLLABORATION_POSTGRES_RESULT" "$FUNDED_HOST_ROOT_RESULT" "$DOCS_CONTRACT_RESULT" "$OS_VIEW_PARITY_RESULT" "$E2E_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) failed=true ;;
            esac
          done

          # These lanes never skip for a source change, so a skip means it did not run.
          if [ "${SHOULD_RUN:-false}" = "true" ]; then
            for result in "$FUNDED_POSTGRES_RESULT" "$COLLABORATION_POSTGRES_RESULT" "$FUNDED_HOST_ROOT_RESULT" "$UNIT_RESULT"; do
              [ "$result" = "success" ] || failed=true
            done
          fi

          if [ "$failed" = "true" ]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
