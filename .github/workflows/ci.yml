name: CI
run-name: >-
  ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null) && format('CI metadata-v1 · {0}', github.sha) || inputs.pr_number && format('CI refresh-v1 pr={0} head={1} base={2} merge={3}', inputs.pr_number, inputs.head_sha, inputs.base_sha, inputs.source_sha) || format('CI coverage-v1 · {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Trusted same-head stack refresh PR (blank runs ordinary manual CI)
        type: string
      head_sha:
        description: Exact PR head for refresh
        type: string
      base_sha:
        description: Exact parent head for refresh
        type: string
      source_sha:
        description: Exact two-parent merge for refresh
        type: string
  merge_group:
  push:
    branches: [main]
  pull_request:
    types: [labeled, ready_for_review, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ready-for-ci' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && github.run_id || 'shared' }}
  queue: max

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source_sha: ${{ steps.refresh.outputs.sourceSha || github.sha }}
      snapshot: ${{ steps.refresh.outputs.snapshot }}
      base_sha: ${{ steps.changed.outputs.base_sha }}
      bootstrap: ${{ steps.changed.outputs.bootstrap }}
      trigger_requested: ${{ steps.changed.outputs.trigger_requested }}
      should_run: ${{ steps.changed.outputs.should_run }}
      docs_contract_tests: ${{ steps.changed.outputs.docs_contract_tests }}
      os_view_parity_tests: ${{ steps.changed.outputs.os_view_parity_tests }}
      dedicated_eligible: ${{ steps.route.outputs.eligible }}
      dedicated_required: ${{ steps.route.outputs.required }}
    steps:
      - name: Checkout trusted main refresh helpers
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Resolve trusted exact-source refresh
        id: refresh
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {resolveRequestingSource}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-refresh.mjs')).href);
            const source=await resolveRequestingSource(github,context.repo,
              {sha:context.sha,ref:context.ref,workflowRef:process.env.CI_WORKFLOW_REF},context.payload.inputs);
            core.setOutput('snapshot',JSON.stringify(source));core.setOutput('sourceSha',source.sourceSha);
      - name: Checkout with bounded retry
        env:
          CHECKOUT_BACKOFF_SECONDS: "5"
          CHECKOUT_MAX_ATTEMPTS: "3"
          CHECKOUT_TIMEOUT_SECONDS: "30"
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.refresh.outputs.sourceSha || github.sha }}
        run: |
          set -euo pipefail

          SOURCE_SHA="${SOURCE_SHA:-$GITHUB_SHA}"
          rm -rf .git
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config --local gc.auto 0
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          for attempt in $(seq 1 "$CHECKOUT_MAX_ATTEMPTS"); do
            echo "Checkout fetch attempt $attempt/$CHECKOUT_MAX_ATTEMPTS"
            if timeout --foreground --kill-after=5s "${CHECKOUT_TIMEOUT_SECONDS}s" \
              git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
                fetch --no-tags --prune --no-recurse-submodules \
                origin "$SOURCE_SHA" \
              && git checkout --force --detach "$SOURCE_SHA"; then
              echo "Checkout fetch succeeded on attempt $attempt/$CHECKOUT_MAX_ATTEMPTS"
              exit 0
            fi

            rm -f .git/index.lock .git/shallow.lock
            if [ "$attempt" -eq "$CHECKOUT_MAX_ATTEMPTS" ]; then
              echo "::error::Checkout fetch failed after $CHECKOUT_MAX_ATTEMPTS attempts"
              exit 1
            fi

            backoff_seconds=$((CHECKOUT_BACKOFF_SECONDS * attempt))
            echo "Checkout fetch attempt $attempt failed; retrying in ${backoff_seconds}s"
            sleep "$backoff_seconds"
          done

      - name: Detect source changes
        id: changed
        env:
          PR_ACTION: ${{ github.event.action || '' }}
          PR_BASE_EDIT: ${{ github.event.action == 'edited' && github.event.changes.base != null }}
          PR_HAS_READY_FOR_CI: ${{ contains(github.event.pull_request.labels.*.name, 'ready-for-ci') }}
          PR_LABEL_NAME: ${{ github.event.label.name || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/dedicated-changes.mjs

      - name: Select guarded Linux delegation
        id: route
        env:
          MATRIX_CI_DEDICATED_ENABLED: ${{ vars.MATRIX_CI_DEDICATED_ENABLED }}
          MATRIX_CI_DEDICATED_SHADOW: ${{ vars.MATRIX_CI_DEDICATED_SHADOW }}
          SHOULD_RUN: ${{ steps.changed.outputs.should_run }}
          REFRESH_SNAPSHOT: ${{ steps.refresh.outputs.snapshot }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const {selectDedicatedRoute}=await import('./scripts/ci/dedicated-admission.mjs');
          const refresh=process.env.REFRESH_SNAPSHOT?JSON.parse(process.env.REFRESH_SNAPSHOT):null;
          if(refresh){appendFileSync(process.env.GITHUB_OUTPUT,`eligible=${process.env.MATRIX_CI_DEDICATED_ENABLED==='true'}\nrequired=true\n`);process.exit(0);}
          const eligible=selectDedicatedRoute({repository:process.env.GITHUB_REPOSITORY,
            eventName:process.env.GITHUB_EVENT_NAME, enabled:process.env.MATRIX_CI_DEDICATED_ENABLED,
            shouldRun:process.env.SHOULD_RUN, pull:event.pull_request});
          const required=selectDedicatedRoute({repository:process.env.GITHUB_REPOSITORY,
            eventName:process.env.GITHUB_EVENT_NAME, enabled:(process.env.MATRIX_CI_DEDICATED_ENABLED==='true'||process.env.MATRIX_CI_DEDICATED_SHADOW==='true')?'true':'false',
            shouldRun:process.env.SHOULD_RUN,pull:event.pull_request});
          appendFileSync(process.env.GITHUB_OUTPUT,`eligible=${eligible}\nrequired=${required}\n`);
          NODE

  # Independent validation jobs share only the change-classification dependency.
  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping typecheck."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Type check all packages
        if: needs.changes.outputs.should_run == 'true'
        run: bun run typecheck

  shell-production-build:
    name: Shell Production Build
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping shell production build."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Cache Next incremental compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: shell/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build shell production bundle
        if: needs.changes.outputs.should_run == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktc2FmZS5leGFtcGxlLmNvbSQ=
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_shell_build
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_shell_build
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.posthog.com
          NEXT_PUBLIC_POSTHOG_API_HOST: /relay
        run: bun run build:shell:production

  patterns:
    name: Pattern Scan
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping pattern scan."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          fetch-depth: 0

      - name: Install ripgrep
        if: needs.changes.outputs.should_run == 'true'
        run: sudo apt-get install -y ripgrep

      - name: Run CLAUDE.md pattern scanner on changed files
        if: needs.changes.outputs.should_run == 'true'
        env:
          COVERAGE_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          COVERAGE_BOOTSTRAP: ${{ needs.changes.outputs.bootstrap }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/review/check-patterns.sh --diff origin/${{ github.base_ref }}
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BEFORE="$COVERAGE_BASE_SHA"
            if [ -z "$BEFORE" ]; then
              echo "Main CI coverage base is missing" >&2
              exit 1
            fi
            if [ "$COVERAGE_BOOTSTRAP" = "true" ]; then
              ./scripts/review/check-patterns.sh
            else
              ./scripts/review/check-patterns.sh --diff "$BEFORE"
            fi
          else
            # On push: only scan files changed in this push range.
            # github.event.before is the pre-push tip; on force-push or first
            # push it may be 000... — fall back to HEAD^ in that case.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD^"
            fi
            if ! git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
              BEFORE="HEAD^"
            fi
            ./scripts/review/check-patterns.sh --diff "$BEFORE"
          fi

  react-doctor:
    name: React Doctor
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Include observed 5m15s checkout, audit and cleanup/transfer variance.
    timeout-minutes: 10
    # Non-blocking during the React audit rollout. Remove once the
    # React audit baseline is clean, then it gates merges. https://github.com/millionco/react-doctor
    continue-on-error: true
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping React audit."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24

      - name: Audit React code (project dirs with changed .tsx/.jsx)
        if: needs.changes.outputs.should_run == 'true'
        env:
          COVERAGE_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BEFORE="$COVERAGE_BASE_SHA"
            if [ -z "$BEFORE" ]; then
              echo "Main CI coverage base is missing" >&2
              exit 1
            fi
            base="$BEFORE"
          else
            base="HEAD^"
            git rev-parse --verify "$base" >/dev/null 2>&1 || base="HEAD"
          fi
          mapfile -t react_files < <(git diff --name-only "$base" "$HEAD_SHA" | grep -E '\.(tsx|jsx)$' || true)
          if [ "${#react_files[@]}" -eq 0 ]; then
            echo "No changed React files; skipping react-doctor."
            exit 0
          fi
          # react-doctor scans a project DIRECTORY (needs a React package.json), not files.
          # Map changed React files to their owning project dir and audit each unique one.
          declare -A dirs=()
          for f in "${react_files[@]}"; do
            case "$f" in
              shell/*) dirs["shell"]=1 ;;
              packages/ui/*) dirs["packages/ui"]=1 ;;
              # home/apps/** are mostly root-toolchain (no package.json); audited pre-commit, skipped here.
            esac
          done
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "Changed React files are not in an audited project dir; skipping."
            exit 0
          fi
          for d in "${!dirs[@]}"; do
            echo "::group::react-doctor $d"
            npx --yes react-doctor@latest "$d" || echo "react-doctor reported findings in $d"
            echo "::endgroup::"
          done

  sync-client:
    name: Sync Client Package
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping sync-client checks."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Build sync client
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @finnaai/matrix build

      - name: Test sync client
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @finnaai/matrix test

      - name: Verify publish shape
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @finnaai/matrix exec node ./scripts/check-publish.mjs

  # Tests run alongside mechanical checks; CI Results collects every result.
  agent-sdk-compatibility:
    name: Agent SDK 0.3.251 Compatibility
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping Agent SDK compatibility."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Install exact Agent SDK
        if: needs.changes.outputs.should_run == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/matrix-agent-sdk-03251"
          pnpm add --ignore-scripts --save-exact --dir "${{ runner.temp }}/matrix-agent-sdk-03251" @anthropic-ai/claude-agent-sdk@0.3.251

      - name: Run real Agent SDK compatibility spike
        if: needs.changes.outputs.should_run == 'true'
        env:
          MATRIX_AGENT_SDK_PACKAGE_DIR: ${{ runner.temp }}/matrix-agent-sdk-03251/node_modules/@anthropic-ai/claude-agent-sdk
        run: pnpm exec vitest run tests/scripts/agent-sdk-real-runtime-spike.test.ts

  unit:
    name: Unit Tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    # Shard 4 has outgrown the previous ceilings: run 35911423904 hit 20 minutes,
    # and main run 37587908679 hit 30 minutes without a failing assertion. Keep a
    # bounded 40-minute window for runner variance and cleanup; split the shards if
    # normal runs approach this ceiling too.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping unit shard."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for tests
        if: needs.changes.outputs.should_run == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@matrix-os.com"

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - run: bun run test -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json=output/ci/unit-${{ matrix.shard }}.json
        if: needs.changes.outputs.should_run == 'true'

      - name: Upload unit profiling
        if: always() && needs.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-profile-${{ matrix.shard }}
          path: output/ci/unit-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  funded-postgres:
    name: Funded Settlement PostgreSQL
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: matrix_test
          POSTGRES_PASSWORD: matrix_test
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix_test -d matrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service only; never use owner or production database secrets.
      MATRIX_TEST_POSTGRES_URL: postgresql://matrix_test:matrix_test@127.0.0.1:5432/matrix_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build test prerequisites once
        run: bun run test:prepare
      - name: Verify funded settlement on PostgreSQL
        run: |
          set -euo pipefail
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/ai-funded-usage-postgres.test.ts tests/platform/ai-funded-recovery-migration.test.ts tests/platform/ai-funded-usage-waiver.test.ts tests/platform/ai-funded-usage-waiver-cli.test.ts tests/platform/ai-funded-usage-waiver-locks-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Account deletion PostgreSQL races
        if: needs.changes.outputs.should_run == 'true'
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/account-deletion-*-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Bot creation, Integration grant and source admission races
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/gateway/bots/integration-grant-source-postgres.test.ts tests/gateway/bots/instantiation.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Preview Drive revocation and admission races
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/preview-drive-postgres-concurrency.test.ts --maxWorkers=1 --no-file-parallelism

  docs-contract:
    name: Docs Contract Tests
    needs: changes
    if: needs.changes.outputs.docs_contract_tests == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip docs contract tests
        if: needs.changes.outputs.docs_contract_tests != 'true'
        run: echo "No docs-only changes detected; skipping docs contract tests."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.docs_contract_tests == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.docs_contract_tests == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.docs_contract_tests == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.docs_contract_tests == 'true'

      - name: Run docs contract tests
        if: needs.changes.outputs.docs_contract_tests == 'true'
        run: pnpm exec vitest run tests/repository/site-extraction.test.ts

  os-view-parity:
    name: OS View Parity
    needs: changes
    if: needs.changes.outputs.os_view_parity_tests == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Skip OS-view parity tests
        if: needs.changes.outputs.os_view_parity_tests != 'true'
        run: echo "No shared OS-view surface changes detected; skipping parity tests."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.os_view_parity_tests == 'true'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.changes.outputs.os_view_parity_tests == 'true'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.os_view_parity_tests == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.os_view_parity_tests == 'true'

      - name: Run shared OS-view parity contract
        if: needs.changes.outputs.os_view_parity_tests == 'true'
        run: |
          pnpm exec vitest run \
            tests/contracts/os-view.test.ts \
            tests/shell/desktop-mode-parity.test.ts \
            tests/shell/desktop-launcher-mode.test.tsx \
            tests/shell/web-desktop-surface.test.tsx \
            tests/shell/os-view-state-client.test.ts \
            tests/desktop/app-launcher.test.tsx \
            tests/desktop/native-desktop-shell.test.tsx \
            tests/desktop/os-view-state-client.test.ts \
            tests/desktop/native-os-view-persistence.test.ts \
            tests/gateway/os-view-state-repository.test.ts

  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_eligible != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [general, electron]
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping e2e tests."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for tests
        if: needs.changes.outputs.should_run == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@matrix-os.com"

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Build test prerequisites once
        run: bun run test:prepare

      - name: Cache Playwright browser revisions
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for terminal presentation regression
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @matrix-os/mcp-browser exec playwright install --with-deps chromium

      - name: Install Chromium for shell-scoped Settings regressions
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter shell exec playwright install --with-deps chromium

      - name: Run E2E tests
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'general'
        run: bun run test:e2e:run

      - name: Run native Electron terminal presentation regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_GRID_ELECTRON: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/terminal-soft-grid.e2e.test.ts --maxWorkers=1

      - name: Upload terminal presentation evidence
        if: always() && needs.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-soft-resize-evidence-${{ matrix.lane }}
          path: output/playwright/terminal-soft-resize
          if-no-files-found: ignore

      - name: Build Desktop for Electron E2E
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        run: bun run build:desktop

      - name: Run required Desktop file download regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/file-download.e2e.test.ts

      - name: Run required Desktop Chat input regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/canonical-input.e2e.test.ts

      - name: Upload Desktop Chat input evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-chat-input-evidence
          path: output/playwright/om-239/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required Electron Desktop provider Settings regressions
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
          MATRIX_PROVIDER_AUTH_ELECTRON: "1"
          MATRIX_SETTINGS_EVIDENCE_DIR: output/playwright/settings-providers
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/provider-authorization-electron.e2e.test.ts tests/e2e/desktop/provider-auth-terminal.e2e.test.ts tests/e2e/desktop/agents-providers-figma.e2e.test.ts tests/e2e/desktop/agents-providers-button-contrast.e2e.test.ts tests/e2e/desktop/provider-settings-idle.e2e.test.ts

      - name: Upload Desktop provider auth evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-provider-auth-evidence
          path: output/playwright/settings-providers/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required MAT-335 Desktop regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/project-folder-picker-layout.e2e.test.ts

      - name: Run required Desktop terminal clipboard regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/terminal-clipboard.e2e.test.ts

      - name: Run required Desktop terminal file attachment regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/terminal-file-drop.e2e.test.ts

      - name: Run required Desktop terminal snapshot regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/terminal-snapshot.e2e.test.ts

      - name: Upload Desktop terminal snapshot evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-terminal-snapshot-evidence
          path: output/playwright/terminal-snapshot/restored.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required Desktop release alignment regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/release-alignment.e2e.test.ts

      - name: Run required Desktop Chat title regression
        if: needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        env:
          MATRIX_DESKTOP_E2E_REQUIRED: "1"
        run: xvfb-run --auto-servernum bun run test:e2e:run -- tests/e2e/desktop/chat-title-layout.e2e.test.ts

      - name: Upload Desktop Chat title evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-chat-title-evidence
          path: output/mat524/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Desktop release alignment evidence
        if: always() && needs.changes.outputs.should_run == 'true' && matrix.lane == 'electron'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-alignment-evidence
          path: output/playwright/release-alignment/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.lane }}
          path: tests/e2e/
          retention-days: 7

  funded-host-root:
    name: Protected Funded Host Root Contracts
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Execute isolated root fixtures without skipped cases
        run: |
          set -euo pipefail
          container_name="funded-host-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          image="public.ecr.aws/docker/library/node:24-bookworm"
          if ! timeout --kill-after=10s 120s docker pull "$image"; then
            image="docker.io/library/node:24-bookworm"
            timeout --kill-after=10s 120s docker pull "$image"
          fi
          timeout --kill-after=10s 180s docker run --rm --init \
            --name "$container_name" --network none --cpus 2 --memory 2g --pids-limit 256 \
            --env MATRIX_DISPOSABLE_ROOT_TEST=true \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            "$image" python3 -I /work/scripts/ci/run-funded-host-root-tests.py

  dedicated-linux:
    name: Verified Dedicated Linux Qualification
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact merge revision Linux outcome
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REFRESH_SNAPSHOT: ${{ needs.changes.outputs.snapshot }}
          REQUESTING_ATTEMPT: ${{ github.run_attempt }}
          MODE: ${{ vars.MATRIX_CI_DEDICATED_ENABLED == 'true' && 'delegated' || 'shadow' }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {waitForDedicatedResult}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-result.mjs')).href);
            const snapshot=process.env.REFRESH_SNAPSHOT?JSON.parse(process.env.REFRESH_SNAPSHOT):null;
            const pull=context.payload.pull_request;
            const result=await waitForDedicatedResult(github,{
              ...context.repo, sourceSha: snapshot?.sourceSha || context.sha, requestingRunId:context.runId,
              requestingRunAttempt:Number(process.env.REQUESTING_ATTEMPT),mode:process.env.MODE,
              imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,
              headSha: snapshot?.headSha || pull.head.sha,
              headRef: snapshot?.headRef || pull.head.ref,
              baseSha: snapshot?.baseSha || pull.base.sha,
              baseRef: snapshot?.baseRef || pull.base.ref,
              prNumber: snapshot?.prNumber || pull.number, serverUrl: context.serverUrl
            },{metrics:values=>core.info('Requester API polling: '+JSON.stringify(values))});
            core.info(`Verified Linux qualification for ${result.sourceSha}; controller run ${result.runId}`);

  ci-results:
    # Metadata events must neither replace a real failed gate with skipped success
    # nor supersede a requesting source run. Their run-name is distinct above.
    name: ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null) && 'CI Metadata (ignored)' || 'CI Results' }}
    needs: [changes, typecheck, shell-production-build, patterns, react-doctor, sync-client, agent-sdk-compatibility, unit, funded-postgres, funded-host-root, docs-contract, os-view-parity, e2e, dedicated-linux]
    if: always() && !(github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize required CI jobs
        env:
          CI_TRIGGER_REQUESTED: ${{ needs.changes.outputs.trigger_requested }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          DEDICATED_ELIGIBLE: ${{ needs.changes.outputs.dedicated_eligible }}
          DEDICATED_REQUIRED: ${{ needs.changes.outputs.dedicated_required }}
          DEDICATED_LINUX_RESULT: ${{ needs.dedicated-linux.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SHELL_PRODUCTION_BUILD_RESULT: ${{ needs.shell-production-build.result }}
          PATTERNS_RESULT: ${{ needs.patterns.result }}
          REACT_DOCTOR_RESULT: ${{ needs.react-doctor.result }}
          SYNC_CLIENT_RESULT: ${{ needs.sync-client.result }}
          AGENT_SDK_COMPATIBILITY_RESULT: ${{ needs.agent-sdk-compatibility.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FUNDED_POSTGRES_RESULT: ${{ needs.funded-postgres.result }}
          FUNDED_HOST_ROOT_RESULT: ${{ needs.funded-host-root.result }}
          DOCS_CONTRACT_RESULT: ${{ needs.docs-contract.result }}
          OS_VIEW_PARITY_RESULT: ${{ needs.os-view-parity.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          DEDICATED_ELIGIBLE=${DEDICATED_ELIGIBLE:-false}
          DEDICATED_REQUIRED=${DEDICATED_REQUIRED:-$DEDICATED_ELIGIBLE}
          DEDICATED_LINUX_RESULT=${DEDICATED_LINUX_RESULT:-skipped}

          {
            echo "### CI Results"
            echo
            echo "Branch protection should require this aggregate job, not each internal shard."
            echo
            echo "CI trigger requested: ${CI_TRIGGER_REQUESTED:-unknown}"
            echo "CI relevant source changes: ${SHOULD_RUN:-unknown}"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Detect CI-relevant changes | $CHANGES_RESULT |"
            echo "| Type Check | $TYPECHECK_RESULT |"
            echo "| Shell Production Build | $SHELL_PRODUCTION_BUILD_RESULT |"
            echo "| Pattern Scan | $PATTERNS_RESULT |"
            echo "| React Doctor | $REACT_DOCTOR_RESULT |"
            echo "| Sync Client Package (Node 20) | $SYNC_CLIENT_RESULT |"
            echo "| Agent SDK 0.3.251 Compatibility | $AGENT_SDK_COMPATIBILITY_RESULT |"
            echo "| Unit Tests | $UNIT_RESULT |"
            echo "| Funded Settlement PostgreSQL | $FUNDED_POSTGRES_RESULT |"
            echo "| Protected Funded Host Root Contracts | $FUNDED_HOST_ROOT_RESULT |"
            echo "| Docs Contract Tests | $DOCS_CONTRACT_RESULT |"
            echo "| OS View Parity | $OS_VIEW_PARITY_RESULT |"
            echo "| E2E Tests | $E2E_RESULT |"
            echo "| Verified Dedicated Linux Qualification | $DEDICATED_LINUX_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CI_TRIGGER_REQUESTED" != "true" ]; then
            echo "Full CI was not requested for this commit. Apply the ready-for-ci label before review." >&2
            exit 1
          fi

          failed=false
          for result in "$CHANGES_RESULT" "$TYPECHECK_RESULT" "$SHELL_PRODUCTION_BUILD_RESULT" "$PATTERNS_RESULT" "$REACT_DOCTOR_RESULT" "$SYNC_CLIENT_RESULT" "$AGENT_SDK_COMPATIBILITY_RESULT" "$UNIT_RESULT" "$FUNDED_POSTGRES_RESULT" "$FUNDED_HOST_ROOT_RESULT" "$DOCS_CONTRACT_RESULT" "$OS_VIEW_PARITY_RESULT" "$E2E_RESULT" "$DEDICATED_LINUX_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                failed=true
                ;;
            esac
          done

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$FUNDED_POSTGRES_RESULT" != "success" ]; then
            failed=true
          fi

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$FUNDED_HOST_ROOT_RESULT" != "success" ]; then
            failed=true
          fi

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$DEDICATED_REQUIRED" = "true" ] && [ "$DEDICATED_LINUX_RESULT" != "success" ]; then
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
