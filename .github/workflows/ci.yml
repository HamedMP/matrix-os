name: CI
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && inputs.pr_number && github.ref == 'refs/heads/main' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true') && format('CI routing-v1 pr={0} head={1} base={2} merge={3}', inputs.pr_number, inputs.head_sha, inputs.base_sha, inputs.source_sha) || ((github.event_name == 'pull_request' && (github.event.pull_request.draft == true || (github.event.action == 'edited' && github.event.changes.base == null))) && format('CI metadata-v1 · {0}', github.sha) || inputs.pr_number && (inputs.execution_mode == 'hosted-only' && format('CI hosted-refresh-v1 pr={0} head={1} base={2} merge={3}', inputs.pr_number, inputs.head_sha, inputs.base_sha, inputs.source_sha) || format('CI refresh-v1 pr={0} head={1} base={2} merge={3}', inputs.pr_number, inputs.head_sha, inputs.base_sha, inputs.source_sha)) || format('CI coverage-v1 · {0}', github.sha)) }}

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Exact-source refresh coverage mode
        type: choice
        default: linux
        options: [linux, hosted-only]
      pr_number:
        description: Trusted same-head stack refresh PR (blank runs ordinary manual CI)
        type: string
      head_sha:
        description: Exact PR head for refresh
        type: string
      base_sha:
        description: Exact parent head for refresh
        type: string
      source_sha:
        description: Exact two-parent merge for refresh
        type: string
  merge_group:
  push:
    branches: [main]
  pull_request:
    # Every non-draft PR head runs full CI; labels never start or gate it.
    types: [opened, ready_for_review, synchronize, reopened, edited]

concurrency:
  # Independent exact-source refreshes must not wait behind unrelated manual runs.
  # Duplicate requests for the same tuple still share one queue across modes.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'workflow_dispatch' && inputs.pr_number && inputs.head_sha && inputs.base_sha && inputs.source_sha && format('refresh-pr-{0}-head-{1}-base-{2}-source-{3}', inputs.pr_number, inputs.head_sha, inputs.base_sha, inputs.source_sha) || 'shared' }}
  queue: max

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  redirect:
    name: Route isolated PR refresh
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      routed: ${{ steps.isolate.outputs.routed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Route exact PR source without executing candidate code
        if: github.ref == 'refs/heads/main'
        id: isolate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
        with:
          script: |
            const {pathToFileURL}=require('node:url'),{resolve}=require('node:path');
            const {routeManualCi}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-execution-router.mjs')).href);
            const result=await routeManualCi(github,context.repo,process.env.CONTROLLER_SHA,context.payload.inputs,{pin:process.env.CONTROLLER_SHA,flag:process.env.ISOLATED_EXECUTION});
            core.setOutput('routed','true');
            await core.summary.addRaw(result.stale?'Superseded PR request skipped; no candidate coverage claimed.':'PR request routed to isolated execution; this Main run claims routing only.').write();

  changes:
    needs: redirect
    if: always() && (needs.redirect.result == 'success' || needs.redirect.result == 'skipped')
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      routed: ${{ needs.redirect.outputs.routed }}
      source_sha: ${{ steps.refresh.outputs.sourceSha || github.sha }}
      # Exact-source refresh dispatches run on main but check out a PR merge. They may restore
      # caches but must never save them, or PR code could poison caches shared with main.
      cache_write: ${{ (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') && 'false' || 'true' }}
      snapshot: ${{ steps.refresh.outputs.snapshot }}
      base_sha: ${{ steps.changed.outputs.base_sha }}
      bootstrap: ${{ steps.changed.outputs.bootstrap }}
      # A superseded PR head skips every heavy lane: queued runs for pushes that a newer push replaced
      # would otherwise each spend a full CI on the saturated hosted runner pool.
      trigger_requested: ${{ needs.redirect.outputs.routed == 'true' && 'true' || (steps.superseded.outputs.stale == 'true' && 'true' || steps.changed.outputs.trigger_requested) }}
      should_run: ${{ needs.redirect.outputs.routed == 'true' && 'false' || (steps.superseded.outputs.stale == 'true' && 'false' || steps.changed.outputs.should_run) }}
      docs_contract_tests: ${{ needs.redirect.outputs.routed == 'true' && 'false' || (steps.superseded.outputs.stale == 'true' && 'false' || steps.changed.outputs.docs_contract_tests) }}
      os_view_parity_tests: ${{ needs.redirect.outputs.routed == 'true' && 'false' || (steps.superseded.outputs.stale == 'true' && 'false' || steps.changed.outputs.os_view_parity_tests) }}
      dedicated_eligible: ${{ needs.redirect.outputs.routed == 'true' && 'false' || (steps.route.outputs.eligible) }}
      dedicated_mode: ${{ steps.route.outputs.mode }}
      dedicated_required: ${{ needs.redirect.outputs.routed == 'true' && 'false' || (steps.route.outputs.required) }}
    steps:
      - name: Authenticate isolated refresh workflow origin
        id: origin
        if: needs.redirect.outputs.routed != 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
          EXECUTION_WORKFLOW_PATH: .github/workflows/ci.yml
          EXECUTION_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const pin=process.env.CONTROLLER_SHA || (context.ref==='refs/heads/main'&&process.env.ISOLATED_EXECUTION!=='true'?context.sha:''),path=process.env.EXECUTION_WORKFLOW_PATH;
            if(!/^[a-f0-9]{40}$/.test(pin||''))throw new Error('Reviewed controller pin is missing');
            const main=context.ref==='refs/heads/main';
            if(main){if(process.env.EXECUTION_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/${path}@refs/heads/main`)throw new Error('Untrusted Main workflow origin');const request={timeout:10000};const {data:tip}=await github.rest.repos.getBranch({...context.repo,branch:'main',request});if(tip.name!=='main'||!/^[a-f0-9]{40}$/.test(tip.commit?.sha||''))throw new Error('Invalid current main branch identity');const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${tip.commit.sha}`,request});if(!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Reviewed helper pin is not on Main');core.setOutput('helper_sha',path.endsWith('/ci.yml')&&process.env.ISOLATED_EXECUTION!=='true'?context.sha:pin);return;}
            const ref=`refs/heads/ci-execution/${pin}`;
            if(process.env.ISOLATED_EXECUTION!=='true'||context.ref!==ref||process.env.EXECUTION_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/${path}@${ref}`||process.env.EXECUTION_WORKFLOW_SHA!==context.sha||context.sha===pin)throw new Error('Untrusted isolated workflow origin');
            const request={timeout:10000};
            const {data:child}=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha,request});
            const {data:source}=await github.rest.git.getCommit({...context.repo,commit_sha:pin,request});
            const {data:branch}=await github.rest.repos.getBranch({...context.repo,branch:`ci-execution/${pin}`,request});
            const {data:tip}=await github.rest.repos.getBranch({...context.repo,branch:'main',request});
            const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${tip.commit.sha}`,request});
            if(child.sha!==context.sha||source.sha!==pin||child.parents?.length!==1||child.parents[0].sha!==pin||!/^[a-f0-9]{40}$/.test(child.tree?.sha||'')||child.tree.sha!==source.tree?.sha||branch.commit?.sha!==context.sha||!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Isolated workflow does not match reviewed Main source');
            core.setOutput('helper_sha',pin);
            core.setOutput('execution_origin',JSON.stringify({schemaVersion:1,controllerSha:pin,controllerRef:'refs/heads/main',executionRef:ref,executionSha:context.sha,executionWorkflowSha:context.sha,workflowPath:path,treeSha:child.tree.sha}));
      - name: Checkout trusted main refresh helpers
        if: needs.redirect.outputs.routed != 'true' && (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.origin.outputs.helper_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Resolve trusted exact-source refresh
        id: refresh
        if: needs.redirect.outputs.routed != 'true' && (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {resolveRequestingSource}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-refresh.mjs')).href);
            const source=await resolveRequestingSource(github,context.repo,
              {sha:context.sha,ref:context.ref,workflowRef:process.env.CI_WORKFLOW_REF,workflowSha:process.env.CI_WORKFLOW_SHA,controllerSha:process.env.CONTROLLER_SHA},context.payload.inputs);
            core.setOutput('snapshot',JSON.stringify(source));core.setOutput('sourceSha',source.sourceSha);
      - name: Checkout with bounded retry
        id: checkout
        if: needs.redirect.outputs.routed != 'true'
        env:
          CHECKOUT_BACKOFF_SECONDS: "5"
          CHECKOUT_MAX_ATTEMPTS: "3"
          CHECKOUT_TIMEOUT_SECONDS: "120"
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.refresh.outputs.sourceSha || github.sha }}
        run: |
          set -euo pipefail

          SOURCE_SHA="${SOURCE_SHA:-$GITHUB_SHA}"
          rm -rf .git
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config --local gc.auto 0
          # Coverage needs complete commit/tree history, but never historical blobs.
          # Materialize only the helpers used by this classification job.
          git config --local remote.origin.promisor true
          git config --local remote.origin.partialclonefilter blob:none
          git sparse-checkout set --no-cone '/scripts/ci/'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          for attempt in $(seq 1 "$CHECKOUT_MAX_ATTEMPTS"); do
            echo "Checkout fetch attempt $attempt/$CHECKOUT_MAX_ATTEMPTS"
            # One deadline bounds both the fetch and lazy blob hydration at checkout.
            # Pass auth to both commands without persisting it in repository config.
            if timeout --kill-after=5s "${CHECKOUT_TIMEOUT_SECONDS}s" \
              bash -c '
                set -euo pipefail
                git -c http.extraheader="AUTHORIZATION: basic $1" \
                  fetch --filter=blob:none --no-tags --prune --no-recurse-submodules origin "$2"
                git -c http.extraheader="AUTHORIZATION: basic $1" checkout --force --detach "$2"
                test "$(git rev-parse HEAD)" = "$2"
              ' checkout "$auth_header" "$SOURCE_SHA"; then
              echo "Checkout fetch succeeded on attempt $attempt/$CHECKOUT_MAX_ATTEMPTS"
              exit 0
            fi

            rm -f .git/index.lock .git/shallow.lock
            if [ "$attempt" -eq "$CHECKOUT_MAX_ATTEMPTS" ]; then
              echo "::error::Checkout fetch failed after $CHECKOUT_MAX_ATTEMPTS attempts"
              exit 1
            fi

            backoff_seconds=$((CHECKOUT_BACKOFF_SECONDS * attempt))
            echo "Checkout fetch attempt $attempt failed; retrying in ${backoff_seconds}s"
            sleep "$backoff_seconds"
          done
      - name: Skip superseded PR heads
        id: superseded
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pull=context.payload.pull_request;
            try{
              const {data:live}=await github.rest.pulls.get({...context.repo,pull_number:pull.number,request:{timeout:10000}});
              const stale=live.head.sha!==pull.head.sha;
              core.setOutput('stale',String(stale));
              if(stale)core.notice(`PR head ${pull.head.sha} was superseded by ${live.head.sha}; skipping CI lanes for the old head.`);
            }catch(error){
              // Never block CI on this optimization: run normally when the live head is unknown.
              core.warning(`Superseded-head check unavailable: ${error instanceof Error ? error.message : 'unknown error'}`);
              core.setOutput('stale','false');
            }
      - name: Detect source changes
        if: needs.redirect.outputs.routed != 'true'
        id: changed
        env:
          PR_ACTION: ${{ github.event.action || '' }}
          PR_BASE_EDIT: ${{ github.event.action == 'edited' && github.event.changes.base != null }}
          PR_DRAFT: ${{ github.event.pull_request.draft == true }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/dedicated-changes.mjs
      - name: Select guarded Linux delegation
        if: needs.redirect.outputs.routed != 'true'
        id: route
        env:
          MATRIX_CI_DEDICATED_ENABLED: ${{ vars.MATRIX_CI_DEDICATED_ENABLED }}
          MATRIX_CI_DEDICATED_MAIN: ${{ vars.MATRIX_CI_DEDICATED_MAIN }}
          MATRIX_CI_DEDICATED_SHADOW: ${{ vars.MATRIX_CI_DEDICATED_SHADOW }}
          SHOULD_RUN: ${{ steps.changed.outputs.should_run }}
          REFRESH_SNAPSHOT: ${{ steps.refresh.outputs.snapshot }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const {selectDedicatedRoute}=await import('./scripts/ci/dedicated-admission.mjs');
          const refresh=process.env.REFRESH_SNAPSHOT?JSON.parse(process.env.REFRESH_SNAPSHOT):null;
          const enabled=process.env.MATRIX_CI_DEDICATED_ENABLED==='true';
          if(refresh){const hosted=refresh.executionMode==='hosted-only';appendFileSync(process.env.GITHUB_OUTPUT,`eligible=${!hosted&&enabled}\nrequired=${!hosted}\nmode=${!hosted&&enabled?'delegated':'shadow'}\n`);process.exit(0);}
          // Main pushes delegate behind their own flag, so PR routing can ship before main controllers do.
          const scoped=enabled&&(process.env.GITHUB_EVENT_NAME!=='push'||process.env.MATRIX_CI_DEDICATED_MAIN==='true');
          const eligible=selectDedicatedRoute({repository:process.env.GITHUB_REPOSITORY,
            eventName:process.env.GITHUB_EVENT_NAME, enabled:scoped?'true':'false',
            shouldRun:process.env.SHOULD_RUN, ref:process.env.GITHUB_REF, pull:event.pull_request});
          const required=selectDedicatedRoute({repository:process.env.GITHUB_REPOSITORY,
            eventName:process.env.GITHUB_EVENT_NAME, enabled:(process.env.MATRIX_CI_DEDICATED_ENABLED==='true'||process.env.MATRIX_CI_DEDICATED_SHADOW==='true')?'true':'false',
            shouldRun:process.env.SHOULD_RUN,ref:process.env.GITHUB_REF,pull:event.pull_request});
          appendFileSync(process.env.GITHUB_OUTPUT,`eligible=${eligible}\nrequired=${required}\nmode=${scoped?'delegated':'shadow'}\n`);
          NODE

      - name: Record exact main coverage decision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COVERAGE_BASE_SHA: ${{ steps.changed.outputs.base_sha }}
          COVERAGE_BOOTSTRAP: ${{ steps.changed.outputs.bootstrap }}
          SHOULD_RUN: ${{ steps.changed.outputs.should_run }}
          DOCS_CONTRACT_TESTS: ${{ steps.changed.outputs.docs_contract_tests }}
          OS_VIEW_PARITY_TESTS: ${{ steps.changed.outputs.os_view_parity_tests }}
          DEDICATED_ELIGIBLE: ${{ steps.route.outputs.eligible }}
          DEDICATED_REQUIRED: ${{ steps.route.outputs.required }}
        run: node scripts/ci/main-ci-decision.mjs
      - name: Upload exact main coverage decision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-ci-decision-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-ci-decision/receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Clean temporary main coverage decision
        if: always() && steps.checkout.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci/main-ci-decision.mjs --cleanup

  isolated-ci-backend:
    name: Isolated CI Backend Decision
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == format('refs/heads/ci-execution/{0}', vars.MATRIX_CI_CONTROLLER_SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    outputs:
      provider: ${{ steps.backend.outputs.provider }}
      infrastructure_fallback: ${{ steps.backend.outputs.infrastructure_fallback }}
      attempt: ${{ steps.backend.outputs.attempt }}
    steps:
      - name: Authenticate isolated backend before helper checkout
        id: origin
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
          EXECUTION_WORKFLOW_PATH: .github/workflows/ci.yml
          EXECUTION_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const pin=process.env.CONTROLLER_SHA || (context.ref==='refs/heads/main'&&process.env.ISOLATED_EXECUTION!=='true'?context.sha:''),path=process.env.EXECUTION_WORKFLOW_PATH;
            if(!/^[a-f0-9]{40}$/.test(pin||''))throw new Error('Reviewed controller pin is missing');
            const ref=`refs/heads/ci-execution/${pin}`;
            if(process.env.ISOLATED_EXECUTION!=='true'||context.ref!==ref||process.env.EXECUTION_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/${path}@${ref}`||process.env.EXECUTION_WORKFLOW_SHA!==context.sha||context.sha===pin)throw new Error('Untrusted isolated workflow origin');
            const request={timeout:10000};
            const {data:child}=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha,request});
            const {data:source}=await github.rest.git.getCommit({...context.repo,commit_sha:pin,request});
            const {data:branch}=await github.rest.repos.getBranch({...context.repo,branch:`ci-execution/${pin}`,request});
            const {data:tip}=await github.rest.repos.getBranch({...context.repo,branch:'main',request});
            if(tip.name!=='main'||!/^[a-f0-9]{40}$/.test(tip.commit?.sha||''))throw new Error('Invalid current Main identity');
            const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${tip.commit.sha}`,request});
            if(child.sha!==context.sha||source.sha!==pin||child.parents?.length!==1||child.parents[0].sha!==pin||!/^[a-f0-9]{40}$/.test(child.tree?.sha||'')||child.tree.sha!==source.tree?.sha||branch.name!==`ci-execution/${pin}`||branch.commit?.sha!==context.sha||!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Isolated workflow does not match reviewed Main source');
            core.setOutput('helper_sha',pin);
            core.setOutput('execution_origin',JSON.stringify({schemaVersion:1,controllerSha:pin,controllerRef:'refs/heads/main',executionRef:ref,executionSha:context.sha,executionWorkflowSha:context.sha,workflowPath:path,treeSha:child.tree.sha}));
      - name: Checkout proved isolated backend helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.origin.outputs.helper_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Qualify and verify current isolated backend
        id: backend
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEDICATED_ELIGIBLE: ${{ needs.changes.outputs.dedicated_eligible }}
          REFRESH_SNAPSHOT: ${{ needs.changes.outputs.snapshot }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REQUESTING_ATTEMPT: ${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
        with:
          script: |
            const {pathToFileURL}=require('node:url'),{resolve}=require('node:path');
            const {requestIsolatedCiQualification}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-ci-handoff.mjs')).href);
            const {decideRequestingBackend}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-backend.mjs')).href);
            const self={...context,runId:context.runId,runAttempt:Number(process.env.REQUESTING_ATTEMPT),workflowRef:process.env.CI_WORKFLOW_REF,workflowSha:process.env.CI_WORKFLOW_SHA};
            await requestIsolatedCiQualification(github,context.repo,self,process.env.CONTROLLER_SHA,context.payload.inputs,{pin:process.env.CONTROLLER_SHA,flag:process.env.ISOLATED_EXECUTION,linuxRequired:process.env.DEDICATED_ELIGIBLE==='true'});
            let result={provider:'hosted',infrastructureFallback:false};
            if(process.env.DEDICATED_ELIGIBLE==='true'){
              result=await decideRequestingBackend(github,context,process.env.REFRESH_SNAPSHOT?JSON.parse(process.env.REFRESH_SNAPSHOT):null,{requestingRunId:context.runId,requestingRunAttempt:self.runAttempt,controllerSha:process.env.CONTROLLER_SHA,mode:'delegated',imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,serverUrl:context.serverUrl});
            }
            core.setOutput('provider',result.provider);core.setOutput('infrastructure_fallback',String(result.infrastructureFallback));
            core.setOutput('attempt',String(self.runAttempt));

  ci-backend:
    name: CI Backend Decision
    needs: [changes, isolated-ci-backend]
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      provider: ${{ steps.isolated.outputs.provider || steps.backend.outputs.provider }}
      infrastructure_fallback: ${{ steps.isolated.outputs.infrastructure_fallback || steps.backend.outputs.infrastructure_fallback }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.dedicated_eligible == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == format('refs/heads/ci-execution/{0}', vars.MATRIX_CI_CONTROLLER_SHA))
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Pass through verified isolated backend
        id: isolated
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == format('refs/heads/ci-execution/{0}', vars.MATRIX_CI_CONTROLLER_SHA)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ISOLATED_BACKEND_RESULT: ${{ needs.isolated-ci-backend.result }}
          ISOLATED_BACKEND_ATTEMPT: ${{ needs.isolated-ci-backend.outputs.attempt }}
          ISOLATED_BACKEND_PROVIDER: ${{ needs.isolated-ci-backend.outputs.provider }}
          ISOLATED_BACKEND_FALLBACK: ${{ needs.isolated-ci-backend.outputs.infrastructure_fallback }}
          REQUESTING_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const result=process.env.ISOLATED_BACKEND_RESULT,attempt=process.env.ISOLATED_BACKEND_ATTEMPT,current=process.env.REQUESTING_ATTEMPT,provider=process.env.ISOLATED_BACKEND_PROVIDER,fallback=process.env.ISOLATED_BACKEND_FALLBACK;
            // This retained decision schedules lanes only; the aggregate requires fresh completion proof.
            if(result!=='success'||!/^[1-9][0-9]*$/.test(current||'')||!/^[1-9][0-9]*$/.test(attempt||'')||!Number.isSafeInteger(Number(current))||!Number.isSafeInteger(Number(attempt))||Number(attempt)>Number(current)||!['linux','hosted'].includes(provider)||!['true','false'].includes(fallback)||(provider==='linux'&&fallback!=='false'))throw new Error('No valid isolated backend scheduling decision');
            core.setOutput('provider',provider);core.setOutput('infrastructure_fallback',fallback);
      - name: Decide exact-source execution backend
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == format('refs/heads/ci-execution/{0}', vars.MATRIX_CI_CONTROLLER_SHA)) }}
        id: backend
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEDICATED_ELIGIBLE: ${{ needs.changes.outputs.dedicated_eligible }}
          REFRESH_SNAPSHOT: ${{ needs.changes.outputs.snapshot }}
          REQUESTING_ATTEMPT: ${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && vars.MATRIX_CI_CONTROLLER_SHA || '' }}
        with:
          script: |
            if(process.env.DEDICATED_ELIGIBLE!=='true'){core.setOutput('provider','hosted');core.setOutput('infrastructure_fallback','false');return;}
            const {pathToFileURL}=require('node:url');const {resolve}=require('node:path');
            const {decideRequestingBackend}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-backend.mjs')).href);
            const result=await decideRequestingBackend(github,context,process.env.REFRESH_SNAPSHOT?JSON.parse(process.env.REFRESH_SNAPSHOT):null,{requestingRunId:context.runId,
              requestingRunAttempt:Number(process.env.REQUESTING_ATTEMPT),...(process.env.CONTROLLER_SHA?{controllerSha:process.env.CONTROLLER_SHA}:{}),mode:'delegated',imageDigest:process.env.IMAGE_DIGEST,
              harnessDigest:process.env.HARNESS_DIGEST,serverUrl:context.serverUrl});
            if(result.fallbackReason)core.warning(`Main Linux qualification fell back to full hosted CI: ${result.fallbackReason}`);
            core.setOutput('provider',result.provider);core.setOutput('infrastructure_fallback',String(result.infrastructureFallback));

