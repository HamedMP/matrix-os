    steps:
      - name: Skip docs contract tests
        if: needs.changes.outputs.docs_contract_tests != 'true' && needs.ci-backend.outputs.infrastructure_fallback != 'true'
        run: echo "No docs-only changes detected; skipping docs contract tests."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.docs_contract_tests == 'true' || needs.ci-backend.outputs.infrastructure_fallback == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.docs_contract_tests == 'true' || needs.ci-backend.outputs.infrastructure_fallback == 'true'

