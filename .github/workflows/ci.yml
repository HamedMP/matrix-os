        if: needs.changes.outputs.docs_contract_tests == 'true' || needs.ci-backend.outputs.infrastructure_fallback == 'true'
        with:
          node-version: 24
          cache: ${{ needs.changes.outputs.cache_write == 'true' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.docs_contract_tests == 'true' || needs.ci-backend.outputs.infrastructure_fallback == 'true'

