            tests/scripts/ci-dedicated-backend.test.ts \
            tests/scripts/ci-fast-workflow.test.ts \
            tests/scripts/ci-dedicated-bridge.test.ts \
            tests/scripts/ci-dedicated-routing.test.ts \
