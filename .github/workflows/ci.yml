  funded-host-root:
    name: Protected Funded Host Root Contracts
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Execute isolated root fixtures without skipped cases
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != x86_64 ]]; then exit 1; fi
          container_name="funded-host-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          image="public.ecr.aws/docker/library/node:24-bookworm"
          if ! timeout --kill-after=10s 120s docker pull "$image"; then
            image="docker.io/library/node:24-bookworm"
            timeout --kill-after=10s 120s docker pull "$image"
          fi
          timeout --kill-after=10s 180s docker run --rm --init \
            --name "$container_name" --network none --cpus 2 --memory 2g --pids-limit 256 \
            --env MATRIX_DISPOSABLE_ROOT_TEST=true \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            "$image" python3 -I /work/scripts/ci/run-funded-host-root-tests.py
          # A fresh container is required: the generated-command fixture owns /opt/matrix.
          timeout --kill-after=10s 180s docker run --rm --init \
            --name "$container_name" --network none --cpus 2 --memory 2g --pids-limit 256 \
            --env MATRIX_FUNDED_REPAIR_DISPOSABLE_TEST=1 \
            --env MATRIX_FUNDED_REPAIR_EXPECT_ARCH=x64 \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            "$image" node /work/tests/deploy/customer-vps/funded-config-linux.mjs

  dedicated-linux:
    name: Verified Dedicated Linux Qualification
    needs: changes
    # Only delegated routing waits on Linux here. In shadow mode CI Results would otherwise wait up to
    # 70 minutes for a non-blocking result; the controller check and source gates record shadow outcomes.
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true' && needs.changes.outputs.dedicated_required == 'true' && needs.changes.outputs.dedicated_eligible != 'true' && needs.changes.outputs.dedicated_mode == 'delegated')
    runs-on: ubuntu-latest
    # Shadow observes Linux qualification; checkout failures and timeouts must not fail the run either.
    continue-on-error: ${{ needs.changes.outputs.dedicated_mode != 'delegated' }}
    timeout-minutes: 70
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact merge revision Linux outcome
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REFRESH_SNAPSHOT: ${{ needs.changes.outputs.snapshot }}
          REQUESTING_ATTEMPT: ${{ github.run_attempt }}
          MODE: ${{ needs.changes.outputs.dedicated_mode == 'delegated' && 'delegated' || 'shadow' }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {waitForDedicatedResult}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-result.mjs')).href);
            const {requestingSnapshot}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-backend.mjs')).href);
            // Shadow mode observes Linux qualification; only delegated routing may block CI on it.
            try{
              const snapshot=await requestingSnapshot(github,context,process.env.REFRESH_SNAPSHOT?JSON.parse(process.env.REFRESH_SNAPSHOT):null);
              const result=await waitForDedicatedResult(github,{
                ...context.repo,...snapshot,requestingRunId:context.runId,
                requestingRunAttempt:Number(process.env.REQUESTING_ATTEMPT),mode:process.env.MODE,
                imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,serverUrl:context.serverUrl
              },{metrics:values=>core.info('Requester API polling: '+JSON.stringify(values))});
              core.info(`Verified Linux qualification for ${result.sourceSha}; controller run ${result.runId}`);
            }catch(error){
              if(process.env.MODE!=='shadow'||!(error instanceof Error))throw error;
              core.warning(`Shadow Linux qualification not verified: ${error.message}`);
              await core.summary.addRaw(`Shadow Linux qualification not verified (non-blocking): ${error.message}\n`).write();
            }

  completion-handoff:
    name: Handoff isolated CI completion
    needs: [redirect, changes, isolated-ci-backend, ci-backend, typecheck, shell-production-build, patterns, react-doctor, sync-client, agent-sdk-compatibility, unit, funded-postgres, collaboration-postgres, funded-host-root, docs-contract, os-view-parity, e2e, dedicated-linux]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == format('refs/heads/ci-execution/{0}', vars.MATRIX_CI_CONTROLLER_SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    outputs:
      attempt: ${{ steps.handoff.outputs.attempt }}
    steps:
      - name: Authenticate isolated CI handoff before helper checkout
        id: origin
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
          EXECUTION_WORKFLOW_PATH: .github/workflows/ci.yml
          EXECUTION_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const pin=process.env.CONTROLLER_SHA || (context.ref==='refs/heads/main'&&process.env.ISOLATED_EXECUTION!=='true'?context.sha:''),path=process.env.EXECUTION_WORKFLOW_PATH;
            if(!/^[a-f0-9]{40}$/.test(pin||''))throw new Error('Reviewed controller pin is missing');
            const ref=`refs/heads/ci-execution/${pin}`;
            if(process.env.ISOLATED_EXECUTION!=='true'||context.ref!==ref||process.env.EXECUTION_WORKFLOW_REF!==`${context.repo.owner}/${context.repo.repo}/${path}@${ref}`||process.env.EXECUTION_WORKFLOW_SHA!==context.sha||context.sha===pin)throw new Error('Untrusted isolated workflow origin');
            const request={timeout:10000};
            const {data:child}=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha,request});
            const {data:source}=await github.rest.git.getCommit({...context.repo,commit_sha:pin,request});
            const {data:branch}=await github.rest.repos.getBranch({...context.repo,branch:`ci-execution/${pin}`,request});
            const {data:tip}=await github.rest.repos.getBranch({...context.repo,branch:'main',request});
            if(tip.name!=='main'||!/^[a-f0-9]{40}$/.test(tip.commit?.sha||''))throw new Error('Invalid current Main identity');
            const {data:ancestry}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${pin}...${tip.commit.sha}`,request});
            if(child.sha!==context.sha||source.sha!==pin||child.parents?.length!==1||child.parents[0].sha!==pin||!/^[a-f0-9]{40}$/.test(child.tree?.sha||'')||child.tree.sha!==source.tree?.sha||branch.name!==`ci-execution/${pin}`||branch.commit?.sha!==context.sha||!['ahead','identical'].includes(ancestry.status)||ancestry.merge_base_commit?.sha!==pin)throw new Error('Isolated workflow does not match reviewed Main source');
            core.setOutput('helper_sha',pin);
            core.setOutput('execution_origin',JSON.stringify({schemaVersion:1,controllerSha:pin,controllerRef:'refs/heads/main',executionRef:ref,executionSha:context.sha,executionWorkflowSha:context.sha,workflowPath:path,treeSha:child.tree.sha}));
      - name: Checkout reviewed completion handoff helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.origin.outputs.helper_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Request isolated CI completion reconciliation
        id: handoff
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONTROLLER_SHA: ${{ vars.MATRIX_CI_CONTROLLER_SHA }}
          ISOLATED_EXECUTION: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REQUESTING_RUN_ATTEMPT: ${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ vars.MATRIX_CI_RUNNER_IMAGE_DIGEST }}
          HARNESS_DIGEST: ${{ vars.MATRIX_CI_RUNNER_HARNESS_DIGEST }}
          LINUX_REQUIRED: ${{ needs.changes.outputs.dedicated_eligible }}
          BACKEND_ATTEMPT: ${{ needs.isolated-ci-backend.outputs.attempt }}
          BACKEND_PROVIDER: ${{ needs.isolated-ci-backend.outputs.provider }}
          BACKEND_FALLBACK: ${{ needs.isolated-ci-backend.outputs.infrastructure_fallback }}
        with:
          script: |
            const {pathToFileURL}=require('node:url'),{resolve}=require('node:path');
            const {requestIsolatedCiCompletion}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/dedicated-ci-handoff.mjs')).href);
            const result=await requestIsolatedCiCompletion(github,context.repo,{...context,runId:context.runId,runAttempt:Number(process.env.REQUESTING_RUN_ATTEMPT),workflowRef:process.env.CI_WORKFLOW_REF,workflowSha:process.env.CI_WORKFLOW_SHA},process.env.CONTROLLER_SHA,context.payload.inputs,{pin:process.env.CONTROLLER_SHA,flag:process.env.ISOLATED_EXECUTION,imageDigest:process.env.IMAGE_DIGEST,harnessDigest:process.env.HARNESS_DIGEST,linuxRequired:process.env.LINUX_REQUIRED==='true',backendAttempt:Number(process.env.BACKEND_ATTEMPT),backendProvider:process.env.BACKEND_PROVIDER,backendInfrastructureFallback:process.env.BACKEND_FALLBACK==='true'});
            core.setOutput('attempt',String(result.attempt));

  ci-results:
    # Every non-draft suite executes this stable required check. Metadata edits
    # verify earlier exact-source coverage instead of renaming/skipping the job:
    # GitHub's merge box only considers the latest suite for this workflow.
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == true) && 'CI Draft (ignored)' || 'CI Results' }}
    needs: [redirect, changes, isolated-ci-backend, ci-backend, typecheck, shell-production-build, patterns, react-doctor, sync-client, agent-sdk-compatibility, unit, funded-postgres, collaboration-postgres, funded-host-root, docs-contract, os-view-parity, e2e, dedicated-linux, completion-handoff]
    if: always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout metadata verification helpers
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Verify exact-source coverage after metadata edit
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXECUTION_CONTROLLER_SHA: ${{ vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && vars.MATRIX_CI_CONTROLLER_SHA || '' }}
        with:
          script: |
            const {pathToFileURL}=require('node:url');
            const {resolve}=require('node:path');
            const {verifyMetadataCoverage}=await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE,'scripts/ci/metadata-result.mjs')).href);
            const pull=context.payload.pull_request;
            const source={prNumber:pull.number,headSha:pull.head.sha,headRef:pull.head.ref,
              baseSha:pull.base.sha,baseRef:pull.base.ref,sourceSha:context.sha,headRepository:pull.head.repo.full_name,...(process.env.EXECUTION_CONTROLLER_SHA?{executionControllerSha:process.env.EXECUTION_CONTROLLER_SHA}:{})};
            const result=await verifyMetadataCoverage(github,context.repo,source,context.runId);
            await core.summary.addRaw(`Metadata edit verified tested-source CI run ${result.runId}, attempt ${result.runAttempt}. Tested merge: ${result.sourceSha}; recorded base: ${result.baseSha}. No workload was skipped as a substitute for coverage.\n`).write();
      - name: Summarize isolated CI routing
        if: needs.redirect.outputs.routed == 'true'
        env:
          CI_REDIRECT_RESULT: ${{ needs.redirect.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          if [ "$CI_REDIRECT_RESULT" != "success" ] || [ "$CHANGES_RESULT" != "success" ]; then
            echo "Routing or change detection did not complete successfully." >&2
            exit 1
          fi
          echo "Routing-only request accepted. No candidate tests or coverage are claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize required CI jobs
        if: ${{ needs.redirect.outputs.routed != 'true' && !(github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null) }}
        env:
          CI_ISOLATED_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && vars.MATRIX_CI_ISOLATED_EXECUTION == 'true' && github.ref == format('refs/heads/ci-execution/{0}', vars.MATRIX_CI_CONTROLLER_SHA) }}
          CI_REQUESTING_ATTEMPT: ${{ github.run_attempt }}
          CI_HANDOFF_ATTEMPT: ${{ needs.completion-handoff.outputs.attempt }}
          CI_HANDOFF_RESULT: ${{ needs.completion-handoff.result }}
          CI_REDIRECT_RESULT: ${{ needs.redirect.result }}
          CI_TRIGGER_REQUESTED: ${{ needs.changes.outputs.trigger_requested }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          DEDICATED_ELIGIBLE: ${{ needs.changes.outputs.dedicated_eligible }}
          DEDICATED_REQUIRED: ${{ needs.changes.outputs.dedicated_required }}
          CI_BACKEND_RESULT: ${{ needs.ci-backend.result }}
          CI_BACKEND_PROVIDER: ${{ needs.ci-backend.outputs.provider }}
          INFRASTRUCTURE_FALLBACK: ${{ needs.ci-backend.outputs.infrastructure_fallback }}
          DEDICATED_LINUX_RESULT: ${{ needs.dedicated-linux.result }}
          DEDICATED_MODE: ${{ needs.changes.outputs.dedicated_mode == 'delegated' && 'delegated' || 'shadow' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SHELL_PRODUCTION_BUILD_RESULT: ${{ needs.shell-production-build.result }}
          PATTERNS_RESULT: ${{ needs.patterns.result }}
          REACT_DOCTOR_RESULT: ${{ needs.react-doctor.result }}
          SYNC_CLIENT_RESULT: ${{ needs.sync-client.result }}
          AGENT_SDK_COMPATIBILITY_RESULT: ${{ needs.agent-sdk-compatibility.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FUNDED_POSTGRES_RESULT: ${{ needs.funded-postgres.result }}
          COLLABORATION_POSTGRES_RESULT: ${{ needs.collaboration-postgres.result }}
          FUNDED_HOST_ROOT_RESULT: ${{ needs.funded-host-root.result }}
          DOCS_CONTRACT_RESULT: ${{ needs.docs-contract.result }}
          OS_VIEW_PARITY_RESULT: ${{ needs.os-view-parity.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          CI_ISOLATED_REQUEST=${CI_ISOLATED_REQUEST:-false}
          CI_HANDOFF_RESULT=${CI_HANDOFF_RESULT:-skipped}
          CI_REDIRECT_RESULT=${CI_REDIRECT_RESULT:-skipped}
          CI_BACKEND_RESULT=${CI_BACKEND_RESULT:-skipped}
          DEDICATED_ELIGIBLE=${DEDICATED_ELIGIBLE:-false}
          DEDICATED_REQUIRED=${DEDICATED_REQUIRED:-$DEDICATED_ELIGIBLE}
          DEDICATED_LINUX_RESULT=${DEDICATED_LINUX_RESULT:-skipped}

          {
            echo "### CI Results"
            echo
            echo "Branch protection should require this aggregate job, not each internal shard."
            echo
            echo "CI trigger requested: ${CI_TRIGGER_REQUESTED:-unknown}"
            echo "CI relevant source changes: ${SHOULD_RUN:-unknown}"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Detect CI-relevant changes | $CHANGES_RESULT |"
            echo "| Type Check | $TYPECHECK_RESULT |"
            echo "| Shell Production Build | $SHELL_PRODUCTION_BUILD_RESULT |"
            echo "| Pattern Scan | $PATTERNS_RESULT |"
            echo "| React Doctor | $REACT_DOCTOR_RESULT |"
            echo "| Sync Client Package (Node 20) | $SYNC_CLIENT_RESULT |"
            echo "| Agent SDK 0.3.251 Compatibility | $AGENT_SDK_COMPATIBILITY_RESULT |"
            echo "| Unit Tests | $UNIT_RESULT |"
            echo "| Funded Settlement PostgreSQL | $FUNDED_POSTGRES_RESULT |"
            echo "| Collaboration PostgreSQL | $COLLABORATION_POSTGRES_RESULT |"
            echo "| Protected Funded Host Root Contracts | $FUNDED_HOST_ROOT_RESULT |"
            echo "| Docs Contract Tests | $DOCS_CONTRACT_RESULT |"
            echo "| OS View Parity | $OS_VIEW_PARITY_RESULT |"
            echo "| E2E Tests | $E2E_RESULT |"
            echo "| Verified Dedicated Linux Qualification | $DEDICATED_LINUX_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CI_TRIGGER_REQUESTED" != "true" ]; then
            echo "Full CI was not requested for this commit. Mark the PR ready for review (not a draft) to run CI." >&2
            exit 1
          fi

          if [ "$CI_ISOLATED_REQUEST" = "true" ]; then
            if [ "$CI_HANDOFF_RESULT" != "success" ] || [[ ! "${CI_REQUESTING_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] || [ "${CI_HANDOFF_ATTEMPT:-}" != "${CI_REQUESTING_ATTEMPT:-}" ]; then
              echo "Current-attempt completion proof is missing. Re-run completion and its dependencies, or re-run all jobs." >&2
              exit 1
            fi
          fi

          failed=false
          # Shadow Linux qualification is observed in the table above but never gates the aggregate.
          LINUX_GATE_RESULT="$DEDICATED_LINUX_RESULT"
          if [ "${DEDICATED_MODE:-delegated}" = "shadow" ]; then LINUX_GATE_RESULT=skipped; fi
          for result in "$CI_HANDOFF_RESULT" "$CI_REDIRECT_RESULT" "$CI_BACKEND_RESULT" "$CHANGES_RESULT" "$TYPECHECK_RESULT" "$SHELL_PRODUCTION_BUILD_RESULT" "$PATTERNS_RESULT" "$REACT_DOCTOR_RESULT" "$SYNC_CLIENT_RESULT" "$AGENT_SDK_COMPATIBILITY_RESULT" "$UNIT_RESULT" "$FUNDED_POSTGRES_RESULT" "$COLLABORATION_POSTGRES_RESULT" "$FUNDED_HOST_ROOT_RESULT" "$DOCS_CONTRACT_RESULT" "$OS_VIEW_PARITY_RESULT" "$E2E_RESULT" "$LINUX_GATE_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                failed=true
                ;;
            esac
          done

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$FUNDED_POSTGRES_RESULT" != "success" ]; then
            failed=true
          fi

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$COLLABORATION_POSTGRES_RESULT" != "success" ]; then
            failed=true
          fi

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$FUNDED_HOST_ROOT_RESULT" != "success" ]; then
            failed=true
          fi

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$DEDICATED_REQUIRED" = "true" ] && [ "$DEDICATED_ELIGIBLE" != "true" ] && [ "$DEDICATED_LINUX_RESULT" != "success" ] && [ "${DEDICATED_MODE:-delegated}" = "delegated" ]; then
            failed=true
          fi

          if [ "${SHOULD_RUN:-false}" = "true" ] && [ "$DEDICATED_ELIGIBLE" = "true" ]; then
            if [ "${CI_BACKEND_RESULT:-unknown}" != "success" ]; then failed=true; fi
            case "${CI_BACKEND_PROVIDER:-unknown}" in
              linux) [ "${INFRASTRUCTURE_FALLBACK:-false}" = "false" ] || failed=true ;;
              hosted)
                [ "${INFRASTRUCTURE_FALLBACK:-false}" = "true" ] || failed=true
                for result in "$TYPECHECK_RESULT" "$SHELL_PRODUCTION_BUILD_RESULT" "$AGENT_SDK_COMPATIBILITY_RESULT" "$UNIT_RESULT" "$DOCS_CONTRACT_RESULT" "$OS_VIEW_PARITY_RESULT" "$E2E_RESULT"; do
                  [ "$result" = "success" ] || failed=true
                done ;;
              *) failed=true ;;
            esac
          fi

          if [ "$failed" = "true" ]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
