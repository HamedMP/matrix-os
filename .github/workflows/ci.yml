  funded-postgres:
    name: Funded Settlement PostgreSQL
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    # Measured run 41180668331 reached remaining PG at 9m29s; retain its 120s runner budget plus artifact/cleanup margin.
    timeout-minutes: 14
    services:
      postgres:
        # ECR Public anonymous pulls hit "toomanyrequests: Data limit exceeded" on shared runner IPs,
        # and a service container cannot fall back; Google's Docker Hub mirror is not pull-limited.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: matrix_test
          POSTGRES_PASSWORD: matrix_test
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix_test -d matrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service only; never use owner or production database secrets.
      MATRIX_TEST_POSTGRES_URL: postgresql://matrix_test:matrix_test@127.0.0.1:5432/matrix_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: ${{ needs.changes.outputs.cache_write == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Build test prerequisites once
        run: bun run test:prepare
      - name: Verify funded settlement on PostgreSQL
        run: |
          set -euo pipefail
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
