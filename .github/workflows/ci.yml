name: CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches: [main]
  pull_request:
    # Every non-draft PR head runs CI; labels never start or gate it. Title and body edits do not
    # rerun it, and stack retargets arrive with a rebase push.
    types: [opened, ready_for_review, synchronize, reopened]

concurrency:
  # A new PR head cancels its older run. Main, merge-queue and manual runs each keep their own group.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source_sha: ${{ github.sha }}
      base_sha: ${{ steps.changed.outputs.base_sha }}
      bootstrap: ${{ steps.changed.outputs.bootstrap }}
      # A superseded PR head skips every heavy lane: queued runs for pushes that a newer push replaced
      # would otherwise each spend a full CI on the saturated hosted runner pool.
      trigger_requested: ${{ steps.superseded.outputs.stale == 'true' && 'true' || steps.changed.outputs.trigger_requested }}
      should_run: ${{ steps.superseded.outputs.stale == 'true' && 'false' || steps.changed.outputs.should_run }}
      docs_contract_tests: ${{ steps.superseded.outputs.stale == 'true' && 'false' || steps.changed.outputs.docs_contract_tests }}
      os_view_parity_tests: ${{ steps.superseded.outputs.stale == 'true' && 'false' || steps.changed.outputs.os_view_parity_tests }}
      # Ordinary PRs run only affected unit tests and skip unrelated E2E; main, manual and merge-queue runs stay full.
      unit_scope: ${{ steps.changed.outputs.unit_scope || 'full' }}
      e2e_tests: ${{ steps.changed.outputs.e2e_tests || 'true' }}
      unit_runner: ${{ steps.runner.outputs.unit_runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout with bounded retry
        env:
          CHECKOUT_BACKOFF_SECONDS: "5"
          CHECKOUT_MAX_ATTEMPTS: "3"
          CHECKOUT_TIMEOUT_SECONDS: "30"
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SOURCE_SHA="${SOURCE_SHA:-$GITHUB_SHA}"
          rm -rf .git
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config --local gc.auto 0
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          for attempt in $(seq 1 "$CHECKOUT_MAX_ATTEMPTS"); do
            echo "Checkout fetch attempt $attempt/$CHECKOUT_MAX_ATTEMPTS"
            if timeout --foreground --kill-after=5s "${CHECKOUT_TIMEOUT_SECONDS}s" \
              git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
                fetch --no-tags --prune --no-recurse-submodules \
                origin "$SOURCE_SHA" \
              && git checkout --force --detach "$SOURCE_SHA"; then
              echo "Checkout fetch succeeded on attempt $attempt/$CHECKOUT_MAX_ATTEMPTS"
              exit 0
            fi

            rm -f .git/index.lock .git/shallow.lock
            if [ "$attempt" -eq "$CHECKOUT_MAX_ATTEMPTS" ]; then
              echo "::error::Checkout fetch failed after $CHECKOUT_MAX_ATTEMPTS attempts"
              exit 1
            fi

            backoff_seconds=$((CHECKOUT_BACKOFF_SECONDS * attempt))
            echo "Checkout fetch attempt $attempt failed; retrying in ${backoff_seconds}s"
            sleep "$backoff_seconds"
          done
      - name: Skip superseded PR heads
        id: superseded
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pull=context.payload.pull_request;
            try{
              const {data:live}=await github.rest.pulls.get({...context.repo,pull_number:pull.number,request:{timeout:10000}});
              const stale=live.head.sha!==pull.head.sha;
              core.setOutput('stale',String(stale));
              if(stale)core.notice(`PR head ${pull.head.sha} was superseded by ${live.head.sha}; skipping CI lanes for the old head.`);
            }catch(error){
              // Never block CI on this optimization: run normally when the live head is unknown.
              core.warning(`Superseded-head check unavailable: ${error instanceof Error ? error.message : 'unknown error'}`);
              core.setOutput('stale','false');
            }
      - name: Detect source changes
        id: changed
        env:
          MAIN_BEFORE: ${{ github.event.before }}
          PR_ACTION: ${{ github.event.action || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: node scripts/ci/changes.mjs
      - name: Select unit test runners
        id: runner
        env:
          POOL_HEARTBEAT: ${{ vars.MATRIX_CI_POOL_HEARTBEAT }}
          # Fork PR code never reaches the self-hosted pool.
          SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          UNIT_SCOPE: ${{ steps.changed.outputs.unit_scope || 'full' }}
        run: node scripts/ci/select-runner.mjs

  typecheck:
    name: Type Check
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping typecheck."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'
        with:
          bun-version: "1.4.3"

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Type check all packages
        if: needs.changes.outputs.should_run == 'true'
        run: bun run typecheck

  shell-production-build:
    name: Shell Production Build
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping shell production build."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'
        with:
          bun-version: "1.4.3"

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Restore Next incremental compilation
        id: next-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: shell/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build shell production bundle
        if: needs.changes.outputs.should_run == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktc2FmZS5leGFtcGxlLmNvbSQ=
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_shell_build
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_shell_build
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.posthog.com
          NEXT_PUBLIC_POSTHOG_API_HOST: /relay
        run: bun run build:shell:production

      - name: Save Next incremental compilation
        if: needs.changes.outputs.should_run == 'true' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: shell/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-pnpm10.33.4-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  patterns:
    name: Pattern Scan
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping pattern scan."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          fetch-depth: 0

      - name: Install ripgrep
        if: needs.changes.outputs.should_run == 'true'
        run: sudo apt-get install -y ripgrep

      - name: Run CLAUDE.md pattern scanner on changed files
        if: needs.changes.outputs.should_run == 'true'
        env:
          COVERAGE_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          COVERAGE_BOOTSTRAP: ${{ needs.changes.outputs.bootstrap }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/review/check-patterns.sh --diff origin/${{ github.base_ref }}
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BEFORE="$COVERAGE_BASE_SHA"
            if [ -z "$BEFORE" ]; then
              echo "Main CI coverage base is missing" >&2
              exit 1
            fi
            if [ "$COVERAGE_BOOTSTRAP" = "true" ]; then
              ./scripts/review/check-patterns.sh
            else
              ./scripts/review/check-patterns.sh --diff "$BEFORE"
            fi
          else
            # On push: only scan files changed in this push range.
            # github.event.before is the pre-push tip; on force-push or first
            # push it may be 000... — fall back to HEAD^ in that case.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD^"
            fi
            if ! git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
              BEFORE="HEAD^"
            fi
            ./scripts/review/check-patterns.sh --diff "$BEFORE"
          fi

  react-doctor:
    name: React Doctor
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    # Include observed 5m15s checkout, audit and cleanup/transfer variance.
    timeout-minutes: 10
    # Non-blocking during the React audit rollout. Remove once the
    # React audit baseline is clean, then it gates merges. https://github.com/millionco/react-doctor
    continue-on-error: true
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping React audit."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24

      - name: Audit React code (project dirs with changed .tsx/.jsx)
        if: needs.changes.outputs.should_run == 'true'
        env:
          COVERAGE_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$COVERAGE_BASE_SHA" ]; then
            base="$COVERAGE_BASE_SHA"
          else
            base="HEAD^"
            git rev-parse --verify "$base" >/dev/null 2>&1 || base="HEAD"
          fi
          mapfile -t react_files < <(git diff --name-only "$base" "$HEAD_SHA" | grep -E '\.(tsx|jsx)$' || true)
          if [ "${#react_files[@]}" -eq 0 ]; then
            echo "No changed React files; skipping react-doctor."
            exit 0
          fi
          # react-doctor scans a project DIRECTORY (needs a React package.json), not files.
          # Map changed React files to their owning project dir and audit each unique one.
          declare -A dirs=()
          for f in "${react_files[@]}"; do
            case "$f" in
              shell/*) dirs["shell"]=1 ;;
              packages/ui/*) dirs["packages/ui"]=1 ;;
              # home/apps/** are mostly root-toolchain (no package.json); audited pre-commit, skipped here.
            esac
          done
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "Changed React files are not in an audited project dir; skipping."
            exit 0
          fi
          for d in "${!dirs[@]}"; do
            echo "::group::react-doctor $d"
            npx --yes react-doctor@latest "$d" || echo "react-doctor reported findings in $d"
            echo "::endgroup::"
          done

  sync-client:
    name: Sync Client Package
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping sync-client checks."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Build sync client
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @finnaai/matrix build

      - name: Test sync client
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @finnaai/matrix test

      - name: Verify publish shape
        if: needs.changes.outputs.should_run == 'true'
        run: pnpm --filter @finnaai/matrix exec node ./scripts/check-publish.mjs

  # Tests run alongside mechanical checks; CI Results collects every result.

  agent-sdk-compatibility:
    name: Agent SDK 0.3.251 Compatibility
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping Agent SDK compatibility."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.should_run == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Install exact Agent SDK
        if: needs.changes.outputs.should_run == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/matrix-agent-sdk-03251"
          pnpm add --ignore-scripts --save-exact --dir "${{ runner.temp }}/matrix-agent-sdk-03251" @anthropic-ai/claude-agent-sdk@0.3.251

      - name: Run real Agent SDK compatibility spike
        if: needs.changes.outputs.should_run == 'true'
        env:
          MATRIX_AGENT_SDK_PACKAGE_DIR: ${{ runner.temp }}/matrix-agent-sdk-03251/node_modules/@anthropic-ai/claude-agent-sdk
        run: pnpm exec vitest run tests/scripts/agent-sdk-real-runtime-spike.test.ts

  unit:
    name: Unit Tests (${{ matrix.shard }}/4)
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    # The dedicated host's runner pool (specs/633-ci-runner-pool) or ubuntu-latest.
    runs-on: ${{ needs.changes.outputs.unit_runner }}
    # Shard 4 has outgrown the previous ceilings: run 35911423904 hit 20 minutes,
    # and main run 37587908679 hit 30 minutes without a failing assertion. Keep a
    # bounded 40-minute window for runner variance and cleanup; split the shards if
    # normal runs approach this ceiling too.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Skip expensive CI for docs-only changes
        if: needs.changes.outputs.should_run != 'true'
        run: echo "No CI-relevant source changes detected; skipping unit shard."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          # The PR merge commit's first parent is the base it is tested against.
          fetch-depth: 2
        if: needs.changes.outputs.should_run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.should_run == 'true'
        with:
          bun-version: "1.4.3"

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git for tests
        if: needs.changes.outputs.should_run == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@matrix-os.com"

      - name: Install ripgrep for pattern scanner tests
        if: needs.changes.outputs.should_run == 'true'
        run: sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.should_run == 'true'

      - name: Select affected unit tests
        id: select
        if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.unit_scope == 'affected'
        timeout-minutes: 10
        # Vitest resolves workspace packages through their built output while walking the import graph.
        run: bun run test:prepare && node scripts/ci/unit-test-selection.mjs HEAD^1 "$RUNNER_TEMP/unit-tests.txt"



      - run: GITHUB_SHA="$UNIT_SOURCE_SHA" bun run test -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json=output/ci/unit-${{ matrix.shard }}.json ${UNIT_SELECTION:+--passWithNoTests $(cat "$UNIT_SELECTION")}
        env:
          UNIT_SOURCE_SHA: ${{ needs.changes.outputs.source_sha || github.sha }}
          # 2 workers on 4-vCPU hosted runners: 4 measured no faster (#2843) and starved the CPU-heavy
          # gateway build in customer-vps-runtime-loader. Pool slots have 8 dedicated CPUs.
          MATRIX_TEST_WORKERS: ${{ runner.environment == 'self-hosted' && '6' || '2' }}
          # Set only after a successful affected-test selection; empty runs the full suite.
          UNIT_SELECTION: ${{ steps.select.outputs.list }}
        if: needs.changes.outputs.should_run == 'true'

      - name: Upload unit profiling
        if: always() && needs.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-profile-${{ matrix.shard }}
          path: output/ci/unit-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  funded-postgres:
    name: Funded Settlement PostgreSQL
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # ECR Public anonymous pulls hit "toomanyrequests: Data limit exceeded" on shared runner IPs,
        # and a service container cannot fall back; Google's Docker Hub mirror is not pull-limited.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: matrix_test
          POSTGRES_PASSWORD: matrix_test
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix_test -d matrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service only; never use owner or production database secrets.
      MATRIX_TEST_POSTGRES_URL: postgresql://matrix_test:matrix_test@127.0.0.1:5432/matrix_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build test prerequisites once
        run: bun run test:prepare
      - name: Verify funded settlement on PostgreSQL
        run: |
          set -euo pipefail
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/ai-funded-usage-postgres.test.ts tests/platform/ai-funded-model-probes-postgres.test.ts tests/platform/ai-funded-recovery-migration.test.ts tests/platform/ai-funded-terminal-concurrency.test.ts tests/platform/ai-funded-usage-waiver.test.ts tests/platform/ai-funded-usage-waiver-cli.test.ts tests/platform/ai-funded-usage-waiver-locks-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Verify reviewed paid starter recovery on PostgreSQL
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/customer-funded-paid-recovery-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Account deletion PostgreSQL races
        if: needs.changes.outputs.should_run == 'true'
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/account-deletion-*-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Bot creation, Integration grant and canonical phase admission races
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/gateway/bots/integration-grant-source-postgres.test.ts tests/gateway/bots/instantiation.test.ts tests/gateway/bots/matrix-bot-personality.test.ts tests/gateway/bots/funded-inference-timeout.test.ts tests/platform/canonical-phase-catalog-readiness.test.ts tests/platform/canonical-funding-expiry-projection.test.ts tests/gateway/canonical-phase-discovery.test.ts tests/platform/canonical-phase-postgres-cleanup.test.ts tests/gateway/company-brain-owner-data.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Preview Drive revocation and admission races
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/platform/preview-drive-postgres-concurrency.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Browser approval owner transactions and revocation races
        run: |
          : "${MATRIX_TEST_POSTGRES_URL:?Disposable PostgreSQL test URL required}"
          pnpm exec vitest run tests/gateway/browser-approval-repository.test.ts --maxWorkers=1 --no-file-parallelism

  collaboration-postgres:
    name: Collaboration PostgreSQL
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # ECR Public anonymous pulls hit "toomanyrequests: Data limit exceeded" on shared runner IPs,
        # and a service container cannot fall back; Google's Docker Hub mirror is not pull-limited.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: matrix_test
          POSTGRES_PASSWORD: matrix_test
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix_test -d matrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service only; never use owner or production database secrets.
      MATRIX_TEST_POSTGRES_URL: postgresql://matrix_test:matrix_test@127.0.0.1:5432/matrix_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build test prerequisites once
        run: bun run test:prepare
      - name: Collaboration PostgreSQL qualification
        run: node scripts/ci/collaboration-postgres.mjs

      - name: Upload collaboration PostgreSQL qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collaboration-postgres-qualification
          path: output/ci/collaboration-postgres/*.json
          if-no-files-found: error
          retention-days: 7

  docs-contract:
    name: Docs Contract Tests
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.docs_contract_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip docs contract tests
        if: needs.changes.outputs.docs_contract_tests != 'true'
        run: echo "No docs-only changes detected; skipping docs contract tests."

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
        if: needs.changes.outputs.docs_contract_tests == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.docs_contract_tests == 'true'

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.docs_contract_tests == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.docs_contract_tests == 'true'

      - name: Run docs contract tests
        if: needs.changes.outputs.docs_contract_tests == 'true'
        run: pnpm exec vitest run tests/repository/site-extraction.test.ts

  os-view-parity:
