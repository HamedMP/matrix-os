name: Audit source mirror
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/audit-source-mirror.yml'
      - 'scripts/audit/**'
permissions:
  contents: read
concurrency:
  group: audit-source-mirror-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify mirror safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/audit/sync-mirror.test.mjs
  synchronize:
    name: Synchronize main source only
    needs: verify
    if: >-
      github.repository == 'HamedMP/matrix-os' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.MATRIX_AUDIT_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Create mirror-only installation token
        id: mirror-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MATRIX_AUDIT_MIRROR_APP_ID }}
          private-key: ${{ secrets.MATRIX_AUDIT_MIRROR_APP_PRIVATE_KEY }}
          owner: FinnaAI
          repositories: matrix-os
          permission-contents: write
          permission-workflows: write
          permission-administration: read
      - name: Verify policy and fast-forward mirror main
        run: node scripts/audit/sync-mirror.mjs
        env:
          MATRIX_AUDIT_MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
