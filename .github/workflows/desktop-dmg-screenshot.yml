name: Desktop DMG Screenshot

on:
  push:
    branches:
      - codex/verify-desktop-dmg-screenshot

permissions:
  actions: read
  contents: read

jobs:
  capture:
    name: Capture branded DMG in Finder
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Download exact PR dry-run artifact
        uses: actions/download-artifact@v6
        with:
          repository: HamedMP/matrix-os
          run-id: 33196563447
          name: matrix-desktop-desktop-v0.1.0-dev.1373.8-dev-macos-arm64
          github-token: ${{ github.token }}
          path: dmg-artifact

      - name: Mount DMG and capture Finder window
        id: capture
        env:
          SCREENSHOT_PATH: ${{ runner.temp }}/matrix-os-dmg-finder.png
        run: |
          set -euo pipefail
          DMG_PATH="$(find dmg-artifact -maxdepth 1 -type f -name '*-mac-arm64.dmg' -print -quit)"
          test -n "$DMG_PATH"

          MOUNT_OUTPUT="$(hdiutil attach "$DMG_PATH" -nobrowse -readonly)"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_OUTPUT" | awk -F '\t' '/\/Volumes\// { print $NF; exit }')"
          test -n "$MOUNT_PATH"

          cleanup() {
            osascript -e 'tell application "Finder" to close every window whose target is (POSIX file "'"$MOUNT_PATH"'" as alias)' >/dev/null 2>&1 || true
            hdiutil detach "$MOUNT_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          open "$MOUNT_PATH"
          osascript <<'APPLESCRIPT'
          tell application "Finder"
            activate
            repeat 40 times
              if (count of Finder windows) > 0 then exit repeat
              delay 0.25
            end repeat
            if (count of Finder windows) = 0 then error "Finder did not open the DMG window"
          end tell
          APPLESCRIPT
          sleep 5

          WINDOW_ID="$(osascript -e 'tell application "Finder" to id of front window')"
          if ! screencapture -x -l "$WINDOW_ID" "$SCREENSHOT_PATH"; then
            screencapture -x "$SCREENSHOT_PATH"
          fi
          test -s "$SCREENSHOT_PATH"
          sips -g pixelWidth -g pixelHeight "$SCREENSHOT_PATH"

      - name: Upload Finder screenshot
        uses: actions/upload-artifact@v6
        with:
          name: matrix-os-dmg-finder-screenshot
          path: ${{ runner.temp }}/matrix-os-dmg-finder.png
          if-no-files-found: error
          retention-days: 30
