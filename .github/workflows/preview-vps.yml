# Preview VPS per PR (spec 093)
#
# Label a same-repo PR with `preview-vps` to get a disposable Hetzner VPS
# running that PR's host bundle, reachable at app.matrix-os.com/vm/pr-<N>.
#
# Flow:
#   deploy   — on label / push while labeled: build a unique exact-head bundle,
#              publish register-only (--channel none, never promoted),
#              provision pr-<N> if absent, deploy the exact version, comment.
#   teardown — on PR close or explicit manual dispatch: delete the pr-<N> VPS.
#   reaper   — daily: delete any pr-* VPS whose PR is closed or older than 72h,
#              so orphans cannot accumulate Hetzner cost.
#
# Centralized logs: enroll once from the ops box with
#   ./scripts/enable-vps-logship.sh pr-<N> preview
# then query with ./scripts/preview-logs.sh --handle pr-<N>.

name: Preview VPS

on:
  pull_request:
    types: [labeled, synchronize, reopened, closed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to deploy a preview VPS for"
        required: true
        type: string
      version:
        description: "Optional existing version pinned to this PR head"
        required: false
        type: string
      release_smoke:
        description: "Test the exact current dev release from a fresh stable preview"
        required: false
        default: false
        type: boolean
      diagnose_smoke:
        description: "Collect sanitized lifecycle evidence from the released-bundle smoke VPS"
        required: false
        default: false
        type: boolean
      verify_inventory:
        description: "Only verify the deployed preview in the authenticated computer inventory"
        required: false
        default: false
        type: boolean
      teardown_preview:
        description: "Delete only this PR's disposable preview VPS"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-vps-${{ github.event.pull_request.number || inputs.pr || 'reaper' }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview-vps' && github.run_id || 'active' }}
  cancel-in-progress: ${{ github.event.action != 'closed' && github.event_name != 'schedule' }}

env:
  PREVIEW_TTL_HOURS: 72

jobs:
  gate:
    name: Gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decide.outputs.action }}
      pr: ${{ steps.decide.outputs.pr }}
      handle: ${{ steps.decide.outputs.handle }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      requested_version: ${{ steps.decide.outputs.requested_version }}
      release_smoke: ${{ steps.decide.outputs.release_smoke }}
    steps:
      - name: Decide action
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          LABELED_NAME: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview-vps') }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SMOKE: ${{ inputs.release_smoke }}
          DIAGNOSE_SMOKE: ${{ inputs.diagnose_smoke }}
          VERIFY_INVENTORY: ${{ inputs.verify_inventory }}
          TEARDOWN_PREVIEW: ${{ inputs.teardown_preview }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action="skip"
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Invalid PR number" >&2
            exit 1
          fi

          head_sha="$EVENT_HEAD_SHA"
          head_ref="$EVENT_HEAD_REF"
          head_repo="$EVENT_HEAD_REPO"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            head_sha="$(jq -r .head.sha <<< "$pr_json")"
            head_ref="$(jq -r .head.ref <<< "$pr_json")"
            head_repo="$(jq -r .head.repo.full_name <<< "$pr_json")"
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PRs never get preview VPSes (secrets are not exposed to them anyway)."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TEARDOWN_PREVIEW" = "true" ]; then
              action="teardown"
            else
              if [ "$DIAGNOSE_SMOKE" = "true" ]; then
                action="diagnose"
              elif [ "$VERIFY_INVENTORY" = "true" ]; then
                action="verify"
              elif [ "$RELEASE_SMOKE" = "true" ]; then
                if [ -z "$REQUESTED_VERSION" ]; then
                  echo "A release version is required for the stable-to-dev smoke test." >&2
                  exit 1
                fi
                action="deploy_existing"
              elif [ -n "$REQUESTED_VERSION" ]; then
                action="deploy_existing"
              else
                action="deploy"
              fi
            fi
          elif [ "$EVENT_ACTION" = "closed" ]; then
            if [ "$HAS_LABEL" = "true" ]; then action="teardown"; fi
          elif [ "$EVENT_ACTION" = "labeled" ]; then
            if [ "$LABELED_NAME" = "preview-vps" ]; then action="deploy"; fi
          elif [ "$HAS_LABEL" = "true" ]; then
            action="deploy"
          fi
          if [ "$action" != "skip" ] && ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid PR head SHA" >&2
            exit 1
          fi
          if [ "$action" = "deploy_existing" ]; then
            if [ "$RELEASE_SMOKE" = "true" ]; then
              if [ "$GITHUB_REF" != "refs/heads/release-smoke-vps" ] ||
                [ "$REQUESTED_VERSION" != "v2026.09.12-1237" ]; then
                echo "Release smoke is restricted to the isolated exact-release test branch." >&2
                exit 1
              fi
              dev_release="$(curl --fail --silent --show-error --max-time 15 \
                'https://app.matrix-os.com/system-bundles/channels/dev.json')"
              if ! jq -e --arg version "$REQUESTED_VERSION" \
                --arg commit "501faacbecf5f9726c92fa6ef10ad8f89b42a587" \
                '.channel == "dev" and .version == $version and .gitCommit == $commit' \
                <<< "$dev_release" >/dev/null; then
                echo "Requested release is not the current dev bundle." >&2
                exit 1
              fi
            elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Pinned Preview deployments must run from the trusted main workflow." >&2
              exit 1
            elif ! printf '%s' "$REQUESTED_VERSION" |
              grep -Eq "^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-pr${PR_NUMBER}(-[0-9]+-[0-9]+)?-[0-9a-f]{7}$" ||
              [ "${REQUESTED_VERSION##*-}" != "${head_sha:0:7}" ]; then
              echo "Invalid pinned preview version" >&2
              exit 1
            fi
          fi
          if [ "$action" = "diagnose" ]; then
            if [ "$GITHUB_REF" != "refs/heads/release-smoke-vps" ] ||
              [ "$REQUESTED_VERSION" != "v2026.09.12-1237" ]; then
              echo "Release diagnostics are restricted to the isolated exact-release test branch." >&2
              exit 1
            fi
          fi
          {
            echo "action=$action"
            echo "pr=$PR_NUMBER"
            echo "handle=pr-$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
            echo "requested_version=$REQUESTED_VERSION"
            echo "release_smoke=$RELEASE_SMOKE"
          } >> "$GITHUB_OUTPUT"
          echo "action=$action pr=$PR_NUMBER"

  build:
    name: Build preview bundle
    needs: gate
    if: needs.gate.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN || vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://eu.posthog.com' }}
      NEXT_PUBLIC_POSTHOG_API_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_API_HOST || '/relay' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - uses: erlef/setup-beam@v1
        with:
          otp-version: 28
          elixir-version: 1.19

      - name: Validate public build environment
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi
          if [ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" = "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k" ]; then
            echo "Refusing to build a preview bundle with the example Clerk key." >&2
            exit 1
          fi

      - name: Generate preview version
        id: version
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          REQUESTED_VERSION: ${{ needs.gate.outputs.requested_version }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-v$(date -u +%Y.%m.%d)-pr${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${HEAD_SHA:0:7}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $VERSION"

      - name: Build host bundle
        env:
          HOST_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
          HOST_BUNDLE_CHANNEL: none
          MATRIX_BUILD_SHA: ${{ needs.gate.outputs.head_sha }}
          MATRIX_BUILD_REF: ${{ needs.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          ./scripts/build-host-bundle.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-bundle-${{ needs.gate.outputs.pr }}
          path: |
            dist/host-bundle/matrix-host-bundle.tar.gz
            dist/host-bundle/matrix-host-bundle.tar.gz.sha256
            dist/host-bundle/incremental-manifest.json
            dist/host-bundle/objects/**
            dist/host-bundle/manifest.json
            dist/host-bundle/release.json
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish and deploy preview VPS
    needs: [gate, build]
    if: always() && ((needs.gate.outputs.action == 'deploy' && needs.build.result == 'success') || needs.gate.outputs.action == 'deploy_existing')
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_BUNDLES_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BUNDLES_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BUNDLES_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUNDLES_BUCKET || vars.R2_BUCKET || 'matrixos-sync' }}
      R2_ENDPOINT: ${{ vars.R2_BUNDLES_ENDPOINT || vars.R2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.R2_BUNDLES_ACCOUNT_ID || secrets.R2_ACCOUNT_ID) }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
      PREVIEW_CLERK_ACCESS_USER_IDS: ${{ secrets.PREVIEW_CLERK_ACCESS_USER_IDS }}
      PREVIEW_PROVISION_TIMEOUT_SECONDS: 3900
      PREVIEW_INSTALL_TIMEOUT_SECONDS: 600
      HANDLE: ${{ needs.gate.outputs.handle }}
      VERSION: ${{ needs.gate.outputs.action == 'deploy_existing' && needs.gate.outputs.requested_version || needs.build.outputs.version }}
      RELEASE_SMOKE: ${{ needs.gate.outputs.release_smoke }}
    steps:
      - name: Checkout preview source
        if: needs.gate.outputs.action == 'deploy'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - name: Checkout trusted workflow helpers
        if: needs.gate.outputs.action == 'deploy_existing'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download bundle artifact
        if: needs.gate.outputs.action == 'deploy'
        uses: actions/download-artifact@v8
        with:
          name: preview-bundle-${{ needs.gate.outputs.pr }}
          path: dist/host-bundle

      - name: Publish release (register-only, no channel)
        if: needs.gate.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          ./scripts/publish-release.sh "$VERSION" --channel none \
            --changelog "Preview bundle for PR #${{ needs.gate.outputs.pr }}"

      - name: Provision or resume preview VPS
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_CLERK_USER_ID:-}" ]; then
            echo "PREVIEW_CLERK_USER_ID secret is not configured." >&2
            exit 1
          fi
          access_user_ids="${PREVIEW_CLERK_ACCESS_USER_IDS:-[]}"
          if ! jq -e --arg owner "$PREVIEW_CLERK_USER_ID" '
            type == "array" and length <= 8
            and all(.[]; type == "string" and test("^user_[A-Za-z0-9]+$"))
            and (unique | length) == length
            and (index($owner) == null)
          ' <<< "$access_user_ids" > /dev/null; then
            echo "PREVIEW_CLERK_ACCESS_USER_IDS must be a JSON array of up to eight unique non-owner Clerk user IDs." >&2
            exit 1
          fi

          fleet_machine="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -c --arg h "$HANDLE" \
              '[.machines[]
                | select(.handle == $h and .status != "deleted" and .deletedAt == null)
                | . + { _preview_rank:
                    (if .status == "running" then 0
                     elif .status == "provisioning" then 1
                     elif .status == "failed" then 2
                     else 3 end) }]
               | sort_by(._preview_rank, (if .runtimeSlot == $h then 0 else 1 end), .provisionedAt)
               | (.[0] // {status: "absent", machineId: ""})
               | del(._preview_rank)')"
          status="$(jq -r '.status' <<< "$fleet_machine")"
          runtime_slot="$(jq -r '.runtimeSlot // ""' <<< "$fleet_machine")"
          echo "Fleet status for ${HANDLE}: ${status}"

          case "$status" in
            provisioning|running)
              if [ "$runtime_slot" = "$HANDLE" ]; then
                echo "Reusing existing ${HANDLE} preview (${status})"
              else
                echo "Active ${HANDLE} requires exact-slot adoption from ${runtime_slot:-unset}"
              fi
              ;;
            absent|failed)
              echo "Preview ${HANDLE} requires provisioning or retry"
              ;;
            *)
              echo "Preview ${HANDLE} is in an unsupported state (${status})." >&2
              exit 1
              ;;
          esac

          # The idempotent provision call also reconciles the complete access
          # allowlist on already-running previews.
          provision_body="$(jq -cn \
            --arg owner "$PREVIEW_CLERK_USER_ID" \
            --arg handle "$HANDLE" \
            --argjson access "$access_user_ids" \
            '{clerkUserId: $owner, handle: $handle, runtimeSlot: $handle, accessClerkUserIds: $access}')"
          code="$(curl -sS --max-time 60 -o /tmp/provision.json -w '%{http_code}' \
            -X POST "${PLATFORM_PUBLIC_URL}/vps/preview/provision" \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            -H "content-type: application/json" \
            --data-binary "$provision_body")"
          if [ "$code" != "202" ]; then
            echo "Preview provision failed with HTTP ${code}." >&2
            exit 1
          fi
          if ! accepted_machine_id="$(jq -er '
            if (
              type == "object"
              and (.machineId | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))
              and (.status == "provisioning" or .status == "running")
              and (.etaSeconds | type == "number" and . >= 0)
            ) then .machineId else error("invalid response") end
          ' /tmp/provision.json)"; then
            echo "Preview provision returned an invalid response." >&2
            exit 1
          fi

          status="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -r --arg h "$HANDLE" --arg id "$accepted_machine_id" \
              '[.machines[] | select(.handle == $h and .machineId == $id and .runtimeSlot == $h and .deletedAt == null)] | .[0].status // "absent"')"
          echo "Immediate fleet visibility for ${HANDLE}: ${status}"
          if [ "$status" != "provisioning" ] && [ "$status" != "running" ]; then
            echo "Accepted preview machine is not durably visible in the fleet." >&2
            exit 1
          fi

          if [ "$status" = "provisioning" ]; then
            echo "Waiting for the VPS to come up..."
            PREVIEW_MACHINE_ID="$accepted_machine_id" ./scripts/wait-preview-provisioning.sh
          fi

      - name: Deploy preview bundle to preview VPS
        run: |
          set -euo pipefail
          attempt() {
            curl -sS --max-time 120 -o /tmp/deploy.json -w '%{http_code}' \
              -X POST "${PLATFORM_PUBLIC_URL}/vps/deploy" \
              -H "authorization: Bearer ${PLATFORM_SECRET}" \
              -H "content-type: application/json" \
              -d "{\"version\":\"${VERSION}\",\"handle\":\"${HANDLE}\"}"
          }
          runtime_token="$(PLATFORM_SIGNING_SECRET="$PLATFORM_SECRET" node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.env.PLATFORM_SIGNING_SECRET).update(process.argv[1]).digest("hex"));
          ' "$HANDLE")"
          echo "::add-mask::$runtime_token"
          send_runtime_command() {
            local body="$1" response="$2"
            curl --fail --silent --show-error --max-time 45 --insecure \
              --resolve "app.matrix-os.com:443:${address}" \
              -o "$response" -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${runtime_token}" \
              -H 'content-type: application/json' --data-binary "$body" &&
              jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null)' \
                "$response" >/dev/null
          }
          wait_for_stable_baseline() {
            local deadline stable_release stable_version status healthy runtime_version
            stable_release="$(curl --fail --silent --show-error --max-time 15 \
              "${PLATFORM_PUBLIC_URL%/}/system-bundles/channels/stable.json")"
            stable_version="$(jq -er 'select(.channel == "stable") | .version | select(type == "string" and test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9]+$"))' \
              <<< "$stable_release")"
            deadline=$((SECONDS + 300))
            while true; do
              runtime="$(curl --fail --silent --show-error --max-time 30 \
                -H "authorization: Bearer ${PLATFORM_SECRET}" \
                "${PLATFORM_PUBLIC_URL%/}/vps/fleet" |
                jq -c --arg h "$HANDLE" \
                  '[.machines[] | select(.handle == $h and .runtimeSlot == $h and .status == "running" and .deletedAt == null)] |
                   if length == 1 then .[0] else {status:"pending",healthy:false,runtimeVersion:null,publicIPv4:""} end')"
              status="$(jq -r '.status' <<< "$runtime")"
              healthy="$(jq -r '.healthy == true' <<< "$runtime")"
              runtime_version="$(jq -r '.runtimeVersion // "pending"' <<< "$runtime")"
              address="$(jq -r '.publicIPv4 // ""' <<< "$runtime")"
              if [ "$status" = "running" ] && [ "$healthy" = "true" ] && [ "$runtime_version" = "$stable_version" ] &&
                printf '%s' "$address" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
                echo "Stable baseline ready for ${HANDLE}: ${stable_version}"
                return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "Disposable preview did not reach the exact healthy stable baseline." >&2
                return 1
              fi
              sleep 15
            done
          }
          seed_legacy_sessions() {
            local body response=/tmp/preview-legacy-seed.json seed_script
            read -r -d '' seed_script <<'PYTHON' || true
          import json
          import os
          import pwd
          import re
          import shlex
          import stat
          import subprocess

          home = "/home/matrix/home"
          owner = pwd.getpwnam("matrix")
          generation_path = "/opt/matrix/app/TERMINAL_RUNTIME_GENERATION"
          generation_fd = os.open(generation_path, os.O_RDONLY | os.O_NOFOLLOW)
          try:
              generation_stat = os.fstat(generation_fd)
              if not stat.S_ISREG(generation_stat.st_mode) or generation_stat.st_size > 80:
                  raise ValueError("invalid generation marker")
              generation = os.read(generation_fd, 81).decode("utf-8").strip()
          finally:
              os.close(generation_fd)
          if not re.fullmatch(r"gen_[0-9a-f]{64}", generation):
              raise ValueError("invalid generation")
          zellij = f"/opt/matrix/terminal-runtime/generations/{generation}/zellij"
          zellij_stat = os.lstat(zellij)
          if not stat.S_ISREG(zellij_stat.st_mode) or stat.S_ISLNK(zellij_stat.st_mode):
              raise ValueError("invalid zellij binary")
          runtime_env = [
              f"HOME={home}",
              f"MATRIX_HOME={home}",
              f"XDG_RUNTIME_DIR=/run/user/{owner.pw_uid}",
              f"DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{owner.pw_uid}/bus",
              f"ZELLIJ_CONFIG_DIR={home}/system/zellij",
              f"ZELLIJ_CONFIG_FILE={home}/system/zellij/config.kdl",
              "TERM=xterm-256color",
          ]
          names = ["release-smoke-a", "release-smoke-b"]
          for name in names:
              command = " ".join(shlex.quote(value) for value in [zellij, "attach", "--create-background", name])
              subprocess.run(
                  ["/usr/sbin/runuser", "-u", "matrix", "--", "/usr/bin/env", *runtime_env,
                   "/usr/bin/script", "-qefc", command, "/dev/null"],
                  check=True,
                  timeout=20,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

          registry_path = f"{home}/system/shell-sessions.json"
          try:
              registry_fd = os.open(registry_path, os.O_RDONLY | os.O_NOFOLLOW)
          except FileNotFoundError:
              registry = {"sessions": {}}
          else:
              try:
                  registry_stat = os.fstat(registry_fd)
                  if not stat.S_ISREG(registry_stat.st_mode) or registry_stat.st_size > 16 * 1024 * 1024:
                      raise ValueError("invalid legacy registry")
                  registry = json.loads(os.read(registry_fd, registry_stat.st_size + 1))
              finally:
                  os.close(registry_fd)
          if not isinstance(registry, dict) or not isinstance(registry.get("sessions"), dict):
              raise ValueError("invalid legacy registry")
          for name in names:
              registry["sessions"][name] = {"name": name, "status": "active", "cwd": ""}
          temporary = f"{registry_path}.release-smoke"
          output_fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          try:
              os.fchown(output_fd, owner.pw_uid, owner.pw_gid)
              os.write(output_fd, (json.dumps(registry) + "\n").encode("utf-8"))
              os.fsync(output_fd)
          finally:
              os.close(output_fd)
          os.replace(temporary, registry_path)
          directory_fd = os.open(os.path.dirname(registry_path), os.O_RDONLY)
          try:
              os.fsync(directory_fd)
          finally:
              os.close(directory_fd)
          print("seeded=2")
          PYTHON
            body="$(jq -cn --arg script "$seed_script" \
              '{command:["/usr/bin/sudo","/usr/bin/python3","-c",$script],timeoutMs:60000}')"
            send_runtime_command "$body" "$response"
            jq -e '.stdout == "seeded=2\n"' "$response" >/dev/null
            echo "Seeded two live legacy Zellij sessions on the stable baseline."
          }
          verify_terminal_migration() {
            local body response=/tmp/preview-terminal-migration.json verify_script evidence
            read -r -d '' verify_script <<'PYTHON' || true
          import json
          import os
          import pwd
          import re
          import stat
          import subprocess

          def read_json(path, limit):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  metadata = os.fstat(fd)
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size < 2 or metadata.st_size > limit:
                      raise ValueError("invalid state file")
                  return json.loads(os.read(fd, metadata.st_size + 1))
              finally:
                  os.close(fd)

          home = "/home/matrix/home"
          journal = read_json(f"{home}/system/terminal-migration-journal.json", 16 * 1024 * 1024)
          state = read_json(f"{home}/system/terminal-workspaces.json", 16 * 1024 * 1024)
          if journal.get("status") != "committed" or state.get("schemaVersion") != 2:
              raise ValueError("migration not committed")
          workspaces = state.get("workspaces")
          if not isinstance(workspaces, dict) or len(workspaces) != 1:
              raise ValueError("unexpected workspace topology")
          workspace = next(iter(workspaces.values()))
          tabs = workspace.get("tabs") if isinstance(workspace, dict) else None
          if not isinstance(tabs, dict):
              raise ValueError("invalid migrated tabs")
          migrated = [tab for tab in tabs.values() if isinstance(tab, dict) and
                      tab.get("migrationKey") in {"release-smoke-a", "release-smoke-b"}]
          if len(migrated) != 2 or any(tab.get("status") != "running" or
                                      not isinstance(tab.get("zellijTabId"), int) or
                                      not re.fullmatch(r"terminal_[0-9]+", str(tab.get("zellijPaneId")))
                                      for tab in migrated):
              raise ValueError("legacy sessions were not activated as tabs")
          legacy_names = journal.get("legacySessionNames")
          terminal_refs = journal.get("terminalRefs")
          generated_names = journal.get("generatedSessionNames")
          expected_seeded = {"release-smoke-a", "release-smoke-b"}
          if (not isinstance(legacy_names, list) or not expected_seeded.issubset(set(legacy_names)) or
              not isinstance(terminal_refs, dict) or not expected_seeded.issubset(terminal_refs) or
              not isinstance(generated_names, list) or generated_names != [workspace.get("zellijSessionName")]):
              raise ValueError("migration journal does not match workspace state")

          owner = pwd.getpwnam("matrix")
          command = [
              "/usr/sbin/runuser", "-u", "matrix", "--", "/usr/bin/env",
              f"HOME={home}", f"MATRIX_HOME={home}",
              f"XDG_RUNTIME_DIR=/run/user/{owner.pw_uid}",
              f"DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{owner.pw_uid}/bus",
              "/usr/bin/systemctl", "--user", "list-units", "matrix-zellij@*.service",
              "--state=active", "--no-legend", "--plain",
          ]
          listed = subprocess.run(command, check=True, timeout=15, capture_output=True, text=True).stdout
          units = [line.split()[0] for line in listed.splitlines() if line.strip()]
          if len(units) != 1 or any(not re.fullmatch(r"matrix-zellij@rt_[0-9a-f]{32}\.service", unit) for unit in units):
              raise ValueError("workspace service topology is not active")
          print(json.dumps({
              "journalStatus": "committed",
              "stateSchemaVersion": 2,
              "workspaceCount": 1,
              "migratedLegacyTabs": 2,
              "generatedSessionCount": len(generated_names),
              "activeWorkspaceServices": len(units),
          }, sort_keys=True))
          PYTHON
            body="$(jq -cn --arg script "$verify_script" \
              '{command:["/usr/bin/sudo","/usr/bin/python3","-c",$script],timeoutMs:45000}')"
            send_runtime_command "$body" "$response"
            evidence="$(jq -cer '.stdout | fromjson |
              select(.journalStatus == "committed" and .stateSchemaVersion == 2 and
                .workspaceCount == 1 and .migratedLegacyTabs == 2 and
                .generatedSessionCount == 1 and .activeWorkspaceServices == 1)' "$response")"
            echo "Terminal migration verified: ${evidence}"
          }
          collect_preview_diagnostics() {
            local body response=/tmp/preview-update-diagnostics.json state_script
            if ! printf '%s' "$address" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
              echo "Preview diagnostics unavailable because the runtime address is invalid." >&2
              return 1
            fi

            read -r -d '' state_script <<'PYTHON' || true
          import json
          import os
          import re
          import stat

          def read_regular(path, limit):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  metadata = os.fstat(fd)
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size < 1 or metadata.st_size > limit:
                      raise ValueError("invalid file")
                  value = os.read(fd, limit + 1)
                  if len(value) > limit:
                      raise ValueError("oversized file")
                  return value.decode("utf-8")
              finally:
                  os.close(fd)

          state = {}
          try:
              value = read_regular("/opt/matrix/app/BUNDLE_VERSION", 256).strip()
              state["appVersion"] = value if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", value) else "invalid"
          except (OSError, UnicodeError, ValueError):
              state["appVersion"] = "unavailable"
          try:
              payload = json.loads(read_regular("/opt/matrix/release.json", 65536))
              value = payload.get("version")
              state["releaseVersion"] = value if isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", value) else "invalid"
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError):
              state["releaseVersion"] = "unavailable"
          try:
              payload = json.loads(read_regular("/opt/matrix/app/.update-error.json", 65536))
              code = payload.get("code")
              version = payload.get("version")
              state["updateError"] = code if isinstance(code, str) and re.fullmatch(r"[a-z][a-z0-9_]{0,63}", code) else "invalid"
              state["updateVersion"] = version if isinstance(version, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", version) else "invalid"
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError):
              state["updateError"] = "none"
          try:
              value = read_regular("/opt/matrix/staging/update-phase", 64).strip()
              state["updatePhase"] = value if re.fullmatch(r"[a-z][a-z-]{0,31}", value) else "invalid"
          except (OSError, UnicodeError, ValueError):
              state["updatePhase"] = "idle"
          print(json.dumps(state, sort_keys=True))
          PYTHON
            body="$(jq -cn --arg script "$state_script" \
              '{command:["/usr/bin/python3","-c",$script],timeoutMs:10000}')"
            echo "::group::Sanitized preview updater state"
            if send_runtime_command "$body" "$response"; then
              jq -r '.stdout // ""' "$response"
            else
              echo "Bounded updater-state collection failed." >&2
            fi
            echo "::endgroup::"
          }
          probe_active_bundle_version() {
            local body response=/tmp/preview-active-bundle-version.json probe_script
            read -r -d '' probe_script <<'PYTHON' || true
          import os
          import re
          import stat

          path = "/opt/matrix/app/BUNDLE_VERSION"
          fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
          try:
              metadata = os.fstat(fd)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size < 2 or metadata.st_size > 256:
                  raise ValueError("invalid bundle version marker")
              value = os.read(fd, 257).decode("utf-8").strip()
              if not re.fullmatch(r"(?:v[0-9]|main-[A-Za-z0-9])[A-Za-z0-9._-]{0,127}", value):
                  raise ValueError("invalid bundle version")
              print(value)
          finally:
              os.close(fd)
          PYTHON
            body="$(jq -cn --arg script "$probe_script" \
              '{command:["/usr/bin/python3","-c",$script],timeoutMs:10000}')"
            send_runtime_command "$body" "$response"
            jq -er '.stdout | select(test("^(v[0-9]|main-[A-Za-z0-9])[A-Za-z0-9._-]{0,127}\\n$")) | rtrimstr("\n")' \
              "$response"
          }
          restart_preview_sync_agent() {
            local body response=/tmp/preview-sync-agent-restart.json
            body='{"command":["/usr/bin/sudo","/usr/bin/systemctl","restart","matrix-sync-agent.service"],"timeoutMs":30000}'
            send_runtime_command "$body" "$response"
          }
          reconcile_preview_registration() {
            local body response=/tmp/preview-registration-recovery.json
            jq -e --arg h "$HANDLE" --arg v "$VERSION" \
              '.status == "running" and .healthy == true and .handle == $h and .runtimeSlot == $h and .runtimeVersion == $v and (.machineId | type == "string") and (.publicIPv4 | type == "string")' \
              <<< "$runtime" >/dev/null
            body="$(jq -cn --rawfile script scripts/preview-registration-recovery.py \
              --arg h "$HANDLE" --arg m "$(jq -r '.machineId' <<< "$runtime")" \
              --arg v "$VERSION" --arg s "$address" \
              '{command:["/usr/bin/python3","-c",$script,$h,$m,$v,$s],timeoutMs:15000}')"
            send_runtime_command "$body" "$response"
            echo "Preview registration verified against platform and host identity."
          }
          verify_preview_stability() {
            local baseline="" current response=/tmp/preview-runtime-stability.json body until_time
            body='{"command":["/usr/bin/systemctl","show","matrix-gateway.service","--property=MainPID","--property=NRestarts","--property=ActiveState"],"timeoutMs":10000}'
            until_time=$((SECONDS + 900))
            while true; do
              send_runtime_command "$body" "$response"
              current="$(jq -er '.stdout | select(contains("ActiveState=active") and (contains("MainPID=0\n") | not))' "$response")"
              if [ -n "$baseline" ] && [ "$current" != "$baseline" ]; then
                echo "Preview gateway restarted during stability validation." >&2
                exit 1
              fi
              baseline="$current"
              [ "$SECONDS" -lt "$until_time" ] || break
              sleep 30
            done
            echo "Preview gateway remained stable for 15 minutes."
          }
          if [ "$RELEASE_SMOKE" = "true" ]; then
            wait_for_stable_baseline
            seed_legacy_sessions
          fi
          code="$(attempt)"
          if [ "$code" != "200" ]; then
            echo "Deploy returned HTTP ${code}; retrying once in 30s..."
            sleep 30
            code="$(attempt)"
          fi
          if [ "$code" != "200" ]; then
            echo "Deploy failed with HTTP ${code} (body in workflow log)" >&2
            cat /tmp/deploy.json >&2
            exit 1
          fi
          jq . /tmp/deploy.json

          echo "Waiting for ${HANDLE} to install ${VERSION}"
          deadline=$((SECONDS + PREVIEW_INSTALL_TIMEOUT_SECONDS))
          transition_repair_attempted=false
          while true; do
            runtime="$(curl -fsS --max-time 30 \
              -H "authorization: Bearer ${PLATFORM_SECRET}" \
              "${PLATFORM_PUBLIC_URL}/vps/fleet" |
              jq -c --arg h "$HANDLE" \
                '[.machines[]
                  | select(.handle == $h and .runtimeSlot == $h and .status != "deleted" and .deletedAt == null)
                  | . + { _preview_rank:
                      (if .status == "running" then 0
                       elif .status == "provisioning" then 1
                       elif .status == "failed" then 2
                       else 3 end) }]
                 | sort_by(._preview_rank, .provisionedAt)
                 | (.[0] // {status: "absent", healthy: false, runtimeVersion: null})
                 | del(._preview_rank)')"
            status="$(jq -r '.status' <<< "$runtime")"
            healthy="$(jq -r '.healthy == true' <<< "$runtime")"
            runtime_version="$(jq -r '.runtimeVersion // "pending"' <<< "$runtime")"
            address="$(jq -r '.publicIPv4 // ""' <<< "$runtime")"
            echo "Runtime for ${HANDLE}: status=${status} healthy=${healthy} version=${runtime_version}"

            if jq -e --arg v "$VERSION" \
              '.healthy == true and .runtimeVersion == $v' <<< "$runtime" > /dev/null; then
              if ! printf '%s' "$address" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
                echo "Preview runtime address is invalid." >&2
                exit 1
              fi
              active_bundle_version=""
              if active_bundle_version="$(probe_active_bundle_version 2>/dev/null)"; then
                echo "Active app version for ${HANDLE}: ${active_bundle_version:-unavailable}"
                if [ "$active_bundle_version" = "$VERSION" ]; then
                  reconcile_preview_registration
                  if [ "$RELEASE_SMOKE" = "true" ]; then
                    verify_terminal_migration
                  fi
                  verify_preview_stability
                  echo "Preview ready: ${HANDLE} is healthy on ${VERSION}"
                  break
                fi
                if [ "$active_bundle_version" != "$VERSION" ]; then
                  if ! [[ "$HANDLE" =~ ^pr-[1-9][0-9]{0,9}$ ]] || [ "$transition_repair_attempted" != false ]; then
                    echo "Preview release metadata diverged from its active app after bounded repair." >&2
                    exit 1
                  fi
                  echo "Recovering the disposable preview from a pre-terminal-runtime updater transition."
                  restart_preview_sync_agent
                  transition_repair_attempted=true
                  sleep 10
                  code="$(attempt)"
                  if [ "$code" != "200" ]; then
                    echo "Exact-version transition repair deploy failed with HTTP ${code}." >&2
                    exit 1
                  fi
                  deadline=$((SECONDS + PREVIEW_INSTALL_TIMEOUT_SECONDS))
                  sleep 15
                  continue
                fi
              else
                echo "Active app version for ${HANDLE}: unavailable"
              fi
            fi
            if [ "$status" = "failed" ]; then
              echo "Preview ${HANDLE} failed while installing ${VERSION}." >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              collect_preview_diagnostics || true
              echo "Timed out waiting for ${HANDLE} to install ${VERSION} (last: status=${status}, healthy=${healthy}, version=${runtime_version})." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
        run: |
          set -euo pipefail
          body="**Preview VPS deployed**

          - Shell: https://app.matrix-os.com/vm/${HANDLE}
          - Bundle: \`${VERSION}\`
          - Logs (from the ops box): \`./scripts/preview-logs.sh --handle ${HANDLE}\` (enroll first with \`./scripts/enable-vps-logship.sh ${HANDLE} preview\`)

          The VPS is deleted when this PR closes, or by the daily reaper after ${PREVIEW_TTL_HOURS}h."
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("**Preview VPS deployed**"))] | .[0].id // ""')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
             gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
           fi

  diagnose_release:
    name: Diagnose released-bundle smoke lifecycle
    needs: gate
    if: needs.gate.outputs.action == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      HANDLE: ${{ needs.gate.outputs.handle }}
      VERSION: ${{ needs.gate.outputs.requested_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect sanitized gateway lifecycle evidence
        run: |
          set -euo pipefail
          runtime="$(curl --fail --silent --show-error --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL%/}/vps/fleet" |
            jq -c --arg h "$HANDLE" --arg v "$VERSION" '
              [.machines[] | select(.handle == $h and .runtimeSlot == $h and .status == "running"
                and .healthy == true and .runtimeVersion == $v and .deletedAt == null)] |
              if length == 1 then .[0] else error("released smoke runtime unavailable") end')"
          address="$(jq -er '.publicIPv4 | select(type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))' \
            <<< "$runtime")"
          runtime_token="$(PLATFORM_SIGNING_SECRET="$PLATFORM_SECRET" node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.env.PLATFORM_SIGNING_SECRET).update(process.argv[1]).digest("hex"));
          ' "$HANDLE")"
          echo "::add-mask::$runtime_token"
          read -r -d '' lifecycle_script <<'PYTHON' || true
          import datetime
          import json
          import re
          import subprocess

          properties = subprocess.run([
              "/usr/bin/systemctl", "show", "matrix-gateway.service",
              "--property=ActiveState", "--property=SubState", "--property=Result",
              "--property=NRestarts", "--property=ExecMainCode", "--property=ExecMainStatus",
              "--property=ExecMainStartTimestamp",
          ], check=True, timeout=10, capture_output=True, text=True).stdout
          current = {}
          for line in properties.splitlines():
              key, separator, value = line.partition("=")
              if separator:
                  current[key] = value

          journal = subprocess.run([
              "/usr/bin/journalctl", "--unit=matrix-gateway.service",
              "--since=2026-09-12 05:34:00 UTC", "--output=json", "--no-pager",
          ], check=True, timeout=15, capture_output=True, text=True).stdout
          events = []
          invocations = set()
          for raw in journal.splitlines():
              try:
                  entry = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              invocation = entry.get("_SYSTEMD_INVOCATION_ID")
              if isinstance(invocation, str) and re.fullmatch(r"[0-9a-f]{32}", invocation):
                  invocations.add(invocation)
              if entry.get("SYSLOG_IDENTIFIER") != "systemd" and entry.get("_COMM") != "systemd":
                  continue
              message = entry.get("MESSAGE")
              if not isinstance(message, str):
                  continue
              category = None
              if message.startswith("Starting "):
                  category = "starting"
              elif message.startswith("Started "):
                  category = "started"
              elif message.startswith("Stopping "):
                  category = "stopping"
              elif message.startswith("Stopped "):
                  category = "stopped"
              elif "Main process exited" in message:
                  category = "main_process_exited"
              elif "Failed with result" in message:
                  category = "failed"
              elif "Scheduled restart job" in message:
                  category = "automatic_restart_scheduled"
              if category is None:
                  continue
              timestamp = entry.get("__REALTIME_TIMESTAMP")
              if isinstance(timestamp, str) and timestamp.isdigit():
                  at = datetime.datetime.fromtimestamp(int(timestamp) / 1_000_000, datetime.timezone.utc).isoformat()
              else:
                  at = "unknown"
              events.append({"at": at, "category": category})

          def bounded_int(value):
              return int(value) if isinstance(value, str) and value.isdigit() and int(value) <= 1_000_000 else -1

          print(json.dumps({
              "gatewayLifecycle": events[-20:],
              "gatewayInvocationCount": len(invocations),
              "activeState": current.get("ActiveState", "unknown") if current.get("ActiveState") in {"active", "inactive", "failed"} else "unknown",
              "subState": current.get("SubState", "unknown") if current.get("SubState") in {"running", "dead", "failed", "auto-restart"} else "unknown",
              "result": current.get("Result", "unknown") if re.fullmatch(r"[a-z-]{1,32}", current.get("Result", "")) else "unknown",
              "nRestarts": bounded_int(current.get("NRestarts")),
              "execMainCode": bounded_int(current.get("ExecMainCode")),
              "execMainStatus": bounded_int(current.get("ExecMainStatus")),
              "currentStart": current.get("ExecMainStartTimestamp", "unknown")[:64],
          }, sort_keys=True))
          PYTHON
          body="$(jq -cn --arg script "$lifecycle_script" \
            '{command:["/usr/bin/sudo","/usr/bin/python3","-c",$script],timeoutMs:30000}')"
          curl --fail --silent --show-error --max-time 45 --insecure \
            --resolve "app.matrix-os.com:443:${address}" \
            -o /tmp/release-smoke-lifecycle.json -X POST 'https://app.matrix-os.com/api/terminal/run' \
            -H "authorization: Bearer ${runtime_token}" \
            -H 'content-type: application/json' --data-binary "$body"
          jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null) |
            .stdout | fromjson | select(.gatewayLifecycle | type == "array")' \
            /tmp/release-smoke-lifecycle.json >/dev/null
          jq -r '.stdout' /tmp/release-smoke-lifecycle.json

  verify_inventory:
    name: Verify preview computer inventory
    needs: gate
    if: needs.gate.outputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
      PREVIEW_CLERK_ACCESS_USER_IDS: ${{ secrets.PREVIEW_CLERK_ACCESS_USER_IDS }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://api.matrix-os.com' }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - name: Verify authenticated inventory projection
        run: |
          set -euo pipefail
          if [ -z "${CLERK_SECRET_KEY:-}" ] || [ -z "${PREVIEW_CLERK_USER_ID:-}" ]; then
            echo "Preview inventory verification is not configured." >&2
            exit 1
          fi
          access_user_ids="${PREVIEW_CLERK_ACCESS_USER_IDS:-[]}"
          if ! preview_user_ids_json="$(jq -ce --arg owner "$PREVIEW_CLERK_USER_ID" '
            if (
              type == "array" and length <= 8
              and all(.[]; type == "string" and test("^user_[A-Za-z0-9]+$"))
              and (unique | length) == length
              and (index($owner) == null)
            ) then [$owner] + . else error("invalid access list") end
          ' <<< "$access_user_ids")"; then
            echo "PREVIEW_CLERK_ACCESS_USER_IDS must be a JSON array of up to eight unique non-owner Clerk user IDs." >&2
            exit 1
          fi
          mapfile -t preview_user_ids < <(jq -r '.[]' <<< "$preview_user_ids_json")
          for preview_user_id in "${preview_user_ids[@]}"; do
            if ! printf '%s' "$preview_user_id" | grep -Eq '^user_[A-Za-z0-9]+$'; then
              echo "Preview inventory verification user is invalid." >&2
              exit 1
            fi
            user_code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://api.clerk.com/v1/users/${preview_user_id}" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10")"
            if [ "$user_code" != "200" ]; then
              echo "Configured preview verification user is unavailable (HTTP ${user_code})." >&2
              exit 1
            fi

            sessions_code="$(curl -sS --max-time 30 -o /tmp/clerk-sessions.json -w '%{http_code}' \
              "https://api.clerk.com/v1/sessions?user_id=${preview_user_id}&status=active&limit=10" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10")"
            if [ "$sessions_code" != "200" ]; then
              echo "Active preview verification sessions are unavailable (HTTP ${sessions_code})." >&2
              exit 1
            fi
            session_id="$(jq -er 'sort_by(.last_active_at // 0) | reverse | .[0].id | select(type == "string" and test("^sess_[A-Za-z0-9]+$"))' /tmp/clerk-sessions.json)"
            token_code="$(curl -sS --max-time 30 -o /tmp/clerk-token.json -w '%{http_code}' \
              -X POST "https://api.clerk.com/v1/sessions/${session_id}/tokens" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10" \
              -H "content-type: application/json" \
              --data-binary '{"expires_in_seconds":60}')"
            if [ "$token_code" != "200" ]; then
              echo "Preview verification token is unavailable (HTTP ${token_code})." >&2
              exit 1
            fi
            session_token="$(jq -er '.jwt | select(type == "string" and length <= 8192)' /tmp/clerk-token.json)"

            inventory_code="$(curl -sS --max-time 30 -o /tmp/computers.json -w '%{http_code}' \
              "${PLATFORM_PUBLIC_URL}/api/auth/computers" \
              -H "authorization: Bearer ${session_token}")"
            if [ "$inventory_code" != "200" ]; then
              echo "Authenticated computer inventory is unavailable." >&2
              exit 1
            fi
            if ! jq -e --arg h "$HANDLE" \
              '[.items[] | select(.handle == $h and .runtimeSlot == $h and .kind == "preview")] | length == 1' \
              /tmp/computers.json > /dev/null; then
              echo "Preview computer is not selectable in the authenticated inventory." >&2
              exit 1
            fi
            echo "Verified ${HANDLE} in the authenticated computer inventory for ${preview_user_id}."
          done

  teardown:
    name: Teardown preview VPS
    needs: gate
    if: needs.gate.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - name: Delete preview VPS
        run: |
          set -euo pipefail
          machine_id="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -r --arg h "$HANDLE" \
              '[.machines[] | select(.handle == $h and .status != "deleted" and .deletedAt == null)] | .[0].machineId // ""')"
          if [ -z "$machine_id" ]; then
            echo "No active VPS for ${HANDLE}; nothing to tear down."
            exit 0
          fi
          code="$(curl -sS --max-time 60 -o /tmp/delete.json -w '%{http_code}' \
            -X DELETE "${PLATFORM_PUBLIC_URL}/vps/${machine_id}" \
            -H "authorization: Bearer ${PLATFORM_SECRET}")"
          if [ "$code" != "200" ]; then
            echo "Delete failed with HTTP ${code} (body in workflow log)" >&2
            cat /tmp/delete.json >&2
            exit 1
          fi
          echo "Deleted ${HANDLE} (${machine_id})"

  reaper:
    name: Reap stale preview VPSes
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete previews for closed PRs and expired previews
        run: |
          set -euo pipefail
          now="$(date +%s)"
          ttl_secs=$((PREVIEW_TTL_HOURS * 3600))
          lookup_failures=/tmp/reaper-lookup-failures
          delete_failures=/tmp/reaper-delete-failures
          : > "$lookup_failures"
          : > "$delete_failures"
          curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -c '.machines[] | select((.handle | test("^pr-[0-9]+$")) and .status != "deleted" and .deletedAt == null)' |
            while IFS= read -r machine; do
              handle="$(jq -r .handle <<< "$machine")"
              machine_id="$(jq -r .machineId <<< "$machine")"
              provisioned="$(jq -r '.provisionedAt // empty' <<< "$machine")"
              pr="${handle#pr-}"
              pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .state 2>/dev/null || echo unknown)"
              # Fail-safe: never delete on unconfirmed PR state (spec 093).
              if [ "$pr_state" = "unknown" ]; then
                echo "Skipping ${handle}: could not confirm PR #${pr} state" >&2
                echo "$handle" >> "$lookup_failures"
                continue
              fi
              reason=""
              if [ "$pr_state" = "closed" ]; then
                reason="PR #${pr} is closed"
              # failed/provisioning VPSes can have a null provisionedAt; a
              # date crash here would abort the whole sweep under set -e.
              elif provisioned_epoch="$(date -d "$provisioned" +%s 2>/dev/null)" && [ -n "$provisioned" ]; then
                age=$((now - provisioned_epoch))
                if [ "$age" -gt "$ttl_secs" ]; then
                  reason="older than ${PREVIEW_TTL_HOURS}h"
                else
                  echo "Keeping ${handle} (PR ${pr_state}, age $((age / 3600))h)"
                  continue
                fi
              else
                echo "Keeping ${handle} (PR ${pr_state}, no valid provisionedAt; age-based reaping skipped)"
                continue
              fi
              echo "Reaping ${handle}: ${reason}"
              code="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' \
                -X DELETE "${PLATFORM_PUBLIC_URL}/vps/${machine_id}" \
                -H "authorization: Bearer ${PLATFORM_SECRET}")"
              if [ "$code" != "200" ]; then
                echo "Failed to delete ${handle} (HTTP ${code})" >&2
                echo "$handle" >> "$delete_failures"
              fi
            done
          failed=0
          if [ -s "$lookup_failures" ]; then
            echo "Reaper could not confirm PR state for: $(tr '\n' ' ' < "$lookup_failures")" >&2
            echo "Those VPSes were skipped (fail-safe)." >&2
            failed=1
          fi
          if [ -s "$delete_failures" ]; then
            echo "Reaper could not delete: $(tr '\n' ' ' < "$delete_failures")" >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Failing the job so skips/failed deletes are visible instead of silently accumulating cost." >&2
            exit 1
          fi
