# Preview VPS per PR (spec 093)
#
# Label a same-repo PR with `preview-vps` to get a disposable Hetzner VPS
# running that PR's host bundle, reachable at app.matrix-os.com/vm/pr-<N>.
#
# Flow:
#   deploy   — on label / push while labeled: build bundle v<date>-pr<N>-<sha7>,
#              publish register-only (--channel none, never promoted),
#              provision pr-<N> if absent, deploy the exact version, comment.
#   teardown — on PR close: delete the pr-<N> VPS.
#   reaper   — daily: delete any pr-* VPS whose PR is closed or older than 72h,
#              so orphans cannot accumulate Hetzner cost.
#
# Centralized logs: enroll once from the ops box with
#   ./scripts/enable-vps-logship.sh pr-<N> preview
# then query with ./scripts/preview-logs.sh --handle pr-<N>.

name: Preview VPS

on:
  pull_request:
    types: [labeled, synchronize, reopened, closed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to deploy a preview VPS for"
        required: true
        type: string
      version:
        description: "Optional existing version pinned to this PR head"
        required: false
        type: string
      verify_inventory:
        description: "Only verify the deployed preview in the authenticated computer inventory"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-vps-${{ github.event.pull_request.number || inputs.pr || 'reaper' }}
  cancel-in-progress: ${{ github.event.action != 'closed' && github.event_name != 'schedule' }}

env:
  PREVIEW_TTL_HOURS: 72

jobs:
  gate:
    name: Gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decide.outputs.action }}
      pr: ${{ steps.decide.outputs.pr }}
      handle: ${{ steps.decide.outputs.handle }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      requested_version: ${{ steps.decide.outputs.requested_version }}
    steps:
      - name: Decide action
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          LABELED_NAME: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview-vps') }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          VERIFY_INVENTORY: ${{ inputs.verify_inventory }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action="skip"
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Invalid PR number" >&2
            exit 1
          fi

          head_sha="$EVENT_HEAD_SHA"
          base_sha="$EVENT_BASE_SHA"
          head_ref="$EVENT_HEAD_REF"
          head_repo="$EVENT_HEAD_REPO"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            head_sha="$(jq -r .head.sha <<< "$pr_json")"
            base_sha="$(jq -r .base.sha <<< "$pr_json")"
            head_ref="$(jq -r .head.ref <<< "$pr_json")"
            head_repo="$(jq -r .head.repo.full_name <<< "$pr_json")"
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PRs never get preview VPSes (secrets are not exposed to them anyway)."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$VERIFY_INVENTORY" = "true" ]; then
              action="verify"
            elif [ -n "$REQUESTED_VERSION" ]; then
              action="deploy_existing"
            else
              action="deploy"
            fi
          elif [ "$EVENT_ACTION" = "closed" ]; then
            if [ "$HAS_LABEL" = "true" ]; then action="teardown"; fi
          elif [ "$EVENT_ACTION" = "labeled" ]; then
            if [ "$LABELED_NAME" = "preview-vps" ]; then action="deploy"; fi
          elif [ "$HAS_LABEL" = "true" ]; then
            action="deploy"
          fi
          if [ "$action" != "skip" ] && ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid PR head SHA" >&2
            exit 1
          fi
          if [ "$action" = "deploy" ] && ! printf '%s' "$base_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid PR base SHA" >&2
            exit 1
          fi
          if [ "$action" = "deploy_existing" ]; then
            if ! printf '%s' "$REQUESTED_VERSION" |
              grep -Eq "^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-pr${PR_NUMBER}-([0-9]+-[0-9]+-)?[0-9a-f]{7}$" ||
              [ "${REQUESTED_VERSION##*-}" != "${head_sha:0:7}" ]; then
              echo "Invalid pinned preview version" >&2
              exit 1
            fi
          fi
          {
            echo "action=$action"
            echo "pr=$PR_NUMBER"
            echo "handle=pr-$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "requested_version=$REQUESTED_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "action=$action pr=$PR_NUMBER"

  build:
    name: Build preview bundle
    needs: gate
    if: needs.gate.outputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN || vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://eu.posthog.com' }}
      NEXT_PUBLIC_POSTHOG_API_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_API_HOST || '/relay' }}
      MATRIX_TERMINAL_RUNTIME_SPIKE: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
      bootstrap_version: ${{ steps.version.outputs.bootstrap_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install patched Zellij build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt \
            --target x86_64-unknown-linux-musl
          rustup default 1.92.0

      - name: Build verified production Zellij
        run: |
          set -euo pipefail
          ./scripts/terminal-runtime/zellij/build.sh "$RUNNER_TEMP/matrix-zellij"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: 28
          elixir-version: 1.19

      - name: Validate public build environment
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi
          if [ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" = "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k" ]; then
            echo "Refusing to build a preview bundle with the example Clerk key." >&2
            exit 1
          fi

      - name: Generate preview version
        id: version
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
          REQUESTED_VERSION: ${{ needs.gate.outputs.requested_version }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-v$(date -u +%Y.%m.%d)-pr${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${HEAD_SHA:0:7}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- \
            packages/gateway/src/shell/runtime-client.ts |
            grep -F 'return nodeEnv === "production" ? "supervised" : "legacy";' >/dev/null; then
            echo "bootstrap_version=v$(date -u +%Y.%m.%d)-pr${PR_NUMBER}-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BASE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
          echo "Preview version: $VERSION"

      - name: Build dormant parent bootstrap bundle
        if: steps.version.outputs.bootstrap_version != ''
        env:
          HOST_BUNDLE_VERSION: ${{ steps.version.outputs.bootstrap_version }}
          HOST_BUNDLE_CHANNEL: none
          MATRIX_BUILD_SHA: ${{ needs.gate.outputs.base_sha }}
          MATRIX_BUILD_REF: bootstrap
          HOST_BUNDLE_ZELLIJ_BUILD_DIR: ${{ runner.temp }}/matrix-zellij
        run: |
          set -euo pipefail
          cp distro/customer-vps/host-bin/matrix-terminal-spike-control "$RUNNER_TEMP/"
          cp distro/customer-vps/systemd/matrix-terminal-activation-watch@.service "$RUNNER_TEMP/"
          git checkout --detach "${{ needs.gate.outputs.base_sha }}"
          cp "$RUNNER_TEMP/matrix-terminal-spike-control" distro/customer-vps/host-bin/
          cp "$RUNNER_TEMP/matrix-terminal-activation-watch@.service" distro/customer-vps/systemd/
          ./scripts/build-host-bundle.sh
          mv dist/host-bundle dist/bootstrap
          rm -f distro/customer-vps/host-bin/matrix-terminal-spike-control
          rm -f distro/customer-vps/systemd/matrix-terminal-activation-watch@.service
          git checkout --detach "${{ needs.gate.outputs.head_sha }}"
      - name: Build host bundle
        env:
          HOST_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
          HOST_BUNDLE_CHANNEL: none
          MATRIX_BUILD_SHA: ${{ needs.gate.outputs.head_sha }}
          MATRIX_BUILD_REF: ${{ needs.gate.outputs.head_ref }}
          HOST_BUNDLE_ZELLIJ_BUILD_DIR: ${{ runner.temp }}/matrix-zellij
        run: |
          set -euo pipefail
          ./scripts/build-host-bundle.sh
          mv dist/host-bundle dist/activation

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-bundle-${{ needs.gate.outputs.pr }}
          path: |
            dist/activation/matrix-host-bundle.tar.gz
            dist/activation/matrix-host-bundle.tar.gz.sha256
            dist/activation/incremental-manifest.json
            dist/activation/objects/**
            dist/activation/manifest.json
            dist/activation/release.json
            dist/bootstrap/matrix-host-bundle.tar.gz
            dist/bootstrap/matrix-host-bundle.tar.gz.sha256
            dist/bootstrap/incremental-manifest.json
            dist/bootstrap/objects/**
            dist/bootstrap/manifest.json
            dist/bootstrap/release.json
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish and deploy preview VPS
    needs: [gate, build]
    if: always() && ((needs.gate.outputs.action == 'deploy' && needs.build.result == 'success') || needs.gate.outputs.action == 'deploy_existing')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_BUNDLES_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BUNDLES_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BUNDLES_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUNDLES_BUCKET || vars.R2_BUCKET || 'matrixos-sync' }}
      R2_ENDPOINT: ${{ vars.R2_BUNDLES_ENDPOINT || vars.R2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.R2_BUNDLES_ACCOUNT_ID || secrets.R2_ACCOUNT_ID) }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
      PREVIEW_CLERK_ACCESS_USER_IDS: ${{ secrets.PREVIEW_CLERK_ACCESS_USER_IDS }}
      HANDLE: ${{ needs.gate.outputs.handle }}
      PR_NUMBER: ${{ needs.gate.outputs.pr }}
      VERSION: ${{ needs.gate.outputs.action == 'deploy_existing' && needs.gate.outputs.requested_version || needs.build.outputs.version }}
      BOOTSTRAP_VERSION: ${{ needs.build.outputs.bootstrap_version }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      BASE_SHA: ${{ needs.gate.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        if: needs.gate.outputs.action == 'deploy'
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - name: Download bundle artifact
        if: needs.gate.outputs.action == 'deploy'
        uses: actions/download-artifact@v8
        with:
          name: preview-bundle-${{ needs.gate.outputs.pr }}
          path: dist

      - name: Publish releases (register-only, no channel)
        if: needs.gate.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          for phase in ${BOOTSTRAP_VERSION:+bootstrap} activation; do
            phase_version="$VERSION"
            [ "$phase" = bootstrap ] && phase_version="$BOOTSTRAP_VERSION"
            rm -rf dist/host-bundle
            cp -a "dist/$phase" dist/host-bundle
            ./scripts/publish-release.sh "$phase_version" --channel none \
              --changelog "Preview bundle for PR #${{ needs.gate.outputs.pr }}"
          done

      - name: Provision or resume preview VPS
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_CLERK_USER_ID:-}" ]; then
            echo "PREVIEW_CLERK_USER_ID secret is not configured." >&2
            exit 1
          fi
          access_user_ids="${PREVIEW_CLERK_ACCESS_USER_IDS:-[]}"
          if ! jq -e --arg owner "$PREVIEW_CLERK_USER_ID" '
            type == "array" and length <= 8
            and all(.[]; type == "string" and test("^user_[A-Za-z0-9]+$"))
            and (unique | length) == length
            and (index($owner) == null)
          ' <<< "$access_user_ids" > /dev/null; then
            echo "PREVIEW_CLERK_ACCESS_USER_IDS must be a JSON array of up to eight unique non-owner Clerk user IDs." >&2
            exit 1
          fi

          fleet_machine="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -c --arg h "$HANDLE" \
              '[.machines[]
                | select(.handle == $h and .status != "deleted")
                | . + { _preview_rank:
                    (if .status == "running" then 0
                     elif .status == "provisioning" then 1
                     elif .status == "failed" then 2
                     else 3 end) }]
               | sort_by(._preview_rank, (if .runtimeSlot == $h then 0 else 1 end), .provisionedAt)
               | (.[0] // {status: "absent", machineId: ""})
               | del(._preview_rank)')"
          status="$(jq -r '.status' <<< "$fleet_machine")"
          runtime_slot="$(jq -r '.runtimeSlot // ""' <<< "$fleet_machine")"
          echo "Fleet status for ${HANDLE}: ${status}"

          case "$status" in
            provisioning|running)
              if [ "$runtime_slot" = "$HANDLE" ]; then
                echo "Reusing existing ${HANDLE} preview (${status})"
              else
                echo "Active ${HANDLE} requires exact-slot adoption from ${runtime_slot:-unset}"
              fi
              ;;
            absent|failed)
              echo "Preview ${HANDLE} requires provisioning or retry"
              ;;
            *)
              echo "Preview ${HANDLE} is in an unsupported state (${status})." >&2
              exit 1
              ;;
          esac

          # The idempotent provision call also reconciles the complete access
          # allowlist on already-running previews.
          provision_body="$(jq -cn \
            --arg owner "$PREVIEW_CLERK_USER_ID" \
            --arg handle "$HANDLE" \
            --argjson access "$access_user_ids" \
            '{clerkUserId: $owner, handle: $handle, runtimeSlot: $handle, accessClerkUserIds: $access}')"
          code="$(curl -sS --max-time 60 -o /tmp/provision.json -w '%{http_code}' \
            -X POST "${PLATFORM_PUBLIC_URL}/vps/preview/provision" \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            -H "content-type: application/json" \
            --data-binary "$provision_body")"
          if [ "$code" != "202" ]; then
            echo "Preview provision failed with HTTP ${code}." >&2
            exit 1
          fi
          if ! accepted_machine_id="$(jq -er '
            if (
              type == "object"
              and (.machineId | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))
              and (.status == "provisioning" or .status == "running")
              and (.etaSeconds | type == "number" and . >= 0)
            ) then .machineId else error("invalid response") end
          ' /tmp/provision.json)"; then
            echo "Preview provision returned an invalid response." >&2
            exit 1
          fi

          status="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -r --arg h "$HANDLE" --arg id "$accepted_machine_id" \
              '[.machines[] | select(.handle == $h and .machineId == $id and .runtimeSlot == $h)] | .[0].status // "absent"')"
          echo "Immediate fleet visibility for ${HANDLE}: ${status}"
          if [ "$status" != "provisioning" ] && [ "$status" != "running" ]; then
            echo "Accepted preview machine is not durably visible in the fleet." >&2
            exit 1
          fi

          if [ "$status" = "provisioning" ]; then
            echo "Waiting for the VPS to come up..."
            deadline=$((SECONDS + 600))
            while true; do
              sleep 15
              status="$(curl -fsS --max-time 30 \
                -H "authorization: Bearer ${PLATFORM_SECRET}" \
                "${PLATFORM_PUBLIC_URL}/vps/fleet" |
                jq -r --arg h "$HANDLE" --arg id "$accepted_machine_id" \
                  '[.machines[] | select(.handle == $h and .machineId == $id)] | .[0].status // "absent"')"
              [ "$status" = "running" ] && break
              if [ "$status" = "failed" ]; then
                echo "Provisioning failed for ${HANDLE}" >&2
                exit 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "Timed out waiting for ${HANDLE} to reach running (last: ${status})" >&2
                exit 1
              fi
              sleep 15
            done
          fi

      - name: Deploy preview bundles to preview VPS
        run: |
          set -euo pipefail
          attempt() {
            local target_version="$1"
            curl -sS --max-time 120 -o /tmp/deploy.json -w '%{http_code}' \
              -X POST "${PLATFORM_PUBLIC_URL}/vps/deploy" \
              -H "authorization: Bearer ${PLATFORM_SECRET}" \
              -H "content-type: application/json" \
              -d "{\"version\":\"${target_version}\",\"handle\":\"${HANDLE}\"}"
          }
          gateway_token="$(node --input-type=module -e 'import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.argv[2]).update(process.argv[1]).digest("hex"));' "$HANDLE" "$PLATFORM_SECRET")"
          echo "::add-mask::$gateway_token"
          diagnostic_body="$(jq -cn '{command:["/opt/matrix/bin/matrix-update","diagnose"],timeoutMs:10000}')"
          is_public_ipv4() {
            node -e '
              const parts = process.argv[1].split(".").map(Number);
              const valid = parts.length === 4 && parts.every((part) => Number.isInteger(part) && part >= 0 && part <= 255);
              process.exit(!valid || parts[0] === 0 || parts[0] === 10 || parts[0] === 127 || parts[0] >= 224 ||
                (parts[0] === 169 && parts[1] === 254) || (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
                (parts[0] === 192 && parts[1] === 168) ? 1 : 0);
            ' "$1"
          }
          updater_diagnostic() {
            local address="$1" code diagnostic_response="$RUNNER_TEMP/preview-updater-diagnostic.json"
            if ! is_public_ipv4 "$address"; then
              return 1
            fi
            rm -f -- "$diagnostic_response"
            code="$(curl --silent --show-error --max-time 30 --connect-timeout 10 --insecure \
              --resolve "app.matrix-os.com:443:${address}" -o "$diagnostic_response" -w '%{http_code}' \
              -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" \
              -H 'content-type: application/json' --data-binary "$diagnostic_body")" || return 1
            [ "$code" = 200 ] &&
              jq -er 'if (
                type == "object" and .exitCode == 0 and
                .timedOut == false and .truncated == false and
                .signal == null and .stderr == "" and
                (.stdout | test("^Update service: (?:idle|running|failed) phase=[a-z_]+ failure=(?:none|[a-z0-9_]+)\\n$"))
              ) then .stdout | rtrimstr("\n") else empty end' "$diagnostic_response"
          }
          updater_idle() {
            local diagnostic
            diagnostic="$(updater_diagnostic "$1")" || return 1
            [ "$diagnostic" = "Update service: idle phase=idle failure=none" ]
          }
          preview_gateway_ready() {
            local address="$1" response="$RUNNER_TEMP/preview-gateway-ready.json" body
            is_public_ipv4 "$address" || return 1
            body="$(jq -cn '{command:["/usr/bin/true"],timeoutMs:10000}')"
            curl --fail --silent --show-error --max-time 30 --connect-timeout 10 --insecure \
              --resolve "app.matrix-os.com:443:${address}" -o "$response" \
              -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" \
              -H 'content-type: application/json' --data-binary "$body" &&
              jq -e '
                .exitCode == 0 and .timedOut == false and .truncated == false and
                .signal == null and .stdout == "" and .stderr == ""
              ' "$response" >/dev/null
          }
          wait_for_preview_gateway() {
            local address="$1" deadline=$((SECONDS + 600))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if preview_gateway_ready "$address"; then return 0; fi
              sleep 10
            done
            return 1
          }
          classify_activation_watch_response() {
            local response="$1" code="$2"
            if [ "$code" != 200 ] || ! jq -e 'type == "object"' "$response" >/dev/null 2>&1; then
              echo gateway_unavailable
              return
            fi
            jq -r '
              if .exitCode == 0 and .timedOut == false and .truncated == false and
                .signal == null and .stderr == "" and .stdout == "activation_watch_armed\n"
              then "armed"
              elif ((.stderr // "") | test("spike_control_[a-z0-9_]+"))
              then ((.stderr // "") | capture("(?<code>spike_control_[a-z0-9_]+)").code)
              elif ((.stderr // "") | test("sudo:"))
              then "sudo_rejected"
              elif .exitCode == 127
              then "helper_unavailable"
              elif ((.exitCode // 0) != 0)
              then "helper_failed"
              else "invalid_response"
              end
            ' "$response" 2>/dev/null || echo invalid_response
          }
          arm_activation_watch() {
            local address="$1" response="$RUNNER_TEMP/activation-watch.json" code body
            body="$(jq -cn --arg head "$HEAD_SHA" \
              '{command:["/usr/bin/sudo","/opt/matrix/bin/matrix-terminal-spike-control","activation-watch-arm",$head],timeoutMs:10000}')"
            code="$(curl --silent --show-error --max-time 30 --connect-timeout 10 --insecure \
              --resolve "app.matrix-os.com:443:${address}" -o "$response" -w '%{http_code}' \
              -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" \
              -H 'content-type: application/json' --data-binary "$body")" ||
              code=000
            activation_watch_diagnostic="$(classify_activation_watch_response "$response" "$code")"
            [ "$activation_watch_diagnostic" = armed ]
          }
          activation_watch_status() {
            local address="$1" response="$RUNNER_TEMP/activation-watch-status.json" body
            body="$(jq -cn --arg head "$HEAD_SHA" \
              '{command:["/usr/bin/sudo","/opt/matrix/bin/matrix-terminal-spike-control","activation-watch-status",$head],timeoutMs:10000}')"
            curl --fail --silent --show-error --max-time 30 --connect-timeout 10 --insecure \
              --resolve "app.matrix-os.com:443:${address}" -o "$response" \
              -X POST 'https://app.matrix-os.com/api/terminal/run' \
              -H "authorization: Bearer ${gateway_token}" \
              -H 'content-type: application/json' --data-binary "$body" &&
              jq -er '.stdout | select(test("^activation_watch_(?:pending|success|timeout state=(?:idle|running|failed|unknown) phase=[a-z_]+ failure=(?:none|[a-z0-9_]+) gateway=(?:active|activating|failed|inactive|unknown) supervisor=(?:active|activating|failed|inactive|unknown) recovery=(?:rollback|rescue) gateway_reason=(?:none|supervisor_unavailable|permission_denied|module_unavailable|native_module_unavailable|schema_invalid|address_in_use|type_error|reference_error|syntax_error|resource_exhausted|unknown) gateway_status=(?:0|[1-9][0-9]{0,2}) supervisor_during_health=(?:active|activating|failed|inactive|unknown))\\n$")) | rtrimstr("\n")' "$response"
          }
          activation_watch_armed=false
          activation_watch_diagnostic=unavailable
          fleet="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet")"
          address="$(jq -er --arg handle "$HANDLE" '
            [.machines[] | select(.handle == $handle and .runtimeSlot == $handle)]
            | if length == 1 then .[0].publicIPv4 else error("preview_unavailable") end
          ' <<<"$fleet")"
          if ! wait_for_preview_gateway "$address"; then
            echo "Preview gateway did not become ready before bundle deployment." >&2
            exit 1
          fi
          for target_version in ${BOOTSTRAP_VERSION:+"$BOOTSTRAP_VERSION"} "$VERSION"; do
            if [ -n "$BOOTSTRAP_VERSION" ] && [ "$target_version" = "$BOOTSTRAP_VERSION" ]; then
              fleet="$(curl -fsS --max-time 30 \
                -H "authorization: Bearer ${PLATFORM_SECRET}" \
                "${PLATFORM_PUBLIC_URL}/vps/fleet")"
              machine="$(jq -ce --arg handle "$HANDLE" '
                  [.machines[] | select(.handle == $handle and .runtimeSlot == $handle)]
                  | if length == 1 then .[0] else {} end
                ' <<<"$fleet")"
              deployed="$(jq -r '.runtimeVersion // ""' <<<"$machine")"
              address="$(jq -r '.publicIPv4 // ""' <<<"$machine")"
              if {
                [[ "$deployed" == *"-${BASE_SHA:0:7}" ]] ||
                  [[ "$deployed" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-pr${PR_NUMBER}-([0-9]+-[0-9]+-)?[0-9a-f]{7}$ ]]
              } &&
                updater_idle "$address"; then
                echo "Reusing the exact dormant parent already installed on the preview."
                continue
              fi
            fi
            deploy_deadline=$((SECONDS + 4500))
            deploy_converged=false
            version_seen=false
            last_signal=$((SECONDS - 60))
            activation_arm_deadline=$((SECONDS + 120))
            while [ "$SECONDS" -lt "$deploy_deadline" ]; do
              if [ -n "$BOOTSTRAP_VERSION" ] && [ "$target_version" = "$VERSION" ] &&
                [ "$activation_watch_armed" != true ]; then
                if arm_activation_watch "$address"; then
                  activation_watch_armed=true
                elif [ "$SECONDS" -ge "$activation_arm_deadline" ]; then
                  echo "Activation watchdog could not be armed before deployment: ${activation_watch_diagnostic}." >&2
                  exit 1
                else
                  echo "Waiting for the activation helper boundary."
                  sleep 2
                  continue
                fi
              fi
              if [ "$version_seen" != true ] && [ $((SECONDS - last_signal)) -ge 60 ]; then
                last_signal="$SECONDS"
                code=""
                if ! code="$(attempt "$target_version")"; then
                  code=000
                fi
                if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                  echo "Preview deploy authorization failed." >&2
                  exit 1
                fi
                if [ "$code" = "200" ] &&
                  jq -e --arg handle "$HANDLE" '
                    .triggered == 1 and .failed == 0 and (.results | length) == 1
                    and .results[0].handle == $handle
                    and .results[0].status == "triggered"
                  ' /tmp/deploy.json >/dev/null; then
                  jq '{triggered, failed, results: [.results[] | {handle, status}]}' \
                    /tmp/deploy.json
                else
                  echo "Waiting for the preview update boundary."
                fi
              fi

              if fleet="$(curl -fsS --max-time 30 \
                -H "authorization: Bearer ${PLATFORM_SECRET}" \
                "${PLATFORM_PUBLIC_URL}/vps/fleet")"; then
                machine="$(jq -ce --arg handle "$HANDLE" '
                    [.machines[] | select(.handle == $handle and .runtimeSlot == $handle)]
                    | if length == 1 then .[0] else {} end
                  ' <<<"$fleet")"
                deployed="$(jq -r '.runtimeVersion // ""' <<<"$machine")"
                address="$(jq -r '.publicIPv4 // ""' <<<"$machine")"
                if [ -n "$BOOTSTRAP_VERSION" ] && [ "$target_version" = "$VERSION" ]; then
                  if [ "$activation_watch_armed" != true ]; then
                    echo "Activation watchdog has not been armed."
                    sleep 2
                    continue
                  fi
                  watch="$(activation_watch_status "$address" || true)"
                  if [[ "$watch" == activation_watch_timeout* ]]; then
                    echo "$watch" >&2
                    exit 1
                  fi
                  if [ "$watch" != activation_watch_success ]; then
                    echo "Activation watchdog did not prove the candidate healthy."
                    sleep 15
                    continue
                  fi
                fi
                if [ "$deployed" = "$target_version" ]; then
                  version_seen=true
                  if updater_idle "$address"; then
                    deploy_converged=true
                    break
                  fi
                  echo "Waiting for the preview updater to become idle."
                else
                  updater_diagnostic_result=""
                  if updater_diagnostic_result="$(updater_diagnostic "$address")"; then
                    case "$updater_diagnostic_result" in
                      "Update service: failed phase=failed failure="*)
                        echo "Preview updater failed after rollback: ${updater_diagnostic_result}" >&2
                        exit 1
                        ;;
                    esac
                  fi
                fi
              fi
              sleep 15
            done
            if [ "$deploy_converged" != true ]; then
              echo "Deployment of ${target_version} did not converge." >&2
              exit 1
            fi
          done

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
        run: |
          set -euo pipefail
          body="**Preview VPS deployed**

          - Shell: https://app.matrix-os.com/vm/${HANDLE}
          - Bundle: \`${VERSION}\`
          - Logs (from the ops box): \`./scripts/preview-logs.sh --handle ${HANDLE}\` (enroll first with \`./scripts/enable-vps-logship.sh ${HANDLE} preview\`)

          The VPS is deleted when this PR closes, or by the daily reaper after ${PREVIEW_TTL_HOURS}h."
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("**Preview VPS deployed**"))] | .[0].id // ""')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
             gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
           fi

  verify_inventory:
    name: Verify preview computer inventory
    needs: gate
    if: needs.gate.outputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
      PREVIEW_CLERK_ACCESS_USER_IDS: ${{ secrets.PREVIEW_CLERK_ACCESS_USER_IDS }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://api.matrix-os.com' }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - name: Verify authenticated inventory projection
        run: |
          set -euo pipefail
          if [ -z "${CLERK_SECRET_KEY:-}" ] || [ -z "${PREVIEW_CLERK_USER_ID:-}" ]; then
            echo "Preview inventory verification is not configured." >&2
            exit 1
          fi
          access_user_ids="${PREVIEW_CLERK_ACCESS_USER_IDS:-[]}"
          if ! preview_user_ids_json="$(jq -ce --arg owner "$PREVIEW_CLERK_USER_ID" '
            if (
              type == "array" and length <= 8
              and all(.[]; type == "string" and test("^user_[A-Za-z0-9]+$"))
              and (unique | length) == length
              and (index($owner) == null)
            ) then [$owner] + . else error("invalid access list") end
          ' <<< "$access_user_ids")"; then
            echo "PREVIEW_CLERK_ACCESS_USER_IDS must be a JSON array of up to eight unique non-owner Clerk user IDs." >&2
            exit 1
          fi
          mapfile -t preview_user_ids < <(jq -r '.[]' <<< "$preview_user_ids_json")
          for preview_user_id in "${preview_user_ids[@]}"; do
            if ! printf '%s' "$preview_user_id" | grep -Eq '^user_[A-Za-z0-9]+$'; then
              echo "Preview inventory verification user is invalid." >&2
              exit 1
            fi
            user_code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://api.clerk.com/v1/users/${preview_user_id}" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10")"
            if [ "$user_code" != "200" ]; then
              echo "Configured preview verification user is unavailable (HTTP ${user_code})." >&2
              exit 1
            fi

            sessions_code="$(curl -sS --max-time 30 -o /tmp/clerk-sessions.json -w '%{http_code}' \
              "https://api.clerk.com/v1/sessions?user_id=${preview_user_id}&status=active&limit=10" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10")"
            if [ "$sessions_code" != "200" ]; then
              echo "Active preview verification sessions are unavailable (HTTP ${sessions_code})." >&2
              exit 1
            fi
            session_id="$(jq -er 'sort_by(.last_active_at // 0) | reverse | .[0].id | select(type == "string" and test("^sess_[A-Za-z0-9]+$"))' /tmp/clerk-sessions.json)"
            token_code="$(curl -sS --max-time 30 -o /tmp/clerk-token.json -w '%{http_code}' \
              -X POST "https://api.clerk.com/v1/sessions/${session_id}/tokens" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10" \
              -H "content-type: application/json" \
              --data-binary '{"expires_in_seconds":60}')"
            if [ "$token_code" != "200" ]; then
              echo "Preview verification token is unavailable (HTTP ${token_code})." >&2
              exit 1
            fi
            session_token="$(jq -er '.jwt | select(type == "string" and length <= 8192)' /tmp/clerk-token.json)"

            inventory_code="$(curl -sS --max-time 30 -o /tmp/computers.json -w '%{http_code}' \
              "${PLATFORM_PUBLIC_URL}/api/auth/computers" \
              -H "authorization: Bearer ${session_token}")"
            if [ "$inventory_code" != "200" ]; then
              echo "Authenticated computer inventory is unavailable." >&2
              exit 1
            fi
            if ! jq -e --arg h "$HANDLE" \
              '[.items[] | select(.handle == $h and .runtimeSlot == $h and .kind == "preview")] | length == 1' \
              /tmp/computers.json > /dev/null; then
              echo "Preview computer is not selectable in the authenticated inventory." >&2
              exit 1
            fi
            echo "Verified ${HANDLE} in the authenticated computer inventory for ${preview_user_id}."
          done

  teardown:
    name: Teardown preview VPS
    needs: gate
    if: needs.gate.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - name: Delete preview VPS
        run: |
          set -euo pipefail
          machine_id="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -r --arg h "$HANDLE" \
              '[.machines[] | select(.handle == $h and .status != "deleted")] | .[0].machineId // ""')"
          if [ -z "$machine_id" ]; then
            echo "No active VPS for ${HANDLE}; nothing to tear down."
            exit 0
          fi
          code="$(curl -sS --max-time 60 -o /tmp/delete.json -w '%{http_code}' \
            -X DELETE "${PLATFORM_PUBLIC_URL}/vps/${machine_id}" \
            -H "authorization: Bearer ${PLATFORM_SECRET}")"
          if [ "$code" != "200" ]; then
            echo "Delete failed with HTTP ${code} (body in workflow log)" >&2
            cat /tmp/delete.json >&2
            exit 1
          fi
          echo "Deleted ${HANDLE} (${machine_id})"

  reaper:
    name: Reap stale preview VPSes
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete previews for closed PRs and expired previews
        run: |
          set -euo pipefail
          now="$(date +%s)"
          ttl_secs=$((PREVIEW_TTL_HOURS * 3600))
          lookup_failures=/tmp/reaper-lookup-failures
          delete_failures=/tmp/reaper-delete-failures
          : > "$lookup_failures"
          : > "$delete_failures"
          curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -c '.machines[] | select((.handle | test("^pr-[0-9]+$")) and .status != "deleted")' |
            while IFS= read -r machine; do
              handle="$(jq -r .handle <<< "$machine")"
              machine_id="$(jq -r .machineId <<< "$machine")"
              provisioned="$(jq -r '.provisionedAt // empty' <<< "$machine")"
              pr="${handle#pr-}"
              pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .state 2>/dev/null || echo unknown)"
              # Fail-safe: never delete on unconfirmed PR state (spec 093).
              if [ "$pr_state" = "unknown" ]; then
                echo "Skipping ${handle}: could not confirm PR #${pr} state" >&2
                echo "$handle" >> "$lookup_failures"
                continue
              fi
              reason=""
              if [ "$pr_state" = "closed" ]; then
                reason="PR #${pr} is closed"
              # failed/provisioning VPSes can have a null provisionedAt; a
              # date crash here would abort the whole sweep under set -e.
              elif provisioned_epoch="$(date -d "$provisioned" +%s 2>/dev/null)" && [ -n "$provisioned" ]; then
                age=$((now - provisioned_epoch))
                if [ "$age" -gt "$ttl_secs" ]; then
                  reason="older than ${PREVIEW_TTL_HOURS}h"
                else
                  echo "Keeping ${handle} (PR ${pr_state}, age $((age / 3600))h)"
                  continue
                fi
              else
                echo "Keeping ${handle} (PR ${pr_state}, no valid provisionedAt; age-based reaping skipped)"
                continue
              fi
              echo "Reaping ${handle}: ${reason}"
              code="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' \
                -X DELETE "${PLATFORM_PUBLIC_URL}/vps/${machine_id}" \
                -H "authorization: Bearer ${PLATFORM_SECRET}")"
              if [ "$code" != "200" ]; then
                echo "Failed to delete ${handle} (HTTP ${code})" >&2
                echo "$handle" >> "$delete_failures"
              fi
            done
          failed=0
          if [ -s "$lookup_failures" ]; then
            echo "Reaper could not confirm PR state for: $(tr '\n' ' ' < "$lookup_failures")" >&2
            echo "Those VPSes were skipped (fail-safe)." >&2
            failed=1
          fi
          if [ -s "$delete_failures" ]; then
            echo "Reaper could not delete: $(tr '\n' ' ' < "$delete_failures")" >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Failing the job so skips/failed deletes are visible instead of silently accumulating cost." >&2
            exit 1
          fi
