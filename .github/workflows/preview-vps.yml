          } finally {
            for (const socket of sockets) {
              if (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING) socket.close();
            }
          }
          JAVASCRIPT
          websocket_path="/tmp/matrix-terminal-websocket-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.mjs"
          websocket_write_body="$(jq -cn --arg script "$write_probe_script" --arg path "$websocket_path" \
            --arg content "$websocket_probe" '
              ($content | [range(0; length; 3000) as $offset | .[$offset:$offset + 3000]]) as $chunks |
              {command:(["/usr/bin/python3","-c",$script,$path] + $chunks),timeoutMs:30000}
            ')"
          runtime_request POST /api/terminal/run /tmp/nimanaderi-write-websocket-probe.json "$websocket_write_body"
          jq -e '.exitCode == 0 and .timedOut == false and .truncated == false' \
            /tmp/nimanaderi-write-websocket-probe.json >/dev/null
          websocket_body="$(jq -cn --arg path "$websocket_path" --arg token "$runtime_token" \
            --arg workspace "$workspace_id" --arg tab "$tab_id" --arg probe "$probe_path" \
            --arg nonce "${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            '{command:["/opt/matrix/runtime/node/bin/node",$path,$token,$workspace,$tab,$probe,$nonce],timeoutMs:150000}')"
          runtime_request POST /api/terminal/run /tmp/nimanaderi-websocket-probe.json "$websocket_body" 180
          if ! jq -e '.exitCode == 0 and .timedOut == false and .truncated == false and .signal == null' /tmp/nimanaderi-websocket-probe.json >/dev/null; then
            jq -c '{exitCode,timedOut,truncated,signal,diagnostic:(.stderr | fromjson? // {code:"missing_probe_diagnostic"})}' /tmp/nimanaderi-websocket-probe.json >&2
            exit 1
          fi
          websocket_result="$(jq -er '.stdout | fromjson' /tmp/nimanaderi-websocket-probe.json)"
          jq -e '.binaryInput == true and .keyboardRoundTrips == 2 and .oscReplies >= 1 and
            .reconnects == 1 and .stableObservationSeconds == 75 and .visibleRgbPayloads == 0' <<< "$websocket_result" >/dev/null
          echo "Terminal transport verified: $(jq -c . <<< "$websocket_result")"

          final="$(collect_state /tmp/nimanaderi-final.json)"
          if ! jq -e --arg target "$VERSION" '
            .appVersion == $target and .releaseVersion == $target and
            .coreServicesActive == true and .terminalRuntimeActive == true and
            .schemaVersion == 2 and
            .migrationStatus == "committed" and .activeWorkspaceServices >= 1 and
            .tabCount >= 1 and .updateError == "none"
          ' <<< "$final" >/dev/null; then
            echo "Post-upgrade terminal creation did not use an active workspace service." >&2
            exit 1
          fi
          echo "Terminal architecture verified: $(jq -c '{schemaVersion,migrationStatus,activeWorkspaceServices,workspaceCount,tabCount}' <<< "$final")"

          for _ in $(seq 1 6); do
            sleep 15
            collect_state /tmp/nimanaderi-observation.json >/dev/null || true
          done
          observed="$(collect_state /tmp/nimanaderi-observed-final.json)"
          jq -e --arg target "$VERSION" '
            .appVersion == $target and .releaseVersion == $target and
            .coreServicesActive == true and .terminalRuntimeActive == true and
            .schemaVersion == 2 and
            .migrationStatus == "committed" and .activeWorkspaceServices >= 1
          ' <<< "$observed" >/dev/null
          echo "Migration remained committed after the observation window: $(jq -c '{appVersion,releaseVersion,migrationStatus,activeWorkspaceServices}' <<< "$observed")"

          delete_exact_test_workspace "$workspace_id" /tmp/nimanaderi-workspace-delete.json
          workspace_created=false
          trap - EXIT
          runtime_request GET /api/terminal/workspaces /tmp/nimanaderi-workspaces-after-cleanup.json
          jq -e --arg workspace "$workspace_id" '
            all(.workspaces[]; .id != $workspace)
          ' /tmp/nimanaderi-workspaces-after-cleanup.json >/dev/null
          echo "Temporary terminal workspace removed by exact ID."

  diagnose_release:
    name: Diagnose released-bundle smoke lifecycle
    needs: gate
    if: needs.gate.outputs.action == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      HANDLE: ${{ needs.gate.outputs.handle }}
      VERSION: ${{ needs.gate.outputs.requested_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect sanitized gateway lifecycle evidence
        run: |
          set -euo pipefail
          runtime="$(curl --fail --silent --show-error --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL%/}/vps/fleet" |
            jq -c --arg h "$HANDLE" --arg v "$VERSION" '
              [.machines[] | select(.handle == $h and .runtimeSlot == $h and .status == "running"
                and .healthy == true and .runtimeVersion == $v and .deletedAt == null)] |
              if length == 1 then .[0] else error("released smoke runtime unavailable") end')"
          address="$(jq -er '.publicIPv4 | select(type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))' \
            <<< "$runtime")"
          runtime_token="$(PLATFORM_SIGNING_SECRET="$PLATFORM_SECRET" node --input-type=module -e '
            import { createHmac } from "node:crypto";
            process.stdout.write(createHmac("sha256", process.env.PLATFORM_SIGNING_SECRET).update(process.argv[1]).digest("hex"));
          ' "$HANDLE")"
          echo "::add-mask::$runtime_token"
          read -r -d '' lifecycle_script <<'PYTHON' || true
          import datetime
          import json
          import os
          import pwd
          import re
          import stat
          import subprocess

          SINCE = "2026-09-12 05:34:00 UTC"

          def timestamp(entry):
              value = entry.get("__REALTIME_TIMESTAMP")
              if isinstance(value, str) and value.isdigit():
                  return datetime.datetime.fromtimestamp(
                      int(value) / 1_000_000, datetime.timezone.utc
                  ).isoformat()
              return "unknown"

          def load_journal(arguments):
              output = subprocess.run([
                  "/usr/bin/journalctl", *arguments, "--since", SINCE,
                  "--output=json", "--no-pager",
              ], check=True, timeout=15, capture_output=True, text=True).stdout
              entries = []
              for raw in output.splitlines():
                  try:
                      entries.append(json.loads(raw))
                  except json.JSONDecodeError:
                      continue
              return entries

          def read_json(path, limit):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  metadata = os.fstat(fd)
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size < 2 or metadata.st_size > limit:
                      raise ValueError("invalid state file")
                  return json.loads(os.read(fd, metadata.st_size + 1))
              finally:
                  os.close(fd)

          properties = subprocess.run([
              "/usr/bin/systemctl", "show", "matrix-gateway.service",
              "--property=ActiveState", "--property=SubState", "--property=Result",
              "--property=NRestarts", "--property=ExecMainCode", "--property=ExecMainStatus",
              "--property=ExecMainStartTimestamp",
          ], check=True, timeout=10, capture_output=True, text=True).stdout
          current = {}
          for line in properties.splitlines():
              key, separator, value = line.partition("=")
              if separator:
                  current[key] = value

          gateway_journal = load_journal(["--unit=matrix-gateway.service"])
          events = []
          exit_fingerprints = []
          invocations = set()
          fingerprint_patterns = {
              "address_in_use": r"\bEADDRINUSE\b",
              "module_missing": r"\bERR_MODULE_NOT_FOUND\b|Cannot find (?:module|package)",
              "file_missing": r"\bENOENT\b",
              "permission_denied": r"\bEACCES\b|permission denied",
              "out_of_memory": r"out of memory|heap limit|oom-kill",
              "uncaught_exception": r"uncaught exception|uncaughtException",
              "unhandled_rejection": r"unhandled rejection|unhandledRejection",
              "syntax_error": r"\bSyntaxError\b",
              "type_error": r"\bTypeError\b",
              "reference_error": r"\bReferenceError\b",
              "terminal_runtime_error": r"terminal runtime.*(?:error|failed)|zellij.*(?:error|failed)",
              "database_error": r"(?:postgres|database).*(?:error|failed)",
          }
          for entry in gateway_journal:
              invocation = entry.get("_SYSTEMD_INVOCATION_ID")
              if isinstance(invocation, str) and re.fullmatch(r"[0-9a-f]{32}", invocation):
                  invocations.add(invocation)
              message = entry.get("MESSAGE")
              if not isinstance(message, str):
                  continue
              if entry.get("SYSLOG_IDENTIFIER") != "systemd" and entry.get("_COMM") != "systemd":
                  for name, pattern in fingerprint_patterns.items():
                      if re.search(pattern, message, re.IGNORECASE):
                          exit_fingerprints.append({"at": timestamp(entry), "category": name})
                  continue
              category = None
              if message.startswith("Starting "):
                  category = "starting"
              elif message.startswith("Started "):
                  category = "started"
              elif message.startswith("Stopping "):
                  category = "stopping"
              elif message.startswith("Stopped "):
                  category = "stopped"
              elif "Main process exited" in message:
                  category = "main_process_exited"
              elif "Failed with result" in message:
                  category = "failed"
              elif "Scheduled restart job" in message:
                  category = "automatic_restart_scheduled"
              if category is None:
                  continue
              event = {"at": timestamp(entry), "category": category}
              if category == "main_process_exited":
                  match = re.search(r"code=([a-z-]+), status=([0-9]+)(?:/([A-Z-]+))?", message)
                  if match:
                      event["code"] = match.group(1) if re.fullmatch(r"[a-z-]+", match.group(1)) else "unknown"
                      event["status"] = int(match.group(2))
                      event["statusName"] = match.group(3) or "unknown"
              events.append(event)

          sync_events = []
          sync_categories = (
              ("Started for ", "agent_started"),
              ("Starting update from ", "update_started"),
              ("Stopping services", "runtime_stop_requested"),
              ("Starting services", "runtime_start_requested"),
              ("Health check passed", "update_health_passed"),
              ("Restarting sync agent", "agent_restart_requested"),
              ("Exact requested version", "already_current"),
              ("Recovering interrupted update", "interrupted_update_recovery"),
              ("ERROR:", "update_error"),
              ("Update failed", "update_failed"),
          )
          for entry in load_journal(["--unit=matrix-sync-agent.service"]):
              message = entry.get("MESSAGE")
              if not isinstance(message, str) or not message.startswith("matrix-sync-agent:"):
                  continue
              payload = re.sub(r"^matrix-sync-agent:\s+[0-9TZ:-]+\s+", "", message)
              for prefix, category in sync_categories:
                  if payload.startswith(prefix):
                      sync_events.append({"at": timestamp(entry), "category": category})
                      break

          privileged_actions = []
          for entry in load_journal(["_COMM=sudo"]):
              message = entry.get("MESSAGE")
              if not isinstance(message, str) or "matrix-gateway" not in message or "systemctl" not in message:
                  continue
              category = None
              if re.search(r"COMMAND=.*systemctl\s+stop\b.*matrix-gateway", message):
                  category = "runtime_stop"
              elif re.search(r"COMMAND=.*systemctl\s+restart\b.*matrix-gateway", message):
                  category = "gateway_restart"
              elif re.search(r"COMMAND=.*systemctl\s+start\b.*matrix-gateway", message):
                  category = "gateway_start"
              if category:
                  privileged_actions.append({"at": timestamp(entry), "category": category})

          terminal_migration = {"journalStatus": "unavailable", "stateSchemaVersion": -1,
                                "workspaceCount": -1, "migratedLegacyTabs": -1,
                                "activeWorkspaceServices": -1}
          try:
              home = "/home/matrix/home"
              migration_journal = read_json(f"{home}/system/terminal-migration-journal.json", 16 * 1024 * 1024)
              workspace_state = read_json(f"{home}/system/terminal-workspaces.json", 16 * 1024 * 1024)
              workspaces = workspace_state.get("workspaces")
              migrated_tabs = []
              if isinstance(workspaces, dict):
                  for workspace in workspaces.values():
                      tabs = workspace.get("tabs") if isinstance(workspace, dict) else None
                      if isinstance(tabs, dict):
                          migrated_tabs.extend(
                              tab for tab in tabs.values()
                              if isinstance(tab, dict) and tab.get("migrationKey") in
                              {"release-smoke-a", "release-smoke-b"}
                          )
              owner = pwd.getpwnam("matrix")
              listed = subprocess.run([
                  "/usr/sbin/runuser", "-u", "matrix", "--", "/usr/bin/env",
                  f"HOME={home}", f"MATRIX_HOME={home}",
                  f"XDG_RUNTIME_DIR=/run/user/{owner.pw_uid}",
                  f"DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{owner.pw_uid}/bus",
                  "/usr/bin/systemctl", "--user", "list-units", "matrix-zellij@*.service",
                  "--state=active", "--no-legend", "--plain",
              ], check=True, timeout=15, capture_output=True, text=True).stdout
              units = [line for line in listed.splitlines() if line.strip()]
              terminal_migration = {
                  "journalStatus": migration_journal.get("status") if migration_journal.get("status") in {"committed", "rolled-back", "prepared"} else "invalid",
                  "stateSchemaVersion": workspace_state.get("schemaVersion") if isinstance(workspace_state.get("schemaVersion"), int) else -1,
                  "workspaceCount": len(workspaces) if isinstance(workspaces, dict) else -1,
                  "migratedLegacyTabs": len(migrated_tabs),
                  "activeWorkspaceServices": len(units),
              }
          except (OSError, ValueError, json.JSONDecodeError, subprocess.SubprocessError):
              pass

          def bounded_int(value):
              return int(value) if isinstance(value, str) and value.isdigit() and int(value) <= 1_000_000 else -1

          print(json.dumps({
              "gatewayLifecycle": events[-20:],
              "gatewayExitFingerprints": exit_fingerprints[-20:],
              "gatewayInvocationCount": len(invocations),
              "syncAgentLifecycle": sync_events[-30:],
              "privilegedGatewayActions": privileged_actions[-20:],
              "terminalMigration": terminal_migration,
              "activeState": current.get("ActiveState", "unknown") if current.get("ActiveState") in {"active", "inactive", "failed"} else "unknown",
              "subState": current.get("SubState", "unknown") if current.get("SubState") in {"running", "dead", "failed", "auto-restart"} else "unknown",
              "result": current.get("Result", "unknown") if re.fullmatch(r"[a-z-]{1,32}", current.get("Result", "")) else "unknown",
              "nRestarts": bounded_int(current.get("NRestarts")),
              "execMainCode": bounded_int(current.get("ExecMainCode")),
              "execMainStatus": bounded_int(current.get("ExecMainStatus")),
              "currentStart": current.get("ExecMainStartTimestamp", "unknown")[:64],
          }, sort_keys=True))
          PYTHON
          diagnostic_payload="$(printf '%s' "$lifecycle_script" | gzip -c | base64 -w0)"
          if [ "${#diagnostic_payload}" -gt 4096 ]; then
            echo "Compressed diagnostic exceeds the terminal command argument limit." >&2
            exit 1
          fi
          body="$(jq -cn --arg payload "$diagnostic_payload" \
            '{command:["/usr/bin/sudo","/usr/bin/python3","-c",
              "import base64,gzip,sys;exec(gzip.decompress(base64.b64decode(sys.argv[1])))",
              $payload],timeoutMs:30000}')"
          curl --fail --silent --show-error --max-time 45 --insecure \
            --resolve "app.matrix-os.com:443:${address}" \
            -o /tmp/release-smoke-lifecycle.json -X POST 'https://app.matrix-os.com/api/terminal/run' \
            -H "authorization: Bearer ${runtime_token}" \
            -H 'content-type: application/json' --data-binary "$body"
          jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null) |
            .stdout | fromjson |
            select((.gatewayLifecycle | type == "array") and
              (.gatewayExitFingerprints | type == "array") and
              (.syncAgentLifecycle | type == "array") and
              (.privilegedGatewayActions | type == "array") and
              (.terminalMigration | type == "object"))' \
            /tmp/release-smoke-lifecycle.json >/dev/null
          jq -r '.stdout' /tmp/release-smoke-lifecycle.json

          read -r -d '' host_script <<'PYTHON' || true
          import datetime
          import json
          import re
          import subprocess

          since = "2026-09-12 05:34:00 UTC"
          units = (
              "cloud-final.service",
              "apt-daily.service",
              "apt-daily-upgrade.service",
              "unattended-upgrades.service",
              "matrix-developer-tools.service",
              "matrix-code-server.service",
              "matrix-linux-tools.service",
              "matrix-sync-agent.service",
              "matrix-shell.service",
          )
          allowed_states = {"active", "inactive", "failed", "activating", "deactivating", "dead", "running", "exited"}

          def bounded_timestamp(value):
              return value[:64] if isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9:+. -]{0,64}", value) else "unknown"

          def entry_timestamp(entry):
              value = entry.get("__REALTIME_TIMESTAMP")
              if isinstance(value, str) and value.isdigit():
                  return datetime.datetime.fromtimestamp(int(value) / 1_000_000, datetime.timezone.utc).isoformat()
              return "unknown"

          service_state = {}
          for unit in units:
              output = subprocess.run([
                  "/usr/bin/systemctl", "show", unit,
                  "--property=ActiveState", "--property=SubState", "--property=Result",
                  "--property=NRestarts", "--property=ExecMainStartTimestamp",
                  "--property=ExecMainExitTimestamp", "--property=ActiveEnterTimestamp",
              ], check=True, timeout=10, capture_output=True, text=True).stdout
              values = dict(line.partition("=")[::2] for line in output.splitlines() if "=" in line)
              service_state[unit] = {
                  "activeState": values.get("ActiveState") if values.get("ActiveState") in allowed_states else "unknown",
                  "subState": values.get("SubState") if values.get("SubState") in allowed_states else "unknown",
                  "result": values.get("Result") if re.fullmatch(r"[a-z-]{1,32}", values.get("Result", "")) else "unknown",
                  "nRestarts": int(values.get("NRestarts", "-1")) if values.get("NRestarts", "").isdigit() else -1,
                  "startedAt": bounded_timestamp(values.get("ExecMainStartTimestamp", "")),
                  "exitedAt": bounded_timestamp(values.get("ExecMainExitTimestamp", "")),
                  "activeAt": bounded_timestamp(values.get("ActiveEnterTimestamp", "")),
              }

          actor_windows = {}
          actor_entries = {}
          for actor in ("needrestart", "cloud-init", "apt-get", "dpkg", "unattended-upgr"):
              output = subprocess.run([
                  "/usr/bin/journalctl", f"_COMM={actor}", "--since", since,
                  "--output=json", "--no-pager",
              ], check=True, timeout=15, capture_output=True, text=True).stdout
              entries = []
              for raw in output.splitlines():
                  try:
                      entries.append(json.loads(raw))
                  except json.JSONDecodeError:
                      continue
              actor_windows[actor] = {
                  "count": min(len(entries), 100000),
                  "firstAt": entry_timestamp(entries[0]) if entries else "none",
                  "lastAt": entry_timestamp(entries[-1]) if entries else "none",
              }
              actor_entries[actor] = entries

          maintenance_patterns = (
              (r"starting unattended", "starting"),
              (r"packages? (?:that will be|to be) upgraded", "packages_selected"),
              (r"package.*(?:upgrade|install)", "package_activity"),
              (r"dpkg", "dpkg_activity"),
              (r"lock", "package_lock"),
              (r"sigterm|signal 15", "sigterm"),
              (r"shut(?:ting)? down|stopping", "stopping"),
              (r"restart", "restart"),
              (r"reboot", "reboot"),
              (r"finished|complete", "completed"),
          )
          maintenance_lifecycle = []
          for actor, entries in actor_entries.items():
              for entry in entries:
                  message = entry.get("MESSAGE")
                  if not isinstance(message, str):
                      continue
                  for pattern, category in maintenance_patterns:
                      if re.search(pattern, message, re.IGNORECASE):
                          maintenance_lifecycle.append({
                              "at": entry_timestamp(entry), "actor": actor, "category": category,
                          })
                          break

          observed_units = (
              "apt-daily.service", "apt-daily-upgrade.service", "unattended-upgrades.service",
              "matrix-developer-tools.service", "matrix-gateway.service",
              "matrix-shell.service", "matrix-sync-agent.service",
          )
          manager_lifecycle = []
          boot_ids = set()
          output = subprocess.run([
              "/usr/bin/journalctl", "--since", since, "--output=json", "--no-pager",
          ], check=True, timeout=20, capture_output=True, text=True).stdout
          for raw in output.splitlines():
              try:
                  entry = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              boot_id = entry.get("_BOOT_ID")
              if isinstance(boot_id, str) and re.fullmatch(r"[0-9a-f]{32}", boot_id):
                  boot_ids.add(boot_id)
              message = entry.get("MESSAGE")
              if not isinstance(message, str) or (entry.get("_COMM") != "systemd" and entry.get("SYSLOG_IDENTIFIER") != "systemd"):
                  continue
              matched_unit = next((unit for unit in observed_units if unit.removesuffix(".service") in message), None)
              category = None
              if "daemon-reload" in message.lower() or "reloading" in message.lower():
                  category = "reload"
              elif "reexecut" in message.lower():
                  category = "reexecute"
              elif message.startswith("Stopping "):
                  category = "stopping"
              elif message.startswith("Stopped "):
                  category = "stopped"
              elif message.startswith("Starting "):
                  category = "starting"
              elif message.startswith("Started "):
                  category = "started"
              elif "Main process exited" in message:
                  category = "main_process_exited"
              if category and (matched_unit or category in {"reload", "reexecute"}):
                  manager_lifecycle.append({
                      "at": entry_timestamp(entry), "category": category,
                      "unit": matched_unit or "system-manager",
                  })

          print(json.dumps({
              "hostServiceState": service_state,
              "hostActorWindows": actor_windows,
              "hostManagerLifecycle": manager_lifecycle[-80:],
              "maintenanceLifecycle": maintenance_lifecycle[-80:],
              "bootIdCount": len(boot_ids),
          }, sort_keys=True))
          PYTHON
          host_payload="$(printf '%s' "$host_script" | gzip -c | base64 -w0)"
          if [ "${#host_payload}" -gt 4096 ]; then
            echo "Compressed host diagnostic exceeds the terminal command argument limit." >&2
            exit 1
          fi
          body="$(jq -cn --arg payload "$host_payload" \
            '{command:["/usr/bin/sudo","/usr/bin/python3","-c",
              "import base64,gzip,sys;exec(gzip.decompress(base64.b64decode(sys.argv[1])))",
              $payload],timeoutMs:30000}')"
          curl --fail --silent --show-error --max-time 45 --insecure \
            --resolve "app.matrix-os.com:443:${address}" \
            -o /tmp/release-smoke-host.json -X POST 'https://app.matrix-os.com/api/terminal/run' \
            -H "authorization: Bearer ${runtime_token}" \
            -H 'content-type: application/json' --data-binary "$body"
          jq -e 'select(.exitCode==0 and .timedOut==false and .truncated==false and .signal==null) |
            .stdout | fromjson |
            select((.hostServiceState | type == "object") and
              (.hostActorWindows | type == "object") and
              (.hostManagerLifecycle | type == "array") and
              (.maintenanceLifecycle | type == "array") and
              (.bootIdCount | type == "number"))' \
            /tmp/release-smoke-host.json >/dev/null
          jq -r '.stdout' /tmp/release-smoke-host.json

  verify_inventory:
    name: Verify preview computer inventory
    needs: gate
    if: needs.gate.outputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PREVIEW_CLERK_USER_ID: ${{ secrets.PREVIEW_CLERK_USER_ID }}
      PREVIEW_CLERK_ACCESS_USER_IDS: ${{ secrets.PREVIEW_CLERK_ACCESS_USER_IDS }}
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://api.matrix-os.com' }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - name: Verify authenticated inventory projection
        run: |
          set -euo pipefail
          if [ -z "${CLERK_SECRET_KEY:-}" ] || [ -z "${PREVIEW_CLERK_USER_ID:-}" ]; then
            echo "Preview inventory verification is not configured." >&2
            exit 1
          fi
          access_user_ids="${PREVIEW_CLERK_ACCESS_USER_IDS:-[]}"
          if ! preview_user_ids_json="$(jq -ce --arg owner "$PREVIEW_CLERK_USER_ID" '
            if (
              type == "array" and length <= 8
              and all(.[]; type == "string" and test("^user_[A-Za-z0-9]+$"))
              and (unique | length) == length
              and (index($owner) == null)
            ) then [$owner] + . else error("invalid access list") end
          ' <<< "$access_user_ids")"; then
            echo "PREVIEW_CLERK_ACCESS_USER_IDS must be a JSON array of up to eight unique non-owner Clerk user IDs." >&2
            exit 1
          fi
          mapfile -t preview_user_ids < <(jq -r '.[]' <<< "$preview_user_ids_json")
          for preview_user_id in "${preview_user_ids[@]}"; do
            if ! printf '%s' "$preview_user_id" | grep -Eq '^user_[A-Za-z0-9]+$'; then
              echo "Preview inventory verification user is invalid." >&2
              exit 1
            fi
            user_code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://api.clerk.com/v1/users/${preview_user_id}" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10")"
            if [ "$user_code" != "200" ]; then
              echo "Configured preview verification user is unavailable (HTTP ${user_code})." >&2
              exit 1
            fi

            sessions_code="$(curl -sS --max-time 30 -o /tmp/clerk-sessions.json -w '%{http_code}' \
              "https://api.clerk.com/v1/sessions?user_id=${preview_user_id}&status=active&limit=10" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10")"
            if [ "$sessions_code" != "200" ]; then
              echo "Active preview verification sessions are unavailable (HTTP ${sessions_code})." >&2
              exit 1
            fi
            session_id="$(jq -er 'sort_by(.last_active_at // 0) | reverse | .[0].id | select(type == "string" and test("^sess_[A-Za-z0-9]+$"))' /tmp/clerk-sessions.json)"
            token_code="$(curl -sS --max-time 30 -o /tmp/clerk-token.json -w '%{http_code}' \
              -X POST "https://api.clerk.com/v1/sessions/${session_id}/tokens" \
              -H "authorization: Bearer ${CLERK_SECRET_KEY}" \
              -H "Clerk-API-Version: 2025-11-10" \
              -H "content-type: application/json" \
              --data-binary '{"expires_in_seconds":60}')"
            if [ "$token_code" != "200" ]; then
              echo "Preview verification token is unavailable (HTTP ${token_code})." >&2
              exit 1
            fi
            session_token="$(jq -er '.jwt | select(type == "string" and length <= 8192)' /tmp/clerk-token.json)"

            inventory_code="$(curl -sS --max-time 30 -o /tmp/computers.json -w '%{http_code}' \
              "${PLATFORM_PUBLIC_URL}/api/auth/computers" \
              -H "authorization: Bearer ${session_token}")"
            if [ "$inventory_code" != "200" ]; then
              echo "Authenticated computer inventory is unavailable." >&2
              exit 1
            fi
            if ! jq -e --arg h "$HANDLE" \
              '[.items[] | select(.handle == $h and .runtimeSlot == $h and .kind == "preview")] | length == 1' \
              /tmp/computers.json > /dev/null; then
              echo "Preview computer is not selectable in the authenticated inventory." >&2
              exit 1
            fi
            echo "Verified ${HANDLE} in the authenticated computer inventory for ${preview_user_id}."
          done

  teardown:
    name: Teardown preview VPS
    needs: gate
    if: needs.gate.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      HANDLE: ${{ needs.gate.outputs.handle }}
    steps:
      - name: Delete preview VPS
        run: |
          set -euo pipefail
          machine_id="$(curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -r --arg h "$HANDLE" \
              '[.machines[] | select(.handle == $h and .status != "deleted" and .deletedAt == null)] | .[0].machineId // ""')"
          if [ -z "$machine_id" ]; then
            echo "No active VPS for ${HANDLE}; nothing to tear down."
            exit 0
          fi
          code="$(curl -sS --max-time 60 -o /tmp/delete.json -w '%{http_code}' \
            -X DELETE "${PLATFORM_PUBLIC_URL}/vps/${machine_id}" \
            -H "authorization: Bearer ${PLATFORM_SECRET}")"
          if [ "$code" != "200" ]; then
            echo "Delete failed with HTTP ${code} (body in workflow log)" >&2
            cat /tmp/delete.json >&2
            exit 1
          fi
          echo "Deleted ${HANDLE} (${machine_id})"

  reaper:
    name: Reap stale preview VPSes
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLATFORM_PUBLIC_URL: ${{ vars.PLATFORM_PUBLIC_URL || 'https://app.matrix-os.com' }}
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete previews for closed PRs and expired previews
        run: |
          set -euo pipefail
          now="$(date +%s)"
          ttl_secs=$((PREVIEW_TTL_HOURS * 3600))
          lookup_failures=/tmp/reaper-lookup-failures
          delete_failures=/tmp/reaper-delete-failures
          : > "$lookup_failures"
          : > "$delete_failures"
          curl -fsS --max-time 30 \
            -H "authorization: Bearer ${PLATFORM_SECRET}" \
            "${PLATFORM_PUBLIC_URL}/vps/fleet" |
            jq -c '.machines[] | select((.handle | test("^pr-[0-9]+$")) and .status != "deleted" and .deletedAt == null)' |
            while IFS= read -r machine; do
              handle="$(jq -r .handle <<< "$machine")"
              machine_id="$(jq -r .machineId <<< "$machine")"
              provisioned="$(jq -r '.provisionedAt // empty' <<< "$machine")"
              pr="${handle#pr-}"
              pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .state 2>/dev/null || echo unknown)"
              # Fail-safe: never delete on unconfirmed PR state (spec 093).
              if [ "$pr_state" = "unknown" ]; then
                echo "Skipping ${handle}: could not confirm PR #${pr} state" >&2
                echo "$handle" >> "$lookup_failures"
                continue
              fi
              reason=""
              if [ "$pr_state" = "closed" ]; then
                reason="PR #${pr} is closed"
              # failed/provisioning VPSes can have a null provisionedAt; a
              # date crash here would abort the whole sweep under set -e.
              elif provisioned_epoch="$(date -d "$provisioned" +%s 2>/dev/null)" && [ -n "$provisioned" ]; then
                age=$((now - provisioned_epoch))
                if [ "$age" -gt "$ttl_secs" ]; then
                  reason="older than ${PREVIEW_TTL_HOURS}h"
                else
                  echo "Keeping ${handle} (PR ${pr_state}, age $((age / 3600))h)"
                  continue
                fi
              else
                echo "Keeping ${handle} (PR ${pr_state}, no valid provisionedAt; age-based reaping skipped)"
                continue
              fi
              echo "Reaping ${handle}: ${reason}"
              code="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' \
                -X DELETE "${PLATFORM_PUBLIC_URL}/vps/${machine_id}" \
                -H "authorization: Bearer ${PLATFORM_SECRET}")"
              if [ "$code" != "200" ]; then
                echo "Failed to delete ${handle} (HTTP ${code})" >&2
                echo "$handle" >> "$delete_failures"
              fi
            done
          failed=0
          if [ -s "$lookup_failures" ]; then
            echo "Reaper could not confirm PR state for: $(tr '\n' ' ' < "$lookup_failures")" >&2
            echo "Those VPSes were skipped (fail-safe)." >&2
            failed=1
          fi
          if [ -s "$delete_failures" ]; then
            echo "Reaper could not delete: $(tr '\n' ' ' < "$delete_failures")" >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Failing the job so skips/failed deletes are visible instead of silently accumulating cost." >&2
            exit 1
          fi
