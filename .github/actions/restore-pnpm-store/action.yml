name: Restore pnpm store without saving
description: Reuse setup-node's package-store cache in read-only PR refreshes
runs:
  using: composite
  steps:
    - name: Locate pnpm store
      id: store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "arch=$(node -p process.arch)" >> "$GITHUB_OUTPUT"
    # setup-node v6 uses RUNNER_OS, os.arch() (lowercase), and the lock hash.
    # Restore only: dispatches may execute PR code in main's cache scope.
    - name: Restore exact dependency cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: node-cache-${{ runner.os }}-${{ steps.store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
