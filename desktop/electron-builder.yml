appId: com.matrix-os.operator
productName: Matrix OS
artifactName: Matrix-OS-${version}-${os}-${arch}.${ext}
generateUpdatesFilesForAllChannels: true
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - "!**/.vite/**"
  - "!**/node_modules/@matrix-os/contracts/**"
asarUnpack: []
protocols:
  - name: Matrix OS
    schemes:
      - matrixos
      - matrix-os
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  title: Matrix OS
  background: build/dmg-background.png
  icon: build/icon.icns
  iconSize: 112
  iconTextSize: 13
  window:
    width: 720
    height: 520
  contents:
    - x: 190
      y: 322
    - x: 530
      y: 322
      type: link
      path: /Applications
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
# Update feed: GitHub releases by default. OPERATOR_UPDATE_FEED can still
# override to a generic feed for break-glass or self-hosted release channels.
publish:
  - provider: github
    owner: HamedMP
    repo: matrix-os
